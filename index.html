      // Verifica dependência entre produtos para não criar uma ficha circular:
      // A usa B e B usa A. Além de confundir a operação, isso nunca teria um
      // custo final calculável.
      const produtoDependeDe = (productId, targetId, recipes, recipeItems, visitados = new Set()) => {
        if (!productId || !targetId) return false;
        if (productId === targetId) return true;
        if (visitados.has(productId)) return false;
        const proximosVisitados = new Set(visitados);
        proximosVisitados.add(productId);
        const ficha = recipes.find((r) => r.productId === productId);
        if (!ficha) return false;
        return recipeItems
          .filter((i) => i.recipeId === ficha.id && i.componentProductId)
          .some((i) => i.componentProductId === targetId
            || produtoDependeDe(i.componentProductId, targetId, recipes, recipeItems, proximosVisitados));
      };

      // Custo de uma linha da ficha. A linha pode vir de uma compra (supplyId)
      // ou de uma fabricação própria (componentProductId).
      const custoDoItemDaFicha = (
        item, supplies, purchases, products = [], recipes = [], recipeItems = [], pilha = new Set()
      ) => {
        if (item?.componentProductId) {
          const componente = products.find((p) => p.id === item.componentProductId);
          if (!componente || pilha.has(componente.id)) return 0;
          const fichaComponente = fichaDoProduto(
            componente.id, recipes, recipeItems, supplies, purchases, products, pilha
          );
          if (!fichaComponente || !(fichaComponente.custo > 0)) return 0;
          const rendimento = Number(fichaComponente.yieldQty) || 0;
          if (rendimento <= 0) return 0;
          const unidadeSaida = fichaComponente.yieldUnit || 'un';
          const qtd = converterQtdComponente(
            item.qty,
            item.usageUnit || unidadeSaida,
            unidadeSaida,
            fichaComponente.weightPerUnit
          );
          return (fichaComponente.custo / rendimento) * qtd;
        }

        const supply = supplies.find((s) => s.id === item?.supplyId);
        if (!supply) return 0;
        return custoUnitarioInsumo(supply.id, purchases) * qtdNaUnidadeBase(item, supply);
      };

      // Custo da receita inteira, do jeito que ela é produzida.
      const custoDaFicha = (
        itens, supplies, purchases, products = [], recipes = [], recipeItems = [], pilha = new Set()
      ) => (itens || []).reduce(
        (total, item) => total + custoDoItemDaFicha(
          item, supplies, purchases, products, recipes, recipeItems, pilha
        ),
        0
      );

      // Custo de UMA unidade do produto, já na unidade em que ele é vendido.
      // Produto vendido a quilo precisa do peso da unidade: a receita rende 40
      // fatias de 120 g, então rende 4,8 kg — e é por kg que o preço é dado.
      const custoPorUnidadeDeVenda = (product, ficha) => {
        if (!ficha || !(ficha.custo > 0)) return Number(product?.manualCost) || 0;
        const rendimento = Number(ficha.yieldQty) || 0;
        if (rendimento <= 0) return 0;
        if ((product?.priceUnit || 'un') === 'kg') {
          // Ficha nova: o rendimento já é o total produzido em kg.
          if ((ficha.yieldUnit || 'un') === 'kg') return ficha.custo / rendimento;

          // Compatibilidade com fichas antigas: antes a tela guardava número
          // de unidades + peso por unidade para chegar ao rendimento em kg.
          const pesoG = Number(ficha.weightPerUnit) || 0;
          if (pesoG > 0) return ficha.custo / ((rendimento * pesoG) / 1000);
        }
        return ficha.custo / rendimento;
      };

      // Custo por unidade de venda de um item de revenda. A compra pode vir
      // numa unidade diferente da venda (compra o quilo, vende em gramas), e
      // é a última compra que manda — o campo de custo é só o espelho dela.
      const converterQtdRevenda = (qtd, origem, destino) => {
        const n = Number(qtd) || 0;
        const de = origem || 'un';
        const para = destino || 'un';
        if (!n || de === para) return n;
        if (de === 'g' && para === 'kg') return n / 1000;
        if (de === 'kg' && para === 'g') return n * 1000;
        return n;
      };

      const custoRevenda = (item, purchases) => {
        const uc = ultimaCompra((purchases || []).filter((c) => c.separatedProductId === item.id));
        if (uc) {
          const qtd = converterQtdRevenda(uc.qty, uc.purchaseUnit, item.priceUnit || 'un');
          if (qtd > 0 && Number(uc.cost) > 0) return Number(uc.cost) / qtd;
        }
        return Number(item.cost) || 0;
      };

      // Reúne a ficha de um produto num objeto só, com o custo já somado.
      // Devolve null quando o produto ainda não tem ficha.
      const fichaDoProduto = (
        productId, recipes, recipeItems, supplies, purchases, products = [], pilha = new Set()
      ) => {
        if (pilha.has(productId)) return null;
        const recipe = recipes.find((r) => r.productId === productId);
        if (!recipe) return null;
        const itens = recipeItems.filter((i) => i.recipeId === recipe.id);
        const proximaPilha = new Set(pilha);
        proximaPilha.add(productId);
        return {
          ...recipe,
          itens,
          custo: custoDaFicha(
            itens, supplies, purchases, products, recipes, recipeItems, proximaPilha
          )
        };
      };

      // O preço do insumo na unidade em que se fala dele: quem compra farinha
      // pensa em reais por quilo, não por grama.
      const precoNaUnidadeGrande = (custoUnit, unidade) => {
        if (unidade === 'g') return { valor: (Number(custoUnit) || 0) * 1000, label: 'kg' };
        if (unidade === 'ml') return { valor: (Number(custoUnit) || 0) * 1000, label: 'L' };
        return { valor: Number(custoUnit) || 0, label: unidade || 'un' };
      };

      const formatPrecoInsumo = (custoUnit, unidade) => {
        const p = precoNaUnidadeGrande(custoUnit, unidade);
        return `${formatCurrencyBR(p.valor)}/${p.label}`;
      };

      // Como a loja escreve a variação do insumo, para conferir de bate-pronto
      const rotuloVariacao = (supply) => {
        if (!supply?.variationUnit || !(Number(supply.variationFactor) > 0)) return '';
        return supply.unit === 'un'
          ? `1 un = ${supply.variationFactor} ${supply.variationUnit}`
          : `1 ${supply.variationUnit} = ${supply.variationFactor} ${supply.unit}`;
      };

      // ------------------------------------------
      // Vitrine = um móvel de verdade da loja (Salgada 1, Salgada 2, Doce…).
      // O que identifica cada uma é o par tipo + número da vitrine, e não o
      // espaço isolado: é por isso que a chave abaixo aparece no pedido de
      // produção, na lista de apoio e no filtro de produtos do espaço.
      // ------------------------------------------
      const showcaseKey = (slot) => (slot ? `${slot.showcaseType}#${slot.shelfNumber}` : '');

      // Categoria comercial e presença na vitrine são coisas diferentes.
      // A categoria organiza o catálogo/CMV; quando o produto participa da
      // vitrine, este mapa define o móvel padrão dele.
      const CATEGORY_BY_SHOWCASE = { salgada: 'salgado', doce: 'doce', sobremesa: 'sobremesa' };
      const SHOWCASE_BY_CATEGORY = {
        salgado: 'salgada', pao: 'salgada',
        doce: 'doce',
        sobremesa: 'sobremesa',
        cafeteria: 'doce', bomboniere: 'doce', bebida_revenda: 'salgada', outro: 'salgada'
      };

      const showcaseTypeOfCategory = (category) => SHOWCASE_BY_CATEGORY[category] || 'salgada';

      const categoryOfShowcaseType = (showcaseType) => CATEGORY_BY_SHOWCASE[showcaseType] || 'salgado';

      // Só entra nos fluxos de vitrine se estiver explicitamente habilitado.
      const productsForShowcaseType = (products, showcaseType) =>
        products.filter((p) => p.showcaseEnabled !== false && showcaseTypeOfCategory(p.category) === showcaseType);

      // Quantidade mínima de um produto em um dia: a soma do mínimo dos espaços
      // que o padrão daquele dia reservou para ele. É o ponto de reposição do
      // pedido de produção — quando o estoque bom da loja fica igual ou abaixo
      // dele, o item é chamado. Zero quer dizer "só quando acabar".
      const planMinQty = (planos) => planos.reduce((soma, p) => soma + (p.minQty || 0), 0);

      // Mínimo sugerido para um item que está entrando no padrão agora: o
      // mínimo de reposição do catálogo do produto. É só o ponto de partida —
      // a loja digita o número dela na vitrine padrão.
      const defaultMinQty = (product, idealQty) =>
        Math.max(0, Math.min(Number(product?.minReplenishmentQty) || 0, idealQty || 0));

      // ------------------------------------------
      // O desenho dos móveis da loja: quantos produtos ficam lado a lado em
      // uma fileira de cada vitrine. É o que se vê no balcão, e é assim que a
      // tela desenha os espaços — o número de fileiras vem do tamanho da
      // vitrine (12 espaços em 4 colunas dão três fileiras; 8 em 3 colunas dão
      // três, sendo a última com um espaço só).
      //
      // Vitrine que não estiver aqui desenha em quatro colunas.
      // ------------------------------------------
      const SHOWCASE_COLUMNS = {
        matriz: { salgada: 4, doce: 4, sobremesa: 4 },
        vilanova: { salgada: 4, doce: 3, sobremesa: 3 }
      };

      const DEFAULT_SHOWCASE_COLUMNS = 4;

      const showcaseColumnsFor = (unit, showcaseType) =>
        (SHOWCASE_COLUMNS[unit] || {})[showcaseType] || DEFAULT_SHOWCASE_COLUMNS;

      // Ordem em que as vitrines aparecem nas listas
      const SHOWCASE_TYPE_ORDER = { salgada: 0, doce: 1, sobremesa: 2 };

      // O mesmo nome de vitrine na vitrine física e na lista de apoio
      const SHOWCASE_TYPES = ['salgada', 'doce', 'sobremesa'];
      const SHOWCASE_TYPE_LABELS = { salgada: 'Salgadas', doce: 'Doces', sobremesa: 'Sobremesas' };

      const compareShowcase = (a, b) => {
        const ta = SHOWCASE_TYPE_ORDER[a.showcaseType];
        const tb = SHOWCASE_TYPE_ORDER[b.showcaseType];
        return (ta === undefined ? 9 : ta) - (tb === undefined ? 9 : tb)
          || (a.shelfNumber || 0) - (b.shelfNumber || 0);
      };

      // Quebra uma lista em blocos, um por vitrine. getSlot devolve o espaço de
      // cada entrada; quem não tem espaço cai no bloco "avulso" do fim.
      const groupByShowcase = (entries, getSlot, avulsoTitle = 'Sem vitrine') => {
        const blocos = [];
        const porChave = {};

        entries.forEach((entry) => {
          const slot = getSlot(entry);
          const chave = slot ? showcaseKey(slot) : '__avulso__';
          if (!porChave[chave]) {
            porChave[chave] = {
              key: chave,
              title: slot ? slot.sectionTitle : avulsoTitle,
              showcaseType: slot ? slot.showcaseType : 'zzz',
              shelfNumber: slot ? slot.shelfNumber : 999,
              entries: []
            };
            blocos.push(porChave[chave]);
          }
          porChave[chave].entries.push(entry);
        });

        return blocos.sort(compareShowcase);
      };

      // Tudo que está exposto em um móvel, com o número do espaço junto.
      // Serve para saber se o produto já tem lugar ali: lote novo de produto
      // que já está na vitrine entra na bandeja dele, e não em espaço novo.
      const itemsOfShowcase = (slots, slotItems, slot) => {
        if (!slot) return [];
        const chave = showcaseKey(slot);
        const doMovel = {};
        slots.forEach((s) => {
          if (s.unit === slot.unit && showcaseKey(s) === chave) doMovel[s.id] = s;
        });
        return slotItems
          .filter((i) => doMovel[i.slotId])
          .map((i) => ({ ...i, slotNumber: doMovel[i.slotId].slotNumber }));
      };

      const calculateDaysInShowcase = (mDateStr) => {
        if (!mDateStr) return 0;
        const mDate = new Date(mDateStr);
        const today = new Date(getTodayDateString());
        const diffTime = Math.abs(today - mDate);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
      };

      // Dias entre dois dias AAAA-MM-DD. Serve para refazer o tempo de vitrine
      // de uma venda quando o lote dela é corrigido no histórico.
      const daysBetweenKeys = (de, ate) => {
        const inicio = toDayKey(de);
        const fim = toDayKey(ate);
        if (!inicio || !fim) return null;
        return Math.max(0, Math.round((dateFromKey(fim) - dateFromKey(inicio)) / 86400000));
      };

      // ------------------------------------------
      // Responsável pelo produto
      // ------------------------------------------
      const NO_RESPONSIBLE_LABEL = 'Sem responsável';

      const cleanResponsible = (value) => (value || '').trim();

      const getResponsibleName = (product) => cleanResponsible(product?.responsible) || NO_RESPONSIBLE_LABEL;

      const getResponsibleInitials = (name) => {
        const clean = cleanResponsible(name);
        if (!clean) return '?';
        const parts = clean.split(/\s+/);
        const first = parts[0][0] || '';
        const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
        return (first + last).toUpperCase();
      };

      const listResponsibles = (products) =>
        Array.from(new Set(products.map((p) => cleanResponsible(p.responsible)).filter(Boolean)))
          .sort((a, b) => a.localeCompare(b, 'pt-BR'));

      // A validade do item na vitrine. O dia a dia é cinza: só o último dia e
      // o vencido ganham cor, porque só eles pedem alguma coisa da pessoa.
      //
      // A conta é a do papel do balcão: a validade é a data escrita no
      // cartão — fabricação mais os dias de validade do produto. Nesse dia
      // o produto ainda vende, e é o último dia dele: é aviso, não perda.
      // Vencido é só depois que essa data passa.
      //
      // markClass: a cor do nome do item; alerta: se merece selo na tela.
      const getSlotItemStatus = (item, product) => {
        if (!item) return { status: 'empty', label: 'Vazio', bgClass: 'tone-quiet', textClass: 'ink-quiet', dotClass: 'dot-quiet', markClass: '', alerta: false };
        const days = calculateDaysInShowcase(item.manufactureDate);
        const shelfLife = product?.shelfLifeDays || 2;

        if (days > shelfLife) {
          return { status: 'expired', label: `Vencido · ${days}d`, bgClass: 'tone-expired', textClass: 'ink-expired', dotClass: 'dot-expired', markClass: 'mark-expired', alerta: true };
        } else if (days === shelfLife) {
          return { status: 'warning', label: `Último dia · ${days}d`, bgClass: 'tone-last', textClass: 'ink-last', dotClass: 'dot-last', markClass: 'mark-warning', alerta: true };
        }
        return { status: 'normal', label: `${days}d na vitrine`, bgClass: 'tone-quiet', textClass: 'ink-quiet', dotClass: 'dot-quiet', markClass: '', alerta: false };
      };

      // ------------------------------------------
      // A TAG DO CARTÃO DA VITRINE
      //
      // A quina colorida do cartão, no mesmo código de cor que o balcão já
      // usa no papel: verde está fresco, amarelo é o último dia de validade
      // e vinho precisa sair da vitrine agora. O amarelo é claro e o verde é
      // escuro de propósito: de longe, duas cores parecidas viram a mesma
      // cor. Dentro da quina vão os dias de vitrine.
      //
      // O dia da validade — a data escrita no cartão — é amarelo, e não
      // vinho: naquele dia o produto ainda vende, e é o último dia dele.
      // O vinho começa no dia seguinte, quando a data já passou.
      //
      // É a leitura de longe: quem passa na frente da vitrine vê a cor antes
      // de ler qualquer número. O tempo em dias continua escrito no cartão,
      // para quem chegar perto.
      // ------------------------------------------
      const SHOWCASE_TAGS = {
        verde: { label: 'Fresco', hint: 'Dentro da validade' },
        amarela: { label: 'Último dia', hint: 'Último dia de validade' },
        vermelha: { label: 'Vencido', hint: 'Passou da validade — tirar da vitrine' }
      };

      const getShowcaseTag = (item, product) => {
        const days = calculateDaysInShowcase(item?.manufactureDate);
        const shelfLife = Number(product?.shelfLifeDays) || 2;
        const cor = days > shelfLife ? 'vermelha' : (days === shelfLife ? 'amarela' : 'verde');
        const { label, hint } = SHOWCASE_TAGS[cor];

        return {
          cor,
          label,
          days,
          shelfLife,
          title: `${hint} · ${days}d na vitrine, de ${shelfLife}d de validade`
        };
      };

      // ------------------------------------------
      // Quão cheio está um espaço — a leitura que o desenho da vitrine pinta.
      //
      // A parte pintada da bandeja é o que existe agora sobre o que o padrão
      // de hoje manda ter naquele espaço. Espaço sem padrão para hoje usa o
      // lote que foi colocado ali como referência: "sobrou meia bandeja"
      // também é leitura de vitrine.
      //
      // É só isso: o desenho diz o quanto tem, e não se está bom ou ruim.
      // Validade e ponto de reposição são conversa dos cards e dos alertas.
      // ------------------------------------------
      const readSlotFill = (slot, items, dayPlans) => {
        const planos = dayPlans.filter((sp) => sp.slotId === slot.id);
        const padrao = planos.reduce((soma, sp) => soma + (sp.idealQty || 0), 0);
        const lote = items.reduce((soma, i) => soma + (i.producedQty || i.currentQty || 0), 0);
        const atual = items.reduce((soma, i) => soma + (i.currentQty || 0), 0);
        const referencia = padrao > 0 ? padrao : lote;

        return {
          atual,
          padrao,
          referencia,
          percent: referencia > 0 ? atual / referencia : (atual > 0 ? 1 : 0),
          vazio: atual === 0
        };
      };

      // ------------------------------------------
      // Tempo de exposição lido em cima da validade do produto:
      // "vendeu fresquinho" é diferente de "vendeu no último dia"
      // ------------------------------------------
      const getExposureInfo = (days, shelfLife) => {
        const cinza = { bgClass: 'tone-quiet', textClass: 'ink-quiet', dotClass: 'dot-quiet' };
        if (days === null || days === undefined) {
          return { status: 'indefinido', label: 'Sem registro', ...cinza };
        }

        const validade = Number(shelfLife) || 0;
        if (validade <= 0) {
          return { status: 'indefinido', label: days === 0 ? 'No mesmo dia' : `${days}d na vitrine`, ...cinza };
        }
        if (days > validade) {
          return {
            status: 'vencido',
            label: `${days}d · passou da validade`,
            bgClass: 'tone-expired', textClass: 'ink-expired', dotClass: 'dot-expired'
          };
        }
        if (days === validade) {
          return {
            status: 'limite',
            label: `${days}d · último dia de validade`,
            bgClass: 'tone-last', textClass: 'ink-last', dotClass: 'dot-last'
          };
        }
        return {
          status: 'fresco',
          label: days === 0 ? 'Fresquinho · saiu no mesmo dia' : `${days}d · dentro da validade`,
          bgClass: 'tone-fresh', textClass: 'ink-fresh', dotClass: 'dot-fresh'
        };
      };

      // ==========================================
      // SUPABASE — ÚNICA FONTE DE DADOS
      //
      // Dados do projeto (Supabase → Project Settings → API).
      // A chave abaixo é a pública, feita para ficar no navegador —
      // quem protege os dados é o RLS, na seção 13 do schema.sql.
      //
      // Antes do primeiro uso, rode supabase/schema.sql no SQL Editor.
      // ==========================================
      const SUPABASE_URL = 'https://rnycjwlmzpackuodflki.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_W9Z02Rr3nlUqS1ec5_OCiw_Ezoc_iWk';

      const isSupabaseConfigured =
        SUPABASE_URL.startsWith('https://') &&
        !SUPABASE_URL.includes('SEU-PROJETO') &&
        SUPABASE_KEY.length > 20 &&
        !SUPABASE_KEY.includes('SUA-CHAVE');

      const sb = isSupabaseConfigured && window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
        : null;

      // Toda consulta passa por aqui: erro do banco vira exceção com contexto
      const run = async (label, query) => {
        const { data, error } = await query;
        if (error) throw new Error(`${label}: ${error.message}`);
        return data;
      };

      // ------------------------------------------
      // Conversão entre as linhas do banco (snake_case)
      // e o formato usado pelos componentes (camelCase)
      // ------------------------------------------
      const fromUnit = (row) => ({ code: row.code, name: row.name });

      const fromProduct = (row) => ({
        id: row.id,
        name: row.name,
        responsible: row.responsible || '',
        category: row.category,
        showcaseEnabled: row.is_active !== false,
        defaultUnit: row.default_unit,
        minReplenishmentQty: row.min_replenishment_qty,
        shelfLifeDays: row.shelf_life_days,
        price: Number(row.price) || 0,
        priceUnit: row.price_unit || 'un',
        manualCost: Number(row.manual_cost) || 0
      });

      const fromSlot = (row) => ({
        id: row.code,
        unit: row.unit_code,
        showcaseType: row.showcase_type,
        shelfNumber: row.shelf_number,
        slotNumber: row.slot_number,
        sectionTitle: row.section_title
      });

      const fromSlotItem = (row) => ({
        id: row.id,
        slotId: row.slot_code,
        productId: row.product_id,
        productName: row.products?.name || row.product_name || 'Produto',
        producedQty: row.produced_qty,
        currentQty: row.current_qty,
        unit: row.unit_of_measure,
        minQty: row.min_qty,
        manufactureDate: row.manufacture_date,
        entryDate: row.entry_date,
        // A hora exata da entrada: é ela que separa o rastro deste item do
        // rastro de uma fornada igual que passou pelo espaço antes dele
        criadoEm: row.created_at
      });

      const fromPlan = (row) => ({
        id: row.id,
        unit: row.unit_code,
        dayOfWeek: row.day_of_week,
        slotId: row.slot_code,
        productId: row.product_id,
        idealQty: row.ideal_qty,
        minQty: row.min_qty || 0,
        unitOfMeasure: row.unit_of_measure,
        priority: row.priority || DEFAULT_PRIORITY,
        frequency: row.frequency || 'dias'
      });

      const fromSale = (row) => ({
        id: row.id,
        unit: row.unit_code,
        productId: row.product_id,
        productName: row.product_name,
        responsible: row.responsible || '',
        qty: row.qty,
        producedQty: row.produced_qty,
        unitOfMeasure: row.unit_of_measure,
        manufactureDate: row.manufacture_date,
        exposureDays: row.exposure_days,
        timestamp: row.sold_at,
        criadoEm: row.created_at
      });

      const fromLoss = (row) => ({
        id: row.id,
        unit: row.unit_code,
        productId: row.product_id,
        productName: row.product_name,
        responsible: row.responsible || '',
        qty: row.qty,
        producedQty: row.produced_qty,
        unitOfMeasure: row.unit_of_measure,
        manufactureDate: row.manufacture_date,
        lossDate: row.loss_date,
        reason: row.reason,
        details: row.details || '',
        slotId: row.slot_code,
        criadoEm: row.created_at
      });

      const fromProduction = (row) => ({
        id: row.id,
        unit: row.unit_code,
        productId: row.product_id,
        productName: row.product_name,
        responsible: row.responsible || '',
        qty: row.qty,
        unitOfMeasure: row.unit_of_measure,
        manufactureDate: row.manufacture_date,
        slotId: row.slot_code,
        source: row.source,
        timestamp: row.produced_at
      });

      const fromSeparated = (row) => ({
        id: row.id,
        unit: row.unit_code,
        productName: row.name,
        category: row.category,
        currentQty: row.current_qty,
        unitOfMeasure: row.unit_of_measure,
        minQty: row.min_qty,
        price: Number(row.price) || 0,
        priceUnit: row.price_unit || 'un',
        cost: Number(row.cost) || 0
      });

      const fromSupply = (row) => ({
        id: row.id,
        name: row.name,
        unit: row.unit || 'g',
        variationUnit: row.variation_unit || '',
        variationFactor: row.variation_factor === null ? null : Number(row.variation_factor),
        supplyClass: row.supply_class || 'insumo'
      });

      const fromSupplyPurchase = (row) => ({
        id: row.id,
        supplyId: row.supply_id,
        supplier: row.supplier || '',
        purchaseDate: row.purchase_date || '',
        qty: Number(row.qty) || 0,
        cost: Number(row.cost) || 0,
        criadoEm: row.created_at
      });

      const fromRecipe = (row) => ({
        id: row.id,
        productId: row.product_id,
        yieldQty: Number(row.yield_qty) || 1,
        yieldUnit: row.yield_unit || 'un',
        weightPerUnit: row.weight_per_unit === null ? null : Number(row.weight_per_unit),
        notes: row.notes || ''
      });

      const fromRecipeItem = (row) => ({
        id: row.id,
        recipeId: row.recipe_id,
        supplyId: row.supply_id || null,
        componentProductId: row.component_product_id || null,
        qty: Number(row.qty) || 0,
        usageUnit: row.usage_unit || ''
      });

      const fromResalePurchase = (row) => ({
        id: row.id,
        separatedProductId: row.separated_product_id,
        supplier: row.supplier || '',
        purchaseDate: row.purchase_date || '',
        qty: Number(row.qty) || 0,
        purchaseUnit: row.purchase_unit || 'un',
        cost: Number(row.cost) || 0,
        criadoEm: row.created_at
      });

      const SLOT_ITEM_COLUMNS = '*, products(name)';

      // O histórico de produção chegou depois das outras tabelas: um banco que
      // ainda não rodou a versão nova do schema.sql continua abrindo o app
      const runSoft = async (query) => {
        const { data, error } = await query;
        return error ? null : data;
      };

      // ------------------------------------------
      // Leitura: carrega o estado inteiro do banco
      // ------------------------------------------
      const fetchEverything = async () => {
        const [
          units, products, slots, slotItems, plans, sales, losses, separated, production,
          supplies, supplyPurchases, recipes, recipeItems, resalePurchases
        ] = await Promise.all([
          run('unidades', sb.from('units').select('*').order('name')),
          run('produtos', sb.from('products').select('*').order('name')),
          run('espaços da vitrine', sb.from('showcase_slots').select('*').order('shelf_number').order('slot_number')),
          run('itens da vitrine', sb.from('slot_items').select(SLOT_ITEM_COLUMNS)),
          run('vitrine padrão', sb.from('standard_plans').select('*')),
          run('vendas', sb.from('sale_records').select('*').order('sold_at', { ascending: false }).limit(500)),
          run('perdas', sb.from('loss_records').select('*').order('loss_date', { ascending: false }).limit(500)),
          run('itens fora da vitrine', sb.from('separated_products').select('*').eq('is_active', true).order('name')),
          runSoft(sb.from('production_records').select('*').order('produced_at', { ascending: false }).limit(500)),
          // As cinco tabelas do CMV entram por runSoft: um banco que ainda não
          // rodou a versão nova do schema.sql continua abrindo a vitrine, e é a
          // própria aba do CMV que explica o que falta rodar
          runSoft(sb.from('supplies').select('*').eq('is_active', true).order('name')),
          runSoft(sb.from('supply_purchases').select('*').order('purchase_date', { ascending: false })),
          runSoft(sb.from('recipes').select('*')),
          runSoft(sb.from('recipe_items').select('*')),
          runSoft(sb.from('resale_purchases').select('*').order('purchase_date', { ascending: false }))
        ]);

        return {
          units: (units || []).map(fromUnit),
          products: (products || []).map(fromProduct),
          slots: (slots || []).map(fromSlot),
          slotItems: (slotItems || []).map(fromSlotItem),
          standardPlans: (plans || []).map(fromPlan),
          saleRecords: (sales || []).map(fromSale),
          lossRecords: (losses || []).map(fromLoss),
          separatedProducts: (separated || []).map(fromSeparated),
          productionRecords: (production || []).map(fromProduction),
          productionReady: production !== null,
          supplies: (supplies || []).map(fromSupply),
          supplyPurchases: (supplyPurchases || []).map(fromSupplyPurchase),
          recipes: (recipes || []).map(fromRecipe),
          recipeItems: (recipeItems || []).map(fromRecipeItem),
          resalePurchases: (resalePurchases || []).map(fromResalePurchase),
          // Falso enquanto as tabelas do CMV não existirem no banco
          cmvReady: supplies !== null && recipes !== null,
          // Banco antigo: as linhas do padrão vêm sem prioridade e frequência
          planExtrasReady: (plans || []).length === 0 || (plans || [])[0].priority !== undefined,
          // A quantidade mínima por dia chegou depois: um banco que ainda não
          // rodou a versão nova do schema.sql continua salvando o padrão sem ela
          planMinReady: (plans || []).length === 0 || (plans || [])[0].min_qty !== undefined
        };
      };

      const getUnitName = (units, code) => units.find((u) => u.code === code)?.name || code;

      // ==========================================
      // PICKER FIELD — CAIXA DE SELEÇÃO DO SITE
      //
      // O navegador desenha <select> e <datalist> com o estilo dele, que não
      // combina com o resto da tela. Este campo usa a mesma lista em todo o
      // app: cartão branco, cantos arredondados e realce azul.
      //
      // Dois modos, escolhidos pelo que é passado:
      //   • com onType  → texto livre com sugestões (produto, responsável)
      //   • sem onType  → escolha fechada, como um <select>
      // ==========================================
      const PickerField = ({
        value = '',
        options = [],
        onPick,
        onType,
        placeholder = '',
        className = 'field field-md',
        inputRef,
        onKeyDown,
        title,
        disabled = false,
        inputProps = {},
        emptyLabel = 'Nada encontrado'
      }) => {
        const [open, setOpen] = useState(false);
        const [active, setActive] = useState(-1);
        const [search, setSearch] = useState('');
        const [typed, setTyped] = useState(false);
        const [box, setBox] = useState(null);

        const localRef = useRef(null);
        const fieldRef = inputRef || localRef;

        const isFree = typeof onType === 'function';
        const selected = options.find((o) => o.value === value) || null;
        // A lista só filtra depois que a pessoa digita: abrir um campo já
        // preenchido mostra todas as opções, para poder trocar de uma vez
        const term = typed ? (isFree ? value : search).trim().toLowerCase() : '';
        const visible = term
          ? options.filter((o) => o.label.toLowerCase().includes(term))
          : options;

        // A lista fica presa ao corpo da página: assim ela não é cortada por
        // tabelas com rolagem nem por cartões com overflow escondido
        const measure = () => {
          const el = fieldRef.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          const below = window.innerHeight - r.bottom;
          const flip = below < 180 && r.top > below;
          setBox({
            left: r.left,
            width: r.width,
            top: flip ? null : r.bottom + 6,
            bottom: flip ? window.innerHeight - r.top + 6 : null,
            maxHeight: Math.max(120, Math.min(260, (flip ? r.top : below) - 16))
          });
        };

        useEffect(() => {
          if (!open) return;
          measure();
          const reposition = () => measure();
          window.addEventListener('scroll', reposition, true);
          window.addEventListener('resize', reposition);
          return () => {
            window.removeEventListener('scroll', reposition, true);
            window.removeEventListener('resize', reposition);
          };
        }, [open]);

        const openList = () => {
          if (disabled) return;
          setSearch('');
          setTyped(false);
          setActive(-1);
          setOpen(true);
        };
        const close = () => { setOpen(false); setActive(-1); setTyped(false); };

        const choose = (opt) => {
          onPick(opt);
          close();
        };

        const handleChange = (e) => {
          if (disabled) return;
          const texto = e.target.value;
          setActive(-1);
          setTyped(true);
          setOpen(true);
          if (isFree) onType(texto);
          else setSearch(texto);
        };

        const handleKeyDown = (e) => {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!open) { openList(); return; }
            const passo = e.key === 'ArrowDown' ? 1 : -1;
            setActive((i) => {
              if (visible.length === 0) return -1;
              const proximo = i + passo;
              if (proximo < 0) return visible.length - 1;
              if (proximo >= visible.length) return 0;
              return proximo;
            });
            return;
          }
          if (e.key === 'Escape' && open) { e.preventDefault(); close(); return; }
          // Enter só escolhe quando alguém está destacado na lista;
          // fora isso o Enter segue para quem usa o campo
          if (e.key === 'Enter' && open && visible[active]) {
            e.preventDefault();
            choose(visible[active]);
            return;
          }
          if (e.key === 'Tab') close();
          if (onKeyDown) onKeyDown(e);
        };

        // Modo fechado: o campo mostra o item escolhido e vira busca ao abrir
        const texto = isFree ? value : (open ? search : (selected ? selected.label : ''));
        const placeholderAtual = !isFree && open && selected ? selected.label : placeholder;

        return (
          <>
            <input
              ref={fieldRef}
              type="text"
              role="combobox"
              aria-expanded={open}
              autoComplete="off"
              title={title}
              disabled={disabled}
              placeholder={placeholderAtual}
              value={texto}
              onChange={handleChange}
              onMouseDown={() => { if (!disabled && !open) openList(); }}
              onBlur={close}
              onKeyDown={handleKeyDown}
              {...inputProps}
              className={`${className} field-select ${disabled ? 'picker-disabled' : ''}`}
            />

            {open && box && ReactDOM.createPortal(
              <div
                className="picker-panel"
                style={{
                  left: box.left,
                  width: box.width,
                  top: box.top === null ? undefined : box.top,
                  bottom: box.bottom === null ? undefined : box.bottom,
                  maxHeight: box.maxHeight
                }}
                onMouseDown={(e) => e.preventDefault()}
              >
                {visible.length === 0 ? (
                  <div className="picker-empty">{emptyLabel}</div>
                ) : (
                  visible.map((opt, i) => (
                    <button
                      key={opt.value || opt.label}
                      type="button"
                      data-active={i === active}
                      data-muted={!!opt.muted}
                      onMouseEnter={() => setActive(i)}
                      onMouseDown={(e) => { e.preventDefault(); choose(opt); }}
                      className="picker-option"
                    >
                      <span className="truncate">{opt.label}</span>
                      {/* Dica da direita: de onde é a opção, quando isso muda
                          o resultado — o produto de outra vitrine, por exemplo */}
                      {opt.hint && <span className="picker-hint">{opt.hint}</span>}
                      {opt.value === value && opt.value !== '' && (
                        <Icons.CheckCircle2 className="w-3.5 h-3.5 shrink-0 opacity-70" />
                      )}
                    </button>
                  ))
                )}
              </div>,
              document.body
            )}
          </>
        );
      };

      // ==========================================
      // QUANTIDADE DA BAIXA SOBRE O LOTE
      //
      // "5/8 un": saiu 5 de um lote de 8, no mesmo formato da vitrine física.
      // Bancos antigos podem não ter guardado o tamanho do lote; aí mostra só a
      // quantidade, e o sinal (+/−) diz se entrou ou saiu.
      //
      // "big" é para quando o número vem escrito na frente do nome do produto,
      // como na vitrine física: ali ele é a primeira coisa que se lê.
      // ==========================================
      const QtyOfBatch = ({ qty, produced, unit, sign = '', className = 'text-[#1d1d1f]', big = false }) => (
        <span className="tnum whitespace-nowrap">
          <span className={`${big ? 'text-[15px]' : 'text-[13px]'} font-extrabold ${className}`}>{produced > 0 ? qty : `${sign}${qty}`}</span>
          <span className={`${big ? 'text-[12px]' : 'text-[11px]'} font-medium text-[#86868b]`}>
            {produced > 0 ? `/${produced}` : ''} {unit}
          </span>
        </span>
      );

      // ==========================================
      // MEDIDOR DE OCUPAÇÃO DA VITRINE
      //
      // O quanto do móvel está tomado, em uma tirinha curta do lado do nome
      // dele: os produtos que estão lá contra os espaços que o móvel tem.
      //
      // O móvel cheio não fica no fim da tirinha: fica em um risquinho a 70%
      // dela, e o pedaço depois da marca é a sobra. Assim a vitrine com mais
      // produto do que espaço atravessa a marca e entra na sobra em âmbar, em
      // vez de desenhar a mesma tirinha cheia de quem está no ponto. Vitrine
      // lotada tem cara de lotada, que é a leitura que a loja faz de longe.
      //
      // A sobra desenhada vai até um terço acima do cheio: dali para cima o
      // âmbar já está no fim e quem conta o resto é a porcentagem. O primeiro
      // pedaço da sobra cresce depressa (raiz, e não reta), senão passar 10%
      // pintaria um fiapo de âmbar que ninguém enxerga — e é justamente esse
      // tanto que a loja precisa ver.
      // ==========================================
      const MEDIDOR_MARCA = 70;      // onde fica o móvel cheio, em % da tirinha
      const MEDIDOR_SOBRA = 30;      // quanto acima do cheio a sobra desenha, em %

      const FillMeter = ({ percent, title, className = '' }) => {
        if (percent === null || percent === undefined) return null;
        const passou = percent > 100;
        const cheio = percent >= 100;
        const ateAMarca = (Math.min(percent, 100) / 100) * MEDIDOR_MARCA;
        const sobra = passou
          ? Math.sqrt(Math.min((percent - 100) / MEDIDOR_SOBRA, 1)) * (100 - MEDIDOR_MARCA)
          : 0;

        return (
          <span
            className={`meter ${className}`}
            title={title}
            role="img"
            aria-label={title || `${percent}% do padrão`}
          >
            <span className="meter-track">
              <span className="meter-room" style={{ width: `${MEDIDOR_MARCA}%` }} />
              <span className="meter-fill" data-full={cheio} style={{ width: `${ateAMarca}%` }} />
              {passou && (
                <span className="meter-over" style={{ left: `${MEDIDOR_MARCA}%`, width: `${sobra}%` }} />
              )}
              <span className="meter-mark" style={{ left: `${MEDIDOR_MARCA}%` }} />
            </span>
            <span className="meter-value" data-over={passou}>{percent}%</span>
          </span>
        );
      };

      // ==========================================
      // TENDÊNCIA — O CAMINHO ATÉ O NÚMERO DE HOJE
      //
      // "Perdeu 34 un" sozinho não diz nada: 34 depois de 12 é um problema
      // novo, 34 depois de 60 é uma melhora. O risquinho desenha os últimos
      // dias e o ponto marca o de hoje, para a leitura vir junto com o
      // número em vez de depender de abrir um relatório.
      //
      // O desenho é esticado na largura que couber, e por isso o traço e o
      // ponto usam non-scaling-stroke: eles têm a mesma espessura em um
      // cartão estreito e em um largo.
      // ==========================================
      const Sparkline = ({ values = [], className = '', title }) => {
        if (values.length === 0) return null;

        const maior = Math.max(...values, 1);
        const menor = Math.min(...values, 0);
        const faixa = maior - menor || 1;
        const passo = values.length > 1 ? 120 / (values.length - 1) : 0;
        const pontos = values.map((v, i) => [
          values.length > 1 ? i * passo : 60,
          28 - ((v - menor) / faixa) * 24
        ]);

        const linha = pontos
          .map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`)
          .join(' ');
        const [ux, uy] = pontos[pontos.length - 1];

        return (
          <svg
            className={`spark ${className}`}
            viewBox="0 0 120 32"
            preserveAspectRatio="none"
            role="img"
            aria-label={title || 'Tendência dos últimos dias'}
          >
            {values.length > 1 && (
              <>
                <path className="spark-area" d={`${linha} L120 32 L0 32 Z`} />
                <path className="spark-line" d={linha} vectorEffect="non-scaling-stroke" />
              </>
            )}
            <line
              className="spark-dot"
              x1={ux} y1={uy} x2={ux} y2={uy}
              vectorEffect="non-scaling-stroke"
            />
          </svg>
        );
      };

      // ==========================================
      // A VARIAÇÃO DE UM NÚMERO CONTRA O PERÍODO ANTERIOR
      //
      // A camada de interpretação do número grande: "↑ 18% vs. os 7 dias
      // anteriores". Em perda, subir é ruim — quem chama a cor é o pior,
      // e não a seta.
      // ==========================================
      const Delta = ({ percent, sufixo, subirEhRuim = true, className = '' }) => {
        if (percent === null || percent === undefined) return null;
        const subiu = percent > 0;
        const desceu = percent < 0;
        const tom = !subiu && !desceu
          ? 'delta-flat'
          : (subiu === subirEhRuim ? 'delta-ruim' : 'delta-bom');

        return (
          <span className={`${tom} tnum ${className}`}>
            {subiu ? '↑' : desceu ? '↓' : '→'} {Math.abs(percent)}%{sufixo ? ` ${sufixo}` : ''}
          </span>
        );
      };

      // ==========================================
      // DATA DA BAIXA + LOTE DE ORIGEM
      //
      // A venda ou a perda lançada hoje pode ser de um lote fabricado dias
      // atrás. Sem dizer de qual lote saiu, dois lançamentos do mesmo produto
      // ficam iguais na tabela e parecem o mesmo produto lançado duas vezes.
      // ==========================================
      const DateWithBatch = ({ dia, manufactureDate }) => (
        <>
          {formatDateBR(dia)}
          {manufactureDate && manufactureDate !== dia && (
            <span className="block t-nano tnum">lote de {formatDateBR(manufactureDate)}</span>
          )}
        </>
      );

      // ==========================================
      // O SELO DA FREQUÊNCIA
      //
      // Diz, em um relance, a natureza do item dentro do padrão: FIXO, o que
      // entra todo dia e a cozinha faz sempre, ou VARIA, o que entra só em
      // alguns dias. O nome continua escrito — "Todo dia", "Seg · Qua",
      // "3 dias" —, mas agora chega pintado, e com a semana desenhada em sete
      // traços quando há espaço para ela.
      // ==========================================
      const NATUREZA_TITULO = {
        fixo: 'Fixo — entra todo dia da semana',
        fora: 'Fora do padrão — não entra em dia nenhum'
      };

      const naturezaDeFrequencia = (dias) =>
        dias.length >= WEEK_DAYS.length ? 'fixo' : dias.length === 0 ? 'fora' : 'varia';

      const SeloFrequencia = ({ dias, semana = false, className = '' }) => {
        const natureza = naturezaDeFrequencia(dias);
        return (
          <span
            className={`freq ${className}`}
            data-fixo={natureza}
            title={NATUREZA_TITULO[natureza] || `Varia — entra em: ${frequencyTitle(dias)}`}
          >
            <span className="freq-nome">{frequencyLabel(dias)}</span>
            {semana && (
              <span className="freq-semana" aria-hidden="true">
                {WEEK_DAYS.map((d) => (
                  <span key={d} className="freq-dia" data-on={dias.includes(d)} />
                ))}
              </span>
            )}
          </span>
        );
      };

      // ==========================================
      // AS ABAS, EM DOIS GRUPOS
      //
      // A vitrine é o dia a dia da loja; o CMV é a conta do negócio. São
      // assuntos e horas do dia diferentes, e cada um tem a sua fileira de
      // abas — juntas, as dez não caberiam na tela do celular.
      // ==========================================
      const NAV_GROUPS = {
        vitrine: {
          label: 'Vitrine',
          title: 'O dia a dia da loja',
          tabs: [
            { id: 'vitrine', label: 'Vitrine', fullLabel: 'Vitrine Operacional', icon: Icons.LayoutGrid },
            { id: 'padrao', label: 'Padrão', fullLabel: 'Vitrine Padrão', icon: Icons.ClipboardList },
            { id: 'producao', label: 'Produção', fullLabel: 'Pedido de Produção', icon: Icons.ChefHat },
            { id: 'perdas', label: 'Perdas', fullLabel: 'Relatório de Perdas', icon: Icons.TrendingDown },
            { id: 'historico', label: 'Histórico', fullLabel: 'Produção, Vendas e Perdas', icon: Icons.History },
            { id: 'fora', label: 'Fora da vitrine', fullLabel: 'Fora da Vitrine', icon: Icons.Coffee }
          ]
        },
        cmv: {
          label: 'CMV',
          title: 'Custo, preço e fornecedores',
          tabs: [
            { id: 'produtos', label: 'Produtos', fullLabel: 'Cadastro de Produtos', icon: Icons.Package },
            { id: 'insumos', label: 'Insumos', fullLabel: 'Insumos & Fichas', icon: Icons.Layers },
            { id: 'cmv', label: 'CMV', fullLabel: 'CMV — Custo da Mercadoria Vendida', icon: Icons.TrendingUp },
            { id: 'fornecedores', label: 'Fornecedores', fullLabel: 'Fornecedores e preços', icon: Icons.ShoppingCart }
          ]
        }
      };

      // De qual grupo é uma aba. Vale para quem chega nela por um botão de
      // dentro da tela, e não pela fileira de cima.
      const groupOfTab = (tab) =>
        NAV_GROUPS.cmv.tabs.some((t) => t.id === tab) ? 'cmv' : 'vitrine';

      // ==========================================
      // NAVBAR COMPONENT
      // ==========================================
      const Navbar = ({ units, currentUnit, onUnitChange, activeTab, onTabChange, totalAlerts, onHome }) => {
        const navItems = NAV_GROUPS[groupOfTab(activeTab)].tabs;

        return (
          <header className="app-navbar glass sticky top-0 z-40 border-b hairline">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-14 gap-4">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-[10px] bg-[#0E0937] flex items-center justify-center text-white text-[13px] font-extrabold tracking-tight">
                      DV
                    </div>
                    <div className="leading-none">
                      <h1 className="t-headline text-[#1d1d1f]">Delícias da Vovó</h1>
                      <p className="t-caption mt-0.5">Gestão de vitrine</p>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={onHome}
                    title="Voltar à tela inicial"
                    className="btn btn-secondary btn-sm shrink-0"
                  >
                    <Icons.ChevronLeft className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Início</span>
                  </button>

                  <div className="h-5 w-px bg-black/10 hidden sm:block" />

                  {/* As unidades vêm da tabela units do Supabase */}
                  <div className="segmented">
                    {units.map((u) => (
                      <button key={u.code} onClick={() => onUnitChange(u.code)} data-active={currentUnit === u.code}>
                        {u.name}
                      </button>
                    ))}
                  </div>

                  {/* Os dois assuntos da casa. Trocar de grupo troca a fileira
                      de abas inteira: são sete de cada lado, nunca dez de uma
                      vez — que é o que faria a fileira estourar no celular.
                      No celular ele desce para a fileira das abas, senão
                      disputaria espaço com a marca e o nome da unidade. */}
                  <div className="hidden lg:flex items-center gap-4">
                    <div className="h-5 w-px bg-black/10" />
                    <div className="segmented">
                      {Object.entries(NAV_GROUPS).map(([id, grupo]) => (
                        <button
                          key={id}
                          onClick={() => onTabChange(grupo.tabs[0].id)}
                          data-active={groupOfTab(activeTab) === id}
                          title={grupo.title}
                        >
                          {grupo.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <nav className="hidden lg:flex items-center gap-0.5">
                  {navItems.map((tab) => {
                    const IconComp = tab.icon;
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => onTabChange(tab.id)}
                        title={tab.fullLabel}
                        className={`px-2.5 h-8 rounded-lg text-[12px] flex items-center gap-1.5 shrink-0 whitespace-nowrap transition-all tracking-tight ${
                          isActive
                            ? 'bg-black/[0.06] text-[#1d1d1f] font-bold'
                            : 'text-[#6e6e73] font-semibold hover:text-[#1d1d1f] hover:bg-black/[0.03]'
                        }`}
                      >
                        <IconComp className="w-3.5 h-3.5 shrink-0" />
                        <span>{tab.label}</span>
                        {tab.id === 'vitrine' && totalAlerts > 0 && (
                          <span className="ml-0.5 min-w-4 h-4 px-1 text-[10px] badge-expired font-bold rounded-full flex items-center justify-center tnum">
                            {totalAlerts}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </nav>
              </div>
            </div>

            {/* Navegação em scroll horizontal no mobile */}
            <div className="lg:hidden flex items-center px-4 py-2 border-t hairline gap-2">
              <div className="segmented shrink-0">
                {Object.entries(NAV_GROUPS).map(([id, grupo]) => (
                  <button
                    key={id}
                    onClick={() => onTabChange(grupo.tabs[0].id)}
                    data-active={groupOfTab(activeTab) === id}
                    title={grupo.title}
                    className="h-7 px-3 text-[12px]"
                  >
                    {grupo.label}
                  </button>
                ))}
              </div>
              <div className="h-5 w-px bg-black/10 shrink-0" />
              <div className="flex overflow-x-auto gap-1.5 scrollbar-none">
              {navItems.map((tab) => {
                const IconComp = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => onTabChange(tab.id)}
                    className={`px-3 h-8 rounded-full text-[12px] font-semibold whitespace-nowrap shrink-0 flex items-center gap-1.5 transition-colors ${
                      isActive ? 'bg-[#0E0937] text-white' : 'text-[#6e6e73] bg-black/[0.05]'
                    }`}
                  >
                    <IconComp className="w-3.5 h-3.5 shrink-0" />
                    <span>{tab.fullLabel}</span>
                    {tab.id === 'vitrine' && totalAlerts > 0 && (
                      <span className={`min-w-4 h-4 px-1 text-[10px] font-bold rounded-full flex items-center justify-center tnum ${isActive ? 'bg-white/25 text-white' : 'badge-expired'}`}>
                        {totalAlerts}
                      </span>
                    )}
                  </button>
                );
              })}
              </div>
            </div>
          </header>
        );
      };

      // ==========================================
      // CAMPO DA CONTAGEM
      //
      // Quantas unidades estão na vitrine agora. Isto é acerto de contagem,
      // não baixa: digitar aqui não registra venda nem perda — para isso são
      // os botões de baixa ao lado.
      // ==========================================
      const QtyField = ({ value, onSet, className = '', label }) => {
        // Enquanto a pessoa digita, o campo pode ficar vazio sem virar zero
        const [rascunho, setRascunho] = useState(null);
        const texto = rascunho === null ? String(value) : rascunho;

        return (
          <input
            type="text"
            inputMode="numeric"
            value={texto}
            onChange={(e) => {
              const limpo = e.target.value.replace(/\D/g, '');
              setRascunho(limpo);
              if (limpo !== '') onSet(Number(limpo));
            }}
            onFocus={(e) => e.target.select()}
            onBlur={() => setRascunho(null)}
            aria-label={label || 'Quantidade na vitrine'}
            className={`field tnum text-center no-spin ${className}`}
          />
        );
      };

      // ==========================================
      // O CLIQUE QUE SAIU DUAS VEZES
      //
      // A mão acostumada ao computador clica duas vezes em tudo, e o dedo no
      // celular repete o toque sem querer. Onde um clique já registra venda,
      // perda ou lançamento, o segundo clique colado no primeiro vira uma
      // baixa que ninguém fez — e, quando a tela já andou para o próximo item,
      // ele ainda cai no item errado.
      //
      // Meio segundo é o limite: abaixo disso é o mesmo gesto, e não conta;
      // acima, é a pessoa pedindo de novo, e aí conta.
      // ==========================================
      const CLIQUE_REPETIDO_MS = 500;

      // O guarda de cada botão não alcança o clique duplo que cai fora dele:
      // some a barrinha do desfazer entre um clique e outro, e o segundo vai
      // parar no botão que ficou embaixo do ponteiro — uma venda que ninguém
      // pediu, no item que estava ali atrás.
      //
      // Por isso o segundo clique de um gesto só vale no mesmo elemento do
      // primeiro. Caiu em outro, foi a tela que andou, e ele morre aqui, na
      // captura, antes de chegar a qualquer botão. Clique repetido no mesmo
      // lugar continua passando: é assim que se sobe a quantidade nos +/−.
      let ultimoAlvoClicado = null;
      document.addEventListener('click', (e) => {
        const mesmoAlvo = e.target === ultimoAlvoClicado;
        ultimoAlvoClicado = e.target;
        if (e.detail > 1 && !mesmoAlvo) {
          e.stopPropagation();
          e.preventDefault();
        }
      }, true);

      // O horário do último clique fica em um ref, e não em estado: o segundo
      // clique chega antes de qualquer render.
      const useCliqueUnico = (acao, ms = CLIQUE_REPETIDO_MS) => {
        const ultimoRef = useRef(0);
        return (...args) => {
          const agora = Date.now();
          if (agora - ultimoRef.current < ms) return;
          ultimoRef.current = agora;
          return acao(...args);
        };
      };

      // ==========================================
      // SEGURAR O BOTÃO
      //
      // O clique curto dá a baixa rápida; segurar por um instante dá baixa no
      // lote inteiro. O próprio botão mostra o tempo do gesto enquanto o dedo
      // fica parado nele.
      // ==========================================
      const LONG_PRESS_MS = 600;

      const useLongPress = (onLongPress, onClick) => {
        const timerRef = useRef(null);
        const disparouRef = useRef(false);
        const origemRef = useRef(null);
        const ultimoRef = useRef(0);
        const [segurando, setSegurando] = useState(false);

        // Um gesto por botão: o toque repetido sem querer e o clique duplo do
        // mouse chegam aqui antes de a tela responder ao primeiro
        const aceitar = () => {
          const agora = Date.now();
          if (agora - ultimoRef.current < CLIQUE_REPETIDO_MS) return false;
          ultimoRef.current = agora;
          return true;
        };

        const soltar = () => {
          if (timerRef.current) clearTimeout(timerRef.current);
          timerRef.current = null;
          origemRef.current = null;
          setSegurando(false);
        };

        return {
          'data-holding': segurando,
          onPointerDown: (e) => {
            disparouRef.current = false;
            origemRef.current = { x: e.clientX, y: e.clientY };
            setSegurando(true);
            timerRef.current = setTimeout(() => {
              disparouRef.current = true;
              setSegurando(false);
              if (aceitar()) onLongPress();
            }, LONG_PRESS_MS);
          },
          // O dedo que arrasta está rolando a lista, não segurando o botão
          onPointerMove: (e) => {
            const origem = origemRef.current;
            if (!origem) return;
            if (Math.abs(e.clientX - origem.x) > 10 || Math.abs(e.clientY - origem.y) > 10) soltar();
          },
          onPointerUp: soltar,
          onPointerLeave: soltar,
          onPointerCancel: soltar,
          // O clique vem depois de soltar o dedo: se a janela já abriu, ele
          // não pode dar a baixa por cima
          onClick: () => {
            if (disparouRef.current) {
              disparouRef.current = false;
              return;
            }
            if (!aceitar()) return;
            onClick();
          },
          onContextMenu: (e) => e.preventDefault()
        };
      };

      // ==========================================
      // BOTÕES DE BAIXA DE UM ITEM
      //
      // Os mesmos dois botões na vitrine física e na lista de apoio:
      //   Venda → toque vende 1; segure para vender tudo
      //   Perda → toque perde 1; segure para perder tudo
      // O gesto fica igual ao da conferência e reduz quatro decisões a duas.
      // ==========================================
      const ItemActions = ({ item, onQuickSale, onRecordSellAll, onQuickLoss, className = '' }) => {
        const venda = useLongPress(
          () => onRecordSellAll(item.id),
          () => onQuickSale(item.id)
        );
        const perda = useLongPress(
          () => onQuickLoss(item.id, item.currentQty),
          () => onQuickLoss(item.id, 1)
        );

        return (
          <div className={`item-actions ${className}`}>
            <button
              {...venda}
              title={`Venda 1 · segure para vender tudo (${item.currentQty})`}
              aria-label={`Venda uma unidade. Segure para vender todas as ${item.currentQty} unidades`}
              className="btn item-action item-action-sale"
            >
              <Icons.ShoppingCart className="w-[18px] h-[18px]" />
            </button>
            <button
              {...perda}
              title={`Perda de 1 · segure para perder tudo (${item.currentQty})`}
              aria-label={`Registre a perda de uma unidade. Segure para perder todas as ${item.currentQty} unidades`}
              className="btn item-action item-action-loss"
            >
              <Icons.Discard className="w-[18px] h-[18px]" />
            </button>
          </div>
        );
      };

      // ==========================================
      // CHECKLIST DA VITRINE
      // ==========================================
      // A conferência item a item. A tela mostra um produto de cada vez, na
      // ordem dos espaços, e a pessoa dá baixa nele com o mesmo gesto da
      // vitrine física: toque tira 1, segurar tira o lote inteiro. Cada
      // resposta já vira venda ou perda no relatório na hora — a conferência
      // não é uma lista para depois passar a limpo.
      //
      // Contar o que sobrou para depois dizer se foi venda ou perda era o
      // caminho principal daqui, e é lento: são três telas para um item que
      // vendeu duas coxinhas. Agora a contagem é a saída de baixo, para o
      // espaço que esvaziou de vez e não compensa ir tocando de um em um.
      //
      // Tocar "vendeu 1" três vezes é um item com três vendidos, e não três
      // respostas: a conferência soma as baixas do item enquanto ela está
      // nele, e só passa adiante quando a pessoa manda.
      //
      // Toda baixa registrada aqui fica com um "Desfazer" na barra de baixo
      // até a próxima: o dedo erra, e a pessoa não pode ter que ir no
      // histórico consertar.

      const CHECKLIST_MOTIVOS = [
        { value: 'vencido', label: 'Venceu' },
        { value: 'danificado', label: 'Avaria' },
        { value: 'qualidade', label: 'Sabor ou textura' },
        { value: 'quebrado', label: 'Queda ou quebra' }
      ];

      const CHECKLIST_RESULTADOS = {
        igual: { label: 'Continua igual', dot: 'dot-quiet', text: 'ink-quiet' },
        venda: { label: 'Vendeu', dot: 'dot-fresh', text: 'ink-fresh' },
        perda: { label: 'Perdeu', dot: 'dot-expired', text: 'ink-expired' },
        ajuste: { label: 'Contagem acertada', dot: 'bg-[#0E0937]', text: 'text-[#0E0937]' },
        pulado: { label: 'Pulado', dot: 'dot-quiet', text: 'ink-quiet' }
      };

      // A resposta de um item guarda o quanto foi vendido e o quanto foi
      // perdido nele, porque as duas coisas cabem no mesmo item: metade da
      // bandeja saiu vendida e duas venceram. "tipo" só diz o que aconteceu
      // quando não houve baixa nenhuma.
      const CHECKLIST_RESPOSTA_VAZIA = { venda: 0, perda: 0, ajuste: 0, tipo: 'igual' };

      const descreverResposta = (r) => {
        if (r.tipo === 'ajuste') return `Contagem acertada · +${r.ajuste}`;
        if (r.tipo === 'pulado') return 'Pulado';
        const partes = [];
        if (r.venda > 0) partes.push(`Vendeu ${r.venda}`);
        if (r.perda > 0) partes.push(`Perdeu ${r.perda}`);
        return partes.length > 0 ? partes.join(' · ') : 'Continua igual';
      };

      // A perda manda na cor: um item que vendeu oito e perdeu duas é o item
      // que teve perda, que é o que a pessoa procura na lista do fim
      const corResposta = (r) => {
        if (r.perda > 0) return CHECKLIST_RESULTADOS.perda.text;
        if (r.venda > 0) return CHECKLIST_RESULTADOS.venda.text;
        return CHECKLIST_RESULTADOS[r.tipo].text;
      };

      const ShowcaseChecklist = ({
        currentUnit, slots, slotItems, products, standardPlans, showcaseType,
        onRecordSale, onRecordLoss, onSetQty, onUndoBaixa, onClose
      }) => {
        // Qual vitrine está sendo conferida. Começa na que está aberta na
        // tela, e "Todas" atravessa a loja inteira de uma vez.
        const [escopo, setEscopo] = useState(showcaseType);
        const [index, setIndex] = useState(0);
        const [passo, setPasso] = useState('acoes'); // acoes | contar | destino | motivo
        const [restante, setRestante] = useState(0);
        const [saiu, setSaiu] = useState(0);
        const [resultados, setResultados] = useState([]);
        // A última baixa registrada, enquanto ela ainda pode ser desfeita
        const [ultima, setUltima] = useState(null);

        const dayOfWeek = getTodayDayOfWeek();

        // A fila é montada quando a conferência começa e quando se troca de
        // vitrine — e só aí. Item que zera no caminho sai da vitrine, mas não
        // pode sumir do meio da fila e embaralhar o "item 3 de 12".
        const fila = useMemo(() => {
          const doEscopo = slots.filter(
            (s) => s.unit === currentUnit && (escopo === 'todas' || s.showcaseType === escopo)
          );
          const porId = {};
          doEscopo.forEach((s) => { porId[s.id] = s; });

          return slotItems
            .filter((i) => porId[i.slotId] && (i.currentQty || 0) > 0)
            .map((i) => ({
              id: i.id,
              slotId: i.slotId,
              productId: i.productId,
              productName: i.productName,
              slot: porId[i.slotId]
            }))
            .sort((a, b) =>
              compareShowcase(a.slot, b.slot)
              || a.slot.slotNumber - b.slot.slotNumber
              || a.productName.localeCompare(b.productName, 'pt-BR')
            );
        }, [escopo, currentUnit]);

        // Trocar de vitrine é começar outra conferência
        useEffect(() => {
          setIndex(0);
          setPasso('acoes');
          setResultados([]);
          setUltima(null);
        }, [escopo]);

        const total = fila.length;
        const entrada = index < total ? fila[index] : null;

        // O item pode ter zerado e voltado pelo desfazer com outro id: aí ele
        // é reconhecido pelo mesmo produto no mesmo espaço
        const item = entrada
          ? slotItems.find((i) => i.id === entrada.id)
            || slotItems.find((i) => i.slotId === entrada.slotId && i.productId === entrada.productId)
          : null;

        const product = item ? products.find((p) => p.id === item.productId) : null;
        const statusInfo = item ? getSlotItemStatus(item, product) : null;

        // Quanto o padrão de hoje manda ter neste espaço — o número que diz se
        // o que sobrou ali é pouco ou muito
        const padraoHoje = entrada
          ? standardPlans
              .filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === dayOfWeek && sp.slotId === entrada.slotId)
              .reduce((soma, sp) => soma + (sp.idealQty || 0), 0)
          : 0;

        const escopoLabel = escopo === 'todas' ? 'de toda a loja' : SHOWCASE_TYPE_LABELS[escopo].toLowerCase();

        // ------------------------------------------
        // Guardar a resposta e passar para o próximo
        // ------------------------------------------
        // O item da vez tem uma resposta só, que vai sendo somada enquanto a
        // conferência está nele
        const resposta = entrada ? resultados.find((r) => r.chave === entrada.id) : null;
        const temBaixa = !!resposta && (resposta.venda > 0 || resposta.perda > 0);

        const responder = (mudanca) => {
          setResultados((prev) => {
            const anterior = prev.find((r) => r.chave === entrada.id);
            const base = anterior || { ...CHECKLIST_RESPOSTA_VAZIA, chave: entrada.id, nome: entrada.productName };
            return [...prev.filter((r) => r.chave !== entrada.id), { ...base, ...mudanca(base) }];
          });
        };

        const proximo = () => {
          setPasso('acoes');
          setIndex((i) => i + 1);
        };

        // A baixa entra na conta do item e fica na barra de baixo, de onde
        // ainda pode voltar atrás
        const guardarBaixa = (campo, qty, baixa) => {
          responder((base) => ({ [campo]: base[campo] + qty, tipo: 'baixa' }));
          setUltima(baixa
            ? { baixa, indice: index, campo, qty, texto: `${qty} ${item.unit} de ${entrada.productName}` }
            : null);
        };

        // Seguir adiante. Sem baixa nenhuma no item, seguir é dizer que ele
        // continua igual; depois de uma baixa, é só fechar o item — e aí o
        // desfazer da última baixa continua na tela, que é onde ela ainda
        // pode ser consertada.
        // Andar na fila também é um clique só: dois seguidos pulariam um item
        // sem ninguém ver
        const seguir = useCliqueUnico(() => {
          if (!temBaixa) {
            responder(() => ({ tipo: 'igual' }));
            setUltima(null);
          }
          proximo();
        });

        const pular = useCliqueUnico(() => {
          responder(() => ({ tipo: 'pulado' }));
          setUltima(null);
          proximo();
        });

        const voltar = useCliqueUnico(() => {
          setPasso('acoes');
          setIndex((i) => Math.max(0, i - 1));
        });

        // Um toque tira uma unidade. Quando essa unidade é a última do
        // espaço, não sobra nada para responder e a conferência já anda.
        const venderUm = useCliqueUnico(async () => {
          const ultimaUnidade = item.currentQty <= 1;
          const baixa = await onRecordSale(item.id, 1);
          guardarBaixa('venda', 1, baixa);
          if (ultimaUnidade) proximo();
        });

        // O motivo da perda de uma unidade entra como "vencido", que é a
        // perda do dia a dia da vitrine — igual ao toque da vitrine física.
        // Perda do lote inteiro é que pergunta o motivo.
        const perderUm = useCliqueUnico(async () => {
          const ultimaUnidade = item.currentQty <= 1;
          const baixa = await onRecordLoss(item.id, 1, 'vencido', '');
          guardarBaixa('perda', 1, baixa);
          if (ultimaUnidade) proximo();
        });

        const venderTudo = useCliqueUnico(async () => {
          const qty = item.currentQty;
          const baixa = await onRecordSale(item.id, qty);
          guardarBaixa('venda', qty, baixa);
          proximo();
        });

        const perderTudo = () => {
          setSaiu(item.currentQty);
          setPasso('motivo');
        };

        const abrirContagem = () => {
          setRestante(item.currentQty);
          setPasso('contar');
        };

        // O que sobrou na vitrine vira a conta do que saiu — e o que saiu
        // ainda precisa dizer se foi venda ou perda
        const confirmarContagem = useCliqueUnico(() => {
          const atual = item.currentQty;
          if (restante === atual) return seguir();
          if (restante > atual) {
            // Recontagem para cima não é venda nem perda: só acerta o número
            onSetQty(item.id, restante);
            responder((base) => ({ ajuste: base.ajuste + (restante - atual), tipo: 'ajuste' }));
            setUltima(null);
            return proximo();
          }
          setSaiu(atual - restante);
          setPasso('destino');
        });

        const confirmarVenda = useCliqueUnico(async () => {
          const baixa = await onRecordSale(item.id, saiu);
          guardarBaixa('venda', saiu, baixa);
          proximo();
        });

        const confirmarPerda = useCliqueUnico(async (motivo) => {
          const baixa = await onRecordLoss(item.id, saiu, motivo, '');
          guardarBaixa('perda', saiu, baixa);
          proximo();
        });

        // Desfazer devolve as unidades, tira a quantidade da conta do item e
        // traz a conferência de volta para ele, para a pessoa responder de
        // novo. Item que ficou sem baixa nenhuma sai da lista do fim.
        const desfazerUltima = useCliqueUnico(() => {
          if (!ultima) return;
          const alvo = fila[ultima.indice];
          onUndoBaixa(ultima.baixa);
          if (alvo) {
            setResultados((prev) => prev
              .map((r) => r.chave === alvo.id
                ? { ...r, [ultima.campo]: Math.max(0, r[ultima.campo] - ultima.qty) }
                : r)
              .filter((r) => r.tipo !== 'baixa' || r.venda > 0 || r.perda > 0));
          }
          setIndex(ultima.indice);
          setPasso('acoes');
          setUltima(null);
        });

        // Venda e perda contam item, não unidade: o que a pessoa quer saber
        // no fim é em quantos espaços ela mexeu
        const contarResultado = (tipo) => resultados.filter((r) => (
          tipo === 'venda' ? r.venda > 0
            : tipo === 'perda' ? r.perda > 0
              : r.tipo === tipo
        )).length;

        // Toque tira 1, segurar tira o lote inteiro — o mesmo gesto dos
        // botões da vitrine física
        const vendeu = useLongPress(venderTudo, venderUm);
        const perdeu = useLongPress(perderTudo, perderUm);

        // Atalhos de teclado. Quem confere no computador anda pela vitrine sem
        // tirar a mão do teclado: seta esquerda vendeu 1, seta direita perdeu 1
        // e Enter fecha o item e chama o próximo — a mesma coisa que os três
        // botões da tela fazem. Esc fecha a conferência.
        //
        // Os atalhos só valem no passo das ações, com um item na frente: na
        // contagem e no motivo as setas são do campo e dos botões, não da
        // conferência. Tecla segurada não repete a baixa, e Enter em um botão
        // com foco é do botão — senão o mesmo Enter faria as duas coisas.
        useEffect(() => {
          const digitando = (alvo) => !!alvo && (
            alvo.tagName === 'INPUT'
            || alvo.tagName === 'TEXTAREA'
            || alvo.tagName === 'SELECT'
            || alvo.isContentEditable
          );

          const aoTeclar = (e) => {
            if (e.key === 'Escape') return onClose();
            if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
            if (digitando(e.target)) return;
            if (passo !== 'acoes' || !entrada || !item) return;

            if (e.key === 'Enter') {
              if (e.target && e.target.tagName === 'BUTTON') return;
              e.preventDefault();
              seguir();
            } else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              venderUm();
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              perderUm();
            }
          };

          window.addEventListener('keydown', aoTeclar);
          return () => window.removeEventListener('keydown', aoTeclar);
        }, [passo, entrada, item, temBaixa, index]);

        const botaoGrande = 'btn btn-lg w-full text-[14px]';

        return (
          <div
            role="dialog"
            aria-modal="true"
            aria-label="Checklist da vitrine"
            className="fixed inset-0 z-50 bg-black/30 backdrop-blur-[2px] flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto"
          >
            <div className="bg-white rounded-[24px] w-full max-w-lg my-auto shadow-[0_24px_64px_rgba(0,0,0,0.24)] overflow-hidden">
              {/* Cabeçalho: onde está a conferência e quanto falta */}
              <div className="px-5 pt-4 pb-3.5 border-b hairline space-y-3">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <span className="t-overline">Conferência da vitrine</span>
                    <h2 className="t-title text-[#1d1d1f] mt-0.5">Checklist</h2>
                  </div>
                  <button
                    onClick={onClose}
                    title="Fechar a conferência"
                    aria-label="Fechar a conferência"
                    className="w-8 h-8 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <div className="segmented flex w-full">
                  {[...SHOWCASE_TYPES, 'todas'].map((tipo) => (
                    <button
                      key={tipo}
                      className="flex-1"
                      onClick={() => setEscopo(tipo)}
                      data-active={escopo === tipo}
                    >
                      {tipo === 'todas' ? 'Todas' : SHOWCASE_TYPE_LABELS[tipo]}
                    </button>
                  ))}
                </div>

                {total > 0 && (
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="t-caption tnum">
                        {index >= total ? `${total} de ${total}` : `Item ${index + 1} de ${total}`}
                      </span>
                      <span className="t-caption tnum">
                        {resultados.length} {resultados.length === 1 ? 'respondido' : 'respondidos'}
                      </span>
                    </div>
                    <div className="h-1.5 rounded-full bg-black/[0.07] overflow-hidden">
                      <div
                        className="h-full bg-[#0E0937] rounded-full transition-all"
                        style={{ width: `${Math.min(100, (index / total) * 100)}%` }}
                      />
                    </div>
                  </div>
                )}
              </div>

              {/* Nada montado nesta vitrine */}
              {total === 0 && (
                <div className="px-5 py-10 text-center space-y-3">
                  <p className="t-body text-[#86868b]">Não tem nada na vitrine {escopoLabel} para conferir.</p>
                  <button onClick={onClose} className="btn btn-secondary btn-md">Fechar</button>
                </div>
              )}

              {/* Fim da fila: o resumo do que a conferência registrou */}
              {total > 0 && index >= total && (
                <div className="px-5 py-6 space-y-4">
                  <div className="text-center space-y-2">
                    <div className="w-14 h-14 rounded-full tone-fresh flex items-center justify-center mx-auto">
                      <Icons.CheckCircle2 className="w-7 h-7 ink-fresh" />
                    </div>
                    <h3 className="t-title text-[#1d1d1f]">Conferência concluída</h3>
                    <p className="t-callout">
                      {total} {total === 1 ? 'item conferido' : 'itens conferidos'} na vitrine {escopoLabel}
                    </p>
                  </div>

                  <div className="flex items-center justify-center gap-2 flex-wrap">
                    {['venda', 'perda', 'ajuste', 'igual', 'pulado']
                      .filter((tipo) => contarResultado(tipo) > 0)
                      .map((tipo) => (
                        <span key={tipo} className={`pill bg-black/[0.05] tnum ${CHECKLIST_RESULTADOS[tipo].text}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${CHECKLIST_RESULTADOS[tipo].dot}`} />
