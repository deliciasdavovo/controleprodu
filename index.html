<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delícias da Vovó - Operacional da Vitrine</title>
    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- React, ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      .scrollbar-none::-webkit-scrollbar { display: none; }
      .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // ==========================================
      // SVG ICON COMPONENTS
      // ==========================================
      const IconBase = ({ d, className = "w-4 h-4", viewBox = "0 0 24 24" }) => (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox={viewBox}>
          {Array.isArray(d) ? d.map((pathD, idx) => <path key={idx} d={pathD} />) : <path d={d} />}
        </svg>
      );

      const Icons = {
        Store: (props) => <IconBase d={["M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z", "M9 22V12h6v10"]} {...props} />,
        LayoutGrid: (props) => <IconBase d={["M3 3h7v7H3z", "M14 3h7v7h-7z", "M14 14h7v7h-7z", "M3 14h7v7H3z"]} {...props} />,
        ClipboardList: (props) => <IconBase d={["M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2", "M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"]} {...props} />,
        TrendingDown: (props) => <IconBase d="M23 18l-9.5-9.5-5 5L1 6" {...props} />,
        History: (props) => <IconBase d={["M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", "M3 3v5h5", "M12 7v5l4 2"]} {...props} />,
        Package: (props) => <IconBase d={["M16.5 9.4 7.55 4.24", "M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z", "M3.27 6.96 12 12.01l8.73-5.05", "M12 22.08V12"]} {...props} />,
        Plus: (props) => <IconBase d="M12 5v14M5 12h14" {...props} />,
        Minus: (props) => <IconBase d="M5 12h14" {...props} />,
        Trash2: (props) => <IconBase d={["M3 6h18", "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2", "M10 11v6", "M14 11v6"]} {...props} />,
        ShoppingCart: (props) => <IconBase d={["M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6", "M9 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z", "M20 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"]} {...props} />,
        AlertTriangle: (props) => <IconBase d={["M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z", "M12 9v4", "M12 17h.01"]} {...props} />,
        CheckCircle2: (props) => <IconBase d={["M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z", "M9 12l2 2 4-4"]} {...props} />,
        Calendar: (props) => <IconBase d={["M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z", "M16 2v4", "M8 2v4", "M3 10h18"]} {...props} />,
        Clock: (props) => <IconBase d={["M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z", "M12 6v6l4 2"]} {...props} />,
        Search: (props) => <IconBase d={["M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z", "M21 21l-4.35-4.35"]} {...props} />,
        TrendingUp: (props) => <IconBase d="M23 6l-9.5 9.5-5-5L1 18" {...props} />,
        AlertCircle: (props) => <IconBase d={["M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z", "M12 8v4", "M12 16h.01"]} {...props} />,
        Copy: (props) => <IconBase d={["M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2", "M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"]} {...props} />,
        ChefHat: (props) => <IconBase d={["M6 13.8a6 6 0 0 1 11.9 0", "M6 17h12", "M7 21h10", "M8 17v4", "M16 17v4"]} {...props} />,
        Coffee: (props) => <IconBase d={["M18 8h1a4 4 0 0 1 0 8h-1", "M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z", "M6 1v3", "M10 1v3", "M14 1v3"]} {...props} />,
        X: (props) => <IconBase d="M18 6L6 18M6 6l12 12" {...props} />,
        CheckSquare: (props) => <IconBase d={["M9 11l3 3L22 4", "M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"]} {...props} />,
        Square: (props) => <IconBase d="M3 3h18v18H3z" {...props} />
      };

      // ==========================================
      // UTILITIES & CONSTANTS
      // ==========================================
      const generateUniqueId = (prefix = 'id') => `${prefix}-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
      const getTodayDateString = () => new Date().toISOString().split('T')[0];

      const formatDateBR = (dateStr) => {
        if (!dateStr) return '';
        const parts = dateStr.split('T')[0].split('-');
        if (parts.length < 3) return dateStr;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const formatCurrencyBR = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);

      const DAYS_MAP = {
        segunda: 'Segunda-feira',
        terca: 'Terça-feira',
        quarta: 'Quarta-feira',
        quinta: 'Quinta-feira',
        sexta: 'Sexta-feira',
        sabado: 'Sábado',
        domingo: 'Domingo'
      };
      const getDayNameBR = (d) => DAYS_MAP[d] || d;

      const calculateDaysInShowcase = (mDateStr) => {
        if (!mDateStr) return 0;
        const mDate = new Date(mDateStr);
        const today = new Date(getTodayDateString());
        const diffTime = Math.abs(today - mDate);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
      };

      const getSlotItemStatus = (item, product) => {
        if (!item) return { status: 'empty', label: 'Vazio', bgClass: 'bg-slate-50', textClass: 'text-slate-400' };
        const days = calculateDaysInShowcase(item.manufactureDate);
        const shelfLife = product?.shelfLifeDays || 2;

        if (days >= shelfLife) {
          return { status: 'expired', label: `Vencido (${days}d)`, bgClass: 'bg-red-100 border-red-300', textClass: 'text-red-700 font-bold' };
        } else if (days === shelfLife - 1) {
          return { status: 'warning', label: `Atenção (${days}d)`, bgClass: 'bg-amber-50 border-amber-300', textClass: 'text-amber-700 font-semibold' };
        }
        return { status: 'normal', label: `Fresco (${days}d)`, bgClass: 'bg-emerald-50 border-emerald-200', textClass: 'text-emerald-700' };
      };

      const INITIAL_PRODUCTS = [
        { id: 'p1', name: 'Coxinha de Frango com Catupiry', category: 'salgado', compatibleShowcases: ['salgada'], defaultUnit: 'un', minReplenishmentQty: 10, shelfLifeDays: 2, price: 8.5 },
        { id: 'p2', name: 'Empada de Frango', category: 'salgado', compatibleShowcases: ['salgada'], defaultUnit: 'un', minReplenishmentQty: 8, shelfLifeDays: 2, price: 7.5 },
        { id: 'p3', name: 'Pastel de Carne Assado', category: 'salgado', compatibleShowcases: ['salgada'], defaultUnit: 'un', minReplenishmentQty: 10, shelfLifeDays: 2, price: 8.0 },
        { id: 'p4', name: 'Croissant de Presunto e Queijo', category: 'salgado', compatibleShowcases: ['salgada'], defaultUnit: 'un', minReplenishmentQty: 6, shelfLifeDays: 1, price: 12.0 },
        { id: 'p5', name: 'Pão de Queijo Tradicional', category: 'salgado', compatibleShowcases: ['salgada'], defaultUnit: 'un', minReplenishmentQty: 15, shelfLifeDays: 1, price: 4.5 },
        { id: 'p6', name: 'Sonho de Creme', category: 'doce', compatibleShowcases: ['doce'], defaultUnit: 'un', minReplenishmentQty: 8, shelfLifeDays: 2, price: 6.5 },
        { id: 'p7', name: 'Donut Glaceado', category: 'doce', compatibleShowcases: ['doce'], defaultUnit: 'un', minReplenishmentQty: 8, shelfLifeDays: 2, price: 7.0 },
        { id: 'p8', name: 'Fatia de Bolo de Cenoura com Chocolate', category: 'sobremesa', compatibleShowcases: ['sobremesa'], defaultUnit: 'un', minReplenishmentQty: 5, shelfLifeDays: 3, price: 9.5 },
        { id: 'p9', name: 'Torta Holandesa (Fatia)', category: 'sobremesa', compatibleShowcases: ['sobremesa'], defaultUnit: 'un', minReplenishmentQty: 4, shelfLifeDays: 3, price: 14.0 },
        { id: 'p10', name: 'Pudim de Leite Condensado (Fatia)', category: 'sobremesa', compatibleShowcases: ['sobremesa'], defaultUnit: 'un', minReplenishmentQty: 6, shelfLifeDays: 3, price: 10.0 }
      ];

      const generateInitialSlots = () => {
        const slots = [];
        // Matriz Slots (59 slots)
        for (let s = 1; s <= 4; s++) {
          for (let p = 1; p <= 10; p++) {
            slots.push({ id: `matriz-salgada-s${s}-p${p}`, unit: 'matriz', showcaseType: 'salgada', shelfNumber: s, slotNumber: p, sectionTitle: `Prateleira ${s} - Salgados` });
          }
        }
        for (let s = 1; s <= 3; s++) {
          for (let p = 1; p <= 5; p++) {
            slots.push({ id: `matriz-doce-s${s}-p${p}`, unit: 'matriz', showcaseType: 'doce', shelfNumber: s, slotNumber: p, sectionTitle: `Prateleira ${s} - Doces` });
          }
        }
        for (let s = 1; s <= 2; s++) {
          for (let p = 1; p <= 2; p++) {
            slots.push({ id: `matriz-sobremesa-s${s}-p${p}`, unit: 'matriz', showcaseType: 'sobremesa', shelfNumber: s, slotNumber: p, sectionTitle: `Prateleira ${s} - Sobremesas` });
          }
        }
        // Vila Nova Slots (32 slots)
        for (let s = 1; s <= 3; s++) {
          for (let p = 1; p <= 8; p++) {
            slots.push({ id: `vilanova-salgada-s${s}-p${p}`, unit: 'vilanova', showcaseType: 'salgada', shelfNumber: s, slotNumber: p, sectionTitle: `Prateleira ${s} - Salgados` });
          }
        }
        for (let s = 1; s <= 2; s++) {
          for (let p = 1; p <= 4; p++) {
            slots.push({ id: `vilanova-doce-s${s}-p${p}`, unit: 'vilanova', showcaseType: 'doce', shelfNumber: s, slotNumber: p, sectionTitle: `Prateleira ${s} - Doces` });
          }
        }
        return slots;
      };

      const generateInitialSlotItems = () => {
        const today = getTodayDateString();
        const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        const twoDaysAgo = new Date(Date.now() - 172800000).toISOString().split('T')[0];

        return [
          { id: 'item-1', slotId: 'matriz-salgada-s1-p1', productId: 'p1', productName: 'Coxinha de Frango com Catupiry', producedQty: 20, currentQty: 14, unit: 'un', minQty: 10, manufactureDate: today, entryDate: today },
          { id: 'item-2', slotId: 'matriz-salgada-s1-p2', productId: 'p2', productName: 'Empada de Frango', producedQty: 15, currentQty: 4, unit: 'un', minQty: 8, manufactureDate: yesterday, entryDate: yesterday },
          { id: 'item-3', slotId: 'matriz-salgada-s2-p1', productId: 'p3', productName: 'Pastel de Carne Assado', producedQty: 12, currentQty: 2, unit: 'un', minQty: 8, manufactureDate: twoDaysAgo, entryDate: twoDaysAgo },
          { id: 'item-4', slotId: 'matriz-doce-s1-p1', productId: 'p6', productName: 'Sonho de Creme', producedQty: 10, currentQty: 8, unit: 'un', minQty: 5, manufactureDate: today, entryDate: today },
          { id: 'item-5', slotId: 'matriz-sobremesa-s1-p1', productId: 'p8', productName: 'Fatia de Bolo de Cenoura com Chocolate', producedQty: 8, currentQty: 3, unit: 'un', minQty: 4, manufactureDate: yesterday, entryDate: yesterday }
        ];
      };

      const generateInitialStandardPlans = () => [
        { id: 'sp-1', unit: 'matriz', dayOfWeek: 'segunda', slotId: 'matriz-salgada-s1-p1', productId: 'p1', idealQty: 20, unitOfMeasure: 'un' },
        { id: 'sp-2', unit: 'matriz', dayOfWeek: 'segunda', slotId: 'matriz-salgada-s1-p2', productId: 'p2', idealQty: 15, unitOfMeasure: 'un' },
        { id: 'sp-3', unit: 'matriz', dayOfWeek: 'segunda', slotId: 'matriz-salgada-s2-p1', productId: 'p3', idealQty: 12, unitOfMeasure: 'un' },
        { id: 'sp-4', unit: 'matriz', dayOfWeek: 'segunda', slotId: 'matriz-doce-s1-p1', productId: 'p6', idealQty: 10, unitOfMeasure: 'un' },
        { id: 'sp-5', unit: 'matriz', dayOfWeek: 'segunda', slotId: 'matriz-sobremesa-s1-p1', productId: 'p8', idealQty: 8, unitOfMeasure: 'un' }
      ];

      const generateInitialSeparatedProducts = () => [
        { id: 'sep-1', unit: 'matriz', productId: 'p-coca', productName: 'Coca-Cola Zero 350ml', category: 'revenda', currentQty: 24, unitOfMeasure: 'un', minQty: 12, price: 6.5 },
        { id: 'sep-2', unit: 'matriz', productId: 'p-suco', productName: 'Suco Del Valle Laranja 290ml', category: 'revenda', currentQty: 18, unitOfMeasure: 'un', minQty: 10, price: 7.0 },
        { id: 'sep-3', unit: 'matriz', productId: 'p-exp', productName: 'Café Expresso Tradicional', category: 'cafeteria', currentQty: 50, unitOfMeasure: 'un', minQty: 20, price: 5.0 },
        { id: 'sep-4', unit: 'matriz', productId: 'p-cap', productName: 'Cappuccino com Canela', category: 'cafeteria', currentQty: 30, unitOfMeasure: 'un', minQty: 15, price: 8.5 }
      ];

      const loadLocal = (key, defaultVal) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultVal;
        } catch (e) {
          return defaultVal;
        }
      };
      const saveLocal = (key, val) => {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      };

      // ==========================================
      // NAVBAR COMPONENT
      // ==========================================
      const Navbar = ({ currentUnit, onUnitChange, activeTab, onTabChange, totalAlerts }) => {
        const navItems = [
          { id: 'vitrine', label: 'Vitrine Operacional', icon: Icons.LayoutGrid },
          { id: 'padrao', label: 'Vitrine Padrão', icon: Icons.ClipboardList },
          { id: 'producao', label: 'Pedido de Produção', icon: Icons.ChefHat },
          { id: 'perdas', label: 'Relatório de Perdas', icon: Icons.TrendingDown },
          { id: 'historico', label: 'Histórico & Vendas', icon: Icons.History },
          { id: 'fora', label: 'Fora da Vitrine', icon: Icons.Coffee },
          { id: 'produtos', label: 'Produtos', icon: Icons.Package }
        ];

        return (
          <header className="bg-slate-900 text-slate-100 border-b border-slate-800 sticky top-0 z-40 shadow-md backdrop-blur-md bg-slate-900/95">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 gap-4">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2">
                    <div className="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-black text-white text-base shadow-xs">
                      DV
                    </div>
                    <div>
                      <h1 className="text-sm font-extrabold leading-tight text-white">Delícias da Vovó</h1>
                      <p className="text-[10px] text-slate-400 font-medium">Gestão Operacional de Vitrine</p>
                    </div>
                  </div>

                  <div className="h-6 w-px bg-slate-800 hidden sm:block" />

                  <div className="flex bg-slate-800 p-0.5 rounded-xl border border-slate-700">
                    <button
                      onClick={() => onUnitChange('matriz')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                        currentUnit === 'matriz' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Matriz
                    </button>
                    <button
                      onClick={() => onUnitChange('vilanova')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                        currentUnit === 'vilanova' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Vila Nova
                    </button>
                  </div>
                </div>

                <nav className="hidden lg:flex items-center gap-1">
                  {navItems.map((tab) => {
                    const IconComp = tab.icon;
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => onTabChange(tab.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                          isActive ? 'bg-slate-800 text-white border border-slate-700 shadow-xs font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                        }`}
                      >
                        <IconComp className="w-3.5 h-3.5" />
                        <span>{tab.label}</span>
                        {tab.id === 'vitrine' && totalAlerts > 0 && (
                          <span className="ml-1 px-1.5 py-0.2 text-[10px] bg-red-600 text-white font-bold rounded-full">
                            {totalAlerts}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </nav>
              </div>
            </div>
            {/* Mobile Tab Scroll Bar */}
            <div className="lg:hidden flex overflow-x-auto px-4 py-2 bg-slate-950/80 border-t border-slate-800 gap-1 scrollbar-none">
              {navItems.map((tab) => {
                const IconComp = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => onTabChange(tab.id)}
                    className={`px-3 py-1 rounded-lg text-xs font-bold whitespace-nowrap flex items-center gap-1.5 ${
                      isActive ? 'bg-blue-600 text-white' : 'text-slate-400 bg-slate-900'
                    }`}
                  >
                    <IconComp className="w-3 h-3" />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </header>
        );
      };

      // ==========================================
      // SHOWCASE GRID COMPONENT
      // ==========================================
      const ShowcaseGrid = ({ currentUnit, slots, slotItems, products, onIncrementQty, onOpenDecreaseModal }) => {
        const [filterType, setFilterType] = useState('salgada');

        const unitSlots = useMemo(() => {
          return slots.filter((s) => s.unit === currentUnit && s.showcaseType === filterType);
        }, [slots, currentUnit, filterType]);

        const shelves = useMemo(() => {
          const map = {};
          unitSlots.forEach((slot) => {
            if (!map[slot.shelfNumber]) map[slot.shelfNumber] = [];
            map[slot.shelfNumber].push(slot);
          });
          return map;
        }, [unitSlots]);

        return (
          <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
              <div className="flex items-center gap-2">
                {['salgada', 'doce', 'sobremesa'].map((type) => (
                  <button
                    key={type}
                    onClick={() => setFilterType(type)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all capitalize ${
                      filterType === type ? 'bg-slate-900 text-white shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                    }`}
                  >
                    {type === 'salgada' ? 'Salgadas' : type === 'doce' ? 'Doces' : 'Sobremesas'}
                  </button>
                ))}
              </div>
              <span className="text-xs font-semibold text-slate-500">
                {unitSlots.length} Espaços Físicos
              </span>
            </div>

            <div className="space-y-6">
              {Object.keys(shelves).map((shelfNum) => (
                <div key={shelfNum} className="space-y-2">
                  <div className="flex items-center gap-2 text-xs font-bold text-slate-700 uppercase tracking-wider">
                    <span className="w-2 h-2 rounded-full bg-blue-600" />
                    Prateleira {shelfNum}
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3">
                    {shelves[shelfNum].map((slot) => {
                      const item = slotItems.find((i) => i.slotId === slot.id);
                      const prod = item ? products.find((p) => p.id === item.productId) : null;
                      const statusInfo = getSlotItemStatus(item, prod);

                      return (
                        <div
                          key={slot.id}
                          className={`p-3 rounded-xl border flex flex-col justify-between h-36 transition-all ${
                            item ? 'bg-white border-slate-200 shadow-xs hover:border-slate-300' : 'bg-slate-50 border-dashed border-slate-200 justify-center items-center text-slate-400'
                          }`}
                        >
                          {item ? (
                            <>
                              <div className="space-y-1">
                                <div className="flex items-start justify-between gap-1">
                                  <span className="text-[10px] font-bold text-slate-400 uppercase">Slot #{slot.slotNumber}</span>
                                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${statusInfo.bgClass} ${statusInfo.textClass}`}>
                                    {statusInfo.label}
                                  </span>
                                </div>
                                <h4 className="text-xs font-bold text-slate-900 line-clamp-2 leading-tight">{item.productName}</h4>
                              </div>

                              <div className="space-y-2 pt-2 border-t border-slate-100">
                                <div className="flex items-center justify-between text-xs">
                                  <span className="text-slate-500 text-[11px]">Estoque:</span>
                                  <span className="font-extrabold text-slate-900">{item.currentQty} / {item.producedQty || item.currentQty} {item.unit}</span>
                                </div>

                                <div className="flex items-center gap-1">
                                  <button
                                    onClick={() => onIncrementQty(item.id)}
                                    className="flex-1 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded font-bold text-xs flex items-center justify-center gap-1"
                                    title="Aumentar +1"
                                  >
                                    <Icons.Plus className="w-3 h-3" />
                                    <span>+1</span>
                                  </button>
                                  <button
                                    onClick={() => onOpenDecreaseModal(item)}
                                    className="flex-1 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded font-bold text-xs flex items-center justify-center gap-1 shadow-xs"
                                    title="Registrar Venda / Perda"
                                  >
                                    <Icons.Minus className="w-3 h-3" />
                                    <span>Baixa</span>
                                  </button>
                                </div>
                              </div>
                            </>
                          ) : (
                            <div className="text-center space-y-1">
                              <span className="text-[10px] font-bold text-slate-400 block">Slot #{slot.slotNumber}</span>
                              <span className="text-xs font-medium text-slate-400">Livre</span>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ==========================================
      // TACTICAL SUPPORT LIST COMPONENT
      // ==========================================
      const SupportList = ({ currentUnit, slotItems, products, slots, onUpdateItem, onQuickAllocate, onRecordSellAll, onOpenDecreaseModal, onRemoveItem }) => {
        const [filterText, setFilterText] = useState('');
        const [quickProductName, setQuickProductName] = useState('');
        const [quickQty, setQuickQty] = useState(10);
        const [quickDate, setQuickDate] = useState(getTodayDateString());

        const productNameRef = useRef(null);
        const qtyRef = useRef(null);
        const dateRef = useRef(null);

        const setQuickDateOffset = (offsetDays) => {
          const d = new Date();
          d.setDate(d.getDate() + offsetDays);
          setQuickDate(d.toISOString().split('T')[0]);
        };

        const unitSlots = slots.filter((s) => s.unit === currentUnit);
        const unitSlotIds = new Set(unitSlots.map((s) => s.id));
        const itemsInUnit = slotItems.filter((item) => unitSlotIds.has(item.slotId));

        const filteredItems = itemsInUnit.filter((item) =>
          item.productName.toLowerCase().includes(filterText.toLowerCase())
        );

        const handleQuickSubmit = (e) => {
          e.preventDefault();
          if (!quickProductName.trim()) {
            if (productNameRef.current) productNameRef.current.focus();
            return;
          }

          onQuickAllocate(quickProductName.trim(), Number(quickQty) || 1, quickDate);
          setQuickProductName('');
          setTimeout(() => {
            if (productNameRef.current) productNameRef.current.focus();
          }, 50);
        };

        return (
          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col h-full overflow-hidden">
            <div className="p-3.5 bg-slate-900 text-white border-b border-slate-800 flex justify-between items-center">
              <div>
                <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-200 flex items-center gap-1.5">
                  <Icons.ClipboardList className="w-3.5 h-3.5 text-blue-400" />
                  Lista de Apoio (Suporte)
                </h2>
                <p className="text-[10px] text-slate-400">Edição rápida, datas e alocação tática</p>
              </div>
              <span className="text-blue-300 font-bold text-[10px] px-2.5 py-0.5 bg-blue-950 border border-blue-800 rounded-full">
                {filteredItems.length} itens
              </span>
            </div>

            <div className="p-3 bg-slate-50 border-b border-slate-200 space-y-2.5">
              <form onSubmit={handleQuickSubmit} className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-bold text-slate-700 uppercase tracking-tight flex items-center gap-1">
                    <Icons.Plus className="w-3 h-3 text-blue-600" />
                    Adicionar Item na Vitrine
                  </span>
                  <span className="text-[9px] text-slate-500 bg-slate-200/80 px-1.5 py-0.5 rounded font-medium">
                    [Enter ↵ para avançar]
                  </span>
                </div>

                <div>
                  <label className="text-[9px] font-bold text-slate-600 uppercase block mb-0.5">
                    1. Produto:
                  </label>
                  <input
                    ref={productNameRef}
                    type="text"
                    list="product-suggestions"
                    placeholder="Digite ou escolha o produto..."
                    value={quickProductName}
                    onChange={(e) => setQuickProductName(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && quickProductName.trim()) {
                        e.preventDefault();
                        if (qtyRef.current) { qtyRef.current.focus(); qtyRef.current.select(); }
                      }
                    }}
                    className="w-full bg-white border border-slate-300 rounded-lg px-2.5 h-8 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-blue-500 font-semibold"
                  />
                  <datalist id="product-suggestions">
                    {products.map((p) => (
                      <option key={p.id} value={p.name} />
                    ))}
                  </datalist>
                </div>

                <div className="grid grid-cols-12 gap-1.5 items-end">
                  <div className="col-span-4">
                    <label className="text-[9px] font-bold text-slate-600 uppercase block mb-0.5">
                      2. Qtd:
                    </label>
                    <input
                      ref={qtyRef}
                      type="number"
                      min="1"
                      placeholder="Qtd"
                      value={quickQty}
                      onChange={(e) => setQuickQty(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          if (dateRef.current) dateRef.current.focus();
                        }
                      }}
                      className="w-full bg-white border border-slate-300 rounded-lg px-2 h-8 text-xs text-slate-900 text-center font-extrabold focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="col-span-5">
                    <label className="text-[9px] font-bold text-slate-600 uppercase block mb-0.5">
                      3. Data Fab.:
                    </label>
                    <input
                      ref={dateRef}
                      type="date"
                      value={quickDate}
                      onChange={(e) => setQuickDate(e.target.value)}
                      className="w-full bg-white border border-slate-300 rounded-lg px-1 h-8 text-[11px] text-slate-900 text-center font-medium focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="col-span-3">
                    <button
                      type="submit"
                      className="w-full h-8 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-lg text-xs transition-all shadow-xs flex items-center justify-center gap-1"
                    >
                      <Icons.Plus className="w-3.5 h-3.5" />
                      Alocar
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-1 pt-0.5 text-[9px]">
                  <span className="text-slate-500 font-semibold mr-0.5">Atalhos:</span>
                  <button
                    type="button"
                    onClick={() => setQuickDateOffset(0)}
                    className={`px-2 py-0.5 rounded border ${
                      quickDate === getTodayDateString()
                        ? 'bg-blue-100 text-blue-900 border-blue-300 font-bold'
                        : 'bg-white text-slate-600 border-slate-200'
                    }`}
                  >
                    Hoje
                  </button>
                  <button
                    type="button"
                    onClick={() => setQuickDateOffset(-1)}
                    className="px-2 py-0.5 rounded bg-white text-slate-600 border border-slate-200"
                  >
                    Ontem (-1d)
                  </button>
                </div>
              </form>

              <div className="relative pt-1 border-t border-slate-200">
                <Icons.Search className="w-3 h-3 text-slate-400 absolute left-2.5 top-3" />
                <input
                  type="text"
                  placeholder="Filtrar tabela..."
                  value={filterText}
                  onChange={(e) => setFilterText(e.target.value)}
                  className="w-full bg-white border border-slate-200 rounded-lg pl-8 pr-2 h-7 text-xs text-slate-900 focus:outline-none focus:border-blue-500"
                />
              </div>
            </div>

            <div className="overflow-x-auto flex-1">
              <table className="w-full text-left text-[11px]">
                <thead className="bg-slate-100 border-b border-slate-200 sticky top-0 z-10 text-[9px] font-bold text-slate-500 uppercase">
                  <tr>
                    <th className="py-2 px-2.5">Produto</th>
                    <th className="py-2 px-1 text-center">Data Fab.</th>
                    <th className="py-2 px-1 text-center">Prod.</th>
                    <th className="py-2 px-1 text-center">Atual</th>
                    <th className="py-2 px-1 text-center">Status</th>
                    <th className="py-2 px-2 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filteredItems.length === 0 ? (
                    <tr>
                      <td colSpan={6} className="text-center py-8 text-slate-400 text-xs">
                        Nenhum item alocado na vitrine no momento.
                      </td>
                    </tr>
                  ) : (
                    filteredItems.map((item) => {
                      const product = products.find((p) => p.id === item.productId);
                      const slot = slots.find((s) => s.id === item.slotId);
                      const statusInfo = getSlotItemStatus(item, product);

                      return (
                        <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                          <td className="py-2 px-2.5">
                            <div className="font-semibold text-slate-900 leading-tight">
                              {item.productName}
                            </div>
                            <div className="text-[9px] text-slate-400 mt-0.5">
                              {slot ? `P${slot.shelfNumber} (Slot #${slot.slotNumber})` : 'Apoio'}
                            </div>
                          </td>

                          <td className="py-2 px-1 text-center">
                            <input
                              type="date"
                              value={item.manufactureDate}
                              onChange={(e) =>
                                onUpdateItem({ ...item, manufactureDate: e.target.value })
                              }
                              className="text-[10px] font-medium py-0.5 px-1 border border-slate-200 rounded bg-white text-slate-800 text-center w-24"
                            />
                          </td>

                          <td className="py-2 px-1 text-center">
                            <input
                              type="number"
                              min="0"
                              value={item.producedQty || item.currentQty}
                              onChange={(e) =>
                                onUpdateItem({
                                  ...item,
                                  producedQty: Math.max(0, Number(e.target.value) || 0)
                                })
                              }
                              className="text-[10px] font-bold py-0.5 px-1 border border-slate-200 rounded bg-white text-slate-900 text-center w-12"
                            />
                          </td>

                          <td className="py-2 px-1 text-center">
                            <input
                              type="number"
                              min="0"
                              value={item.currentQty}
                              onChange={(e) =>
                                onUpdateItem({
                                  ...item,
                                  currentQty: Math.max(0, Number(e.target.value) || 0)
                                })
                              }
                              className="text-[10px] font-black py-0.5 px-1 border border-amber-300 rounded bg-amber-50 text-amber-900 text-center w-12"
                            />
                          </td>

                          <td className="py-2 px-1 text-center">
                            <span className={`inline-block text-[9px] px-1.5 py-0.2 rounded font-bold uppercase ${statusInfo.bgClass} ${statusInfo.textClass}`}>
                              {statusInfo.label}
                            </span>
                          </td>

                          <td className="py-2 px-2 text-right">
                            <div className="flex items-center justify-end gap-1">
                              <button
                                onClick={() => onOpenDecreaseModal(item)}
                                title="Baixa / Venda / Perda"
                                className="px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-[11px] font-bold"
                              >
                                −
                              </button>
                              <button
                                onClick={() => onRecordSellAll(item.id)}
                                title="Vendeu tudo!"
                                className="p-1 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded"
                              >
                                <Icons.CheckCircle2 className="w-3.5 h-3.5" />
                              </button>
                              <button
                                onClick={() => onRemoveItem(item.id)}
                                title="Remover item"
                                className="p-1 bg-red-50 hover:bg-red-100 text-red-600 rounded"
                              >
                                <Icons.Trash2 className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      // ==========================================
      // STANDARD SHOWCASE VIEW (Vitrine Padrão)
      // ==========================================
      const StandardShowcaseView = ({
        currentUnit,
        slots,
        products,
        standardPlans,
        selectedDay,
        onSelectDay,
        onUpdatePlanItem,
        onRemovePlanItem,
        onCopyDayPlan,
        onClearDayPlan,
        onGenerateProductionOrder
      }) => {
        const [targetCopyDay, setTargetCopyDay] = useState('terca');
        const DAYS = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'];

        const unitSlots = slots.filter((s) => s.unit === currentUnit);
        const dayPlans = standardPlans.filter(
          (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay
        );

        const handleCopy = () => {
          if (selectedDay === targetCopyDay) {
            alert('Selecione um dia de destino diferente do atual.');
            return;
          }
          onCopyDayPlan(selectedDay, targetCopyDay);
          alert(`Padrão de ${getDayNameBR(selectedDay)} copiado para ${getDayNameBR(targetCopyDay)}!`);
        };

        const handleClear = () => {
          if (confirm(`Limpar todo o padrão de ${getDayNameBR(selectedDay)}?`)) {
            onClearDayPlan(selectedDay);
          }
        };

        return (
          <div className="space-y-6">
            <div className="bg-slate-900 text-white rounded-2xl p-6 border border-slate-800 shadow-md">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2 text-blue-400 text-xs font-bold uppercase tracking-wider mb-1">
                    <Icons.Calendar className="w-4 h-4" />
                    Planejamento Semanal
                  </div>
                  <h2 className="text-xl font-black text-white">
                    Vitrine Padrão - {currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'}
                  </h2>
                  <p className="text-xs text-slate-300 mt-1">
                    Defina como a vitrine física deve ser montada idealmente em cada dia da semana.
                  </p>
                </div>

                <button
                  onClick={onGenerateProductionOrder}
                  className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs shadow-xs flex items-center gap-2"
                >
                  <Icons.ChefHat className="w-4 h-4" />
                  Gerar Pedido de Produção
                </button>
              </div>

              <div className="flex items-center gap-2 mt-5 overflow-x-auto pb-1 scrollbar-none">
                {DAYS.map((day) => {
                  const count = standardPlans.filter(
                    (sp) => sp.unit === currentUnit && sp.dayOfWeek === day
                  ).length;

                  return (
                    <button
                      key={day}
                      onClick={() => onSelectDay(day)}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${
                        selectedDay === day
                          ? 'bg-blue-600 text-white shadow-xs font-extrabold'
                          : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                      }`}
                    >
                      <span>{getDayNameBR(day)}</span>
                      <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-900 text-slate-300">
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                  <Icons.Copy className="w-4 h-4 text-purple-600" />
                  Copiar padrão de <strong>{getDayNameBR(selectedDay)}</strong> para:
                </span>
                <select
                  value={targetCopyDay}
                  onChange={(e) => setTargetCopyDay(e.target.value)}
                  className="text-xs py-1.5 px-3 bg-slate-50 border border-slate-300 rounded-xl font-medium"
                >
                  {DAYS.map((d) => (
                    <option key={d} value={d}>{getDayNameBR(d)}</option>
                  ))}
                </select>
                <button
                  onClick={handleCopy}
                  className="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs"
                >
                  Copiar
                </button>
              </div>

              <button
                onClick={handleClear}
                className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 font-bold rounded-xl text-xs border border-red-200 flex items-center gap-1.5"
              >
                <Icons.Trash2 className="w-3.5 h-3.5" />
                Limpar Padrão
              </button>
            </div>

            <div className="space-y-6">
              {Array.from(new Set(unitSlots.map((s) => s.sectionTitle))).map((sectionTitle) => {
                const sectionSlots = unitSlots.filter((s) => s.sectionTitle === sectionTitle);

                return (
                  <div key={sectionTitle} className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                      <h3 className="text-sm font-extrabold text-slate-900">{sectionTitle}</h3>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-900 uppercase">
                        {sectionSlots[0]?.showcaseType}
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                      {sectionSlots.map((slot) => {
                        const planItem = dayPlans.find((sp) => sp.slotId === slot.id);

                        return (
                          <div
                            key={slot.id}
                            className={`rounded-xl p-3 border transition-all ${
                              planItem ? 'bg-purple-50/50 border-purple-200' : 'bg-slate-50 border-slate-200'
                            }`}
                          >
                            <div className="flex items-center justify-between pb-1.5 mb-2 border-b border-slate-200/60 text-xs font-bold text-slate-800">
                              <span>Slot #{slot.slotNumber} (P{slot.shelfNumber})</span>
                            </div>

                            <select
                              value={planItem?.productId || ''}
                              onChange={(e) => {
                                const val = e.target.value;
                                if (!val) {
                                  if (planItem) onRemovePlanItem(planItem.id);
                                } else {
                                  const prod = products.find((p) => p.id === val);
                                  const qty = planItem?.idealQty || (prod ? prod.minReplenishmentQty * 2 : 10);
                                  onUpdatePlanItem(slot.id, val, qty);
                                }
                              }}
                              className="w-full text-xs py-1.5 px-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-semibold focus:outline-none focus:border-purple-500 mb-2"
                            >
                              <option value="">-- Espaço Vazio --</option>
                              {products.map((p) => (
                                <option key={p.id} value={p.id}>{p.name}</option>
                              ))}
                            </select>

                            {planItem && (
                              <div className="flex items-center justify-between bg-white p-1.5 rounded-lg border border-purple-200 text-xs">
                                <span className="text-[10px] font-bold text-slate-600">Qtd Ideal:</span>
                                <div className="flex items-center gap-1.5">
                                  <button
                                    onClick={() => onUpdatePlanItem(slot.id, planItem.productId, Math.max(1, planItem.idealQty - 1))}
                                    className="w-5 h-5 rounded bg-slate-100 hover:bg-slate-200 font-bold flex items-center justify-center text-xs"
                                  >
                                    -
                                  </button>
                                  <span className="text-xs font-black text-purple-900 min-w-5 text-center">{planItem.idealQty}</span>
                                  <button
                                    onClick={() => onUpdatePlanItem(slot.id, planItem.productId, planItem.idealQty + 1)}
                                    className="w-5 h-5 rounded bg-purple-600 text-white font-bold flex items-center justify-center text-xs"
                                  >
                                    +
                                  </button>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // ==========================================
      // PRODUCTION ORDER VIEW
      // ==========================================
      const ProductionOrderView = ({
        currentUnit,
        slots,
        slotItems,
        products,
        standardPlans,
        selectedDay,
        onApplyProductionToShowcase
      }) => {
        const [completedItems, setCompletedItems] = useState({});

        const dayPlans = standardPlans.filter(
          (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay
        );

        const orderList = dayPlans.map((plan) => {
          const slot = slots.find((s) => s.id === plan.slotId);
          const product = products.find((p) => p.id === plan.productId);
          const currentItemsInSlot = slotItems.filter(
            (item) => item.slotId === plan.slotId && item.productId === plan.productId
          );
          const currentTotalQty = currentItemsInSlot.reduce((acc, item) => acc + item.currentQty, 0);
          const neededQty = Math.max(0, plan.idealQty - currentTotalQty);

          return {
            planId: plan.id,
            slotId: plan.slotId,
            slotTitle: slot ? `${slot.sectionTitle} (P${slot.shelfNumber})` : 'Slot',
            productId: plan.productId,
            productName: product?.name || 'Produto',
            idealQty: plan.idealQty,
            currentQty: currentTotalQty,
            neededQty,
            unitOfMeasure: plan.unitOfMeasure
          };
        });

        const itemsNeedingProduction = orderList.filter((item) => item.neededQty > 0);

        const handleApplyAll = () => {
          if (itemsNeedingProduction.length === 0) return;
          const payload = itemsNeedingProduction.map((item) => ({
            slotId: item.slotId,
            productId: item.productId,
            qty: item.neededQty,
            productName: item.productName
          }));
          onApplyProductionToShowcase(payload);
          alert('Produção lançada na vitrine com sucesso!');
        };

        return (
          <div className="space-y-6">
            <div className="bg-amber-900 text-white rounded-2xl p-6 shadow-md border border-amber-800">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2 text-amber-300 text-xs font-bold uppercase tracking-wider mb-1">
                    <Icons.ChefHat className="w-4 h-4" />
                    Pedido de Produção para Cozinha / Padaria
                  </div>
                  <h2 className="text-xl font-extrabold text-white">
                    Necessidades de Reposição - {getDayNameBR(selectedDay)} ({currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'})
                  </h2>
                  <p className="text-xs text-amber-100 mt-1">
                    Calculado comparando a <strong>Vitrine Padrão Ideal</strong> com a <strong>Vitrine Atual</strong>.
                  </p>
                </div>

                <button
                  onClick={handleApplyAll}
                  disabled={itemsNeedingProduction.length === 0}
                  className="px-5 py-3 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold rounded-xl text-xs shadow-lg flex items-center gap-2"
                >
                  <Icons.Plus className="w-4 h-4" />
                  Lançar Produção na Vitrine (+{itemsNeedingProduction.reduce((a, b) => a + b.neededQty, 0)} itens)
                </button>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-200 space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                  <Icons.ClipboardList className="w-4 h-4 text-blue-600" />
                  Checklist de Assamento e Preparo
                </h3>
                <span className="text-xs font-bold text-blue-900 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full">
                  {itemsNeedingProduction.length} item(s) a produzir
                </span>
              </div>

              {itemsNeedingProduction.length === 0 ? (
                <div className="text-center py-12 text-slate-400 space-y-2">
                  <Icons.CheckCircle2 className="w-12 h-12 text-emerald-500 mx-auto" />
                  <h4 className="text-base font-bold text-slate-800">Vitrine 100% Abastecida!</h4>
                  <p className="text-xs text-slate-500">Nenhum produto em falta em relação ao padrão ideal.</p>
                </div>
              ) : (
                <div className="divide-y divide-slate-100">
                  {itemsNeedingProduction.map((item) => {
                    const isChecked = !!completedItems[item.planId];
                    return (
                      <div key={item.planId} className="py-3 px-2 flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                          <button
                            type="button"
                            onClick={() => setCompletedItems((prev) => ({ ...prev, [item.planId]: !prev[item.planId] }))}
                            className="text-slate-400 hover:text-emerald-600"
                          >
                            {isChecked ? <Icons.CheckSquare className="w-5 h-5 text-emerald-600" /> : <Icons.Square className="w-5 h-5" />}
                          </button>
                          <div>
                            <h4 className={`text-sm font-bold ${isChecked ? 'line-through text-slate-400' : 'text-slate-900'}`}>
                              {item.productName}
                            </h4>
                            <p className="text-xs text-slate-500">Destino: {item.slotTitle}</p>
                          </div>
                        </div>

                        <div className="flex items-center gap-4 text-right">
                          <div className="text-xs text-slate-500 hidden sm:block">
                            <span>Ideal: <strong>{item.idealQty}</strong></span> • <span>Atual: <strong>{item.currentQty}</strong></span>
                          </div>
                          <div className="bg-amber-100 text-amber-950 font-black text-sm px-3 py-1.5 rounded-xl border border-amber-300">
                            Faltam: +{item.neededQty} {item.unitOfMeasure}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // LOSSES REPORT VIEW
      // ==========================================
      const LossesReportView = ({ currentUnit, lossRecords }) => {
        const [filterText, setFilterText] = useState('');
        const [selectedReason, setSelectedReason] = useState('todos');

        const unitLosses = lossRecords.filter((l) => l.unit === currentUnit);
        const filteredLosses = unitLosses.filter((l) => {
          const matchesText = l.productName.toLowerCase().includes(filterText.toLowerCase());
          const matchesReason = selectedReason === 'todos' || l.reason === selectedReason;
          return matchesText && matchesReason;
        });

        const totalLossQty = unitLosses.reduce((acc, l) => acc + l.qty, 0);

        return (
          <div className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-red-900 text-white p-5 rounded-2xl border border-red-800 space-y-1">
                <span className="text-xs font-bold text-red-200 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.Trash2 className="w-4 h-4" />
                  Total de Itens Perdidos ({currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'})
                </span>
                <div className="text-3xl font-black">{totalLossQty} <span className="text-sm font-normal text-red-200">unidades</span></div>
                <p className="text-[11px] text-red-200">Registrado em {unitLosses.length} lançamento(s)</p>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.AlertTriangle className="w-4 h-4 text-amber-500" />
                  Monitoramento de Desperdício
                </span>
                <div className="text-xl font-bold text-slate-900">Atenção à Validade</div>
                <p className="text-[11px] text-slate-500">Mantenha a rotação de estoque em dia</p>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.TrendingUp className="w-4 h-4 text-blue-500" />
                  Ação Recomendada
                </span>
                <p className="text-xs text-slate-600">
                  Ajuste o padrão ideal para dias com menor movimento.
                </p>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-200 space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                <h3 className="text-base font-bold text-slate-900">Registro Detalhado de Perdas</h3>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder="Buscar produto..."
                    value={filterText}
                    onChange={(e) => setFilterText(e.target.value)}
                    className="text-xs pl-3 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg"
                  />
                  <select
                    value={selectedReason}
                    onChange={(e) => setSelectedReason(e.target.value)}
                    className="text-xs py-1.5 px-3 bg-slate-50 border border-slate-200 rounded-lg"
                  >
                    <option value="todos">Todos os Motivos</option>
                    <option value="vencido">Vencidos</option>
                    <option value="danificado">Danificados</option>
                    <option value="qualidade">Qualidade</option>
                    <option value="quebrado">Quebrados</option>
                  </select>
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                      <th className="py-2.5 px-3">Data Baixa</th>
                      <th className="py-2.5 px-3">Produto</th>
                      <th className="py-2.5 px-3 text-center">Quantidade</th>
                      <th className="py-2.5 px-3">Motivo</th>
                      <th className="py-2.5 px-3">Detalhes</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredLosses.length === 0 ? (
                      <tr>
                        <td colSpan={5} className="text-center py-8 text-slate-400">Nenhuma perda registrada.</td>
                      </tr>
                    ) : (
                      filteredLosses.map((r) => (
                        <tr key={r.id} className="hover:bg-slate-50">
                          <td className="py-2.5 px-3 text-slate-600">{formatDateBR(r.lossDate)}</td>
                          <td className="py-2.5 px-3 font-bold text-slate-900">{r.productName}</td>
                          <td className="py-2.5 px-3 text-center font-extrabold text-red-600">Perdeu {r.qty} {r.unitOfMeasure}</td>
                          <td className="py-2.5 px-3 font-semibold capitalize">{r.reason}</td>
                          <td className="py-2.5 px-3 text-slate-500 italic">{r.details || '-'}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // HISTORY & SALES VIEW
      // ==========================================
      const HistoryView = ({ currentUnit, saleRecords, lossRecords }) => {
        const [activeTab, setActiveTab] = useState('vendas');
        const unitSales = saleRecords.filter((s) => s.unit === currentUnit);
        const unitLosses = lossRecords.filter((l) => l.unit === currentUnit);
        const totalSalesQty = unitSales.reduce((acc, s) => acc + s.qty, 0);

        const avgDays = unitSales.length > 0
          ? (unitSales.reduce((acc, s) => acc + (s.exposureDays || 0), 0) / unitSales.length).toFixed(1)
          : '0';

        return (
          <div className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-emerald-900 text-white p-5 rounded-2xl border border-emerald-800 space-y-1">
                <span className="text-xs font-bold text-emerald-200 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.ShoppingCart className="w-4 h-4" />
                  Total de Vendas ({currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'})
                </span>
                <div className="text-3xl font-black">{totalSalesQty} <span className="text-sm font-normal text-emerald-200">itens</span></div>
                <p className="text-[11px] text-emerald-200">{unitSales.length} transações de saída por venda</p>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.Clock className="w-4 h-4 text-amber-500" />
                  Média de Exposição na Vitrine
                </span>
                <div className="text-2xl font-black text-slate-900">{avgDays} <span className="text-sm font-normal text-slate-500">dias</span></div>
                <p className="text-[11px] text-slate-500">Tempo médio do balcão até a venda</p>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-1">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                  <Icons.TrendingUp className="w-4 h-4 text-emerald-500" />
                  Eficiência do Balcão
                </span>
                <div className="text-2xl font-black text-emerald-600">
                  {totalSalesQty + unitLosses.reduce((a, b) => a + b.qty, 0) > 0
                    ? ((totalSalesQty / (totalSalesQty + unitLosses.reduce((a, b) => a + b.qty, 0))) * 100).toFixed(1) + '%'
                    : '100%'}
                </div>
                <p className="text-[11px] text-slate-500">Aproveitamento de vendas vs perdas</p>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-200 space-y-4">
              <div className="flex items-center gap-2 pb-3 border-b border-slate-100">
                <button
                  onClick={() => setActiveTab('vendas')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'vendas' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}`}
                >
                  Vendas ({unitSales.length})
                </button>
                <button
                  onClick={() => setActiveTab('perdas')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'perdas' ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-700'}`}
                >
                  Perdas ({unitLosses.length})
                </button>
              </div>

              {activeTab === 'vendas' ? (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                        <th className="py-2.5 px-3">Data/Hora</th>
                        <th className="py-2.5 px-3">Produto</th>
                        <th className="py-2.5 px-3 text-center">Quantidade</th>
                        <th className="py-2.5 px-3 text-center">Dias Exposto</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {unitSales.length === 0 ? (
                        <tr><td colSpan={4} className="text-center py-8 text-slate-400">Nenhuma venda registrada.</td></tr>
                      ) : (
                        unitSales.map((s) => (
                          <tr key={s.id} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 text-slate-500">{new Date(s.timestamp).toLocaleString('pt-BR')}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-900">{s.productName}</td>
                            <td className="py-2.5 px-3 text-center font-bold text-emerald-600">Vendeu {s.qty} {s.unitOfMeasure}</td>
                            <td className="py-2.5 px-3 text-center font-medium">{s.exposureDays === 0 ? 'Mesmo Dia' : `${s.exposureDays}d`}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                        <th className="py-2.5 px-3">Data</th>
                        <th className="py-2.5 px-3">Produto</th>
                        <th className="py-2.5 px-3 text-center">Quantidade</th>
                        <th className="py-2.5 px-3">Motivo</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {unitLosses.length === 0 ? (
                        <tr><td colSpan={4} className="text-center py-8 text-slate-400">Nenhuma perda registrada.</td></tr>
                      ) : (
                        unitLosses.map((l) => (
                          <tr key={l.id} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 text-slate-500">{formatDateBR(l.lossDate)}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-900">{l.productName}</td>
                            <td className="py-2.5 px-3 text-center font-bold text-red-600">Perdeu {l.qty} {l.unitOfMeasure}</td>
                            <td className="py-2.5 px-3 capitalize font-medium">{l.reason}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // SEPARATED PRODUCTS VIEW (Fora da Vitrine)
      // ==========================================
      const SeparatedProductsView = ({ currentUnit, separatedProducts, onUpdateQty, onAddSeparatedProduct }) => {
        const [showModal, setShowModal] = useState(false);
        const [name, setName] = useState('');
        const [category, setCategory] = useState('revenda');
        const [qty, setQty] = useState(10);
        const [price, setPrice] = useState(7.0);

        const unitItems = separatedProducts.filter((i) => i.unit === currentUnit);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          onAddSeparatedProduct({
            unit: currentUnit,
            productId: generateUniqueId('sep'),
            productName: name.trim(),
            category,
            currentQty: qty,
            unitOfMeasure: 'un',
            minQty: 5,
            price
          });
          setName('');
          setShowModal(false);
        };

        return (
          <div className="space-y-6">
            <div className="bg-slate-900 text-white rounded-2xl p-6 border border-slate-800 shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 text-amber-400 text-xs font-bold uppercase tracking-wider mb-1">
                  <Icons.Coffee className="w-4 h-4" />
                  Produtos Fora da Vitrine Física
                </div>
                <h2 className="text-xl font-extrabold text-white">
                  Revenda, Cafeteria e Encomendas - {currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'}
                </h2>
                <p className="text-xs text-slate-300 mt-1">
                  Bebidas industrializadas, cafés preparados e itens sob encomenda.
                </p>
              </div>

              <button
                onClick={() => setShowModal(true)}
                className="px-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-amber-950 font-bold rounded-xl text-xs shadow-md flex items-center gap-1.5"
              >
                <Icons.Plus className="w-4 h-4" />
                Novo Item Fora da Vitrine
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
              {unitItems.map((item) => (
                <div key={item.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-col justify-between space-y-3">
                  <div>
                    <div className="flex items-center justify-between text-[10px] uppercase font-bold text-slate-400 mb-1">
                      <span>{item.category}</span>
                      <span className="text-emerald-600 font-extrabold">{formatCurrencyBR(item.price)}</span>
                    </div>
                    <h4 className="text-sm font-bold text-slate-900">{item.productName}</h4>
                  </div>

                  <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                    <div>
                      <span className="text-[10px] text-slate-400 block">Estoque:</span>
                      <span className="text-base font-black text-slate-900">{item.currentQty} {item.unitOfMeasure}</span>
                    </div>
                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => onUpdateQty(item.id, -1)}
                        className="w-8 h-8 rounded-xl bg-slate-100 text-slate-800 font-bold flex items-center justify-center"
                      >
                        -
                      </button>
                      <button
                        onClick={() => onUpdateQty(item.id, 1)}
                        className="w-8 h-8 rounded-xl bg-amber-500 text-amber-950 font-bold flex items-center justify-center"
                      >
                        +
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSubmit} className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-200">
                  <h3 className="text-base font-bold text-slate-900">Novo Item Fora da Vitrine</h3>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nome:</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Ex: Coca-Cola 350ml..."
                      className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Categoria:</label>
                      <select
                        value={category}
                        onChange={(e) => setCategory(e.target.value)}
                        className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                      >
                        <option value="revenda">Revenda</option>
                        <option value="cafeteria">Cafeteria</option>
                        <option value="encomenda">Encomenda</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Preço (R$):</label>
                      <input
                        type="number"
                        step="0.01"
                        value={price}
                        onChange={(e) => setPrice(Number(e.target.value) || 0)}
                        className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Estoque Inicial:</label>
                    <input
                      type="number"
                      value={qty}
                      onChange={(e) => setQty(Number(e.target.value) || 0)}
                      className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-xs font-semibold text-slate-600">Cancelar</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold bg-amber-500 text-amber-950 rounded-xl">Salvar</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // PRODUCT CATALOG VIEW
      // ==========================================
      const ProductCatalogView = ({ products, onAddProduct, onDeleteProduct }) => {
        const [filterText, setFilterText] = useState('');
        const [showModal, setShowModal] = useState(false);

        const [name, setName] = useState('');
        const [category, setCategory] = useState('salgado');
        const [price, setPrice] = useState(8.5);
        const [shelfLifeDays, setShelfLifeDays] = useState(2);

        const filtered = products.filter((p) => p.name.toLowerCase().includes(filterText.toLowerCase()));

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          onAddProduct({
            id: generateUniqueId('p'),
            name: name.trim(),
            category,
            compatibleShowcases: [category === 'salgado' ? 'salgada' : category === 'doce' ? 'doce' : 'sobremesa'],
            defaultUnit: 'un',
            minReplenishmentQty: 5,
            shelfLifeDays,
            price
          });
          setName('');
          setShowModal(false);
        };

        return (
          <div className="space-y-6">
            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
