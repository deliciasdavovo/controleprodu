                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-1.5">
                  <span className="t-caption mr-0.5">Data:</span>
                  <button
                    type="button"
                    onClick={() => setQuickDateOffset(0)}
                    className={`btn h-6 px-2.5 text-[11px] ${
                      quickDate === getTodayDateString() ? 'bg-black/[0.09] text-[#1d1d1f]' : 'btn-secondary'
                    }`}
                  >
                    Hoje
                  </button>
                  <button type="button" onClick={() => setQuickDateOffset(-1)} className="btn btn-secondary h-6 px-2.5 text-[11px]">
                    Ontem
                  </button>
                </div>
              </form>

              {/* O fio separa o filtro do formulário — e no celular, sem
                  formulário em cima, ele separaria de nada */}
              <div className="relative lg:pt-3 lg:border-t hairline">
                <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[18px]" />
                <input
                  type="text"
                  placeholder="Filtrar itens…"
                  value={filterText}
                  onChange={(e) => setFilterText(e.target.value)}
                  className="field field-sm field-search"
                />
              </div>
            </div>

            <div role="list" aria-label={`Itens da vitrine ${typeLabel}`} className="support-list flex-1 overflow-y-auto max-h-[620px]">
              {filteredItems.length === 0 ? (
                <div className="text-center py-12 px-4">
                  <p className="t-body text-[#86868b]">Nada na vitrine {typeLabel.toLowerCase()}</p>
                  <p className="t-caption mt-1">
                    <span className="hidden lg:inline">Use o formulário acima para alocar</span>
                    <span className="lg:hidden">Toque no + do canto da tela para colocar o primeiro</span>
                  </p>
                </div>
              ) : (
                showcaseBlocks.map((bloco) => (
                  <section key={bloco.key} aria-label={bloco.title}>
                    <div className="support-section-header px-4 py-2 border-b hairline sticky top-0 z-10 flex items-center justify-between gap-2">
                      <span className="t-overline">{bloco.title}</span>
                      <span className="t-caption tnum">{bloco.entries.length}</span>
                    </div>

                    {bloco.entries.map((item) => {
                      const product = products.find((p) => p.id === item.productId);
                      const slot = slotOf(item);
                      const statusInfo = getSlotItemStatus(item, product);

                      return (
                        <div key={item.id} role="listitem" className="support-row">
                          {/* Cabeçalho de uma linha: espaço, produto e saldo */}
                          <div className="flex items-start gap-2.5">
                            <span
                              className="support-slot"
                              title={slot ? `Espaço ${slot.slotNumber}` : 'Item de apoio'}
                              aria-label={slot ? `Espaço ${slot.slotNumber}` : 'Item de apoio'}
                            >
                              {slot ? `#${slot.slotNumber}` : 'A'}
                            </span>

                            <div className="min-w-0 flex-1">
                              <div className="flex items-start justify-between gap-2">
                                <div className="min-w-0">
                                  <h4 className="text-[14px] font-semibold leading-[1.35] tracking-[-0.012em] truncate">
                                    <mark className={`mark ${statusInfo.markClass}`}>{item.productName}</mark>
                                  </h4>
                                  <p className="t-micro mt-1 flex items-center gap-1 truncate">
                                    <Icons.User className="w-3 h-3 shrink-0" />
                                    <span className="truncate">{getResponsibleName(product)}</span>
                                    {slot && companheiros(item) > 0 && (
                                      <span className="shrink-0">· espaço dividido</span>
                                    )}
                                  </p>
                                </div>

                                <div className="flex flex-col items-end gap-1 shrink-0">
                                  <div className="support-qty" title={`${item.currentQty} ${item.unit} na vitrine`}>
                                    <strong>{item.currentQty}</strong>
                                    <span className="t-nano">{item.unit}</span>
                                  </div>
                                  <span className={`text-[10px] ${statusInfo.alerta ? `pill ${statusInfo.bgClass} ${statusInfo.textClass}` : 't-caption tnum'}`}>
                                    {statusInfo.label}
                                  </span>
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* Edição compacta, dentro da linha da lista */}
                          <div className="support-fields">
                            <label className="min-w-0">
                              <span className="t-nano block mb-0.5">Fabricação</span>
                              <input
                                type="date"
                                value={item.manufactureDate}
                                onChange={(e) => onUpdateItem({ ...item, manufactureDate: e.target.value })}
                                className="field h-8 px-1.5 text-[11px] text-center tnum"
                              />
                            </label>
                            <label className="min-w-0">
                              <span className="t-nano block mb-0.5 text-center">Produzido</span>
                              <input
                                type="number"
                                min="0"
                                value={item.producedQty || item.currentQty}
                                onChange={(e) =>
                                  onUpdateItem({ ...item, producedQty: Math.max(0, Number(e.target.value) || 0) })
                                }
                                className="field h-8 px-1 text-[12px] font-bold text-center tnum no-spin"
                              />
                            </label>
                            <div className="min-w-0">
                              <span className="t-nano block mb-0.5 text-center">Na vitrine</span>
                              <QtyField
                                value={item.currentQty}
                                onSet={(valor) => onSetQty(item.id, valor)}
                                label={`Quantidade de ${item.productName} na vitrine`}
                                className="h-8 px-1 text-[13px] font-extrabold"
                              />
                            </div>
                          </div>

                          {/* Baixas: sai do estoque e vai para o relatório. É
                              outra coisa da contagem acima, que só corrige. */}
                          <div className="support-actions">
                            <ItemActions
                              item={item}
                              onQuickSale={onQuickSale}
                              onRecordSellAll={onRecordSellAll}
                              onQuickLoss={onQuickLoss}
                            />
                            <button
                              onClick={() => onRemoveItem(item.id)}
                              title="Remover da vitrine e apagar os lançamentos deste item"
                              aria-label="Remover da vitrine e apagar os lançamentos deste item"
                              className="btn w-8 h-[38px] px-0 shrink-0 rounded-xl bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73]"
                            >
                              <Icons.Trash2 className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </section>
                ))
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // ORGANIZAR ITEM DA VITRINE PADRÃO
      //
      // Uma janelinha por espaço: prioridade (A a D), em que dias o item entra,
      // a quantidade ideal e o mínimo. É aqui que "todo dia" vira as sete
      // linhas da semana sem precisar copiar dia por dia.
      // ==========================================
      const PlanOrganizeModal = ({ slot, product, priority, days, idealQty, minQty, onClose, onSave, onRemove }) => {
        if (!slot) return null;
        const [prio, setPrio] = useState(priority || DEFAULT_PRIORITY);
        const [selectedDays, setSelectedDays] = useState(days && days.length ? days : []);
        const [qty, setQty] = useState(idealQty || 1);
        const [min, setMin] = useState(minQty || 0);

        const todoDia = selectedDays.length === WEEK_DAYS.length;

        const toggleDay = (day) =>
          setSelectedDays((atual) =>
            atual.includes(day)
              ? atual.filter((d) => d !== day)
              : WEEK_DAYS.filter((d) => d === day || atual.includes(d))
          );

        const salvar = useCliqueUnico(() => {
          const ideal = Math.max(1, Number(qty) || 1);
          onSave({
            priority: prio,
            days: selectedDays,
            idealQty: ideal,
            // Mínimo acima do padrão chamaria o item para sempre: o teto é o
            // próprio padrão do dia
            minQty: Math.max(0, Math.min(Math.floor(Number(min) || 0), ideal))
          });
          onClose();
        });

        const handleSubmit = (e) => {
          e.preventDefault();
          if (selectedDays.length === 0) {
            alert('Marque pelo menos um dia — ou use "Tirar do padrão" para remover o item.');
            return;
          }
          salvar();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Organizar item</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1 truncate">{product?.name || 'Produto'}</h3>
                  <p className="t-callout mt-1 truncate">
                    {slot.sectionTitle} · espaço #{slot.slotNumber} · {getResponsibleName(product)}
                  </p>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div>
                <label className="t-caption block mb-1.5">Prioridade</label>
                <div className="grid grid-cols-4 gap-1.5">
                  {PRIORITIES.map((p) => (
                    <button
                      key={p.value}
                      type="button"
                      onClick={() => setPrio(p.value)}
                      title={p.hint}
                      className={`h-11 rounded-xl border text-[15px] font-extrabold flex flex-col items-center justify-center gap-1 transition-all ${
                        prio === p.value
                          ? 'border-[#0E0937] bg-[#0E0937]/[0.06] text-[#0E0937]'
                          : 'border-black/[0.08] bg-white text-[#6e6e73] hover:bg-black/[0.03]'
                      }`}
                    >
                      {p.value}
                      <span className={`w-1.5 h-1.5 rounded-full ${p.dot}`} />
                    </button>
                  ))}
                </div>
                <p className="t-caption mt-1.5">{getPriority(prio).title} — {getPriority(prio).hint}</p>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="t-caption">Frequência</label>
                  <button
                    type="button"
                    onClick={() => setSelectedDays(todoDia ? [] : [...WEEK_DAYS])}
                    className="btn btn-secondary h-7 px-2.5 text-[12px]"
                  >
                    {todoDia ? 'Limpar dias' : 'Todo dia'}
                  </button>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {WEEK_DAYS.map((day) => (
                    <button
                      key={day}
                      type="button"
                      onClick={() => toggleDay(day)}
                      title={getDayNameBR(day)}
                      className={`h-10 rounded-xl border text-[12px] font-bold transition-all ${
                        selectedDays.includes(day)
                          ? 'border-[#0E0937] bg-[#0E0937] text-white'
                          : 'border-black/[0.08] bg-white text-[#6e6e73] hover:bg-black/[0.03]'
                      }`}
                    >
                      {getDayShortBR(day)}
                    </button>
                  ))}
                </div>
                <p className="t-caption mt-1.5">
                  {todoDia
                    ? 'O item fica neste espaço nos sete dias da semana.'
                    : `Entra em: ${frequencyTitle(selectedDays)}.`}
                  {' '}Nos dias marcados o espaço passa a ser deste produto; nos desmarcados ele fica livre.
                </p>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="t-caption block mb-1.5">Quantidade ideal por dia</label>
                  <input
                    type="number"
                    min="1"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    title="Quanto este espaço deve ter no dia"
                    className="field field-md text-center font-extrabold tnum"
                  />
                </div>
                <div>
                  <label className="t-caption block mb-1.5">Quantidade mínima</label>
                  <input
                    type="number"
                    min="0"
                    value={min}
                    onChange={(e) => setMin(e.target.value)}
                    title="O pedido de produção chama o item quando o estoque da loja chega neste número. 0 = só quando acabar"
                    className="field field-md text-center font-extrabold tnum"
                  />
                </div>
              </div>
              <p className="t-caption -mt-1">
                O mínimo vale para os dias marcados acima e é ele que chama o item no pedido de
                produção: quando a loja chega nele, o pedido manda fazer a fornada do padrão.
                0 = só quando acabar.
              </p>

              <div className="flex justify-between gap-2 pt-1">
                <button
                  type="button"
                  onClick={() => { onRemove(); onClose(); }}
                  className="btn btn-danger-quiet btn-sm"
                >
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Tirar do padrão
                </button>
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                  <button type="submit" className="btn btn-primary btn-md">Salvar</button>
                </div>
              </div>
            </form>
          </div>
        );
      };

      // ==========================================
      // TABELA DA SEMANA (Vitrine Padrão)
      //
      // A vitrine de cada dia é editada uma de cada vez, então é difícil ver
      // o desenho da semana inteira. Esta tabela abre isso: uma linha por
      // produto, uma coluna por dia, com a quantidade que o padrão pede, o
      // total da semana e a média por dia em que o item entra.
      //
      // A quantidade é digitada na própria célula: dá para montar a semana
      // inteira de um produto sem trocar de dia.
      //
      // A mesma grade edita duas coisas, uma de cada vez: o PADRÃO do dia
      // (quanto a vitrine deve ter) e o MÍNIMO do dia (em que ponto o pedido
      // de produção chama o item). São as duas quantidades que a cozinha
      // precisa por item e por dia, e cada uma tem a sua leitura da semana.
      // ==========================================

      // Os dois números que a grade da semana edita
      const WEEK_FIELDS = [
        {
          value: 'padrao', label: 'Padrão',
          title: 'Quantidade por dia',
          heading: 'A semana inteira',
          hint: 'Clique na quantidade para mudar — 0 tira o produto do dia.',
          cellHint: 'digite a quantidade (0 tira do dia)',
          columnLabel: 'Padrão'
        },
        {
          value: 'minimo', label: 'Mínimo',
          title: 'Quantidade mínima por dia',
          heading: 'O mínimo da semana',
          hint: 'O pedido chama o item quando o estoque da loja chega neste número — 0 é só quando acabar.',
          cellHint: 'digite o mínimo (0 = só quando acabar)',
          columnLabel: 'Mínimo'
        }
      ];

      const getWeekField = (value) => WEEK_FIELDS.find((f) => f.value === value) || WEEK_FIELDS[0];

      // Uma célula da tabela: mostra a quantidade e vira campo ao clicar.
      // Enter e sair do campo gravam, Esc desfaz.
      const WeeklyQtyCell = ({ value, onCommit, title }) => {
        const [texto, setTexto] = useState('');
        const [editando, setEditando] = useState(false);

        useEffect(() => {
          if (!editando) setTexto(value ? String(value) : '');
        }, [value, editando]);

        const gravar = () => {
          setEditando(false);
          const nova = texto.trim() === '' ? 0 : Math.max(0, Math.floor(Number(texto)));
          if (!Number.isFinite(nova) || nova === (value || 0)) {
            setTexto(value ? String(value) : '');
            return;
          }
          onCommit(nova);
        };

        return (
          <input
            type="text"
            inputMode="numeric"
            value={editando ? texto : (value ? String(value) : '')}
            title={title}
            placeholder="—"
            onFocus={(e) => { setEditando(true); setTexto(value ? String(value) : ''); e.target.select(); }}
            onChange={(e) => setTexto(e.target.value.replace(/[^0-9]/g, ''))}
            onBlur={gravar}
            onKeyDown={(e) => {
              if (e.key === 'Enter') { e.currentTarget.blur(); }
              if (e.key === 'Escape') { setTexto(value ? String(value) : ''); setEditando(false); e.currentTarget.blur(); }
            }}
            className={`qty-cell tnum ${value ? 'font-bold text-[#1d1d1f]' : 'ink-muted'}`}
          />
        );
      };

      const WeeklyPlanTable = ({
        currentUnit,
        products,
        slots,
        standardPlans,
        selectedDay,
        onSelectDay,
        onSetWeeklyQty,
        onSetWeeklyMin
      }) => {
        const [aberto, setAberto] = useState(true);
        const [busca, setBusca] = useState('');
        const [ordem, setOrdem] = useState('total');
        const [campo, setCampo] = useState('padrao');
        // O que a grade mostra: a semana inteira, só os fixos (a rotina que
        // não muda) ou só os que variam (o que a loja mexe conforme o
        // movimento). Ver um sem o outro é o jeito de conferir cada natureza
        const [natureza, setNatureza] = useState('todas');
        const [copiado, setCopiado] = useState(false);

        const editandoMinimo = campo === 'minimo';
        const campoAtual = getWeekField(campo);

        const slotById = useMemo(() => {
          const map = {};
          slots.forEach((s) => { map[s.id] = s; });
          return map;
        }, [slots]);

        // Uma linha por produto, somando os espaços que ele ocupa no dia
        const linhas = useMemo(() => {
          const porProduto = {};

          standardPlans
            .filter((sp) => sp.unit === currentUnit)
            .forEach((sp) => {
              if (!porProduto[sp.productId]) {
                const produto = products.find((p) => p.id === sp.productId);
                porProduto[sp.productId] = {
                  id: sp.productId,
                  nome: produto?.name || 'Produto removido',
                  vitrines: [],
                  dias: {},
                  minimos: {},
                  espacos: {},
                  prioridade: null,
                  total: 0,
                  totalMinimo: 0
                };
              }

              const linha = porProduto[sp.productId];
              const slot = slotById[sp.slotId];
              if (slot && !linha.vitrines.includes(slot.sectionTitle)) {
                linha.vitrines.push(slot.sectionTitle);
              }
              linha.dias[sp.dayOfWeek] = (linha.dias[sp.dayOfWeek] || 0) + (sp.idealQty || 0);
              linha.minimos[sp.dayOfWeek] = (linha.minimos[sp.dayOfWeek] || 0) + (sp.minQty || 0);
              linha.espacos[sp.dayOfWeek] = (linha.espacos[sp.dayOfWeek] || 0) + 1;
              linha.total += sp.idealQty || 0;
              linha.totalMinimo += sp.minQty || 0;

              // Quando o produto entra com letras diferentes em dias ou
              // espaços diferentes, vale a mais urgente. A primeira letra que
              // aparece é o ponto de partida: começar do padrão B fazia um
              // item C inteiro ser lido como B.
              const prio = getPriority(sp.priority).value;
              if (linha.prioridade === null || priorityRank(prio) < priorityRank(linha.prioridade)) {
                linha.prioridade = prio;
              }
            });

          return Object.values(porProduto).map((linha) => {
            const diasDoItem = WEEK_DAYS.filter((d) => (linha.dias[d] || 0) > 0);
            const diasAtivos = diasDoItem.length;
            return {
              ...linha,
              prioridade: linha.prioridade || DEFAULT_PRIORITY,
              diasDoItem,
              diasAtivos,
              freqLabel: frequencyLabel(diasDoItem),
              freqTitle: frequencyTitle(diasDoItem),
              todoDia: diasAtivos >= WEEK_DAYS.length,
              media: diasAtivos ? linha.total / diasAtivos : 0,
              mediaMinimo: diasAtivos ? linha.totalMinimo / diasAtivos : 0
            };
          });
        }, [standardPlans, currentUnit, products, slotById]);

        const visiveis = useMemo(() => {
          const termo = normalizeName(busca);
          let lista = termo ? linhas.filter((l) => normalizeName(l.nome).includes(termo)) : linhas;
          if (natureza === 'fixos') lista = lista.filter((l) => l.todoDia);
          else if (natureza === 'variam') lista = lista.filter((l) => !l.todoDia);
          return [...lista].sort((a, b) => {
            if (ordem === 'nome') return a.nome.localeCompare(b.nome, 'pt-BR');
            // Por importância: a letra primeiro e, dentro dela, quem entra em
            // mais dias da semana — é a ordem do que a cozinha faz sempre
            if (ordem === 'importancia') {
              return priorityRank(a.prioridade) - priorityRank(b.prioridade)
                || b.diasAtivos - a.diasAtivos
                || a.nome.localeCompare(b.nome, 'pt-BR');
            }
            if (ordem === 'frequencia') {
              return b.diasAtivos - a.diasAtivos
                || priorityRank(a.prioridade) - priorityRank(b.prioridade)
                || a.nome.localeCompare(b.nome, 'pt-BR');
            }
            return b.total - a.total || a.nome.localeCompare(b.nome, 'pt-BR');
          });
        }, [linhas, busca, ordem, natureza]);

        // Quantos itens de cada natureza o padrão tem — o número que resume a
        // semana antes de a grade ser lida
        const totalFixos = useMemo(() => linhas.filter((l) => l.todoDia).length, [linhas]);
        const totalVariam = linhas.length - totalFixos;

        // A leitura de baixo acompanha o que está sendo editado: somar padrão
        // com a grade do mínimo na tela daria um total que não é de nada
        const valorDoDia = (linha, day) =>
          (editandoMinimo ? linha.minimos[day] : linha.dias[day]) || 0;

        const totalPorDia = useMemo(() => {
          const contas = {};
          WEEK_DAYS.forEach((d) => {
            contas[d] = visiveis.reduce((acc, l) => acc + valorDoDia(l, d), 0);
          });
          return contas;
        }, [visiveis, editandoMinimo]);

        const totalSemana = useMemo(
          () => visiveis.reduce((acc, l) => acc + (editandoMinimo ? l.totalMinimo : l.total), 0),
          [visiveis, editandoMinimo]
        );

        const formatarMedia = (valor) =>
          (Math.round(valor * 10) / 10).toString().replace('.', ',');

        // Sai com tabulação: cola direto no Excel ou no Google Planilhas. Vai a
        // grade que está na tela — padrão ou mínimo —, dita já na primeira
        // coluna para a planilha colada não virar número sem nome
        const handleCopy = async () => {
          const linhasTexto = [
            [campoAtual.columnLabel, 'Prioridade', 'Frequência', ...WEEK_DAYS.map(getDayShortBR), 'Total semana'].join('\t'),
            ...visiveis.map((l) =>
              [
                l.nome, l.prioridade, l.freqLabel,
                ...WEEK_DAYS.map((d) => valorDoDia(l, d)),
                editandoMinimo ? l.totalMinimo : l.total
              ].join('\t')
            ),
            ['Total', '', '', ...WEEK_DAYS.map((d) => totalPorDia[d]), totalSemana].join('\t')
          ];

          const ok = await copyTextToClipboard(linhasTexto.join('\n'));
          if (ok) {
            setCopiado(true);
            setTimeout(() => setCopiado(false), 2000);
          }
        };

        return (

                {/* A conta das duas naturezas, na mesma cor dos selos da

                  <p className="t-caption mt-1 flex items-center gap-1.5 flex-wrap">

                    <span className="freq" data-fixo="varia">{totalVariam} variam</span>

                )}
                <p className="t-caption mt-0.5">
                  {campoAtual.hint}
                </p>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {aberto && (
                  <button onClick={handleCopy} className="btn btn-secondary btn-sm">
                    <Icons.Copy className="w-3.5 h-3.5" />

                <button onClick={() => setAberto(!aberto)} className="btn btn-secondary btn-sm">
                  {aberto ? 'Esconder' : 'Mostrar'}
                </button>
              </div>
            </div>

            {aberto && (
              <>
                <div className="flex flex-col sm:flex-row sm:flex-wrap sm:items-center gap-2 mt-4">
                  <div className="relative flex-1 min-w-[180px] max-w-xs">
                    <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[11px]" />
                    <input

                  </div>
                  {/* O que a grade edita. São duas quantidades por item e por

                  <div className="flex items-center gap-2">

                    <div className="segmented">
                      {WEEK_FIELDS.map((f) => (

                  {/* Mostrar só uma das naturezas. O fixo é a rotina que a

                    <div className="segmented">

                      </button>
                      <button onClick={() => setNatureza('variam')} data-active={natureza === 'variam'}
                              title="Só os itens que entram em alguns dias">

                  </div>

                  <div className="flex items-center gap-2">
                    <span className="t-caption">Ordenar</span>
                    <div className="segmented">
                      <button onClick={() => setOrdem('total')} data-active={ordem === 'total'}>

                      </button>
                      <button onClick={() => setOrdem('importancia')} data-active={ordem === 'importancia'}

                      </button>
                      <button onClick={() => setOrdem('frequencia')} data-active={ordem === 'frequencia'}
                              title="Quem entra em mais dias da semana primeiro">
                        Frequência
                      </button>
                      <button onClick={() => setOrdem('nome')} data-active={ordem === 'nome'}>
                        A-Z
                      </button>
                    </div>
                  </div>
                </div>

                {visiveis.length === 0 ? (
                  <p className="t-body text-center py-10">
                    {linhas.length === 0
                      ? 'Nenhum item no padrão ainda — monte a vitrine de um dia para a semana aparecer aqui.'
                      : busca.trim()
                        ? 'Nenhum produto com esse nome.'
                        : natureza === 'fixos'
                          ? 'Nenhum item entra todo dia da semana.'
                          : natureza === 'variam'
                            ? 'Todos os itens do padrão entram todo dia.'
                            : 'Nenhum produto com esse nome.'}
                  </p>
                ) : (
                  <div className="mt-3 rola-x">
                    <table className="week-table">
                      <thead>
                        <tr>
                          <th
                            data-sticky="true"
                            className="sticky left-0 z-10 text-left t-overline font-bold px-2.5 py-2 border-b border-r hairline w-[136px] sm:w-[240px]"
                            style={{ background: 'var(--bg-surface)' }}
                          >
                            Produto
                          </th>
                          <th className="text-center t-overline font-bold px-1.5 py-2 border-b border-r hairline"
                              title="A–D: a importância do item, para ordenar e filtrar a lista">
                            P
                          </th>
                          <th className="text-left t-overline font-bold px-2.5 py-2 border-b border-r hairline whitespace-nowrap"
                              title="Em que dias da semana o item entra no padrão. Roxo cheio: fixo, entra todo dia. Roxo lavado: varia, entra só em alguns — e os sete traços mostram quais">
                            Freq.
                          </th>
                          {WEEK_DAYS.map((day) => (
                            <th
                              key={day}
                              data-hoje={selectedDay === day}
                              className="px-1 pb-2 border-b hairline"
                            >
                              <button
                                onClick={() => onSelectDay(day)}
                                title={`Editar a vitrine de ${getDayNameBR(day)}`}
                                className={`w-full min-w-11 rounded-lg px-2 py-1.5 text-[12px] font-bold transition-colors ${
                                  selectedDay === day
                                    ? 'text-[#0E0937]'
                                    : 'text-[#86868b] hover:text-[#1d1d1f] hover:bg-black/[0.04]'
                                }`}
                              >
                                {getDayShortBR(day)}
                              </button>
                            </th>
                          ))}
                          <th className="text-right t-overline font-bold px-2.5 py-2 border-b hairline whitespace-nowrap">
                            Total
                          </th>
                        </tr>
                      </thead>

                      <tbody>
                        {visiveis.map((linha) => (
                          <tr key={linha.id} className="border-b hairline">
                            <td
                              data-sticky="true"
                              data-natureza={linha.todoDia ? 'fixo' : 'varia'}
                              className="sticky left-0 z-10 pl-3 pr-2.5 py-1.5 border-r hairline w-[136px] sm:w-[240px] max-w-[136px] sm:max-w-[240px]"
                              style={{ background: 'var(--bg-surface)' }}
                            >
                              <p className="font-semibold text-[#1d1d1f] truncate" title={linha.nome}>
                                {linha.nome}
                              </p>
                              {linha.vitrines.length > 0 && (
                                <p className="t-micro truncate">{linha.vitrines.join(' · ')}</p>
                              )}
                            </td>

                            {/* A importância e a frequência coladas no nome:
                                a letra diz o peso do item, a frequência diz se
                                ele é rotina de todo dia ou só de alguns */}
                            <td className="text-center px-1.5 py-1.5 border-r hairline font-bold text-[#6e6e73]"
                                title={getPriority(linha.prioridade).title}>
                              {linha.prioridade}
                            </td>
                            <td className="px-2.5 py-1.5 border-r hairline whitespace-nowrap">
                              <SeloFrequencia dias={linha.diasDoItem} semana />
                            </td>

                            {WEEK_DAYS.map((day) => {
                              const valor = valorDoDia(linha, day);
                              const espacos = linha.espacos[day] || 0;
                              const noDia = (linha.dias[day] || 0) > 0 || espacos > 0;

                              // Mínimo de um dia em que o item não entra não
                              // existe: a célula fica apagada em vez de abrir
                              // um campo que não teria onde gravar
                              if (editandoMinimo && !noDia) {
                                return (
                                  <td
                                    key={day}
                                    data-hoje={selectedDay === day}
                                    className="px-1 py-1 text-center text-[#d2d2d7]"
                                    title={`${linha.nome} não entra em ${getDayNameBR(day)} — coloque no padrão do dia primeiro`}
                                  >
                                    ·
                                  </td>
                                );

                              return (
                                <td
                                  key={day}
                                  data-hoje={selectedDay === day}
                                  className="px-1 py-1"
                                >

                                    value={valor}
                                    title={
                                      espacos > 1
                                        ? `${linha.nome} · ${getDayNameBR(day)} — ${espacos} espaços; o número é repartido entre eles`
                                        : `${linha.nome} · ${getDayNameBR(day)} — ${campoAtual.cellHint}`
                                    }
                                    onCommit={(nova) => (editandoMinimo
                                      ? onSetWeeklyMin(day, linha.id, nova)
                                      : onSetWeeklyQty(day, linha.id, nova))}
                                  />
                                </td>
                              );
                            })}

                            <td className="text-right px-2.5 py-1.5 whitespace-nowrap">
                              <span className="tnum font-extrabold text-[#1d1d1f]">
                                {editandoMinimo ? linha.totalMinimo : linha.total}
                              </span>
                              {linha.diasAtivos > 1 && (
                                <span className="t-micro tnum block">
                                  {formatarMedia(editandoMinimo ? linha.mediaMinimo : linha.media)}/dia
                                </span>
                              )}

                        ))}
                      </tbody>

                      <tfoot>
                        <tr>
                          <td
                            data-sticky="true"
                            className="sticky left-0 z-10 px-2.5 py-2 t-overline font-bold border-r hairline"
                            style={{ background: 'var(--bg-surface)' }}
                          >
                            Total do dia
                          </td>
                          <td className="border-r hairline" />
                          <td className="border-r hairline" />
                          {WEEK_DAYS.map((day) => (
                            <td
                              key={day}
                              data-hoje={selectedDay === day}
                              className={`text-center tnum font-extrabold px-1 py-2 ${
                                selectedDay === day ? 'text-[#0E0937]' : 'text-[#1d1d1f]'
                              }`}
                            >
                              {totalPorDia[day] || 0}
                            </td>
                          ))}
                          <td className="text-right tnum font-extrabold px-2.5 py-2 text-[#1d1d1f]">
                            {totalSemana}
                          </td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                )}
              </>
            )}
          </div>
        );
      };

      // ==========================================
      // O MAPA DAS VITRINES
      //
      // O desenho da semana inteira em uma folha só: uma linha por espaço,
      // uma coluna por dia, o nome do produto dentro da célula. É a planilha
      // que a loja já desenhava na mão para saber o que vai em cada quina do
      // móvel em cada dia.
      //
      // Dias seguidos com o mesmo produto viram uma faixa só, que atravessa
      // as colunas desses dias. O espaço que não muda a semana inteira sai
      // como uma barra de ponta a ponta; o que troca sai picotado, cada
      // produto no seu tom. O desenho aparece antes da leitura.
      // ==========================================
      const MAPA_TONS = 4;

      const ShowcaseMap = ({
        currentUnit,
        slots,
        products,
        standardPlans,
        selectedDay,
        onSelectDay
      }) => {
        const [aberto, setAberto] = useState(true);

        const productById = useMemo(() => {
          const mapa = {};
          products.forEach((p) => { mapa[p.id] = p; });
          return mapa;
        }, [products]);

        // O que cada espaço recebe em cada dia: espaço → dia → item do padrão
        const planoPorEspaco = useMemo(() => {
          const mapa = {};
          standardPlans
            .filter((sp) => sp.unit === currentUnit)
            .forEach((sp) => {
              if (!mapa[sp.slotId]) mapa[sp.slotId] = {};
              mapa[sp.slotId][sp.dayOfWeek] = { productId: sp.productId, qty: sp.idealQty || 0 };
            });
          return mapa;
        }, [standardPlans, currentUnit]);

        const vitrines = useMemo(() => {
          const unitSlots = slots.filter((s) => s.unit === currentUnit);
          const blocos = groupByShowcase(unitSlots, (slot) => slot);

          blocos.forEach((bloco) => {
            bloco.entries.sort((a, b) => a.slotNumber - b.slotNumber);

            bloco.linhas = bloco.entries.map((slot) => {
              const porDia = planoPorEspaco[slot.id] || {};

              // O tom sai da ordem de quem ocupa mais dias do espaço: o
              // produto principal da linha fica sempre com o índigo da casa,
              // e quem entra só de vez em quando é que muda de cor
              const contagem = new Map();
              WEEK_DAYS.forEach((day) => {
                const entrada = porDia[day];
                if (entrada) contagem.set(entrada.productId, (contagem.get(entrada.productId) || 0) + 1);
              });
              const tomDe = {};
              [...contagem.entries()]
                .sort((a, b) => b[1] - a[1])
                .forEach(([productId], i) => { tomDe[productId] = i % MAPA_TONS; });

              // Dias seguidos com o mesmo produto viram uma faixa só
              const faixas = [];
              WEEK_DAYS.forEach((day) => {
                const entrada = porDia[day];
                const productId = entrada ? entrada.productId : null;
                const ultima = faixas[faixas.length - 1];
                if (ultima && ultima.productId === productId) {
                  ultima.dias.push(day);
                  ultima.qtys.push(entrada ? entrada.qty : 0);
                } else {
                  faixas.push({ productId, dias: [day], qtys: [entrada ? entrada.qty : 0] });
                }
              });

              const diasOcupados = WEEK_DAYS.filter((day) => porDia[day]).length;
              const natureza = contagem.size === 0
                ? 'vazio'
                : (contagem.size === 1 && diasOcupados === WEEK_DAYS.length) ? 'fixo' : 'varia';

              return { slot, faixas, tomDe, natureza, produtos: contagem.size };
            });
          });

          return blocos;
        }, [slots, currentUnit, planoPorEspaco]);

        const linhas = useMemo(() => vitrines.flatMap((v) => v.linhas), [vitrines]);
        const fixos = linhas.filter((l) => l.natureza === 'fixo').length;
        const variam = linhas.filter((l) => l.natureza === 'varia').length;

        return (
          <div className="card p-4 sm:p-5">
            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="t-overline flex items-center gap-1.5 mb-1.5">
                  <Icons.LayoutGrid className="w-3.5 h-3.5" />
                  Mapeamento das vitrines
                </div>
                <h3 className="t-title text-[#1d1d1f]">O desenho da semana</h3>
                <p className="t-caption mt-1">
                  Um espaço por linha, um dia por coluna. Dias seguidos com o mesmo produto viram
                  uma faixa só — clique nela para editar aquele dia.
                </p>
                {linhas.length > 0 && (
                  <p className="t-caption mt-1.5 flex items-center gap-1.5 flex-wrap">
                    <span className="freq" data-fixo="fixo">{fixos} espaços fixos</span>
                    <span className="freq" data-fixo="varia">{variam} trocam na semana</span>
                  </p>
                )}
              </div>

              <button onClick={() => setAberto(!aberto)} className="btn btn-secondary btn-sm shrink-0">
                {aberto ? 'Esconder' : 'Mostrar'}
              </button>
            </div>

            {aberto && (
              linhas.length === 0 ? (
                <p className="t-body text-center py-10">
                  Nenhum espaço cadastrado nesta unidade ainda.
                </p>
              ) : (
                <div className="mt-4 rola-x">
                  <div className="mapa">
                    <span />
                    {WEEK_DAYS.map((day) => (
                      <button
                        key={day}
                        onClick={() => onSelectDay(day)}
                        data-hoje={selectedDay === day}
                        className="mapa-dia"
                        title={`Editar a vitrine de ${getDayNameBR(day)}`}
                      >
                        {getDayShortBR(day)}
                      </button>
                    ))}

                    {vitrines.map((vitrine) => (
                      <React.Fragment key={vitrine.key}>
                        <div className="mapa-vitrine">
                          <span className="t-overline">{vitrine.title}</span>
                        </div>

                        {vitrine.linhas.map((linha) => (
                          <React.Fragment key={linha.slot.id}>
                            <span
                              className="mapa-espaco"
                              data-natureza={linha.natureza}
                              title={
                                linha.natureza === 'fixo'
                                  ? `Espaço ${linha.slot.slotNumber} — o mesmo produto a semana inteira`
                                  : linha.natureza === 'varia'
                                    ? `Espaço ${linha.slot.slotNumber} — ${linha.produtos} produtos se revezam na semana`
                                    : `Espaço ${linha.slot.slotNumber} — livre a semana inteira`
                              }
                            >
                              {linha.slot.slotNumber}
                            </span>

                            {linha.faixas.map((faixa) => {
                              const produto = faixa.productId ? productById[faixa.productId] : null;
                              const nome = faixa.productId
                                ? (produto?.name || 'Produto removido')
                                : 'livre';
                              // A quantidade só aparece quando é a mesma em
                              // todos os dias da faixa: uma faixa com números
                              // diferentes por dia mostraria um deles como se
                              // valesse para todos
                              const mesmaQtd = faixa.qtys.every((q) => q === faixa.qtys[0]);
                              const dias = faixa.dias.map(getDayShortBR).join(', ');

                              return (
                                <button
                                  key={faixa.dias[0]}
                                  type="button"
                                  onClick={() => onSelectDay(faixa.dias[0])}
                                  style={{ gridColumn: `span ${faixa.dias.length}` }}
                                  className="mapa-faixa"
                                  data-tom={faixa.productId ? linha.tomDe[faixa.productId] : undefined}
                                  data-vazio={!faixa.productId}
                                  title={
                                    faixa.productId
                                      ? `${nome} · espaço ${linha.slot.slotNumber} · ${dias}${
                                          mesmaQtd
                                            ? ` — ${faixa.qtys[0]} un por dia`
                                            : ` — ${faixa.dias.map((d, i) => `${getDayShortBR(d)} ${faixa.qtys[i]}`).join(', ')}`
                                        }`
                                      : `Espaço ${linha.slot.slotNumber} livre em ${dias}`
                                  }
                                >
                                  <span className="mapa-nome">{nome}</span>
                                  {faixa.productId && mesmaQtd && faixa.qtys[0] > 0 && (
                                    <span className="mapa-qtd tnum">{faixa.qtys[0]} un</span>
                                  )}
                                </button>
                              );
                            })}
                          </React.Fragment>
                        ))}
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              )
            )}
          </div>
        );
      };

      // ==========================================
      // STANDARD SHOWCASE VIEW (Vitrine Padrão)
      //
      // Uma grade por vitrine, uma embaixo da outra, no desenho do móvel de
      // verdade: as colunas de produto daquela vitrine (SHOWCASE_COLUMNS) e as
      // fileiras que o tamanho dela pedir. Quem monta a vitrine na loja olha
      // para a tela e vê a mesma coisa que vai ver no balcão.
      //
      // Nada de cartão em volta de cada espaço: o que separa um do outro é o
      // fio fino da grade. O espaço vazio fica apagado, e as duas quantidades
      // — o padrão do dia e o mínimo — se digitam na própria célula.
      // ==========================================
      const StandardShowcaseView = ({
        currentUnit,
        unitName,
        slots,
        products,
        standardPlans,
        selectedDay,
        onSelectDay,
        onUpdatePlanItem,
        onRemovePlanItem,
        onUpdatePlanSchedule,
        onSetPlanMin,
        onSetWeeklyQty,
        onSetWeeklyMin,
        onCopyDayPlan,
        onClearDayPlan,
        onGenerateProductionOrder
      }) => {
        const [targetCopyDay, setTargetCopyDay] = useState('terca');
        const [priorityFilter, setPriorityFilter] = useState('todas');
        const [organizing, setOrganizing] = useState(null);

        const unitSlots = slots.filter((s) => s.unit === currentUnit);
        const dayPlans = standardPlans.filter(
          (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay
        );

        const planOf = (slotId) => dayPlans.find((sp) => sp.slotId === slotId);
        const productOf = (productId) => products.find((p) => p.id === productId);

        // Uma coluna por vitrine de verdade (Salgada 1, Salgada 2, Doce…)
        const showcases = useMemo(() => {
          const colunas = [];
          const porChave = {};

          unitSlots.forEach((slot) => {
            const chave = showcaseKey(slot);
            if (!porChave[chave]) {
              porChave[chave] = {
                key: chave,
                title: slot.sectionTitle,
                showcaseType: slot.showcaseType,
                shelfNumber: slot.shelfNumber,
                slots: []
              };
              colunas.push(porChave[chave]);
            }
            porChave[chave].slots.push(slot);
          });

          colunas.forEach((c) => c.slots.sort((a, b) => a.slotNumber - b.slotNumber));
          return colunas.sort(compareShowcase);
        }, [unitSlots]);

        const handleCopy = () => {
          if (selectedDay === targetCopyDay) {
            alert('Selecione um dia de destino diferente do atual.');
            return;
          }
          onCopyDayPlan(selectedDay, targetCopyDay);
          alert(`Padrão de ${getDayNameBR(selectedDay)} copiado para ${getDayNameBR(targetCopyDay)}!`);
        };

        const handleClear = () => {
          if (confirm(`Limpar todo o padrão de ${getDayNameBR(selectedDay)}?`)) {
            onClearDayPlan(selectedDay);
          }
        };

        // Quantos itens do dia tem em cada prioridade — vira o filtro do topo
        const countByPriority = useMemo(() => {
          const contas = {};
          PRIORITIES.forEach((p) => { contas[p.value] = 0; });
          dayPlans.forEach((sp) => { contas[getPriority(sp.priority).value] += 1; });
          return contas;
        }, [dayPlans]);

        const matchesFilter = (plan) =>
          priorityFilter === 'todas' || (plan && getPriority(plan.priority).value === priorityFilter);

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                  <div className="t-overline flex items-center gap-1.5 mb-2">
                    <Icons.Calendar className="w-3.5 h-3.5" />
                    Planejamento semanal
                  </div>
                  <h2 className="t-display">Vitrine padrão</h2>
                  <p className="t-body mt-1.5 max-w-lg">
                    Defina como a vitrine deve ser montada em cada dia — {unitName}.
                    Cada item tem dois números por dia: a quantidade do padrão e a

                  </p>

              {/* Os dias em um segmented control: um bloco só, o dia aberto

              <div className="mt-6 rola-x pb-1 scrollbar-none">

            <div className="card-flat p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="t-callout mr-0.5" title={
                  priorityFilter === 'todas'

                  {PRIORITIES.map((p) => (
                    <button

                      {p.value}
                      <span className="tnum opacity-60">{countByPriority[p.value]}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <span className="t-callout flex items-center gap-1.5">
                  <Icons.Copy className="w-4 h-4 text-[#6e6e73]" />
                  Copiar <strong className="text-[#1d1d1f] font-bold">{getDayNameBR(selectedDay)}</strong> para
                </span>
                <select
                  value={targetCopyDay}

                  {WEEK_DAYS.map((d) => (

                  ))}
                </select>
                <button onClick={handleCopy} className="btn btn-secondary btn-sm">

                </button>
                <button onClick={handleClear} className="btn btn-danger-quiet btn-sm">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Limpar padrão
                </button>
              </div>
            </div>

            {/* Cada vitrine no desenho dela: os espaços em colunas de produto,
                na ordem em que estão no móvel da loja, com o número de colunas
                que aquela vitrine tem de verdade. Espaço vazio fica apagado,
                para o olho cair primeiro no que já está montado. */}
            <div className="space-y-4">
              {showcases.map((vitrine) => {
                const planejados = vitrine.slots.filter((s) => planOf(s.id));
                const total = planejados.reduce((acc, s) => acc + (planOf(s.id)?.idealQty || 0), 0);
                const totalMinimo = planejados.reduce((acc, s) => acc + (planOf(s.id)?.minQty || 0), 0);
                const colunas = showcaseColumnsFor(currentUnit, vitrine.showcaseType);
                // O espaço da vitrine salgada só oferece produto salgado
                const productOptions = [
                  { value: '', label: 'Espaço vazio', muted: true },
                  ...productsForShowcaseType(products, vitrine.showcaseType).map((p) => ({ value: p.id, label: p.name }))
                ];

                return (
                  <div key={vitrine.key} className="card p-4 sm:p-5">
                    <div className="flex items-start justify-between gap-3 pb-3">
                      <div className="min-w-0">
                        <h3 className="t-headline text-[#1d1d1f] truncate">{vitrine.title}</h3>
                        <p className="t-caption tnum mt-0.5">
                          {planejados.length}/{vitrine.slots.length} espaços cheios
                          {totalMinimo > 0 && ` · mín. ${totalMinimo} un`}
                        </p>
                      </div>
                      <div className="text-right shrink-0">
                        <p className="t-metric-xs">{total}</p>
                        <p className="t-micro mt-0.5">un no dia</p>
                      </div>
                    </div>

                    {/* A grade é o móvel: o fio fino entre os espaços faz o
                        desenho da vitrine, sem cartão em volta de cada um */}
                    <div className="rola-x">
                      <div
                        className="grid gap-px bg-[var(--hairline)] border hairline rounded-xl overflow-hidden"
                        style={{
                          gridTemplateColumns: `repeat(${colunas}, minmax(0, 1fr))`,
                          minWidth: `${colunas * 190}px`
                        }}
                      >
                        {vitrine.slots.map((slot) => {
                          const planItem = planOf(slot.id);
                          const product = planItem ? productOf(planItem.productId) : null;
                          const dias = planItem
                            ? planDaysOf(standardPlans, currentUnit, slot.id, planItem.productId)
                            : [];
                          const prio = getPriority(planItem?.priority);
                          const apagado = planItem && !matchesFilter(planItem);
                          // Produto de outra categoria que já estava aqui continua
                          // aparecendo, senão o campo ficaria em branco com o
                          // espaço ocupado
                          const opcoes = product && !productOptions.some((o) => o.value === product.id)
                            ? [...productOptions, { value: product.id, label: product.name }]
                            : productOptions;
                          const organizar = () => setOrganizing({ slot, plan: planItem, product, dias });

                          return (
                            <div
                              key={slot.id}
                              className={`px-2.5 py-2 bg-[var(--bg-surface)] transition-opacity ${
                                apagado
                                  ? 'opacity-30'
                                  : planItem
                                    ? ''
                                    : 'opacity-45 hover:opacity-100 focus-within:opacity-100'
                              }`}
                            >
                              <div className="flex items-center gap-1.5">
                                <span className="t-caption tnum w-4 shrink-0 text-center">{slot.slotNumber}</span>
                                <PickerField
                                  value={planItem?.productId || ''}
                                  options={opcoes}
                                  placeholder="Espaço vazio"
                                  emptyLabel="Nenhum produto desta vitrine com esse nome"
                                  onPick={(opt) => {
                                    if (!opt.value) {
                                      if (planItem) onRemovePlanItem(planItem.id);
                                      return;
                                    }
                                    const prod = products.find((p) => p.id === opt.value);
                                    const qty = planItem?.idealQty || (prod ? prod.minReplenishmentQty * 2 : 10);
                                    onUpdatePlanItem(slot.id, opt.value, qty, planItem?.priority || DEFAULT_PRIORITY);
                                  }}
                                  className="field field-sm font-semibold flex-1 min-w-0"
                                />
                              </div>

                              {/* A linha de baixo do espaço: a importância e os
                                  dias em texto, e as duas quantidades que se
                                  digitam na própria célula */}
                              <div className="flex items-center justify-between gap-1.5 mt-1.5 min-h-[32px]">
                                {planItem ? (
                                  <>
                                    {/* A letra e a frequência do espaço. A
                                        frequência vem pintada: roxo cheio é o
                                        fixo de todo dia, roxo lavado é o que
                                        entra só em alguns — dá para varrer a
                                        vitrine e ver o que é rotina sem ler */}
                                    <button
                                      type="button"
                                      onClick={organizar}
                                      title={`${prio.title} · ${frequencyTitle(dias)} — clique para mudar`}
                                      className="flex items-center gap-1.5 text-[11px] text-left min-w-0 opacity-90 hover:opacity-100 transition-opacity"
                                    >
                                      <span className="font-bold text-[#6e6e73] shrink-0">{prio.value}</span>
                                      <SeloFrequencia dias={dias} />
                                    </button>

                                    <div className="flex items-center gap-0.5 shrink-0">
                                      <span className="w-11">
                                        <WeeklyQtyCell
                                          value={planItem.idealQty}
                                          title={`${product?.name || 'Item'} · espaço ${slot.slotNumber} — digite a quantidade do dia (0 esvazia o espaço)`}
                                          onCommit={(nova) => {
                                            if (nova <= 0) {
                                              onRemovePlanItem(planItem.id);
                                              return;
                                            }
                                            onUpdatePlanItem(slot.id, planItem.productId, nova, planItem.priority);
                                          }}
                                        />
                                      </span>
                                      <span className="t-nano shrink-0">mín.</span>
                                      <span className="w-11">
                                        <WeeklyQtyCell
                                          value={planItem.minQty || 0}
                                          title={`${product?.name || 'Item'} · espaço ${slot.slotNumber} — digite o mínimo (0 = só quando acabar)`}
                                          onCommit={(nova) => onSetPlanMin(slot.id, nova)}
                                        />
                                      </span>
                                    </div>
                                  </>
                                ) : (
                                  <span className="t-micro">Espaço vazio</span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            <ShowcaseMap
              currentUnit={currentUnit}
              slots={slots}
              products={products}
              standardPlans={standardPlans}
              selectedDay={selectedDay}
              onSelectDay={onSelectDay}
            />

            <WeeklyPlanTable
              currentUnit={currentUnit}
              products={products}
              slots={slots}
              standardPlans={standardPlans}
              selectedDay={selectedDay}
              onSelectDay={onSelectDay}
              onSetWeeklyQty={onSetWeeklyQty}
              onSetWeeklyMin={onSetWeeklyMin}
            />

            {organizing && (
              <PlanOrganizeModal
                slot={organizing.slot}
                product={organizing.product}
                priority={organizing.plan.priority}
                days={organizing.dias}
                idealQty={organizing.plan.idealQty}
                minQty={organizing.plan.minQty}
                onClose={() => setOrganizing(null)}
                onSave={({ priority, days, idealQty, minQty }) =>
                  onUpdatePlanSchedule(organizing.slot.id, organizing.plan.productId, { priority, days, idealQty, minQty })
                }
                onRemove={() => onRemovePlanItem(organizing.plan.id)}
              />
            )}
          </div>
        );
      };

      // ==========================================
      // PRODUCTION ORDER VIEW — a planilha do dia
      //
      // O pedido é uma planilha, não uma pilha de cartões: uma linha por
      // produto do padrão do dia, as contas em colunas (padrão, loja,
      // vencido, falta, mínimo) e uma única coluna que se digita — Produzir.
      // É ela que manda: quantidade acima de zero entra no pedido, zero fica
      // de fora. A conta preenche a coluna com o que ela chamaria; quem está
      // na loja corrige por cima, na célula, e o rodapé fecha a soma.
      //
      // A mesma planilha se lê de dois jeitos: agrupada por vitrine, que é a
      // vitrine do dia seguinte em lista — móvel por móvel, na ordem dos
      // espaços —, ou agrupada por responsável, que é a ordem de quem produz.
      //
      // Teclado: ↑ ↓ andam pela coluna, Enter desce uma linha, Espaço na
      // primeira coluna coloca e tira do pedido, e Tab anda pelas células
      // como em qualquer planilha.
      // ==========================================

      // Célula de quantidade do pedido: número limpo, que vira campo quando a
      // mão chega nele. Enter e sair da célula gravam, Esc desfaz, e as setas
      // andam pela coluna sem tirar a mão do teclado.
      const OrderQtyCell = ({ value, onCommit, onMove, title, cellRef }) => {
        const [texto, setTexto] = useState('');
        const [editando, setEditando] = useState(false);

        useEffect(() => {
          if (!editando) setTexto(value ? String(value) : '');
        }, [value, editando]);

        const gravar = () => {
          setEditando(false);
          const nova = texto.trim() === '' ? 0 : Math.max(0, Math.floor(Number(texto)));
          if (!Number.isFinite(nova)) {
            setTexto(value ? String(value) : '');
            return;
          }
          if (nova !== (value || 0)) onCommit(nova);
        };

        return (
          <input
            ref={cellRef}
            type="text"
            inputMode="numeric"
            value={editando ? texto : (value ? String(value) : '')}
            title={title}
            placeholder="—"
            onFocus={(e) => { setEditando(true); setTexto(value ? String(value) : ''); e.target.select(); }}
            onChange={(e) => setTexto(e.target.value.replace(/[^0-9]/g, ''))}
            onBlur={gravar}
            onKeyDown={(e) => {
              if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); gravar(); onMove(1); }
              else if (e.key === 'ArrowUp') { e.preventDefault(); gravar(); onMove(-1); }
              else if (e.key === 'Escape') { setTexto(value ? String(value) : ''); setEditando(false); e.currentTarget.blur(); }
            }}
            className={`sheet-input ${value ? 'font-bold text-[#1d1d1f]' : 'ink-muted'}`}
          />
        );
      };

      // A largura de cada coluna da planilha. Ela é fixa para as tabelas de
      // todos os blocos ficarem alinhadas entre si: sem isso, cada vitrine
      // media as colunas pelo próprio conteúdo e a leitura de cima para baixo
      // se perdia. A última fica com a sobra.
      const SHEET_COLS = ['34px', '220px', '34px', '96px', '108px', '64px', '64px', '58px', '58px', '54px', '88px', '46px', '126px', 'auto'];

      const SheetCols = () => (
        <colgroup>
          {SHEET_COLS.map((largura, i) => <col key={i} style={{ width: largura }} />)}
        </colgroup>
      );

      // Reparte a quantidade digitada entre os espaços que o padrão reservou
      // para o produto, na mesma proporção do padrão. O que sobra da divisão
      // vai para o último espaço, para a soma bater exatamente com o pedido.
      const spreadOrderQty = (total, targets) => {
        if (total <= 0 || targets.length === 0) return [];
        if (targets.length === 1) return [{ ...targets[0], qty: total }];

        const base = targets.reduce((acc, t) => acc + t.qty, 0);
        let resto = total;

        return targets
          .map((alvo, i) => {
            if (i === targets.length - 1) return { ...alvo, qty: Math.max(0, resto) };
            const parte = base > 0 ? Math.round(total * (alvo.qty / base)) : Math.floor(total / targets.length);
            const qty = Math.max(0, Math.min(parte, resto));
            resto -= qty;
            return { ...alvo, qty };
          })
          .filter((alvo) => alvo.qty > 0);
      };

      const ProductionOrderView = ({
        currentUnit,
        unitName,
        slots,
        slotItems,
        products,
        standardPlans,
        selectedDay,
        onSelectDay,
        onApplyProductionToShowcase
      }) => {
        // O que a loja digitou na coluna Produzir, produto por produto. Quem
        // não está aqui usa o que a conta sugere.
        const [quantidades, setQuantidades] = useState({});
        const [agrupar, setAgrupar] = useState('vitrine');
        const [mostrar, setMostrar] = useState('tudo');
        const [frequencia, setFrequencia] = useState('todas');
        const [copiado, setCopiado] = useState('');

        // Os campos da coluna Produzir, na ordem da tela — é por eles que as
        // setas e o Enter andam
        const celulas = useRef([]);

        // Outro dia (ou outra unidade) é outro pedido: a planilha recomeça no
        // que a conta sugere, senão o que foi digitado na terça vazava para
        // a quarta
        useEffect(() => { setQuantidades({}); }, [selectedDay, currentUnit]);

        const hoje = getTodayDayOfWeek();
        const amanha = nextWeekDay(hoje);

        const dayPlans = useMemo(
          () => standardPlans.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay),
          [standardPlans, currentUnit, selectedDay]
        );

        const slotById = useMemo(() => {
          const map = {};
          slots.forEach((s) => { map[s.id] = s; });
          return map;
        }, [slots]);

        // Quanto de cada produto já existe na loja, somando TODAS as vitrines e
        // todos os espaços da unidade. A conta já olhou só para o espaço
        // planejado, depois só para a vitrine planejada — e nos dois casos o
        // pedido mandava produzir empada com empada na loja, só porque ela
        // estava no espaço do lado ou na outra vitrine. Aqui o que vale é o
        // que existe: se tem na loja, não se pede de novo.
        //
        // O que está vencido não entra na conta: ele vai sair da vitrine, então
        // precisa ser refeito. O que está no último dia conta como estoque, mas
        // fica marcado na linha para a loja decidir se adianta a produção.
        const stockByProduct = useMemo(() => {
          const map = {};
          slotItems.forEach((item) => {
            const slot = slotById[item.slotId];
            if (!slot || slot.unit !== currentUnit) return;
            const product = products.find((p) => p.id === item.productId);
            const status = getSlotItemStatus(item, product).status;
            const atual = map[item.productId] || { good: 0, expired: 0, lastDay: 0 };

            if (status === 'expired') atual.expired += item.currentQty;
            else {
              atual.good += item.currentQty;
              if (status === 'warning') atual.lastDay += item.currentQty;
            }
            map[item.productId] = atual;
          });
          return map;
        }, [slotItems, slotById, products, currentUnit]);

        // Estoque bom em um espaço só — usado para espalhar a produção
        const qtyInSlot = (slotId, productId) =>
          slotItems
            .filter((item) => {
              if (item.slotId !== slotId || item.productId !== productId) return false;
              const product = products.find((p) => p.id === item.productId);
              return getSlotItemStatus(item, product).status !== 'expired';
            })
            .reduce((acc, item) => acc + item.currentQty, 0);

        // Uma linha por produto, juntando todos os espaços — de todas as
        // vitrines — que o padrão do dia reservou para ele. Antes havia uma
        // linha por vitrine, e o mesmo produto era cobrado duas vezes.
        const orderList = useMemo(() => {
          const grupos = [];
          const porProduto = {};

          dayPlans.forEach((plan) => {
            const slot = slotById[plan.slotId];
            if (!slot || slot.unit !== currentUnit) return;

            if (!porProduto[plan.productId]) {
              porProduto[plan.productId] = {
                key: plan.productId,
                productId: plan.productId,
                unitOfMeasure: plan.unitOfMeasure,
                plans: []
              };
              grupos.push(porProduto[plan.productId]);
            }
            porProduto[plan.productId].plans.push({
              slot, idealQty: plan.idealQty, minQty: plan.minQty || 0, priority: plan.priority
            });
          });

          return grupos.map((grupo) => {
            const product = products.find((p) => p.id === grupo.productId);
            const idealQty = grupo.plans.reduce((acc, p) => acc + p.idealQty, 0);
            const estoque = stockByProduct[grupo.productId] || { good: 0, expired: 0, lastDay: 0 };
            const currentQty = estoque.good;
            const neededQty = Math.max(0, idealQty - currentQty);

            // Quando o mesmo produto ocupa espaços com letras diferentes,
            // vale a mais urgente
            const priority = grupo.plans
              .map((p) => getPriority(p.priority).value)
              .sort((a, b) => priorityRank(a) - priorityRank(b))[0] || DEFAULT_PRIORITY;

            // Sugestão da conta: o item é chamado quando o estoque bom da loja
            // fica igual ou abaixo da quantidade mínima que a vitrine padrão
            // guarda para este produto NESTE dia, ou quando tem peça vencida
            // para repor. Mínimo zero é "só quando acabar". É só o
            // preenchimento inicial da coluna Produzir — a última palavra é a
            // que for digitada na célula.
            const minQty = planMinQty(grupo.plans);
            const belowMin = currentQty <= minQty;
            const suggested = neededQty > 0 && (belowMin || estoque.expired > 0);

            // A quantidade sugerida é a do padrão do dia — a fornada inteira,
            // nunca a diferença: quem faz empada faz a fornada de empada, não
            // "mais 1" para completar bandeja.
            const suggestedQty = suggested ? idealQty : 0;

            // Os espaços que o padrão reservou, na ordem da vitrine. A
            // quantidade digitada é repartida entre eles nesta proporção.
            const ordenados = grupo.plans
              .slice()
              .sort((a, b) => compareShowcase(a.slot, b.slot) || a.slot.slotNumber - b.slot.slotNumber);

            const targets = ordenados
              .map((p) => ({ slotId: p.slot.id, slotNumber: p.slot.slotNumber, qty: p.idealQty }))
              .filter((alvo) => alvo.qty > 0);

            // Onde este produto mora hoje: "Vitrine Salgada 1 #3, #5 ·
            // Vitrine Salgada 2 #1" — o padrão pode espalhar o mesmo item
            // por mais de um móvel
            const locais = [];
            const porVitrine = {};
            ordenados.forEach((p) => {
              const chave = showcaseKey(p.slot);
              if (!porVitrine[chave]) {
                porVitrine[chave] = { title: p.slot.sectionTitle, espacos: [] };
                locais.push(porVitrine[chave]);
              }
              porVitrine[chave].espacos.push(p.slot.slotNumber);
            });
            const localLabel = locais.map((l) => `${l.title} #${l.espacos.join(', #')}`).join(' · ');
            const espacosLabel = locais.map((l) => `#${l.espacos.join(', #')}`).join(' · ');

            // Em que móvel a linha entra quando a planilha é lida na ordem da
            // vitrine: o primeiro espaço reservado para o produto
            const primeiro = ordenados[0].slot;

            // Em quantos dias da semana este produto entra no padrão da
            // unidade, juntando todos os espaços dele. É o que separa o item
            // de todo dia — que a cozinha faz sempre — do que aparece só em
            // um dia ou outro.
            const diasDaSemana = WEEK_DAYS.filter((day) =>
              standardPlans.some(
                (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.productId === grupo.productId
              )
            );

            // Estoque bom que está na loja, mas fora dos espaços que o padrão
            // reservou — é o que segurava o pedido sem aparecer em lugar
            // nenhum, então a planilha avisa quanto é
            const noPlano = ordenados.reduce((acc, p) => acc + qtyInSlot(p.slot.id, grupo.productId), 0);
            const foraDoPlano = Math.max(0, currentQty - noPlano);

            return {
              key: grupo.key,
              localLabel,
              espacosLabel,
              showcaseTitle: primeiro.sectionTitle,
              showcaseSort: primeiro,
              diasDaSemana,
              freqLabel: frequencyLabel(diasDaSemana),
              freqTitle: frequencyTitle(diasDaSemana),
              todoDia: diasDaSemana.length >= WEEK_DAYS.length,
              foraDoPlano,
              productId: grupo.productId,
              productName: product?.name || 'Produto',
              responsible: getResponsibleName(product),
              priority,
              idealQty,
              currentQty,
              expiredQty: estoque.expired,
              lastDayQty: estoque.lastDay,
              minQty,
              belowMin,
              suggested,
              suggestedQty,
              neededQty,
              targets,
              unitOfMeasure: grupo.unitOfMeasure
            };
          });
        }, [dayPlans, standardPlans, slotById, slotItems, products, stockByProduct, currentUnit]);

        // A planilha: a conta de cada produto com a quantidade que vale agora
        // — a digitada, se houver, senão a sugerida
        const rows = useMemo(
          () => orderList.map((item) => {
            const orderQty = quantidades[item.key] === undefined ? item.suggestedQty : quantidades[item.key];
            const situacao = orderQty > 0
              ? (item.suggested ? 'Chamado' : 'Escolhido')
              : item.suggested
                ? 'Tirado do pedido'
                : item.neededQty > 0
                  ? 'Acima do mínimo'
                  : 'Abastecido';
            return { ...item, orderQty, noPedido: orderQty > 0, situacao };
          }),
          [orderList, quantidades]
        );

        const definirQtd = (key, qtd) =>
          setQuantidades((prev) => ({ ...prev, [key]: Math.max(0, Math.floor(qtd) || 0) }));

        // A caixinha da primeira coluna é um atalho da célula: liga com a
        // quantidade do padrão do dia, desliga zerando
        const alternar = (row) =>
