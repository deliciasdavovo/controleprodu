          () => visiveis.reduce((acc, l) => acc + (editandoMinimo ? l.totalMinimo : l.total), 0),
          [visiveis, editandoMinimo]
        );

        const formatarMedia = (valor) =>
          (Math.round(valor * 10) / 10).toString().replace('.', ',');

        // Sai com tabulação: cola direto no Excel ou no Google Planilhas. Vai a
        // grade que está na tela — padrão ou mínimo —, dita já na primeira
        // coluna para a planilha colada não virar número sem nome
        const handleCopy = async () => {
          const linhasTexto = [
            [campoAtual.columnLabel, 'Prioridade', 'Frequência', ...WEEK_DAYS.map(getDayShortBR), 'Total semana'].join('\t'),
            ...visiveis.map((l) =>
              [
                l.nome, l.prioridade, l.freqLabel,
                ...WEEK_DAYS.map((d) => valorDoDia(l, d)),
                editandoMinimo ? l.totalMinimo : l.total
              ].join('\t')
            ),
            ['Total', '', '', ...WEEK_DAYS.map((d) => totalPorDia[d]), totalSemana].join('\t')
          ];

          const ok = await copyTextToClipboard(linhasTexto.join('\n'));
          if (ok) {
            setCopiado(true);
            setTimeout(() => setCopiado(false), 2000);
          }
        };

        return (
          <div className="card p-4 sm:p-5">
            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="t-overline flex items-center gap-1.5 mb-1.5">
                  <Icons.ClipboardList className="w-3.5 h-3.5" />
                  {campoAtual.title}
                </div>
                <h3 className="t-title text-[#1d1d1f]">{campoAtual.heading}</h3>
                <p className="t-caption mt-1">
                  {linhas.length} produtos no padrão · {WEEK_DAYS.reduce((acc, d) => acc + (totalPorDia[d] || 0), 0)} un na semana
                </p>
                <p className="t-caption mt-0.5">
                  {campoAtual.hint}
                </p>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {aberto && (
                  <button onClick={handleCopy} className="btn btn-secondary btn-sm">
                    <Icons.Copy className="w-3.5 h-3.5" />
                    {copiado ? 'Copiado!' : 'Copiar tabela'}
                  </button>
                )}
                <button onClick={() => setAberto(!aberto)} className="btn btn-secondary btn-sm">
                  {aberto ? 'Esconder' : 'Mostrar'}
                </button>
              </div>
            </div>

            {aberto && (
              <>
                <div className="flex flex-col sm:flex-row sm:flex-wrap sm:items-center gap-2 mt-4">
                  <div className="relative flex-1 min-w-[180px] max-w-xs">
                    <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[11px]" />
                    <input
                      type="text"
                      placeholder="Pesquisar produto…"
                      value={busca}
                      onChange={(e) => setBusca(e.target.value)}
                      className="field field-sm field-search"
                    />
                  </div>
                  {/* O que a grade edita. São duas quantidades por item e por
                      dia — quanto a vitrine deve ter e em que ponto o pedido
                      chama o item — e cada uma tem a sua leitura da semana */}
                  <div className="flex items-center gap-2">
                    <span className="t-caption">Editando</span>
                    <div className="segmented">
                      {WEEK_FIELDS.map((f) => (
                        <button
                          key={f.value}
                          onClick={() => setCampo(f.value)}
                          data-active={campo === f.value}
                          title={f.hint}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="t-caption">Ordenar</span>
                    <div className="segmented">
                      <button onClick={() => setOrdem('total')} data-active={ordem === 'total'}>
                        Maior total
                      </button>
                      <button onClick={() => setOrdem('importancia')} data-active={ordem === 'importancia'}
                              title="A letra primeiro e, dentro dela, quem entra em mais dias">
                        Importância
                      </button>
                      <button onClick={() => setOrdem('frequencia')} data-active={ordem === 'frequencia'}
                              title="Quem entra em mais dias da semana primeiro">
                        Frequência
                      </button>
                      <button onClick={() => setOrdem('nome')} data-active={ordem === 'nome'}>
                        A-Z
                      </button>
                    </div>
                  </div>
                </div>

                {visiveis.length === 0 ? (
                  <p className="t-body text-center py-10">
                    {linhas.length === 0
                      ? 'Nenhum item no padrão ainda — monte a vitrine de um dia para a semana aparecer aqui.'
                      : 'Nenhum produto com esse nome.'}
                  </p>
                ) : (
                  <div className="mt-3 overflow-x-auto">
                    <table className="week-table">
                      <thead>
                        <tr>
                          <th
                            data-sticky="true"
                            className="sticky left-0 z-10 text-left t-overline font-bold px-2.5 py-2 border-b border-r hairline w-[136px] sm:w-[240px]"
                            style={{ background: 'var(--bg-surface)' }}
                          >
                            Produto
                          </th>
                          <th className="text-center t-overline font-bold px-1.5 py-2 border-b border-r hairline"
                              title="A–D: a importância do item, para ordenar e filtrar a lista">
                            P
                          </th>
                          <th className="text-left t-overline font-bold px-2.5 py-2 border-b border-r hairline whitespace-nowrap"
                              title="Em quantos dias da semana o item entra no padrão">
                            Freq.
                          </th>
                          {WEEK_DAYS.map((day) => (
                            <th
                              key={day}
                              data-hoje={selectedDay === day}
                              className="px-1 pb-2 border-b hairline"
                            >
                              <button
                                onClick={() => onSelectDay(day)}
                                title={`Editar a vitrine de ${getDayNameBR(day)}`}
                                className={`w-full min-w-11 rounded-lg px-2 py-1.5 text-[12px] font-bold transition-colors ${
                                  selectedDay === day
                                    ? 'text-[#0071e3]'
                                    : 'text-[#86868b] hover:text-[#1d1d1f] hover:bg-black/[0.04]'
                                }`}
                              >
                                {getDayShortBR(day)}
                              </button>
                            </th>
                          ))}
                          <th className="text-right t-overline font-bold px-2.5 py-2 border-b hairline whitespace-nowrap">
                            Total
                          </th>
                        </tr>
                      </thead>

                      <tbody>
                        {visiveis.map((linha) => (
                          <tr key={linha.id} className="border-b hairline">
                            <td
                              data-sticky="true"
                              className="sticky left-0 z-10 px-2.5 py-1.5 border-r hairline w-[136px] sm:w-[240px] max-w-[136px] sm:max-w-[240px]"
                              style={{ background: 'var(--bg-surface)' }}
                            >
                              <p className="font-semibold text-[#1d1d1f] truncate" title={linha.nome}>
                                {linha.nome}
                              </p>
                              {linha.vitrines.length > 0 && (
                                <p className="t-caption text-[11px] truncate">{linha.vitrines.join(' · ')}</p>
                              )}
                            </td>

                            {/* A importância e a frequência coladas no nome:
                                a letra diz o peso do item, a frequência diz se
                                ele é rotina de todo dia ou só de alguns */}
                            <td className="text-center px-1.5 py-1.5 border-r hairline font-bold text-[#6e6e73]"
                                title={getPriority(linha.prioridade).title}>
                              {linha.prioridade}
                            </td>
                            <td
                              className={`px-2.5 py-1.5 border-r hairline whitespace-nowrap text-[12px] ${
                                linha.todoDia ? 'text-[#1d1d1f] font-semibold' : 'text-[#86868b]'
                              }`}
                              title={`${linha.nome} entra em: ${linha.freqTitle}`}
                            >
                              {linha.freqLabel}
                            </td>

                            {WEEK_DAYS.map((day) => {
                              const valor = valorDoDia(linha, day);
                              const espacos = linha.espacos[day] || 0;
                              const noDia = (linha.dias[day] || 0) > 0 || espacos > 0;

                              // Mínimo de um dia em que o item não entra não
                              // existe: a célula fica apagada em vez de abrir
                              // um campo que não teria onde gravar
                              if (editandoMinimo && !noDia) {
                                return (
                                  <td
                                    key={day}
                                    data-hoje={selectedDay === day}
                                    className="px-1 py-1 text-center text-[#d2d2d7]"
                                    title={`${linha.nome} não entra em ${getDayNameBR(day)} — coloque no padrão do dia primeiro`}
                                  >
                                    ·
                                  </td>
                                );
                              }

                              return (
                                <td
                                  key={day}
                                  data-hoje={selectedDay === day}
                                  className="px-1 py-1"
                                >
                                  <WeeklyQtyCell
                                    value={valor}
                                    title={
                                      espacos > 1
                                        ? `${linha.nome} · ${getDayNameBR(day)} — ${espacos} espaços; o número é repartido entre eles`
                                        : `${linha.nome} · ${getDayNameBR(day)} — ${campoAtual.cellHint}`
                                    }
                                    onCommit={(nova) => (editandoMinimo
                                      ? onSetWeeklyMin(day, linha.id, nova)
                                      : onSetWeeklyQty(day, linha.id, nova))}
                                  />
                                </td>
                              );
                            })}

                            <td className="text-right px-2.5 py-1.5 whitespace-nowrap">
                              <span className="tnum font-extrabold text-[#1d1d1f]">
                                {editandoMinimo ? linha.totalMinimo : linha.total}
                              </span>
                              {linha.diasAtivos > 1 && (
                                <span className="t-caption tnum text-[11px] block">
                                  {formatarMedia(editandoMinimo ? linha.mediaMinimo : linha.media)}/dia
                                </span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>

                      <tfoot>
                        <tr>
                          <td
                            data-sticky="true"
                            className="sticky left-0 z-10 px-2.5 py-2 t-overline font-bold border-r hairline"
                            style={{ background: 'var(--bg-surface)' }}
                          >
                            Total do dia
                          </td>
                          <td className="border-r hairline" />
                          <td className="border-r hairline" />
                          {WEEK_DAYS.map((day) => (
                            <td
                              key={day}
                              data-hoje={selectedDay === day}
                              className={`text-center tnum font-extrabold px-1 py-2 ${
                                selectedDay === day ? 'text-[#0071e3]' : 'text-[#1d1d1f]'
                              }`}
                            >
                              {totalPorDia[day] || 0}
                            </td>
                          ))}
                          <td className="text-right tnum font-extrabold px-2.5 py-2 text-[#1d1d1f]">
                            {totalSemana}
                          </td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                )}
              </>
            )}
          </div>
        );
      };

      // ==========================================
      // STANDARD SHOWCASE VIEW (Vitrine Padrão)
      //
      // Uma grade por vitrine, uma embaixo da outra, no desenho do móvel de
      // verdade: as colunas de produto daquela vitrine (SHOWCASE_COLUMNS) e as
      // fileiras que o tamanho dela pedir. Quem monta a vitrine na loja olha
      // para a tela e vê a mesma coisa que vai ver no balcão.
      //
      // Nada de cartão em volta de cada espaço: o que separa um do outro é o
      // fio fino da grade. O espaço vazio fica apagado, e as duas quantidades
      // — o padrão do dia e o mínimo — se digitam na própria célula.
      // ==========================================
      const StandardShowcaseView = ({
        currentUnit,
        unitName,
        slots,
        products,
        standardPlans,
        selectedDay,
        onSelectDay,
        onUpdatePlanItem,
        onRemovePlanItem,
        onUpdatePlanSchedule,
        onSetPlanMin,
        onSetWeeklyQty,
        onSetWeeklyMin,
        onCopyDayPlan,
        onClearDayPlan,
        onGenerateProductionOrder
      }) => {
        const [targetCopyDay, setTargetCopyDay] = useState('terca');
        const [priorityFilter, setPriorityFilter] = useState('todas');
        const [organizing, setOrganizing] = useState(null);

        const unitSlots = slots.filter((s) => s.unit === currentUnit);
        const dayPlans = standardPlans.filter(
          (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay
        );

        const planOf = (slotId) => dayPlans.find((sp) => sp.slotId === slotId);
        const productOf = (productId) => products.find((p) => p.id === productId);

        // Uma coluna por vitrine de verdade (Salgada 1, Salgada 2, Doce…)
        const showcases = useMemo(() => {
          const colunas = [];
          const porChave = {};

          unitSlots.forEach((slot) => {
            const chave = showcaseKey(slot);
            if (!porChave[chave]) {
              porChave[chave] = {
                key: chave,
                title: slot.sectionTitle,
                showcaseType: slot.showcaseType,
                shelfNumber: slot.shelfNumber,
                slots: []
              };
              colunas.push(porChave[chave]);
            }
            porChave[chave].slots.push(slot);
          });

          colunas.forEach((c) => c.slots.sort((a, b) => a.slotNumber - b.slotNumber));
          return colunas.sort(compareShowcase);
        }, [unitSlots]);

        const handleCopy = () => {
          if (selectedDay === targetCopyDay) {
            alert('Selecione um dia de destino diferente do atual.');
            return;
          }
          onCopyDayPlan(selectedDay, targetCopyDay);
          alert(`Padrão de ${getDayNameBR(selectedDay)} copiado para ${getDayNameBR(targetCopyDay)}!`);
        };

        const handleClear = () => {
          if (confirm(`Limpar todo o padrão de ${getDayNameBR(selectedDay)}?`)) {
            onClearDayPlan(selectedDay);
          }
        };

        // Quantos itens do dia tem em cada prioridade — vira o filtro do topo
        const countByPriority = useMemo(() => {
          const contas = {};
          PRIORITIES.forEach((p) => { contas[p.value] = 0; });
          dayPlans.forEach((sp) => { contas[getPriority(sp.priority).value] += 1; });
          return contas;
        }, [dayPlans]);

        const matchesFilter = (plan) =>
          priorityFilter === 'todas' || (plan && getPriority(plan.priority).value === priorityFilter);

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                  <div className="t-overline flex items-center gap-1.5 mb-2">
                    <Icons.Calendar className="w-3.5 h-3.5" />
                    Planejamento semanal
                  </div>
                  <h2 className="t-display">Vitrine padrão</h2>
                  <p className="t-body mt-1.5 max-w-lg">
                    Defina como a vitrine deve ser montada em cada dia — {unitName}.
                    Cada item tem dois números por dia: a quantidade do padrão e a
                    quantidade mínima, que é a que chama o item no pedido de produção.
                    Os dois se digitam na célula — na grade de cada vitrine, espaço
                    por espaço, ou na tabela da semana, aqui embaixo.
                  </p>
                </div>

                <button onClick={onGenerateProductionOrder} className="btn btn-primary btn-md shrink-0">
                  <Icons.ChefHat className="w-4 h-4" />
                  Gerar pedido de produção
                </button>
              </div>

              {/* Os dias em um segmented control: um bloco só, o dia aberto
                  aparece na pastilha branca — o mesmo gesto do iOS */}
              <div className="mt-6 overflow-x-auto pb-1 scrollbar-none">
                <div className="segmented w-full min-w-max">
                  {WEEK_DAYS.map((day) => {
                    const count = standardPlans.filter(
                      (sp) => sp.unit === currentUnit && sp.dayOfWeek === day
                    ).length;

                    return (
                      <button
                        key={day}
                        onClick={() => onSelectDay(day)}
                        data-active={selectedDay === day}
                        title={`${getDayNameBR(day)} · ${count} ${count === 1 ? 'item' : 'itens'}`}
                        className="flex-1 flex items-center justify-center gap-1.5"
                      >
                        <span>{getDayNameBR(day)}</span>
                        <span className={`tnum text-[11px] font-bold ${
                          selectedDay === day ? 'text-[#0071e3]' : 'text-[#86868b]'
                        }`}>
                          {count}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="card-flat p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="t-callout mr-0.5" title={
                  priorityFilter === 'todas'
                    ? 'A prioridade organiza a lista — quem decide o pedido é a quantidade mínima'
                    : getPriority(priorityFilter).hint
                }>
                  Prioridade
                </span>
                <div className="segmented">
                  <button
                    onClick={() => setPriorityFilter('todas')}
                    data-active={priorityFilter === 'todas'}
                    title="Mostrar todos os itens do dia"
                  >
                    Todas
                  </button>
                  {PRIORITIES.map((p) => (
                    <button
                      key={p.value}
                      onClick={() => setPriorityFilter(priorityFilter === p.value ? 'todas' : p.value)}
                      data-active={priorityFilter === p.value}
                      title={`${p.title} — ${p.hint}`}
                      className="flex items-center gap-1.5"
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${p.dot}`} />
                      {p.value}
                      <span className="tnum opacity-60">{countByPriority[p.value]}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <span className="t-callout flex items-center gap-1.5">
                  <Icons.Copy className="w-4 h-4 text-[#6e6e73]" />
                  Copiar <strong className="text-[#1d1d1f] font-bold">{getDayNameBR(selectedDay)}</strong> para
                </span>
                <select
                  value={targetCopyDay}
                  onChange={(e) => setTargetCopyDay(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  {WEEK_DAYS.map((d) => (
                    <option key={d} value={d}>{getDayNameBR(d)}</option>
                  ))}
                </select>
                <button onClick={handleCopy} className="btn btn-secondary btn-sm">
                  Copiar
                </button>
                <button onClick={handleClear} className="btn btn-danger-quiet btn-sm">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Limpar padrão
                </button>
              </div>
            </div>

            {/* Cada vitrine no desenho dela: os espaços em colunas de produto,
                na ordem em que estão no móvel da loja, com o número de colunas
                que aquela vitrine tem de verdade. Espaço vazio fica apagado,
                para o olho cair primeiro no que já está montado. */}
            <div className="space-y-4">
              {showcases.map((vitrine) => {
                const planejados = vitrine.slots.filter((s) => planOf(s.id));
                const total = planejados.reduce((acc, s) => acc + (planOf(s.id)?.idealQty || 0), 0);
                const totalMinimo = planejados.reduce((acc, s) => acc + (planOf(s.id)?.minQty || 0), 0);
                const colunas = showcaseColumnsFor(currentUnit, vitrine.showcaseType);
                // O espaço da vitrine salgada só oferece produto salgado
                const productOptions = [
                  { value: '', label: 'Espaço vazio', muted: true },
                  ...productsForShowcaseType(products, vitrine.showcaseType).map((p) => ({ value: p.id, label: p.name }))
                ];

                return (
                  <div key={vitrine.key} className="card p-4 sm:p-5">
                    <div className="flex items-start justify-between gap-3 pb-3">
                      <div className="min-w-0">
                        <h3 className="t-headline text-[#1d1d1f] truncate">{vitrine.title}</h3>
                        <p className="t-caption tnum mt-0.5">
                          {planejados.length}/{vitrine.slots.length} espaços cheios
                          {totalMinimo > 0 && ` · mín. ${totalMinimo} un`}
                        </p>
                      </div>
                      <div className="text-right shrink-0">
                        <p className="tnum text-[19px] font-extrabold text-[#1d1d1f] leading-none">{total}</p>
                        <p className="t-caption text-[11px] mt-0.5">un no dia</p>
                      </div>
                    </div>

                    {/* A grade é o móvel: o fio fino entre os espaços faz o
                        desenho da vitrine, sem cartão em volta de cada um */}
                    <div className="overflow-x-auto">
                      <div
                        className="grid gap-px bg-[var(--hairline)] border hairline rounded-xl overflow-hidden"
                        style={{
                          gridTemplateColumns: `repeat(${colunas}, minmax(0, 1fr))`,
                          minWidth: `${colunas * 190}px`
                        }}
                      >
                        {vitrine.slots.map((slot) => {
                          const planItem = planOf(slot.id);
                          const product = planItem ? productOf(planItem.productId) : null;
                          const dias = planItem
                            ? planDaysOf(standardPlans, currentUnit, slot.id, planItem.productId)
                            : [];
                          const prio = getPriority(planItem?.priority);
                          const apagado = planItem && !matchesFilter(planItem);
                          // Produto de outra categoria que já estava aqui continua
                          // aparecendo, senão o campo ficaria em branco com o
                          // espaço ocupado
                          const opcoes = product && !productOptions.some((o) => o.value === product.id)
                            ? [...productOptions, { value: product.id, label: product.name }]
                            : productOptions;
                          const organizar = () => setOrganizing({ slot, plan: planItem, product, dias });

                          return (
                            <div
                              key={slot.id}
                              className={`px-2.5 py-2 bg-[var(--bg-surface)] transition-opacity ${
                                apagado
                                  ? 'opacity-30'
                                  : planItem
                                    ? ''
                                    : 'opacity-45 hover:opacity-100 focus-within:opacity-100'
                              }`}
                            >
                              <div className="flex items-center gap-1.5">
                                <span className="t-caption tnum w-4 shrink-0 text-center">{slot.slotNumber}</span>
                                <PickerField
                                  value={planItem?.productId || ''}
                                  options={opcoes}
                                  placeholder="Espaço vazio"
                                  emptyLabel="Nenhum produto desta vitrine com esse nome"
                                  onPick={(opt) => {
                                    if (!opt.value) {
                                      if (planItem) onRemovePlanItem(planItem.id);
                                      return;
                                    }
                                    const prod = products.find((p) => p.id === opt.value);
                                    const qty = planItem?.idealQty || (prod ? prod.minReplenishmentQty * 2 : 10);
                                    onUpdatePlanItem(slot.id, opt.value, qty, planItem?.priority || DEFAULT_PRIORITY);
                                  }}
                                  className="field field-sm font-semibold flex-1 min-w-0"
                                />
                              </div>

                              {/* A linha de baixo do espaço: a importância e os
                                  dias em texto, e as duas quantidades que se
                                  digitam na própria célula */}
                              <div className="flex items-center justify-between gap-1.5 mt-1.5 min-h-[32px]">
                                {planItem ? (
                                  <>
                                    <button
                                      type="button"
                                      onClick={organizar}
                                      title={`${prio.title} · ${frequencyTitle(dias)} — clique para mudar`}
                                      className="text-[11px] text-left truncate min-w-0 text-[#86868b] hover:text-[#1d1d1f] transition-colors"
                                    >
                                      <span className="font-bold text-[#6e6e73]">{prio.value}</span>
                                      {' · '}
                                      {frequencyLabel(dias)}
                                    </button>

                                    <div className="flex items-center gap-0.5 shrink-0">
                                      <span className="w-11">
                                        <WeeklyQtyCell
                                          value={planItem.idealQty}
                                          title={`${product?.name || 'Item'} · espaço ${slot.slotNumber} — digite a quantidade do dia (0 esvazia o espaço)`}
                                          onCommit={(nova) => {
                                            if (nova <= 0) {
                                              onRemovePlanItem(planItem.id);
                                              return;
                                            }
                                            onUpdatePlanItem(slot.id, planItem.productId, nova, planItem.priority);
                                          }}
                                        />
                                      </span>
                                      <span className="t-caption text-[10px] shrink-0">mín.</span>
                                      <span className="w-11">
                                        <WeeklyQtyCell
                                          value={planItem.minQty || 0}
                                          title={`${product?.name || 'Item'} · espaço ${slot.slotNumber} — digite o mínimo (0 = só quando acabar)`}
                                          onCommit={(nova) => onSetPlanMin(slot.id, nova)}
                                        />
                                      </span>
                                    </div>
                                  </>
                                ) : (
                                  <span className="t-caption text-[11px]">Espaço vazio</span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            <WeeklyPlanTable
              currentUnit={currentUnit}
              products={products}
              slots={slots}
              standardPlans={standardPlans}
              selectedDay={selectedDay}
              onSelectDay={onSelectDay}
              onSetWeeklyQty={onSetWeeklyQty}
              onSetWeeklyMin={onSetWeeklyMin}
            />

            {organizing && (
              <PlanOrganizeModal
                slot={organizing.slot}
                product={organizing.product}
                priority={organizing.plan.priority}
                days={organizing.dias}
                idealQty={organizing.plan.idealQty}
                minQty={organizing.plan.minQty}
                onClose={() => setOrganizing(null)}
                onSave={({ priority, days, idealQty, minQty }) =>
                  onUpdatePlanSchedule(organizing.slot.id, organizing.plan.productId, { priority, days, idealQty, minQty })
                }
                onRemove={() => onRemovePlanItem(organizing.plan.id)}
              />
            )}
          </div>
        );
      };

      // ==========================================
      // PRODUCTION ORDER VIEW — a planilha do dia
      //
      // O pedido é uma planilha, não uma pilha de cartões: uma linha por
      // produto do padrão do dia, as contas em colunas (padrão, loja,
      // vencido, falta, mínimo) e uma única coluna que se digita — Produzir.
      // É ela que manda: quantidade acima de zero entra no pedido, zero fica
      // de fora. A conta preenche a coluna com o que ela chamaria; quem está
      // na loja corrige por cima, na célula, e o rodapé fecha a soma.
      //
      // A mesma planilha se lê de dois jeitos: agrupada por vitrine, que é a
      // vitrine do dia seguinte em lista — móvel por móvel, na ordem dos
      // espaços —, ou agrupada por responsável, que é a ordem de quem produz.
      //
      // Teclado: ↑ ↓ andam pela coluna, Enter desce uma linha, Espaço na
      // primeira coluna coloca e tira do pedido, e Tab anda pelas células
      // como em qualquer planilha.
      // ==========================================

      // Célula de quantidade do pedido: número limpo, que vira campo quando a
      // mão chega nele. Enter e sair da célula gravam, Esc desfaz, e as setas
      // andam pela coluna sem tirar a mão do teclado.
      const OrderQtyCell = ({ value, onCommit, onMove, title, cellRef }) => {
        const [texto, setTexto] = useState('');
        const [editando, setEditando] = useState(false);

        useEffect(() => {
          if (!editando) setTexto(value ? String(value) : '');
        }, [value, editando]);

        const gravar = () => {
          setEditando(false);
          const nova = texto.trim() === '' ? 0 : Math.max(0, Math.floor(Number(texto)));
          if (!Number.isFinite(nova)) {
            setTexto(value ? String(value) : '');
            return;
          }
          if (nova !== (value || 0)) onCommit(nova);
        };

        return (
          <input
            ref={cellRef}
            type="text"
            inputMode="numeric"
            value={editando ? texto : (value ? String(value) : '')}
            title={title}
            placeholder="—"
            onFocus={(e) => { setEditando(true); setTexto(value ? String(value) : ''); e.target.select(); }}
            onChange={(e) => setTexto(e.target.value.replace(/[^0-9]/g, ''))}
            onBlur={gravar}
            onKeyDown={(e) => {
              if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); gravar(); onMove(1); }
              else if (e.key === 'ArrowUp') { e.preventDefault(); gravar(); onMove(-1); }
              else if (e.key === 'Escape') { setTexto(value ? String(value) : ''); setEditando(false); e.currentTarget.blur(); }
            }}
            className={`sheet-input ${value ? 'font-bold text-[#1d1d1f]' : 'text-[#c7c7cc]'}`}
          />
        );
      };

      // A largura de cada coluna da planilha. Ela é fixa para as tabelas de
      // todos os blocos ficarem alinhadas entre si: sem isso, cada vitrine
      // media as colunas pelo próprio conteúdo e a leitura de cima para baixo
      // se perdia. A última fica com a sobra.
      const SHEET_COLS = ['34px', '220px', '34px', '96px', '108px', '64px', '64px', '58px', '58px', '54px', '88px', '46px', '126px', 'auto'];

      const SheetCols = () => (
        <colgroup>
          {SHEET_COLS.map((largura, i) => <col key={i} style={{ width: largura }} />)}
        </colgroup>
      );

      // Reparte a quantidade digitada entre os espaços que o padrão reservou
      // para o produto, na mesma proporção do padrão. O que sobra da divisão
      // vai para o último espaço, para a soma bater exatamente com o pedido.
      const spreadOrderQty = (total, targets) => {
        if (total <= 0 || targets.length === 0) return [];
        if (targets.length === 1) return [{ ...targets[0], qty: total }];

        const base = targets.reduce((acc, t) => acc + t.qty, 0);
        let resto = total;

        return targets
          .map((alvo, i) => {
            if (i === targets.length - 1) return { ...alvo, qty: Math.max(0, resto) };
            const parte = base > 0 ? Math.round(total * (alvo.qty / base)) : Math.floor(total / targets.length);
            const qty = Math.max(0, Math.min(parte, resto));
            resto -= qty;
            return { ...alvo, qty };
          })
          .filter((alvo) => alvo.qty > 0);
      };

      const ProductionOrderView = ({
        currentUnit,
        unitName,
        slots,
        slotItems,
        products,
        standardPlans,
        selectedDay,
        onSelectDay,
        onApplyProductionToShowcase
      }) => {
        // O que a loja digitou na coluna Produzir, produto por produto. Quem
        // não está aqui usa o que a conta sugere.
        const [quantidades, setQuantidades] = useState({});
        const [agrupar, setAgrupar] = useState('vitrine');
        const [mostrar, setMostrar] = useState('tudo');
        const [frequencia, setFrequencia] = useState('todas');
        const [copiado, setCopiado] = useState('');

        // Os campos da coluna Produzir, na ordem da tela — é por eles que as
        // setas e o Enter andam
        const celulas = useRef([]);

        // Outro dia (ou outra unidade) é outro pedido: a planilha recomeça no
        // que a conta sugere, senão o que foi digitado na terça vazava para
        // a quarta
        useEffect(() => { setQuantidades({}); }, [selectedDay, currentUnit]);

        const hoje = getTodayDayOfWeek();
        const amanha = nextWeekDay(hoje);

        const dayPlans = useMemo(
          () => standardPlans.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay),
          [standardPlans, currentUnit, selectedDay]
        );

        const slotById = useMemo(() => {
          const map = {};
          slots.forEach((s) => { map[s.id] = s; });
          return map;
        }, [slots]);

        // Quanto de cada produto já existe na loja, somando TODAS as vitrines e
        // todos os espaços da unidade. A conta já olhou só para o espaço
        // planejado, depois só para a vitrine planejada — e nos dois casos o
        // pedido mandava produzir empada com empada na loja, só porque ela
        // estava no espaço do lado ou na outra vitrine. Aqui o que vale é o
        // que existe: se tem na loja, não se pede de novo.
        //
        // O que está vencido não entra na conta: ele vai sair da vitrine, então
        // precisa ser refeito. O que está no último dia conta como estoque, mas
        // fica marcado na linha para a loja decidir se adianta a produção.
        const stockByProduct = useMemo(() => {
          const map = {};
          slotItems.forEach((item) => {
            const slot = slotById[item.slotId];
            if (!slot || slot.unit !== currentUnit) return;
            const product = products.find((p) => p.id === item.productId);
            const status = getSlotItemStatus(item, product).status;
            const atual = map[item.productId] || { good: 0, expired: 0, lastDay: 0 };

            if (status === 'expired') atual.expired += item.currentQty;
            else {
              atual.good += item.currentQty;
              if (status === 'warning') atual.lastDay += item.currentQty;
            }
            map[item.productId] = atual;
          });
          return map;
        }, [slotItems, slotById, products, currentUnit]);

        // Estoque bom em um espaço só — usado para espalhar a produção
        const qtyInSlot = (slotId, productId) =>
          slotItems
            .filter((item) => {
              if (item.slotId !== slotId || item.productId !== productId) return false;
              const product = products.find((p) => p.id === item.productId);
              return getSlotItemStatus(item, product).status !== 'expired';
            })
            .reduce((acc, item) => acc + item.currentQty, 0);

        // Uma linha por produto, juntando todos os espaços — de todas as
        // vitrines — que o padrão do dia reservou para ele. Antes havia uma
        // linha por vitrine, e o mesmo produto era cobrado duas vezes.
        const orderList = useMemo(() => {
          const grupos = [];
          const porProduto = {};

          dayPlans.forEach((plan) => {
            const slot = slotById[plan.slotId];
            if (!slot || slot.unit !== currentUnit) return;

            if (!porProduto[plan.productId]) {
              porProduto[plan.productId] = {
                key: plan.productId,
                productId: plan.productId,
                unitOfMeasure: plan.unitOfMeasure,
                plans: []
              };
              grupos.push(porProduto[plan.productId]);
            }
            porProduto[plan.productId].plans.push({
              slot, idealQty: plan.idealQty, minQty: plan.minQty || 0, priority: plan.priority
            });
          });

          return grupos.map((grupo) => {
            const product = products.find((p) => p.id === grupo.productId);
            const idealQty = grupo.plans.reduce((acc, p) => acc + p.idealQty, 0);
            const estoque = stockByProduct[grupo.productId] || { good: 0, expired: 0, lastDay: 0 };
            const currentQty = estoque.good;
            const neededQty = Math.max(0, idealQty - currentQty);

            // Quando o mesmo produto ocupa espaços com letras diferentes,
            // vale a mais urgente
            const priority = grupo.plans
              .map((p) => getPriority(p.priority).value)
              .sort((a, b) => priorityRank(a) - priorityRank(b))[0] || DEFAULT_PRIORITY;

            // Sugestão da conta: o item é chamado quando o estoque bom da loja
            // fica igual ou abaixo da quantidade mínima que a vitrine padrão
            // guarda para este produto NESTE dia, ou quando tem peça vencida
            // para repor. Mínimo zero é "só quando acabar". É só o
            // preenchimento inicial da coluna Produzir — a última palavra é a
            // que for digitada na célula.
            const minQty = planMinQty(grupo.plans);
            const belowMin = currentQty <= minQty;
            const suggested = neededQty > 0 && (belowMin || estoque.expired > 0);

            // A quantidade sugerida é a do padrão do dia — a fornada inteira,
            // nunca a diferença: quem faz empada faz a fornada de empada, não
            // "mais 1" para completar bandeja.
            const suggestedQty = suggested ? idealQty : 0;

            // Os espaços que o padrão reservou, na ordem da vitrine. A
            // quantidade digitada é repartida entre eles nesta proporção.
            const ordenados = grupo.plans
              .slice()
              .sort((a, b) => compareShowcase(a.slot, b.slot) || a.slot.slotNumber - b.slot.slotNumber);

            const targets = ordenados
              .map((p) => ({ slotId: p.slot.id, slotNumber: p.slot.slotNumber, qty: p.idealQty }))
              .filter((alvo) => alvo.qty > 0);

            // Onde este produto mora hoje: "Vitrine Salgada 1 #3, #5 ·
            // Vitrine Salgada 2 #1" — o padrão pode espalhar o mesmo item
            // por mais de um móvel
            const locais = [];
            const porVitrine = {};
            ordenados.forEach((p) => {
              const chave = showcaseKey(p.slot);
              if (!porVitrine[chave]) {
                porVitrine[chave] = { title: p.slot.sectionTitle, espacos: [] };
                locais.push(porVitrine[chave]);
              }
              porVitrine[chave].espacos.push(p.slot.slotNumber);
            });
            const localLabel = locais.map((l) => `${l.title} #${l.espacos.join(', #')}`).join(' · ');
            const espacosLabel = locais.map((l) => `#${l.espacos.join(', #')}`).join(' · ');

            // Em que móvel a linha entra quando a planilha é lida na ordem da
            // vitrine: o primeiro espaço reservado para o produto
            const primeiro = ordenados[0].slot;

            // Em quantos dias da semana este produto entra no padrão da
            // unidade, juntando todos os espaços dele. É o que separa o item
            // de todo dia — que a cozinha faz sempre — do que aparece só em
            // um dia ou outro.
            const diasDaSemana = WEEK_DAYS.filter((day) =>
              standardPlans.some(
                (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.productId === grupo.productId
              )
            );

            // Estoque bom que está na loja, mas fora dos espaços que o padrão
            // reservou — é o que segurava o pedido sem aparecer em lugar
            // nenhum, então a planilha avisa quanto é
            const noPlano = ordenados.reduce((acc, p) => acc + qtyInSlot(p.slot.id, grupo.productId), 0);
            const foraDoPlano = Math.max(0, currentQty - noPlano);

            return {
              key: grupo.key,
              localLabel,
              espacosLabel,
              showcaseTitle: primeiro.sectionTitle,
              showcaseSort: primeiro,
              diasDaSemana,
              freqLabel: frequencyLabel(diasDaSemana),
              freqTitle: frequencyTitle(diasDaSemana),
              todoDia: diasDaSemana.length >= WEEK_DAYS.length,
              foraDoPlano,
              productId: grupo.productId,
              productName: product?.name || 'Produto',
              responsible: getResponsibleName(product),
              priority,
              idealQty,
              currentQty,
              expiredQty: estoque.expired,
              lastDayQty: estoque.lastDay,
              minQty,
              belowMin,
              suggested,
              suggestedQty,
              neededQty,
              targets,
              unitOfMeasure: grupo.unitOfMeasure
            };
          });
        }, [dayPlans, standardPlans, slotById, slotItems, products, stockByProduct, currentUnit]);

        // A planilha: a conta de cada produto com a quantidade que vale agora
        // — a digitada, se houver, senão a sugerida
        const rows = useMemo(
          () => orderList.map((item) => {
            const orderQty = quantidades[item.key] === undefined ? item.suggestedQty : quantidades[item.key];
            const situacao = orderQty > 0
              ? (item.suggested ? 'Chamado' : 'Escolhido')
              : item.suggested
                ? 'Tirado do pedido'
                : item.neededQty > 0
                  ? 'Acima do mínimo'
                  : 'Abastecido';
            return { ...item, orderQty, noPedido: orderQty > 0, situacao };
          }),
          [orderList, quantidades]
        );

        const definirQtd = (key, qtd) =>
          setQuantidades((prev) => ({ ...prev, [key]: Math.max(0, Math.floor(qtd) || 0) }));

        // A caixinha da primeira coluna é um atalho da célula: liga com a
        // quantidade do padrão do dia, desliga zerando
        const alternar = (row) =>
          definirQtd(row.key, row.orderQty > 0 ? 0 : (row.idealQty > 0 ? row.idealQty : 1));

        const voltarAoSugerido = () => setQuantidades({});
        const preencherTudo = () => {
          const novo = {};
          orderList.forEach((item) => { novo[item.key] = item.idealQty; });
          setQuantidades(novo);
        };
        const zerarTudo = () => {
          const novo = {};
          orderList.forEach((item) => { novo[item.key] = 0; });
          setQuantidades(novo);
        };

        const visiveis = useMemo(() => {
          let lista = rows;
          if (mostrar === 'pedido') lista = lista.filter((r) => r.noPedido);
          else if (mostrar === 'fora') lista = lista.filter((r) => !r.noPedido);

          // O item de todo dia é a rotina da cozinha; o de alguns dias é o
          // que muda de acordo com o movimento. Ver um sem o outro ajuda a
          // enxergar o que é fixo na semana.
          if (frequencia === 'todo-dia') lista = lista.filter((r) => r.todoDia);
          else if (frequencia === 'alguns') lista = lista.filter((r) => !r.todoDia);

          return lista;
        }, [rows, mostrar, frequencia]);

        // Os blocos da planilha. Por vitrine, é a vitrine do dia em lista:
        // os móveis na ordem da loja e, dentro deles, os espaços em ordem.
        // Por responsável, é a ordem de quem produz — o que não pode faltar
        // primeiro. "Nenhum" deixa a planilha corrida, em ordem alfabética.
        const blocos = useMemo(() => {
          const porOrdemDaVitrine = (a, b) =>
            compareShowcase(a.showcaseSort, b.showcaseSort) ||
            (a.targets[0]?.slotNumber || 0) - (b.targets[0]?.slotNumber || 0) ||
            a.productName.localeCompare(b.productName, 'pt-BR');

          const porOrdemDaProducao = (a, b) =>
            priorityRank(a.priority) - priorityRank(b.priority) ||
            a.productName.localeCompare(b.productName, 'pt-BR');

          if (agrupar === 'nenhum') {
            return [{
              key: '__tudo__',
              title: '',
              entries: [...visiveis].sort((a, b) => a.productName.localeCompare(b.productName, 'pt-BR'))
            }];
          }

          const lista = [];
          const porChave = {};

          [...visiveis]
            .sort(agrupar === 'vitrine' ? porOrdemDaVitrine : porOrdemDaProducao)
            .forEach((row) => {
              const chave = agrupar === 'vitrine' ? row.showcaseTitle : row.responsible;
              if (!porChave[chave]) {
                porChave[chave] = { key: chave, title: chave, entries: [] };
                lista.push(porChave[chave]);
              }
              porChave[chave].entries.push(row);
            });

          if (agrupar === 'responsavel') {
            lista.sort((a, b) => {
              if (a.title === NO_RESPONSIBLE_LABEL) return 1;
              if (b.title === NO_RESPONSIBLE_LABEL) return -1;
              return a.title.localeCompare(b.title, 'pt-BR');
            });
          }

          return lista;
        }, [visiveis, agrupar]);

        // A ordem em que as células da coluna Produzir aparecem na tela — é
        // por ela que ↑ ↓ e Enter andam
        const ordemNaTela = useMemo(() => blocos.flatMap((b) => b.entries), [blocos]);

        const irPara = (indice) => {
          const alvo = celulas.current[indice];
          if (alvo) { alvo.focus(); alvo.select(); }
        };

        const noPedido = rows.filter((r) => r.noPedido);
        const totalUn = noPedido.reduce((acc, r) => acc + r.orderQty, 0);
        const chamados = rows.filter((r) => r.suggested).length;
        const mexido = Object.keys(quantidades).length > 0;

        const somaDe = (entries, campo) => entries.reduce((acc, r) => acc + (r[campo] || 0), 0);

        // ------------------------------------------
        // Sai em texto, do jeito que vai para o WhatsApp ou para o papel:
        // o nome de quem produz em cima e, embaixo, quantidade e item. Sem
        // espaço, sem vitrine, sem prioridade — esse detalhe está na planilha.
        // É o mesmo texto no "Copiar pedido" e no "Copiar lista" de cada
        // bloco; muda só quais itens entram.
        // ------------------------------------------
        const textoPorResponsavel = (itens) => {
          const porResponsavel = new Map();
          itens.forEach((item) => {
            if (!porResponsavel.has(item.responsible)) porResponsavel.set(item.responsible, []);
            porResponsavel.get(item.responsible).push(item);
          });

          // Quem está sem responsável cadastrado fica por último
          const nomes = [...porResponsavel.keys()].sort((a, b) => {
            if (a === NO_RESPONSIBLE_LABEL) return 1;
            if (b === NO_RESPONSIBLE_LABEL) return -1;
            return a.localeCompare(b, 'pt-BR');
          });

          return nomes
            .map((nome) => {
              const linhas = porResponsavel.get(nome)
                .slice()
                .sort((a, b) => a.productName.localeCompare(b.productName, 'pt-BR'))
                .map((p) => `${p.orderQty} ${p.unitOfMeasure} — ${p.productName}`);
              return [nome.toUpperCase(), ...linhas].join('\n');
            })
            .join('\n\n');
        };

        const copiarTexto = async (chave, texto) => {
          const ok = await copyTextToClipboard(texto);
          if (!ok) {
            alert('Não consegui copiar sozinho. Selecione o texto da planilha e copie na mão.');
            return;
          }
          setCopiado(chave);
          setTimeout(() => setCopiado((atual) => (atual === chave ? '' : atual)), 2000);
        };

        // O pedido inteiro, separado por quem produz
        const copiarTudo = () => {
          if (noPedido.length === 0) return;
          copiarTexto('__tudo__', textoPorResponsavel(noPedido));
        };

        // A lista de um bloco só — a vitrine, ou a pessoa — no mesmo formato:
        // responsável em cima, quantidade e item embaixo
        const copiarBloco = (bloco) => {
          const itens = bloco.entries.filter((item) => item.noPedido);
          if (itens.length === 0) return;
          copiarTexto(bloco.key, textoPorResponsavel(itens));
        };

        // A planilha inteira separada por tabulação: cola direto no Excel ou
        // no Google Planilhas, do mesmo jeito que a tabela da semana
        const copiarPlanilha = () => {
          const cabecalho = [
            'Produto', 'Prioridade', 'Frequência', 'Dias', 'Vitrine', 'Espaços', 'Padrão', 'Na loja',
            'Vencido', 'Falta', 'Mínimo', 'Produzir', 'Unidade', 'Responsável', 'Situação'
          ];

          const linhas = ordemNaTela.map((r) => [
            r.productName, r.priority, r.freqLabel, r.freqTitle, r.showcaseTitle, r.espacosLabel,
            r.idealQty, r.currentQty, r.expiredQty, r.neededQty, r.minQty, r.orderQty,
            r.unitOfMeasure, r.responsible, r.situacao
          ].join('\t'));

          const total = ['Total', '', '', '', '', '',
            somaDe(ordemNaTela, 'idealQty'), somaDe(ordemNaTela, 'currentQty'),
            somaDe(ordemNaTela, 'expiredQty'), somaDe(ordemNaTela, 'neededQty'), '',
            somaDe(ordemNaTela, 'orderQty'), '', '', ''
          ].join('\t');

          copiarTexto('__planilha__', [cabecalho.join('\t'), ...linhas, total].join('\n'));
        };

        const handleApplyAll = () => {
          if (noPedido.length === 0) return;
          // A quantidade digitada é repartida entre os espaços do padrão, na
          // proporção que ele manda
          const payload = noPedido.flatMap((item) =>
            spreadOrderQty(item.orderQty, item.targets).map((alvo) => ({
              slotId: alvo.slotId,
              productId: item.productId,
              qty: alvo.qty,
              productName: item.productName
            }))
          );
          if (payload.length === 0) return;
          onApplyProductionToShowcase(payload);
          alert('Produção lançada na vitrine com sucesso!');
        };

        // Uma linha da planilha. O índice é a posição dela na coluna
        // Produzir, para as setas saberem para onde ir.
        const renderLinha = (row, indice) => (
          <tr key={row.key} data-fora={!row.noPedido}>
            <td data-sticky="true" style={{ left: 0 }} className="px-1.5 text-center">
              <button
                type="button"
                onClick={() => alternar(row)}
                title={row.noPedido
                  ? `Tirar ${row.productName} do pedido`
                  : `Colocar ${row.productName} no pedido — ${row.idealQty} ${row.unitOfMeasure}`}
                data-on={row.noPedido}
                className="sheet-check"
              >
                {row.noPedido && <Icons.Check className="w-3 h-3" />}
              </button>
            </td>

            <td
              data-sticky="true"
              style={{ left: '34px' }}
              className="max-w-[150px] sm:max-w-[230px] overflow-hidden text-ellipsis font-semibold text-[#1d1d1f]"
              title={`${row.productName} · ${row.localLabel}`}
            >
              {row.productName}
            </td>

            <td className="text-center text-[#6e6e73] font-bold" title={getPriority(row.priority).hint}>
              {row.priority}
            </td>
            {/* Em quantos dias da semana o item entra no padrão: o de todo
                dia fica escrito em preto, o resto em cinza */}
            <td
              className={`overflow-hidden text-ellipsis ${
                row.todoDia ? 'text-[#1d1d1f] font-semibold' : 'text-[#86868b]'
              }`}
              title={`${row.productName} entra em: ${row.freqTitle}`}
            >
              {row.freqLabel}
            </td>
            <td className="text-[#6e6e73] overflow-hidden text-ellipsis" title={row.localLabel}>
              {agrupar === 'vitrine' ? row.espacosLabel : row.localLabel}
            </td>

            <td className="num">{row.idealQty}</td>
            <td className="num" title={`${row.currentQty} ${row.unitOfMeasure} bons na loja, em qualquer vitrine`}>
              {row.currentQty}
            </td>
            <td className={`num ${row.expiredQty > 0 ? 'text-[#c9271d] font-bold' : 'text-[#c7c7cc]'}`}
                title={row.expiredQty > 0 ? `${row.expiredQty} vencido(s) para repor` : 'Nada vencido'}>
              {row.expiredQty || '—'}
            </td>
            <td className="num">{row.neededQty || '—'}</td>
            <td
              className={`num ${row.belowMin ? 'text-[#0058b0] font-bold' : 'text-[#86868b]'}`}
              title={
                row.minQty > 0
                  ? `Mínimo de ${row.productName} em ${getDayNameBR(selectedDay).toLowerCase()}: ${row.minQty} ${row.unitOfMeasure}`
                    + ` — na loja tem ${row.currentQty}.`
                    + ` ${row.belowMin ? 'Está no mínimo, por isso é chamado.' : 'Acima do mínimo.'}`
                    + ' Para mudar, digite na tabela da semana, na aba Vitrine padrão.'
                  : 'Sem mínimo neste dia — o item só é chamado quando acaba.'
                    + ' Para dar um mínimo, digite na tabela da semana, na aba Vitrine padrão.'
              }
            >
              {row.minQty || '—'}
            </td>

            <td className="p-0">
              <OrderQtyCell
                value={row.orderQty}
                cellRef={(el) => { celulas.current[indice] = el; }}
                onMove={(passo) => irPara(indice + passo)}
                onCommit={(nova) => definirQtd(row.key, nova)}
                title={`Quanto produzir de ${row.productName} — o padrão do dia pede ${row.idealQty} ${row.unitOfMeasure}. 0 tira do pedido.`}
              />
            </td>
            <td className="text-[#86868b]">{row.unitOfMeasure}</td>
            <td className="text-[#6e6e73] max-w-[130px] overflow-hidden text-ellipsis" title={row.responsible}>
              {row.responsible}
            </td>

            <td className="text-[11px]">
              <span className={
                row.situacao === 'Chamado' ? 'text-[#0058b0] font-semibold'
                  : row.situacao === 'Escolhido' ? 'text-[#1d1d1f] font-semibold'
                    : 'text-[#86868b]'
              }>
                {row.situacao}
              </span>
              {row.lastDayQty > 0 && (
                <span className="text-[#a35e00] ml-1.5 tnum">· {row.lastDayQty} no último dia</span>
              )}
              {row.foraDoPlano > 0 && (
                <span className="text-[#86868b] ml-1.5 tnum">· {row.foraDoPlano} em outro espaço</span>
              )}
            </td>
          </tr>
        );

        let indice = -1;

        return (
          <div className="space-y-3">
            {/* Barra do pedido: dia, leitura e os botões. Sem cartão grande —
                a tela é a planilha, o resto é moldura */}
            <div className="card-flat px-4 py-3 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="min-w-0">
                <h2 className="t-title text-[#1d1d1f]">Pedido de produção</h2>
                <p className="t-caption mt-0.5">
                  {unitName} · {rows.length} {rows.length === 1 ? 'produto' : 'produtos'} no padrão de{' '}
                  {getDayNameBR(selectedDay).toLowerCase()} · {chamados} chamado(s) pela conta ·
                  digite na coluna <strong className="text-[#1d1d1f] font-semibold">Produzir</strong>;
                  0 tira do pedido
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2 shrink-0">
                <select
                  value={selectedDay}
                  onChange={(e) => onSelectDay(e.target.value)}
                  title="O dia que o pedido monta — abre no dia seguinte ao de hoje"
                  className="field field-sm field-select field-auto"
                >
                  {WEEK_DAYS.map((day) => (
                    <option key={day} value={day}>
                      {getDayNameBR(day)}
                      {day === hoje ? ' (hoje)' : day === amanha ? ' (amanhã)' : ''}
                    </option>
                  ))}
                </select>

                <button
                  onClick={copiarPlanilha}
                  disabled={rows.length === 0}
                  title="A planilha inteira separada por tabulação — cola direto no Excel"
                  className="btn btn-secondary btn-sm disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Copy className="w-3.5 h-3.5" />
                  {copiado === '__planilha__' ? 'Copiado!' : 'Copiar planilha'}
                </button>
                <button
                  onClick={copiarTudo}
                  disabled={noPedido.length === 0}
                  title="Responsável, quantidade e item — para mandar no WhatsApp"
                  className="btn btn-secondary btn-sm disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Copy className="w-3.5 h-3.5" />
                  {copiado === '__tudo__' ? 'Copiado!' : 'Copiar pedido'}
                </button>
                <button
                  onClick={handleApplyAll}
                  disabled={noPedido.length === 0}
                  className="btn btn-primary btn-sm disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Plus className="w-3.5 h-3.5" />
                  Lançar na vitrine
                  {totalUn > 0 && <span className="tnum opacity-80">{totalUn} un</span>}
                </button>
              </div>
            </div>

            {/* Os controles da planilha: como ler e o que mostrar */}
            <div className="card-flat px-4 py-2.5 flex flex-wrap items-center gap-x-4 gap-y-2">
              <label className="flex items-center gap-2">
                <span className="t-caption">Agrupar</span>
                <select
                  value={agrupar}
                  onChange={(e) => setAgrupar(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  <option value="vitrine">Por vitrine (a vitrine do dia)</option>
                  <option value="responsavel">Por responsável (quem produz)</option>
                  <option value="nenhum">Sem grupo (A-Z)</option>
                </select>
              </label>

              <label className="flex items-center gap-2">
                <span className="t-caption">Mostrar</span>
                <select
                  value={mostrar}
                  onChange={(e) => setMostrar(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  <option value="tudo">Todo o padrão do dia</option>
                  <option value="pedido">Só o que vai ser produzido</option>
                  <option value="fora">Só o que ficou de fora</option>
                </select>
              </label>

              <label className="flex items-center gap-2">
                <span className="t-caption">Frequência</span>
                <select
                  value={frequencia}
                  onChange={(e) => setFrequencia(e.target.value)}
                  title="Em quantos dias da semana o item entra no padrão"
                  className="field field-sm field-select field-auto"
                >
                  <option value="todas">Toda frequência</option>
                  <option value="todo-dia">Só os de todo dia</option>
                  <option value="alguns">Só os de alguns dias</option>
                </select>
              </label>

              <div className="flex flex-wrap items-center gap-2 ml-auto">
                <span className="t-caption tnum">
                  {noPedido.length} no pedido · {totalUn} un
                </span>
                <button onClick={preencherTudo} className="btn btn-secondary btn-sm" title="Colocar a quantidade do padrão em todas as linhas">
                  Preencher com o padrão
                </button>
                <button onClick={zerarTudo} className="btn btn-secondary btn-sm" title="Zerar a coluna Produzir">
                  Zerar
                </button>
                {mexido && (
                  <button onClick={voltarAoSugerido} className="btn btn-secondary btn-sm" title="Desfazer o que foi digitado e voltar ao que a conta sugere">
                    Voltar ao sugerido
                  </button>
                )}
              </div>
            </div>

            {rows.length === 0 ? (
              <div className="card-flat text-center py-14 px-4 space-y-2">
                <h4 className="t-title text-[#1d1d1f]">Sem padrão para {getDayNameBR(selectedDay)}</h4>
                <p className="t-callout">
                  Monte a vitrine deste dia na aba Vitrine padrão para o pedido ter o que calcular
                </p>
              </div>
            ) : visiveis.length === 0 ? (
              <div className="card-flat text-center py-12 px-4">
                <p className="t-callout">
                  {mostrar === 'pedido'
                    ? 'Nada marcado para produzir — digite a quantidade na coluna Produzir'
                    : 'Todo o padrão do dia está no pedido'}
                </p>
              </div>
            ) : (
              // Uma planilha por bloco: cada vitrine (ou cada responsável) tem
              // a sua, com o nome do móvel em cima, o subtotal no rodapé dela e
              // o "Copiar lista" ao lado do título. Antes era tudo uma tabela
              // só, com uma linha cinza separando — e a vitrine se perdia no
              // meio das linhas.
              <div className="space-y-4">
                {blocos.map((bloco) => {
                  const base = indice + 1;
                  indice += bloco.entries.length;
                  const temPedido = bloco.entries.some((i) => i.noPedido);

                  return (
                    <div key={bloco.key} className="card-flat overflow-hidden">
                      {bloco.title && (
                        <div className="px-4 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b hairline bg-[var(--bg-elevated)]">
                          <div className="min-w-0">
                            <h3 className="t-headline text-[#1d1d1f] truncate" title={bloco.title}>
                              {bloco.title}
                            </h3>
                            <p className="t-caption tnum mt-0.5">
                              {bloco.entries.length} {bloco.entries.length === 1 ? 'item' : 'itens'} ·
                              {' '}{somaDe(bloco.entries, 'idealQty')} un no padrão ·
                              {' '}{somaDe(bloco.entries, 'currentQty')} na loja ·
                              {' '}<strong className="text-[#0058b0] font-bold">
                                {somaDe(bloco.entries, 'orderQty')} un a produzir
                              </strong>
                            </p>
                          </div>
                          {temPedido && (
                            <button
                              onClick={() => copiarBloco(bloco)}
                              className="btn btn-secondary btn-sm shrink-0 self-start sm:self-auto"
                              title={`Copiar a lista de ${bloco.title} — responsável e itens`}
                            >
                              <Icons.Copy className="w-3.5 h-3.5" />
                              {copiado === bloco.key ? 'Copiado!' : 'Copiar lista'}
                            </button>
                          )}
                        </div>
                      )}

                      <div className="overflow-x-auto">
                        <table className="sheet">
                          <SheetCols />
                          <thead>
                            <tr>
                              <th data-sticky="true" style={{ left: 0 }} className="w-[34px]" title="Entra no pedido">✓</th>
                              <th data-sticky="true" style={{ left: '34px' }}>Produto</th>
                              <th className="text-center" title="A–D: a importância do item, para ordenar e filtrar a lista">P</th>
                              <th title="Em quantos dias da semana o item entra no padrão">Freq.</th>
                              <th>{agrupar === 'vitrine' ? 'Espaços' : 'Vitrine'}</th>
                              <th className="num" title="Quantidade que o padrão do dia manda ter">Padrão</th>
                              <th className="num" title="Estoque bom, em qualquer vitrine da loja">Na loja</th>
                              <th className="num" title="Peças vencidas, que vão sair da vitrine">Venc.</th>
                              <th className="num" title="Padrão menos o que está na loja">Falta</th>
                              <th className="num" title="Quantidade mínima do item neste dia — o item é chamado quando o estoque bom chega nela. Digite na tabela da semana, na aba Vitrine padrão">Mín.</th>
                              <th className="num" style={{ width: '88px' }} title="Digite aqui — 0 tira do pedido">Produzir</th>
                              <th>Un</th>
                              <th>Responsável</th>
                              {/* A última coluna estica: é ela que come a sobra
                                  da largura, e não a célula que se digita */}
                              <th style={{ width: '99%' }}>Situação</th>
                            </tr>
                          </thead>

                          <tbody>
                            {bloco.entries.map((row, i) => renderLinha(row, base + i))}
                          </tbody>

                          <tfoot>
                            <tr>
                              <td data-sticky="true" style={{ left: 0 }} />
                              <td data-sticky="true" style={{ left: '34px' }}>
                                {bloco.title ? 'Total do móvel' : 'Total'}
                              </td>
                              <td colSpan={3} className="t-caption text-[11px]">
                                {bloco.entries.length} {bloco.entries.length === 1 ? 'linha' : 'linhas'}
                              </td>
                              <td className="num">{somaDe(bloco.entries, 'idealQty')}</td>
                              <td className="num">{somaDe(bloco.entries, 'currentQty')}</td>
                              <td className="num">{somaDe(bloco.entries, 'expiredQty') || '—'}</td>
                              <td className="num">{somaDe(bloco.entries, 'neededQty') || '—'}</td>
                              <td />
                              <td className="num text-[#0058b0]">{somaDe(bloco.entries, 'orderQty')}</td>
                              <td colSpan={3} className="t-caption text-[11px]">
                                {bloco.entries.filter((i) => i.noPedido).length} item(ns) no pedido
                              </td>
                            </tr>
                          </tfoot>
                        </table>
                      </div>
                    </div>
                  );
                })}

                {/* O fecho do dia, somando todos os blocos */}
                <div className="card-flat px-4 py-3 flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
                  <span className="t-headline text-[#1d1d1f]">Total do dia</span>
                  <span className="t-callout tnum">
                    {visiveis.length} {visiveis.length === 1 ? 'linha' : 'linhas'} ·
                    {' '}{somaDe(visiveis, 'idealQty')} un no padrão ·
                    {' '}{somaDe(visiveis, 'currentQty')} na loja ·
                    {' '}{somaDe(visiveis, 'neededQty')} de falta
                  </span>
                  <span className="t-headline tnum text-[#0058b0]">
                    {somaDe(visiveis, 'orderQty')} un a produzir
                    <span className="t-caption ml-1.5">em {noPedido.length} item(ns)</span>
                  </span>
                </div>
              </div>
            )}

            <p className="t-caption px-1">

              de {getDayNameBR(selectedDay).toLowerCase()}</strong> — a que está digitada na tabela da

              como estoque e mínimo zero é "só quando acabar". A quantidade sugerida é a do padrão do
              dia — a fornada inteira, nunca "mais 1" para completar bandeja. A letra A–D não entra na
              conta: ela só organiza as listas. Quando o produto ocupa mais de um espaço, a quantidade
              digitada é repartida entre eles na proporção do padrão. No teclado: ↑ ↓ andam pela coluna,

        const activeResponsible = lossResponsibles.includes(selectedResponsible) ? selectedResponsible : 'todos';

        const filteredLosses = unitLosses.filter((l) => {
          const matchesText = l.productName.toLowerCase().includes(filterText.toLowerCase());

                  Itens perdidos

                  {totalLossQty}

                  <Icons.AlertTriangle className="w-3.5 h-3.5" />

                </span>

      // ==========================================
      // CORRIGIR UM LANÇAMENTO DO HISTÓRICO
      //
      // Venda, perda e produção entram com um clique só, então errar a
      // quantidade ou o lote é fácil. Aqui o lançamento é acertado no lugar,
      // sem precisar excluir e lançar de novo.
      //
      // Só o registro muda: o que está na vitrine agora fica como está — a
      // mesma regra que já vale para excluir um lançamento.
      // ==========================================
      const HistoryEditModal = ({ registro, onClose, onSave }) => {
        if (!registro) return null;

        const ehProducao = registro.tipo === 'producao';
        const ehPerda = registro.tipo === 'perda';

        const [qty, setQty] = useState(String(registro.qty || 1));
        const [lote, setLote] = useState(toDayKey(registro.manufactureDate));
        const [dia, setDia] = useState(registro.dia || '');
        const [loteQty, setLoteQty] = useState(registro.producedQty ? String(registro.producedQty) : '');
        const [reason, setReason] = useState(registro.reason || 'vencido');
        const [details, setDetails] = useState(registro.details || '');

        const titulo = ehProducao ? 'Corrigir produção' : ehPerda ? 'Corrigir perda' : 'Corrigir venda';
        const rotuloData = ehPerda ? 'Data da perda' : 'Data da venda';

        const numero = (texto) => {
          const n = Math.floor(Number(texto));
          return Number.isFinite(n) ? n : NaN;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          const quantidade = numero(qty);
          if (!(quantidade >= 1)) {
            alert('A quantidade precisa ser 1 ou mais. Para tirar o lançamento do histórico, use o botão de excluir.');
            return;
          }

          const tamanhoLote = loteQty.trim() === '' ? null : Math.max(0, numero(loteQty) || 0);

          onSave(registro.tipo, registro.id, {
            qty: quantidade,
            // Na produção o dia do histórico é a própria data de fabricação
            dia: ehProducao ? (lote || registro.dia) : (dia || registro.dia),
            manufactureDate: lote || null,
            producedQty: ehProducao ? null : tamanhoLote,
            reason,
            details: details.trim()
          });
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)] max-h-[90vh] overflow-y-auto">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">{titulo}</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1 truncate">{registro.productName}</h3>

                  <Icons.X className="w-4 h-4" />
                </button>
