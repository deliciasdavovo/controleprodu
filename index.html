      // ==========================================
      // PRODUCT CATALOG VIEW
      // ==========================================
      const ProductCatalogView = ({ products, onAddProduct, onUpdateProduct, onDeleteProduct }) => {
        const [filterText, setFilterText] = useState('');
        const [filterResponsible, setFilterResponsible] = useState('todos');

        // Linha de cadastro: um produto por vez, sem sair do teclado
        const BLANK_DRAFT = { name: '', responsible: '', category: 'salgado', showcaseEnabled: true, shelfLifeDays: 2, price: 8.5, priceUnit: 'un' };
        const [draft, setDraft] = useState(BLANK_DRAFT);

        const nameRef = useRef(null);
        const responsibleRef = useRef(null);
        const categoryRef = useRef(null);
        const shelfLifeRef = useRef(null);
        const priceRef = useRef(null);

        const responsibleOptions = listResponsibles(products);
        const hasUnassigned = products.some((p) => !cleanResponsible(p.responsible));

        const productOptions = products.map((p) => ({ value: p.name, label: p.name }));
        const responsiblePickerOptions = responsibleOptions.map((r) => ({ value: r, label: r }));

        // Nome igual ao de um produto já cadastrado: a linha passa a editar aquele produto
        const findByName = (value) =>
          normalizeName(value)
            ? products.find((p) => normalizeName(p.name) === normalizeName(value)) || null
            : null;

        const matched = findByName(draft.name);

        const setField = (field, value) => setDraft((d) => ({ ...d, [field]: value }));

        // Ao reconhecer um produto existente, a linha carrega os dados dele para ajuste
        const handleDraftName = (value) => {
          const found = findByName(value);
          setDraft((d) => found
            ? {
                name: value,
                responsible: found.responsible || '',
                category: found.category,
                showcaseEnabled: found.showcaseEnabled !== false,
                shelfLifeDays: found.shelfLifeDays,
                price: found.price,
                priceUnit: found.priceUnit || 'un'
              }
            : { ...d, name: value });
        };

        // Enter passa para o próximo campo; no último, o formulário salva sozinho
        const goToField = (ref) => (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const el = ref.current;
          if (!el) return;
          el.focus();
          if (el.select) el.select();
        };

        const filtered = products.filter((p) => {
          const matchesText = p.name.toLowerCase().includes(filterText.toLowerCase());
          const matchesResponsible =
            filterResponsible === 'todos' ||
            (filterResponsible === 'sem' ? !cleanResponsible(p.responsible) : cleanResponsible(p.responsible) === filterResponsible);
          return matchesText && matchesResponsible;
        });

        // A linha do cadastro não fecha depois de salvar, então o clique
        // repetido cadastraria o mesmo produto duas vezes
        const salvar = useCliqueUnico((nome) => {
          const dados = {
            name: nome,
            responsible: cleanResponsible(draft.responsible),
            category: draft.category,
            showcaseEnabled: draft.showcaseEnabled !== false,
            shelfLifeDays: Math.max(1, Number(draft.shelfLifeDays) || 1),
            price: Math.max(0, Number(draft.price) || 0),
            priceUnit: draft.priceUnit === 'kg' ? 'kg' : 'un'
          };

          if (matched) {
            onUpdateProduct({ ...matched, ...dados });
          } else {
            // O id vem do banco; aqui só descrevemos o produto
            onAddProduct({ ...dados, defaultUnit: 'un', minReplenishmentQty: 5 });
          }

          // Responsável e categoria continuam preenchidos: quem cadastra costuma
          // lançar vários itens seguidos da mesma pessoa
          setDraft({ ...BLANK_DRAFT, responsible: dados.responsible, category: dados.category, showcaseEnabled: dados.showcaseEnabled, priceUnit: dados.priceUnit });
          setTimeout(() => {
            if (nameRef.current) nameRef.current.focus();
          }, 50);
        });

        const handleSubmit = (e) => {
          e.preventDefault();
          const nome = draft.name.trim();
          if (!nome) {
            if (nameRef.current) nameRef.current.focus();
            return;
          }
          salvar(nome);
        };

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7">
              <div className="t-overline flex items-center gap-1.5 mb-2">
                <Icons.Package className="w-3.5 h-3.5" />
                Cadastro
              </div>
              <h2 className="t-display">Catálogo de produtos</h2>
              <p className="t-body mt-1.5">Cadastro mestre para CMV e fichas técnicas. O produto pode existir sem participar da vitrine.</p>

              <form onSubmit={handleSubmit} className="mt-5 pt-5 border-t hairline">
                <div className="flex items-center justify-between mb-3">
                  <span className="t-overline">Cadastrar na linha</span>
                  <span className="t-micro">Enter ↵ avança e salva</span>
                </div>

                <div className="grid grid-cols-12 gap-2 sm:gap-3 items-end">
                  <div className="col-span-12 md:col-span-3">
                    <label className="t-caption block mb-1">Produto</label>
                    <PickerField
                      inputRef={nameRef}
                      placeholder="Digite ou busque…"
                      value={draft.name}
                      options={productOptions}
                      onType={handleDraftName}
                      onPick={(opt) => handleDraftName(opt.label)}
                      emptyLabel="Nome novo — vai entrar como produto novo"
                      onKeyDown={goToField(responsibleRef)}
                      className="field field-md font-semibold"
                    />
                  </div>

                  <div className="col-span-7 md:col-span-3">
                    <label className="t-caption block mb-1">Responsável</label>
                    <PickerField
                      inputRef={responsibleRef}
                      placeholder="Quem produz"
                      value={draft.responsible}
                      options={responsiblePickerOptions}
                      onType={(texto) => setField('responsible', texto)}
                      onPick={(opt) => setField('responsible', opt.value)}
                      emptyLabel="Responsável novo — é criado ao salvar"
                      onKeyDown={goToField(categoryRef)}
                      className="field field-md"
                    />
                  </div>

                  <div className="col-span-5 md:col-span-2">
                    <label className="t-caption block mb-1">Categoria</label>
                    <PickerField
                      inputRef={categoryRef}
                      value={draft.category}
                      options={PRODUCT_CATEGORIES}
                      onPick={(opt) => setField('category', opt.value)}
                      onKeyDown={goToField(shelfLifeRef)}
                      className="field field-md"
                    />
                  </div>

                  <div className="col-span-7 md:col-span-2">
                    <label className="t-caption block mb-1">Vai para vitrine?</label>
                    <label className="field field-md flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={draft.showcaseEnabled !== false}
                        onChange={(e) => setField('showcaseEnabled', e.target.checked)}
                        className="w-4 h-4"
                      />
                      <span className="t-callout font-semibold">{draft.showcaseEnabled !== false ? 'Sim' : 'Não'}</span>
                    </label>
                  </div>

                  <div className="col-span-4 md:col-span-1">
                    <label className="t-caption block mb-1">Validade</label>
                    <input
                      ref={shelfLifeRef}
                      type="number"
                      min="1"
                      title="Validade em dias a partir da fabricação"
                      value={draft.shelfLifeDays}
                      onChange={(e) => setField('shelfLifeDays', e.target.value)}
                      onKeyDown={goToField(priceRef)}
                      className="field field-md text-center tnum"
                    />
                  </div>

                  <div className="col-span-8 md:col-span-2">
                    <div className="grid grid-cols-[minmax(0,1fr)_108px] gap-2">
                      <div>
                        <label className="t-caption block mb-1">Preço de venda</label>
                        <div className="relative">
                          <span className="t-micro absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">R$</span>
                          <input
                            ref={priceRef}
                            type="number"
                            step="0.01"
                            min="0"
                            value={draft.price}
                            onChange={(e) => setField('price', e.target.value)}
                            className="field field-md text-right tnum pl-8"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="t-caption block mb-1">Vendido por</label>
                        <PickerField
                          value={draft.priceUnit || 'un'}
                          options={[
                            { value: 'un', label: 'Unidade' },
                            { value: 'kg', label: 'Kg' }
                          ]}
                          onPick={(opt) => setField('priceUnit', opt.value)}
                          className="field field-md"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="col-span-4 md:col-span-2">
                    <button
                      type="submit"
                      title={matched ? 'Salvar alterações do produto' : 'Cadastrar produto'}
                      className="btn btn-primary btn-md w-full"
                    >
                      {matched ? <Icons.CheckCircle2 className="w-4 h-4" /> : <Icons.Plus className="w-4 h-4" />}
                      {matched ? 'Salvar' : 'Cadastrar'}
                    </button>
                  </div>
                </div>

                <p className="t-micro mt-2">
                  {matched
                    ? `“${matched.name}” já está no catálogo — os campos acima atualizam o cadastro dele.`
                    : 'Validade em dias contados da fabricação. Um nome já cadastrado abre o produto para edição.'}

              </form>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-col sm:flex-row sm:items-center gap-2 pb-4">
                <div className="relative flex-1 max-w-sm">
                  <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[11px]" />
                  <input
                    type="text"
                    placeholder="Pesquisar produto…"
                    value={filterText}
                    onChange={(e) => setFilterText(e.target.value)}
                    className="field field-sm field-search"
                  />
                </div>
                <div className="w-52 max-w-full">
                  <PickerField
                    value={filterResponsible}
                    options={[
                      { value: 'todos', label: 'Todos os responsáveis' },
                      ...responsibleOptions.map((r) => ({ value: r, label: r })),
                      ...(hasUnassigned ? [{ value: 'sem', label: NO_RESPONSIBLE_LABEL }] : [])
                    ]}
                    onPick={(opt) => setFilterResponsible(opt.value)}
                    className="field field-sm"
                  />
                </div>
              </div>

              <div className="rola-x">
                <table className="w-full text-left tabela-larga">
                  <thead>
                    <tr className="t-overline-sm border-b hairline">
                      <th className="py-3 pr-3 font-bold sticky left-0 bg-white z-10">Produto</th>
                      <th className="py-3 px-3 font-bold">Responsável</th>
                      <th className="py-3 px-3 font-bold">Categoria</th>
                      <th className="py-3 px-3 text-center font-bold">Vitrine</th>
                      <th className="py-3 px-3 text-center font-bold">Validade</th>
                      <th className="py-3 px-3 text-right font-bold">Preço de venda</th>
                      <th className="py-3 pl-3 text-right font-bold">Ação</th>

                  </thead>
                  <tbody>
                    {filtered.length === 0 ? (
                      <tr><td colSpan={7} className="text-center py-10"><p className="t-body text-[#86868b]">Nenhum produto encontrado</p></td></tr>
                    ) : (
                      filtered.map((p) => (
                        <tr key={p.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                          <td className="py-2.5 pr-3 sticky left-0 bg-white z-10">
                            <input
                              type="text"
                              value={p.name}
                              onChange={(e) => onUpdateProduct({ ...p, name: e.target.value })}

                              title="Nome do produto"
                              className="field h-8 px-2.5 text-[13px] font-semibold w-36 sm:w-56"
                            />

                          <td className="py-2.5 px-3">
                            <div className="w-32 sm:w-40">
                              <PickerField
                                value={p.responsible || ''}
                                options={responsiblePickerOptions}
                                onType={(texto) => onUpdateProduct({ ...p, responsible: texto })}
                                onPick={(opt) => onUpdateProduct({ ...p, responsible: opt.value })}
                                placeholder="Quem responde…"
                                title="Responsável pelo produto"
                                emptyLabel="Responsável novo"
                                className="field h-8 pl-2.5 text-[12px]"

                              <input
                                type="checkbox"
                                checked={p.showcaseEnabled !== false}
                                onChange={(e) => onUpdateProduct({ ...p, showcaseEnabled: e.target.checked })}

                              <input
                                type="number"

                                onChange={(e) => onUpdateProduct({ ...p, shelfLifeDays: Math.max(1, Number(e.target.value) || 1) })}

                                className="field h-8 px-2 text-[12px] text-center tnum w-14 sm:w-16"

                            </div>
                          </td>
                          <td className="py-2.5 px-3">
                            <div className="flex items-center justify-end gap-1.5 min-w-[190px]">
                              <span className="t-micro">R$</span>
                              <input
                                type="number"
                                step="0.01"
                                min="0"

                                onChange={(e) => onUpdateProduct({ ...p, price: Math.max(0, Number(e.target.value) || 0) })}
                                title={`Preço de venda por ${p.priceUnit === 'kg' ? 'kg' : 'unidade'}`}
                                className="field h-8 px-2 text-[12px] text-right font-bold tnum w-20 sm:w-24"
                              />
                              <span className="t-micro">/</span>
                              <div className="w-24">
                                <PickerField
                                  value={p.priceUnit || 'un'}
                                  options={[
                                    { value: 'un', label: 'unidade' },
                                    { value: 'kg', label: 'kg' }
                                  ]}

                                  title="Unidade do preço de venda"
                                  className="field h-8 pl-2.5 text-[12px]"
                                />

                          </td>

                      ))

              <p className="t-micro pt-3">
                Toque em qualquer campo da tabela para corrigir o produto — o app salva sozinho.
              </p>
            </div>
          </div>
        );
      };

      // ==========================================
      // SLOT ADD MODAL
      //
      // Coloca produto na vitrine. O espaço já vem escolhido por quem abriu a
      // janela — o primeiro livre daquele móvel e, com o móvel cheio, o menos
      // ocupado —, porque em que espaço o produto cai não é decisão de quem
      // está montando: é só onde couber.
      //
      // Quando o espaço já tem alguém, a janela diz com quem o produto vai
      // dividir o lugar, para não ser surpresa na hora de procurar.
      // ==========================================
      const SlotAddModal = ({ slot, itemsInSlot, itemsInShowcase = [], products, onClose, onConfirm }) => {
        if (!slot) return null;
        const [productName, setProductName] = useState('');
        const [qty, setQty] = useState(10);
        const [date, setDate] = useState(getTodayDateString());

        // O espaço pertence a uma vitrine, então a lista mostra só os produtos
        // daquela vitrine — nada de doce aparecendo na vitrine salgada
        const categoriaDaVitrine = categoryOfShowcaseType(slot.showcaseType);
        const productOptions = productsForShowcaseType(products, slot.showcaseType)
          .map((p) => ({ value: p.name, label: p.name }));
        const dividindo = itemsInSlot.length > 0;

        // Produto que já está neste móvel não ganha espaço novo: o lote entra
        // na mesma bandeja do que já está exposto. A janela avisa antes de
        // confirmar, senão a pessoa escolhe um espaço vazio e o item aparece
        // em outro lugar sem explicação.
        const jaNoMovel = itemsInShowcase.find(
          (i) => i.productName.toLowerCase().trim() === productName.toLowerCase().trim()
        );

        const colocar = useCliqueUnico((nome) => {
          onConfirm(nome, Math.max(1, Number(qty) || 1), date, slot.id);
          onClose();
        });

        const handleSubmit = (e) => {
          e.preventDefault();
          const nome = productName.trim();
          if (!nome) return;
          colocar(nome);
        };

        return (
          /* No celular esta janela também sobe de baixo, igual à folha do +:
             colocar produto é o mesmo trabalho, e a mão faz do mesmo jeito */
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-end sm:items-center justify-center sm:p-4 z-50">
            <form onSubmit={handleSubmit} className="bottom-sheet px-4 pt-3 sm:p-6 space-y-4">
              <div className="bottom-sheet-grab sm:hidden" />
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Colocar na vitrine</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1">{slot.sectionTitle}</h3>
                  <p className="t-callout mt-1">
                    {dividindo
                      ? 'Esta vitrine está cheia — o produto vai dividir o lugar com:'
                      : 'Vai para um espaço livre desta vitrine.'}
                  </p>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              {dividindo && (
                <div className="card-quiet p-3 space-y-1">
                  {itemsInSlot.map((item) => (
                    <div key={item.id} className="flex items-center justify-between gap-2">
                      <span className="text-[12px] font-semibold text-[#1d1d1f] truncate">{item.productName}</span>
                      <span className="t-caption tnum shrink-0">{item.currentQty} {item.unit}</span>
                    </div>
                  ))}
                </div>
              )}

              <div>
                <label className="t-caption block mb-1">
                  Produto <span className="font-normal">· só os de {categoriaDaVitrine} desta vitrine</span>
                </label>
                <PickerField
                  placeholder="Digite ou escolha…"
                  value={productName}
                  options={productOptions}
                  onType={setProductName}
                  onPick={(opt) => setProductName(opt.label)}
                  emptyLabel={`Nenhum produto de ${categoriaDaVitrine} com esse nome — ao colocar, ele entra no catálogo`}
                  className="field field-lg font-semibold"
                />
                {jaNoMovel && (
                  <p className="t-micro mt-1.5 flex items-start gap-1">
                    <Icons.Layers className="w-3 h-3 shrink-0 mt-[2px]" />
                    <span>
                      Já tem <strong className="text-[#1d1d1f]">{jaNoMovel.productName}</strong> no espaço{' '}
                      {jaNoMovel.slotNumber} desta vitrine — o lote novo vai junto com ele, na mesma bandeja.
                    </span>
                  </p>
                )}
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="t-caption block mb-1">Quantidade</label>
                  <input
                    type="number"
                    min="1"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    className="field field-lg text-center font-extrabold tnum"
                  />
                </div>
                <div>
                  <label className="t-caption block mb-1">Fabricação</label>
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="field field-lg text-center tnum"
                  />
                </div>
              </div>

              <div className="grid grid-cols-[auto_minmax(0,1fr)] gap-2 pt-1">
                <button type="button" onClick={onClose} className="btn btn-secondary btn-lg">Cancelar</button>
                <button type="submit" className="btn btn-primary btn-lg">
                  <Icons.Plus className="w-4 h-4" />
                  {dividindo ? 'Dividir espaço' : 'Colocar'}
                </button>
              </div>
            </form>
          </div>
        );
      };

      // ==========================================
      // FOLHA DE LANÇAR ITEM (celular)
      //
      // A mesma coisa que o formulário da lista de apoio faz, só que numa
      // folha que sobe de baixo e cabe na mão: produto, quantidade e data em
      // alvos grandes. Quem abre ela é o + preso no canto da tela da vitrine.
      //
      // A folha não fecha ao lançar: fornada que sai do forno vem em vários
      // produtos seguidos, e cada lançamento fica no comprovante do fim, para
      // a pessoa ver o que já entrou sem sair da folha.
      // ==========================================
      const QUICK_QTY_PRESETS = [5, 10, 15, 20, 30];

      const QuickAddSheet = ({ open, currentUnit, slots, products, showcaseType, onChangeShowcaseType, onQuickAllocate, onClose }) => {
        if (!open) return null;

        const [productName, setProductName] = useState('');
        const [qty, setQty] = useState(10);
        const [date, setDate] = useState(getTodayDateString());
        const [lancados, setLancados] = useState([]);

        const hoje = getTodayDateString();
        const ontem = shiftDayKey(hoje, -1);

        // A mesma regra da lista de apoio: lança-se pelo produto, e não pela
        // vitrine aberta. Os produtos da vitrine escolhida vêm primeiro; os
        // das outras vêm depois, com o nome do móvel para onde eles vão.
        const productOptions = useMemo(() => {
          const daVitrine = [];
          const deOutras = [];

          products.filter((p) => p.showcaseEnabled !== false).forEach((p) => {
            const tipo = showcaseTypeOfCategory(p.category);
            const opcao = { value: p.name, label: p.name };
            if (tipo === showcaseType) daVitrine.push(opcao);
            else deOutras.push({ ...opcao, hint: SHOWCASE_TYPE_LABELS[tipo] });
          });

          return [...daVitrine, ...deOutras];
        }, [products, showcaseType]);

        // Produto já cadastrado vai para a vitrine da categoria dele; nome novo
        // entra na vitrine escolhida aqui em cima
        const produtoEscolhido = products.find((p) => normalizeName(p.name) === normalizeName(productName));
        const tipoDestino = produtoEscolhido ? showcaseTypeOfCategory(produtoEscolhido.category) : showcaseType;
        const temEspaco = slots.some((s) => s.unit === currentUnit && s.showcaseType === tipoDestino);

        // A folha continua aberta depois de colocar — fornada sai em vários
        // produtos seguidos —, então o clique repetido entraria duas vezes
        const colocar = useCliqueUnico((nome) => {
          const quantidade = Math.max(1, Number(qty) || 1);
          onQuickAllocate(nome, quantidade, date, null, showcaseType);

          // Comprovante do que acabou de entrar, do mais novo para o mais
          // velho: sem ele a folha limpa o campo e parece que nada aconteceu
          const lancado = {
            chave: `${nome}-${Date.now()}`,
            nome,
            qty: quantidade,
            unidade: produtoEscolhido?.defaultUnit || 'un',
            tipo: tipoDestino
          };
          setLancados((prev) => [lancado, ...prev].slice(0, 5));
          setProductName('');
        });

        const submeter = (e) => {
          e.preventDefault();
          const nome = productName.trim();
          if (!nome) return;
          colocar(nome);
        };

        return (
          <div
            role="dialog"
            aria-modal="true"
            aria-label="Colocar item na vitrine"
            onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}
            className="fixed inset-0 z-50 bg-black/30 backdrop-blur-[2px] flex items-end sm:items-center justify-center sm:p-4"
          >
            <form onSubmit={submeter} className="bottom-sheet px-4 pt-3 sm:p-5 space-y-4">
              <div className="bottom-sheet-grab sm:hidden" />

              <div className="flex items-start justify-between gap-3 pb-3 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Colocar na vitrine</span>
                  <h3 className="t-title text-[#1d1d1f] mt-0.5">Novo item</h3>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  title="Fechar"
                  aria-label="Fechar"
                  className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors"
                >
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              {/* Trocar a vitrine aqui troca a vitrine da tela também: é sempre
                  a mesma vitrine, como na lista de apoio */}
              <div className="segmented flex w-full">
                {SHOWCASE_TYPES.map((tipo) => (
                  <button
                    key={tipo}
                    type="button"
                    className="flex-1 h-9"
                    onClick={() => onChangeShowcaseType(tipo)}
                    data-active={showcaseType === tipo}
                  >
                    {SHOWCASE_TYPE_LABELS[tipo]}
                  </button>
                ))}
              </div>

              <div>
                <label className="t-caption block mb-1.5">
                  Produto <span className="font-normal">· de qualquer vitrine</span>
                </label>
                <PickerField
                  placeholder="Digite ou escolha…"
                  value={productName}
                  options={productOptions}
                  onType={setProductName}
                  onPick={(opt) => setProductName(opt.value)}
                  emptyLabel={`Produto novo — entra como ${categoryOfShowcaseType(showcaseType)} ao colocar`}
                  className="field field-lg font-semibold"
                />
                <p className={`t-micro mt-1.5 ${tipoDestino === showcaseType ? '' : 'text-[#0E0937] font-semibold'}`}>
                  Vai para a vitrine {SHOWCASE_TYPE_LABELS[tipoDestino]}
                </p>
                {!temEspaco && (
                  <p className="t-micro mt-1 ink-expired font-semibold">
                    Esta unidade não tem espaço de {SHOWCASE_TYPE_LABELS[tipoDestino].toLowerCase()} cadastrado.
                  </p>
                )}
              </div>

              <div>
                <label className="t-caption block mb-1.5">Quantidade</label>
                <div className="qty-stepper">
                  <button
                    type="button"
                    onClick={() => setQty((q) => Math.max(1, (Number(q) || 1) - 1))}
                    aria-label="Tirar uma unidade"
                  >
                    −
                  </button>
                  <input
                    type="number"
                    inputMode="numeric"
                    min="1"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    className="field field-lg no-spin tnum"
                  />
                  <button
                    type="button"
                    onClick={() => setQty((q) => (Number(q) || 0) + 1)}
                    aria-label="Somar uma unidade"
                  >
                    +
                  </button>
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {QUICK_QTY_PRESETS.map((n) => (
                    <button
                      key={n}
                      type="button"
                      onClick={() => setQty(n)}
                      data-active={Number(qty) === n}
                      className="chip tnum"
                    >
                      {n}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="t-caption block mb-1.5">Fabricação</label>
                <div className="flex flex-wrap items-center gap-1.5 mb-2">
                  <button type="button" onClick={() => setDate(hoje)} data-active={date === hoje} className="chip">Hoje</button>
                  <button type="button" onClick={() => setDate(ontem)} data-active={date === ontem} className="chip">Ontem</button>
                </div>
                <input
                  type="date"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="field field-lg text-center tnum"
                />
              </div>

              <button type="submit" disabled={!productName.trim()} className="btn btn-primary btn-lg w-full disabled:opacity-40">
                <Icons.Plus className="w-4 h-4" />
                Colocar na vitrine
              </button>

              {/* O que já entrou nesta abertura da folha */}
              {lancados.length > 0 && (
                <div className="card-quiet p-3 space-y-1.5">
                  <div className="flex items-center gap-1.5">
                    <Icons.CheckCircle2 className="w-3.5 h-3.5 ink-fresh shrink-0" />
                    <span className="t-overline">
                      {lancados.length} {lancados.length === 1 ? 'item colocado agora' : 'itens colocados agora'}
                    </span>
                  </div>
                  {lancados.map((l) => (
                    <div key={l.chave} className="flex items-center justify-between gap-2">
                      <span className="text-[12px] font-semibold text-[#1d1d1f] truncate">{l.nome}</span>
                      <span className="t-caption tnum shrink-0">
                        {l.qty} {l.unidade} · {SHOWCASE_TYPE_LABELS[l.tipo]}
                      </span>
                    </div>
                  ))}
                  <button type="button" onClick={onClose} className="btn btn-secondary btn-md w-full mt-1">
                    Pronto
                  </button>
                </div>
              )}
            </form>
          </div>
        );
      };

      // ==========================================
      // ITEM DECREASE MODAL
      // ==========================================
      // A venda de uma unidade acontece com um clique na vitrine; esta janela é
      // para o resto: perda com motivo, baixa em lote e "vendeu tudo".
      const ItemDecreaseModal = ({ item, initialMode = 'venda', onClose, onRecordSale, onRecordLoss, onRecordSellAll }) => {
        if (!item) return null;
        const [mode, setMode] = useState(initialMode);
        const [qty, setQty] = useState(1);
        const [reason, setReason] = useState('vencido');
        const [details, setDetails] = useState('');

        const handleConfirm = useCliqueUnico(() => {
          if (qty <= 0) return;
          if (mode === 'venda') {
            onRecordSale(item.id, qty);
          } else {
            onRecordLoss(item.id, qty, reason, details);
          }
          onClose();
        });

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-[20px] max-w-md w-full p-6 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Baixa de produto</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1">{item.productName}</h3>
                  <p className="t-callout mt-1 tnum">
                    Estoque atual: <strong className="text-[#1d1d1f] font-bold">{item.currentQty} {item.unit}</strong>
                  </p>
                </div>
                <button onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2 my-5">
                <button
                  type="button"
                  onClick={() => setMode('venda')}
                  className={`btn btn-md ${mode === 'venda' ? 'btn-success' : 'btn-secondary'}`}
                >
                  <Icons.ShoppingCart className="w-4 h-4" /> Venda
                </button>
                <button
                  type="button"
                  onClick={() => setMode('perda')}
                  className={`btn btn-md ${mode === 'perda' ? 'btn-danger' : 'btn-secondary'}`}
                >
                  <Icons.Discard className="w-4 h-4" /> Perda
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="t-caption block mb-1.5">Quantidade</label>
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setQty((q) => Math.max(1, q - 1))}
                      className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                    >
                      −
                    </button>
                    <input
                      type="number"
                      min="1"
                      max={item.currentQty}
                      value={qty}
                      onChange={(e) => setQty(Math.min(item.currentQty, Math.max(1, Number(e.target.value) || 1)))}
                      className="field field-md w-20 text-center text-[17px] font-extrabold tnum"
                    />
                    <button
                      onClick={() => setQty((q) => Math.min(item.currentQty, q + 1))}
                      className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                    >
                      +
                    </button>
                  </div>
                </div>

                {mode === 'perda' && (
                  <div className="space-y-3 p-4 surface-expired rounded-2xl">
                    <div>
                      <label className="t-caption block mb-1">Motivo</label>
                      <select value={reason} onChange={(e) => setReason(e.target.value)} className="field field-sm">
                        <option value="vencido">Produto vencido</option>
                        <option value="danificado">Avaria física</option>
                        <option value="qualidade">Alteração de sabor ou textura</option>
                        <option value="quebrado">Queda ou quebra</option>
                      </select>
                    </div>
                    <div>
                      <label className="t-caption block mb-1">Detalhes</label>
                      <input
                        type="text"
                        value={details}
                        onChange={(e) => setDetails(e.target.value)}
                        placeholder="Observações"
                        className="field field-sm"
                      />
                    </div>
                  </div>
                )}

                {/* Os dois que zeram o espaço, com o mesmo fundo cheio dos
                    botões da vitrine. O "perdeu tudo" daqui só preenche a
                    quantidade: quem abriu esta janela veio escolher o motivo */}
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => { onRecordSellAll(item.id); onClose(); }}
                    className="btn btn-success btn-md px-2"
                  >
                    <Icons.CheckCircle2 className="w-4 h-4 shrink-0" />
                    <span className="tnum">Vendeu tudo ({item.currentQty})</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => { setMode('perda'); setQty(item.currentQty); }}
                    className="btn btn-danger btn-md px-2"
                  >
                    <Icons.Discard className="w-4 h-4 shrink-0" />
                    <span className="tnum">Perdeu tudo ({item.currentQty})</span>
                  </button>
                </div>
              </div>

              <div className="flex justify-end gap-2 mt-6">
                <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                <button
                  type="button"
                  onClick={handleConfirm}
                  className={`btn btn-md ${mode === 'venda' ? 'btn-success' : 'btn-danger'}`}
                >
                  Confirmar {mode === 'venda' ? 'venda' : 'perda'}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // BARRA DE DESFAZER DA BAIXA DE UM CLIQUE
      //
      // Venda e perda entram sem confirmar, então o conserto do clique errado
      // fica aqui embaixo por alguns segundos.
      // ==========================================
      const UndoBaixaBar = ({ info, onUndo, onDismiss }) => {
        const perda = info.tabela === 'loss_records';
        const IconeBaixa = perda ? Icons.Discard : Icons.ShoppingCart;

        return (
        <div className="fixed inset-x-0 bottom-4 z-50 flex justify-center px-4 pointer-events-none">
          <div className="pointer-events-auto flex items-center gap-3 rounded-full bg-[#1d1d1f] text-white pl-4 pr-2 py-2 shadow-[0_12px_32px_rgba(0,0,0,0.28)] max-w-full">
            <IconeBaixa className={`w-4 h-4 shrink-0 ${perda ? 'text-[#ffb340]' : 'text-[#5ddc7c]'}`} />
            <span className="text-[13px] font-semibold tracking-[-0.01em] truncate">
              <span className="tnum">{info.qty} {info.item.unit}</span> de {info.item.productName} — {perda ? 'perda registrada' : 'venda registrada'}
            </span>
            <button
              onClick={onUndo}
              className="btn btn-sm bg-white/[0.14] text-white hover:bg-white/25 shrink-0"
            >
              <Icons.History className="w-3.5 h-3.5" />
              Desfazer
            </button>
            <button
              onClick={onDismiss}
              title="Fechar"
              className="w-7 h-7 rounded-full hover:bg-white/15 text-white/70 flex items-center justify-center shrink-0 transition-colors"
            >
              <Icons.X className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
        );
      };

      // ==========================================
      // TELAS DE ESTADO DA CONEXÃO
      // ==========================================

      // ==========================================
      // CMV — AS TELAS
      //
      // Três abas que leem a mesma base e respondem a perguntas diferentes:
      //
      //   Insumos & Fichas  →  o que eu compro e o que entra em cada produto
      //   CMV               →  quanto sobra de cada coisa que eu vendo
      //   Fornecedores      →  o preço subiu? com quem sai mais barato?
      //
      // Quem cadastra é a primeira; as outras duas só mostram.
      // ==========================================

      // O CMV pintado pela faixa em que caiu. A cor é a informação: quem passa
      // o olho na tabela precisa achar o produto ruim sem ler número nenhum.
      const CmvCell = ({ cmv, calculavel, natureza = 'fabricacao', className = '' }) => {
        if (!calculavel) return <span className="t-body ink-quiet">—</span>;
        const s = getCmvStatus(cmv, natureza);
        return (
          <span className={`pill ${s.tone} ${className}`} title={`Meta de ${natureza}: bom até ${CMV_METAS[natureza].bom}%, atenção até ${CMV_METAS[natureza].atencao}%`}>
            <span className={`w-1.5 h-1.5 rounded-full ${s.dot}`} />
            <span className="tnum font-bold">{cmv.toFixed(1)}%</span>
            <span className="font-semibold">{s.label}</span>
          </span>
        );
      };

      // O aviso de que o banco ainda não tem as tabelas do CMV. Mesma ideia do
      // aviso do histórico de produção: a loja continua trabalhando, e a tela
      // diz o que falta rodar em vez de dar erro.
      const CmvSetupNotice = () => (
        <div className="card p-6 sm:p-7">
          <div className="t-overline flex items-center gap-1.5 mb-2">
            <Icons.AlertTriangle className="w-3.5 h-3.5" />
            Falta rodar o banco
          </div>
          <h2 className="t-display">O CMV ainda não está ligado</h2>
          <p className="t-body mt-2">
            As tabelas de insumos e fichas técnicas não existem neste banco. Abra o Supabase →
            {' '}<strong>SQL Editor</strong> → <strong>New query</strong>, cole o arquivo
            {' '}<code className="text-[12px] bg-black/[0.05] px-1.5 py-0.5 rounded">supabase/schema.sql</code>
            {' '}e clique em Run. Nada do que já está lá dentro é apagado.
          </p>
          <p className="t-micro mt-3">Depois de rodar, recarregue esta página.</p>
        </div>
      );

      // ==========================================
      // JANELA DO HISTÓRICO DE COMPRAS
      //
      // A mesma para insumo e para revenda: as duas guardam compra com
      // fornecedor, data, quantidade e valor pago. A diferença é que a compra
      // de revenda tem unidade própria (compra o fardo, vende a lata), e ela
      // só aparece quando quem abriu a janela passa as unidades.
      //
      // É aqui que se vê o preço mudar: cada linha mostra o custo unitário
      // daquela compra, então a coluna inteira é a história do fornecedor.
      // ==========================================
      const PurchaseHistoryModal = ({
        titulo,
        subtitulo,
        compras,
        unidadeBase,
        unidadesCompra = null,
        fornecedores = [],
        onAdd,
        onUpdate,
        onDelete,
        onClose
      }) => {
        const BLANK = {
          supplier: '',
          purchaseDate: getTodayDateString(),
          qty: '',
          purchaseUnit: unidadesCompra ? unidadesCompra[0] : '',
          cost: ''
        };
        const [draft, setDraft] = useState(BLANK);
        const setField = (campo, valor) => setDraft((d) => ({ ...d, [campo]: valor }));

        const ordenadas = comprasOrdenadas(compras);
        const fornecedorOptions = fornecedores.map((f) => ({ value: f, label: f }));

        const custoUnitDe = (c) => {
          const qtd = Number(c.qty) || 0;
          return qtd > 0 ? (Number(c.cost) || 0) / qtd : 0;
        };

        const salvar = (e) => {
          e.preventDefault();
          const qty = Number(draft.qty) || 0;
          const cost = Number(draft.cost) || 0;
          if (qty <= 0 || cost <= 0) return;
          onAdd({
            supplier: draft.supplier.trim(),
            purchaseDate: draft.purchaseDate || null,
            qty,
            purchaseUnit: draft.purchaseUnit || undefined,
            cost
          });
          setDraft({ ...BLANK, supplier: draft.supplier, purchaseDate: draft.purchaseDate });
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto z-50">
            <div className="card w-full max-w-3xl p-5 sm:p-6">
              <div className="flex items-start justify-between gap-3 mb-4">
                <div className="min-w-0">
                  <div className="t-overline flex items-center gap-1.5 mb-1">
                    <Icons.ShoppingCart className="w-3.5 h-3.5" />
                    Compras
                  </div>
                  <h3 className="t-title truncate">{titulo}</h3>
                  {subtitulo && <p className="t-micro mt-0.5">{subtitulo}</p>}
                </div>
                <button onClick={onClose} title="Fechar" className="w-8 h-8 rounded-full bg-black/[0.05] hover:bg-black/[0.09] flex items-center justify-center shrink-0">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <form onSubmit={salvar} className="pt-4 border-t hairline">
                <div className="t-overline mb-2">Lançar compra</div>
                <div className="grid grid-cols-12 gap-2 items-end">
                  <div className="col-span-12 sm:col-span-4">
                    <label className="t-caption block mb-1">Fornecedor</label>
                    <PickerField
                      value={draft.supplier}
                      options={fornecedorOptions}
                      onType={(t) => setField('supplier', t)}
                      onPick={(opt) => setField('supplier', opt.value)}
                      placeholder="De quem comprou"
                      emptyLabel="Fornecedor novo"
                      className="field field-sm"
                    />
                  </div>
                  <div className="col-span-6 sm:col-span-3">
                    <label className="t-caption block mb-1">Data</label>
                    <input
                      type="date"
                      value={draft.purchaseDate}
                      onChange={(e) => setField('purchaseDate', e.target.value)}
                      className="field field-sm"
                    />
                  </div>
                  <div className={unidadesCompra ? 'col-span-3 sm:col-span-1' : 'col-span-6 sm:col-span-2'}>
                    <label className="t-caption block mb-1">Qtd</label>
                    <input
                      type="number"
                      min="0"
                      step="0.001"
                      value={draft.qty}
                      onChange={(e) => setField('qty', e.target.value)}
                      placeholder={unidadeBase === 'un' ? 'ex: 12' : 'ex: 5000'}
                      title={`Quantidade comprada, em ${unidadeBase}`}
                      className="field field-sm text-right tnum no-spin"
                    />
                  </div>
                  {unidadesCompra && (
                    <div className="col-span-3 sm:col-span-2">
                      <label className="t-caption block mb-1">Unid.</label>
                      <select
                        value={draft.purchaseUnit}
                        onChange={(e) => setField('purchaseUnit', e.target.value)}
                        className="field field-sm field-select"
                      >
                        {unidadesCompra.map((u) => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="col-span-6 sm:col-span-2">
                    <label className="t-caption block mb-1">Valor pago</label>
                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      value={draft.cost}
                      onChange={(e) => setField('cost', e.target.value)}
                      placeholder="ex: 18,43"
                      className="field field-sm text-right tnum no-spin"
                    />
                  </div>
                  <div className="col-span-6 sm:col-span-12">
                    <button type="submit" className="btn btn-primary btn-sm w-full sm:w-auto">
                      <Icons.Plus className="w-3.5 h-3.5" />
                      Lançar
                    </button>
                  </div>
                </div>
              </form>

              <div className="rola-x mt-5 pt-4 border-t hairline">
                <table className="w-full text-left">
                  <thead>
                    <tr className="t-overline-sm border-b hairline">
                      <th className="py-2.5 pr-3 font-bold">Fornecedor</th>
                      <th className="py-2.5 px-3 font-bold">Data</th>
                      <th className="py-2.5 px-3 text-right font-bold">Qtd</th>
                      <th className="py-2.5 px-3 text-right font-bold">Valor pago</th>
                      <th className="py-2.5 px-3 text-right font-bold">Custo</th>
                      <th className="py-2.5 pl-3 text-right font-bold">Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ordenadas.length === 0 ? (
                      <tr><td colSpan={6} className="text-center py-8"><p className="t-body ink-quiet">Nenhuma compra lançada ainda</p></td></tr>
                    ) : ordenadas.map((c, idx) => (
                      <tr key={c.id} className="border-t hairline">
                        <td className="py-2 pr-3">
                          <div className="w-32 sm:w-44">
                            <PickerField
                              value={c.supplier || ''}
                              options={fornecedorOptions}
                              onType={(t) => onUpdate({ ...c, supplier: t })}
                              onPick={(opt) => onUpdate({ ...c, supplier: opt.value })}
                              placeholder="Fornecedor"
                              emptyLabel="Fornecedor novo"
                              className="field h-8 pl-2.5 text-[12px]"
                            />
                          </div>
                        </td>
                        <td className="py-2 px-3">
                          <input
                            type="date"
                            value={c.purchaseDate || ''}
                            onChange={(e) => onUpdate({ ...c, purchaseDate: e.target.value })}
                            className="field h-8 px-2 text-[12px] w-32 sm:w-36"
                          />
                        </td>
                        <td className="py-2 px-3">
                          <div className="flex items-center justify-end gap-1">
                            <input
                              type="number"
                              min="0"
                              step="0.001"
                              value={c.qty || ''}
                              onChange={(e) => onUpdate({ ...c, qty: Number(e.target.value) || 0 })}
                              className="field h-8 px-2 text-[12px] text-right tnum no-spin w-20"
                            />
                            <span className="t-micro">{c.purchaseUnit || unidadeBase}</span>
                          </div>
                        </td>
                        <td className="py-2 px-3">
                          <input
                            type="number"
                            min="0"
                            step="0.01"
                            value={c.cost || ''}
                            onChange={(e) => onUpdate({ ...c, cost: Number(e.target.value) || 0 })}
                            className="field h-8 px-2 text-[12px] text-right font-bold tnum no-spin w-24 ml-auto block"
                          />
                        </td>
                        <td className="py-2 px-3 text-right">
                          <span className="t-body tnum">
                            {formatPrecoInsumo(custoUnitDe(c), c.purchaseUnit || unidadeBase)}
                          </span>
                          {idx === 0 && <div className="t-nano ink-quiet">é este que vale</div>}
                        </td>
                        <td className="py-2 pl-3 text-right">
                          <button
                            onClick={() => onDelete(c.id)}
                            title="Excluir esta compra"
                            className="w-7 h-7 rounded-full icon-danger flex items-center justify-center ml-auto"
                          >
                            <Icons.Trash2 className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <p className="t-micro pt-3">
                O custo do item é sempre o da compra mais recente — é o que você vai pagar para repor.
              </p>
            </div>
          </div>
        );
      };

      // ==========================================
      // INSUMOS & FICHAS
      //
      // A tela de cadastro do CMV, em três painéis:
      //
      //   Insumos  → o que se compra, e por quanto
      //   Fichas   → o que entra em cada produto, e quanto aquilo rende
      //   Revenda  → o que se compra pronto para vender
      //
      // A linha do insumo já mostra a última compra e deixa corrigi-la ali
      // mesmo: é o que a loja mais faz — chegou a nota, o preço mudou. O
      // histórico inteiro fica atrás do carrinho, para quando a pergunta for
      // outra ("subiu quanto?", "de quem eu comprava antes?").
      // ==========================================
      const SuppliesRecipesView = ({
        supplies,
        supplyPurchases,
        recipes,
        recipeItems,
        products,
        separatedProducts,
        resalePurchases,
        currentUnit,
        fornecedores,
        onAddSupply,
        onUpdateSupply,
        onDeleteSupply,
        onSetUltimaCompraInsumo,
        onAddSupplyPurchase,
        onUpdateSupplyPurchase,
        onDeleteSupplyPurchase,
        onAddSeparatedProduct,
        onSetSupplyResale,
        onUpdateRecipe,
        onAddRecipeItem,
        onUpdateRecipeItem,
        onDeleteRecipeItem,
        onUpdateSeparatedProduct,
        onSetUltimaCompraRevenda,
        onAddResalePurchase,
        onUpdateResalePurchase,
        onDeleteResalePurchase
      }) => {
        const [painel, setPainel] = useState('insumos');
        const [busca, setBusca] = useState('');
        const [classeFiltro, setClasseFiltro] = useState('todos');
        // Qual histórico está aberto: { tipo: 'insumo' | 'revenda', id }
        const [historico, setHistorico] = useState(null);
        // Produto cuja ficha está aberta
        const [fichaProdutoId, setFichaProdutoId] = useState(null);

        const BLANK_SUPPLY = { name: '', unit: 'g', supplyClass: 'insumo', supplier: '', purchaseDate: getTodayDateString(), qty: '', cost: '', resaleAlso: false };
        const [draft, setDraft] = useState(BLANK_SUPPLY);
        const nomeRef = useRef(null);

        const comprasDoInsumo = (id) => supplyPurchases.filter((c) => c.supplyId === id);
        const comprasDaRevenda = (id) => resalePurchases.filter((c) => c.separatedProductId === id);

        const draftExistente = supplies.find((s) => normalizeName(s.name) === normalizeName(draft.name.trim())) || null;
        const draftUltimaCompra = draftExistente ? ultimaCompra(comprasDoInsumo(draftExistente.id)) : null;

        const aplicarInsumoExistente = (nome) => {
          const existente = supplies.find((s) => normalizeName(s.name) === normalizeName(String(nome || '').trim()));
          if (!existente) return;
          setDraft((d) => ({
            ...d,
            name: existente.name,
            unit: existente.unit || d.unit,
            supplyClass: existente.supplyClass || 'insumo'
          }));
        };

        const primeiraSugestaoCadastro = (lista, texto, getLabel = (x) => x) => {
          const termo = normalizeName(String(texto || '').trim());
          if (!termo) return null;
          const rotulo = (item) => normalizeName(String(getLabel(item) || ''));
          return lista.find((item) => rotulo(item) === termo)
            || lista.find((item) => rotulo(item).startsWith(termo))
            || lista.find((item) => rotulo(item).includes(termo))
            || null;
        };

        const aceitarSugestaoCadastroInsumo = (campo) => {
          const tipo = campo?.dataset?.insumoField || '';

          if (tipo === 'nome') {
            const sugestao = primeiraSugestaoCadastro(supplies, campo.value, (s) => s.name);
            if (!sugestao) return false;
            setDraft((d) => ({
              ...d,
              name: sugestao.name,
              unit: sugestao.unit || d.unit,
              supplyClass: sugestao.supplyClass || 'insumo'
            }));
            return true;
          }

          if (tipo === 'unidade') {
            const sugestao = primeiraSugestaoCadastro(SUPPLY_UNITS, campo.value);
            if (!sugestao) return false;
            setDraft((d) => ({ ...d, unit: String(sugestao) }));
            return true;
          }

          if (tipo === 'classe') {
            const sugestao = primeiraSugestaoCadastro(SUPPLY_CLASSES, campo.value, (c) => c.label);
            if (!sugestao) return false;
            setDraft((d) => ({ ...d, supplyClass: sugestao.value }));
            return true;
          }

          if (tipo === 'fornecedor') {
            const digitado = String(campo.value || '').trim();
            const sugestao = digitado
              ? primeiraSugestaoCadastro(fornecedores, digitado)
              : (draftUltimaCompra?.supplier || '');
            if (!sugestao) return false;
            setDraft((d) => ({ ...d, supplier: String(sugestao) }));
            return true;
          }

          if (tipo === 'qtd' && !String(campo.value || '').trim() && draftUltimaCompra?.qty) {
            setDraft((d) => ({ ...d, qty: String(draftUltimaCompra.qty) }));
            return true;
          }

          if (tipo === 'custo' && !String(campo.value || '').trim() && draftUltimaCompra?.cost) {
            setDraft((d) => ({ ...d, cost: String(draftUltimaCompra.cost) }));
            return true;
          }

          return false;
        };

        const avancarCadastroInsumo = (e) => {
          if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
          const form = e.currentTarget.form;
          if (!form) return;

          // Enter primeiro aceita a sugestão visível/autocomplete daquele campo.
          aceitarSugestaoCadastroInsumo(e.currentTarget);

          const campos = Array.from(form.querySelectorAll('[data-insumo-flow]'));
          const idx = campos.indexOf(e.currentTarget);
          if (idx >= 0 && idx < campos.length - 1) {
            e.preventDefault();
            const proximo = campos[idx + 1];
            requestAnimationFrame(() => {
              proximo.focus();
              if (proximo.select && proximo.tagName === 'INPUT') proximo.select();
            });
          }
        };

        const revendaDaUnidade = separatedProducts.filter((p) => p.unit === currentUnit);

        const revendaDoInsumo = (nome) => revendaDaUnidade.find(
          (p) => normalizeName(p.productName || p.name) === normalizeName(nome)
        ) || null;

        const criarRevendaDoInsumo = (nome, unidade = 'un') => {
          const limpo = String(nome || '').trim();
          if (!limpo || revendaDoInsumo(limpo) || !onAddSeparatedProduct) return;
          onAddSeparatedProduct({
            productName: limpo,
            category: 'revenda',
            currentQty: 0,
            unitOfMeasure: unidade === 'un' ? 'un' : unidade,
            minQty: 0,
            price: 0
          });
        };

        const cadastrar = async (e) => {
          e.preventDefault();
          const nome = draft.name.trim();
          if (!nome) return;

          const qty = Number(draft.qty) || 0;
          const cost = Number(draft.cost) || 0;
          if ((qty > 0 || cost > 0) && !(qty > 0 && cost > 0)) {
            window.alert('Para registrar a compra, preencha quantidade e valor pago.');
            return;
          }

          // Se já existe, esta linha vira uma NOVA COMPRA do mesmo insumo.
          const existente = supplies.find((s) => normalizeName(s.name) === normalizeName(nome));
          let supplyId = existente?.id || null;
          if (existente) {
            // Unidade, classe e revenda são dados mestres do insumo.
            // No formulário rápido de compra, insumo existente não altera esses campos.
          } else {
            const novo = await onAddSupply({ name: nome, unit: draft.unit, supplyClass: draft.supplyClass });
            supplyId = novo?.id || null;
          }

          if (supplyId && qty > 0 && cost > 0) {
            onAddSupplyPurchase(supplyId, {
              supplier: draft.supplier.trim(),
              purchaseDate: draft.purchaseDate || getTodayDateString(),
              qty,
              cost
            });
          }

          if (draft.resaleAlso) {
            criarRevendaDoInsumo(nome, draft.unit);
          }

          setDraft({ ...BLANK_SUPPLY, unit: draft.unit, supplyClass: draft.supplyClass, purchaseDate: getTodayDateString() });
          setTimeout(() => nomeRef.current && nomeRef.current.focus(), 50);
        };

        const insumosFiltrados = supplies.filter((s) => {
          const bateTexto = s.name.toLowerCase().includes(busca.toLowerCase());
          const bateClasse = classeFiltro === 'todos' || (s.supplyClass || 'insumo') === classeFiltro;
          return bateTexto && bateClasse;
        });

        // Produtos de fabricação, com a ficha e o custo já resolvidos
        const produtosComFicha = useMemo(() => products.map((p) => {
          const ficha = fichaDoProduto(p.id, recipes, recipeItems, supplies, supplyPurchases, products);
          return { produto: p, ficha, custoUn: custoPorUnidadeDeVenda(p, ficha) };
        }), [products, recipes, recipeItems, supplies, supplyPurchases]);

        const fichaAberta = produtosComFicha.find((x) => String(x.produto.id) === String(fichaProdutoId)) || null;

        const supplyOptions = supplies.map((s) => ({
          value: s.id,
          label: s.name,
          hint: formatPrecoInsumo(custoUnitarioInsumo(s.id, supplyPurchases), s.unit)
        }));

        const PAINEIS = [
          { id: 'insumos', label: 'Insumos' },
          { id: 'fichas', label: 'Fichas técnicas' },
          { id: 'revenda', label: 'Revenda' }
        ];

        return (
          <div className="space-y-5">
            <div>
              <h2 className="t-display">Insumos &amp; fichas</h2>
              <p className="t-body mt-1">
                O que a casa compra e o que entra em cada produto. É daqui que sai o CMV.
              </p>
            </div>

            <div className="segmented w-full sm:w-auto sm:inline-flex">
              {PAINEIS.map((p) => (
                <button key={p.id} onClick={() => setPainel(p.id)} data-active={painel === p.id} className="flex-1 sm:flex-none h-9 px-4">
                  {p.label}
                </button>
              ))}
            </div>

            {/* ---------------- INSUMOS ---------------- */}
            {painel === 'insumos' && (
              <div className="space-y-5">
                <div className="card p-6 sm:p-7">
                  <div className="t-overline flex items-center gap-1.5 mb-2">
                    <Icons.Package className="w-3.5 h-3.5" />
                    Cadastro
                  </div>
                  <h3 className="t-title">Novo insumo</h3>
                  <p className="t-body mt-1.5">
                    Cadastre o insumo e a compra na mesma linha. Se o insumo já existir, o lançamento vira uma nova compra no histórico.
                  </p>

                  <form onSubmit={cadastrar} className="mt-5 pt-5 border-t hairline">
                    <div className="grid grid-cols-12 gap-2 sm:gap-3 items-end">
                      <div className="col-span-12 sm:col-span-5">
                        <label className="t-caption block mb-1">Insumo</label>
                        <PickerField
                          inputRef={nomeRef}
                          value={draft.name}
                          options={supplies.map((s) => ({
                            value: s.name,
                            label: s.name,
                            hint: `${s.unit} · ${SUPPLY_CLASSES.find((c) => c.value === (s.supplyClass || 'insumo'))?.label || 'Ingrediente'}`
                          }))}
                          onType={(nome) => {
                            const existente = supplies.find((s) => normalizeName(s.name) === normalizeName(String(nome || '').trim()));
                            setDraft((d) => existente
                              ? { ...d, name: nome, unit: existente.unit || d.unit, supplyClass: existente.supplyClass || 'insumo' }
                              : { ...d, name: nome });
                          }}
                          onPick={(opt) => aplicarInsumoExistente(opt.value)}
                          onKeyDown={avancarCadastroInsumo}
                          inputProps={{ 'data-insumo-flow': true, 'data-insumo-field': 'nome' }}
                          placeholder="Digite ou escolha um insumo"
                          emptyLabel="Insumo novo — será cadastrado ao salvar"
                          className="field field-md font-semibold"
                        />
                      </div>
                      <div className="col-span-4 sm:col-span-2">
                        <label className="t-caption block mb-1">Unidade</label>
                        {draftExistente ? (
                          <div
                            title="Unidade fixa do cadastro. Para alterar, use a tabela de insumos."
                            className="field field-md flex items-center px-3 bg-black/[0.035] text-[#86868b] cursor-not-allowed"
                          >
                            {draft.unit}
                          </div>
                        ) : (
                          <PickerField
                            value={draft.unit}
                            options={SUPPLY_UNITS.map((u) => ({ value: u, label: u }))}
                            onPick={(opt) => setDraft((d) => ({ ...d, unit: opt.value }))}
                            onKeyDown={avancarCadastroInsumo}
                            inputProps={{ 'data-insumo-flow': true, 'data-insumo-field': 'unidade' }}
                            title="Unidade do novo insumo"
                            className="field field-md"
                          />
                        )}
                      </div>
                      <div className="col-span-8 sm:col-span-3">
                        <label className="t-caption block mb-1">Classe</label>
                        {draftExistente ? (
                          <div
                            title="Classe fixa do cadastro. Para alterar, use a tabela de insumos."
                            className="field field-md flex items-center px-3 bg-black/[0.035] text-[#86868b] cursor-not-allowed"
                          >
                            {SUPPLY_CLASSES.find((c) => c.value === draft.supplyClass)?.label || draft.supplyClass}
                          </div>
                        ) : (
                          <PickerField
                            value={draft.supplyClass}
                            options={SUPPLY_CLASSES}
                            onPick={(opt) => setDraft((d) => ({ ...d, supplyClass: opt.value }))}
                            onKeyDown={avancarCadastroInsumo}
                            inputProps={{ 'data-insumo-flow': true, 'data-insumo-field': 'classe' }}
                            title="Classe do novo insumo"
                            className="field field-md"
                          />
                        )}
                      </div>
                      <div className="col-span-12 sm:col-span-2">
                        <label className="t-caption block mb-1">Também é revenda?</label>
                        <label className="field field-md flex items-center gap-2 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={draftExistente ? !!revendaDoInsumo(draftExistente.name) : draft.resaleAlso}
                            disabled={!!draftExistente}
                            onChange={(e) => setDraft((d) => ({ ...d, resaleAlso: e.target.checked }))}
                            className="w-4 h-4 disabled:opacity-55 disabled:cursor-not-allowed"
                          />
                          <span className={`t-callout font-semibold ${draftExistente ? 'text-[#86868b]' : ''}`}>
                            Revenda também{draftExistente ? ' · edite na tabela' : ''}
                          </span>
                        </label>
                      </div>
                      <div className="col-span-12 sm:col-span-4">
                        <label className="t-caption block mb-1">Fornecedor</label>
                        <PickerField
                          value={draft.supplier}
                          options={fornecedores.map((f) => ({ value: f, label: f }))}
                          onType={(supplier) => setDraft((d) => ({ ...d, supplier }))}
                          onPick={(opt) => setDraft((d) => ({ ...d, supplier: opt.value }))}
                          onKeyDown={avancarCadastroInsumo}
                          inputProps={{ 'data-insumo-flow': true, 'data-insumo-field': 'fornecedor' }}
                          placeholder={draftUltimaCompra?.supplier || 'Fornecedor'}
                          emptyLabel="Fornecedor novo — será salvo com esta compra"
                          className="field field-md"
                        />
                      </div>
                      <div className="col-span-6 sm:col-span-2">
                        <label className="t-caption block mb-1">Data</label>
                        <input
                          type="date"
                          value={draft.purchaseDate}
