        ajuste: { label: 'Contagem acertada', dot: 'bg-[#0071e3]', text: 'text-[#0058b0]' },
        pulado: { label: 'Pulado', dot: 'bg-[#c7c7cc]', text: 'text-[#86868b]' }
      };

      // A resposta de um item guarda o quanto foi vendido e o quanto foi
      // perdido nele, porque as duas coisas cabem no mesmo item: metade da
      // bandeja saiu vendida e duas venceram. "tipo" só diz o que aconteceu
      // quando não houve baixa nenhuma.
      const CHECKLIST_RESPOSTA_VAZIA = { venda: 0, perda: 0, ajuste: 0, tipo: 'igual' };

      const descreverResposta = (r) => {
        if (r.tipo === 'ajuste') return `Contagem acertada · +${r.ajuste}`;
        if (r.tipo === 'pulado') return 'Pulado';
        const partes = [];
        if (r.venda > 0) partes.push(`Vendeu ${r.venda}`);
        if (r.perda > 0) partes.push(`Perdeu ${r.perda}`);
        return partes.length > 0 ? partes.join(' · ') : 'Continua igual';
      };

      // A perda manda na cor: um item que vendeu oito e perdeu duas é o item
      // que teve perda, que é o que a pessoa procura na lista do fim
      const corResposta = (r) => {
        if (r.perda > 0) return CHECKLIST_RESULTADOS.perda.text;
        if (r.venda > 0) return CHECKLIST_RESULTADOS.venda.text;
        return CHECKLIST_RESULTADOS[r.tipo].text;
      };

      const ShowcaseChecklist = ({
        currentUnit, slots, slotItems, products, standardPlans, showcaseType,
        onRecordSale, onRecordLoss, onSetQty, onUndoBaixa, onClose
      }) => {
        // Qual vitrine está sendo conferida. Começa na que está aberta na
        // tela, e "Todas" atravessa a loja inteira de uma vez.
        const [escopo, setEscopo] = useState(showcaseType);
        const [index, setIndex] = useState(0);
        const [passo, setPasso] = useState('acoes'); // acoes | contar | destino | motivo
        const [restante, setRestante] = useState(0);
        const [saiu, setSaiu] = useState(0);
        const [resultados, setResultados] = useState([]);
        // A última baixa registrada, enquanto ela ainda pode ser desfeita
        const [ultima, setUltima] = useState(null);

        const dayOfWeek = getTodayDayOfWeek();

        // A fila é montada quando a conferência começa e quando se troca de
        // vitrine — e só aí. Item que zera no caminho sai da vitrine, mas não
        // pode sumir do meio da fila e embaralhar o "item 3 de 12".
        const fila = useMemo(() => {
          const doEscopo = slots.filter(
            (s) => s.unit === currentUnit && (escopo === 'todas' || s.showcaseType === escopo)
          );
          const porId = {};
          doEscopo.forEach((s) => { porId[s.id] = s; });

          return slotItems
            .filter((i) => porId[i.slotId] && (i.currentQty || 0) > 0)
            .map((i) => ({
              id: i.id,
              slotId: i.slotId,
              productId: i.productId,
              productName: i.productName,
              slot: porId[i.slotId]
            }))
            .sort((a, b) =>
              compareShowcase(a.slot, b.slot)
              || a.slot.slotNumber - b.slot.slotNumber
              || a.productName.localeCompare(b.productName, 'pt-BR')
            );
        }, [escopo, currentUnit]);

        // Trocar de vitrine é começar outra conferência
        useEffect(() => {
          setIndex(0);
          setPasso('acoes');
          setResultados([]);
          setUltima(null);
        }, [escopo]);

        const total = fila.length;
        const entrada = index < total ? fila[index] : null;

        // O item pode ter zerado e voltado pelo desfazer com outro id: aí ele
        // é reconhecido pelo mesmo produto no mesmo espaço
        const item = entrada
          ? slotItems.find((i) => i.id === entrada.id)
            || slotItems.find((i) => i.slotId === entrada.slotId && i.productId === entrada.productId)
          : null;

        const product = item ? products.find((p) => p.id === item.productId) : null;
        const statusInfo = item ? getSlotItemStatus(item, product) : null;

        // Quanto o padrão de hoje manda ter neste espaço — o número que diz se
        // o que sobrou ali é pouco ou muito
        const padraoHoje = entrada
          ? standardPlans
              .filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === dayOfWeek && sp.slotId === entrada.slotId)
              .reduce((soma, sp) => soma + (sp.idealQty || 0), 0)
          : 0;

        const escopoLabel = escopo === 'todas' ? 'de toda a loja' : SHOWCASE_TYPE_LABELS[escopo].toLowerCase();

        // ------------------------------------------
        // Guardar a resposta e passar para o próximo
        // ------------------------------------------
        // O item da vez tem uma resposta só, que vai sendo somada enquanto a
        // conferência está nele
        const resposta = entrada ? resultados.find((r) => r.chave === entrada.id) : null;
        const temBaixa = !!resposta && (resposta.venda > 0 || resposta.perda > 0);

        const responder = (mudanca) => {
          setResultados((prev) => {
            const anterior = prev.find((r) => r.chave === entrada.id);
            const base = anterior || { ...CHECKLIST_RESPOSTA_VAZIA, chave: entrada.id, nome: entrada.productName };
            return [...prev.filter((r) => r.chave !== entrada.id), { ...base, ...mudanca(base) }];
          });
        };

        const proximo = () => {
          setPasso('acoes');
          setIndex((i) => i + 1);
        };

        // A baixa entra na conta do item e fica na barra de baixo, de onde
        // ainda pode voltar atrás
        const guardarBaixa = (campo, qty, baixa) => {
          responder((base) => ({ [campo]: base[campo] + qty, tipo: 'baixa' }));
          setUltima(baixa
            ? { baixa, indice: index, campo, qty, texto: `${qty} ${item.unit} de ${entrada.productName}` }
            : null);
        };

        // Seguir adiante. Sem baixa nenhuma no item, seguir é dizer que ele
        // continua igual; depois de uma baixa, é só fechar o item — e aí o
        // desfazer da última baixa continua na tela, que é onde ela ainda
        // pode ser consertada.
        const seguir = () => {
          if (!temBaixa) {
            responder(() => ({ tipo: 'igual' }));
            setUltima(null);
          }
          proximo();
        };

        const pular = () => {
          responder(() => ({ tipo: 'pulado' }));
          setUltima(null);
          proximo();
        };

        const voltar = () => {
          setPasso('acoes');
          setIndex((i) => Math.max(0, i - 1));
        };

        // Um toque tira uma unidade. Quando essa unidade é a última do
        // espaço, não sobra nada para responder e a conferência já anda.
        const venderUm = async () => {
          const ultimaUnidade = item.currentQty <= 1;
          const baixa = await onRecordSale(item.id, 1);
          guardarBaixa('venda', 1, baixa);
          if (ultimaUnidade) proximo();
        };

        // O motivo da perda de uma unidade entra como "vencido", que é a
        // perda do dia a dia da vitrine — igual ao toque da vitrine física.
        // Perda do lote inteiro é que pergunta o motivo.
        const perderUm = async () => {
          const ultimaUnidade = item.currentQty <= 1;
          const baixa = await onRecordLoss(item.id, 1, 'vencido', '');
          guardarBaixa('perda', 1, baixa);
          if (ultimaUnidade) proximo();
        };

        const venderTudo = async () => {
          const qty = item.currentQty;
          const baixa = await onRecordSale(item.id, qty);
          guardarBaixa('venda', qty, baixa);
          proximo();
        };

        const perderTudo = () => {
          setSaiu(item.currentQty);
          setPasso('motivo');
        };

        const abrirContagem = () => {
          setRestante(item.currentQty);
          setPasso('contar');
        };

        // O que sobrou na vitrine vira a conta do que saiu — e o que saiu
        // ainda precisa dizer se foi venda ou perda
        const confirmarContagem = () => {
          const atual = item.currentQty;
          if (restante === atual) return seguir();
          if (restante > atual) {
            // Recontagem para cima não é venda nem perda: só acerta o número
            onSetQty(item.id, restante);
            responder((base) => ({ ajuste: base.ajuste + (restante - atual), tipo: 'ajuste' }));
            setUltima(null);
            return proximo();
          }
          setSaiu(atual - restante);
          setPasso('destino');
        };

        const confirmarVenda = async () => {
          const baixa = await onRecordSale(item.id, saiu);
          guardarBaixa('venda', saiu, baixa);
          proximo();
        };

        const confirmarPerda = async (motivo) => {
          const baixa = await onRecordLoss(item.id, saiu, motivo, '');
          guardarBaixa('perda', saiu, baixa);
          proximo();
        };

        // Desfazer devolve as unidades, tira a quantidade da conta do item e
        // traz a conferência de volta para ele, para a pessoa responder de
        // novo. Item que ficou sem baixa nenhuma sai da lista do fim.
        const desfazerUltima = () => {
          if (!ultima) return;
          const alvo = fila[ultima.indice];
          onUndoBaixa(ultima.baixa);
          if (alvo) {
            setResultados((prev) => prev
              .map((r) => r.chave === alvo.id
                ? { ...r, [ultima.campo]: Math.max(0, r[ultima.campo] - ultima.qty) }
                : r)
              .filter((r) => r.tipo !== 'baixa' || r.venda > 0 || r.perda > 0));
          }
          setIndex(ultima.indice);
          setPasso('acoes');
          setUltima(null);
        };

        // Venda e perda contam item, não unidade: o que a pessoa quer saber
        // no fim é em quantos espaços ela mexeu
        const contarResultado = (tipo) => resultados.filter((r) => (
          tipo === 'venda' ? r.venda > 0
            : tipo === 'perda' ? r.perda > 0
              : r.tipo === tipo
        )).length;

        // Toque tira 1, segurar tira o lote inteiro — o mesmo gesto dos
        // botões da vitrine física
        const vendeu = useLongPress(venderTudo, venderUm);
        const perdeu = useLongPress(perderTudo, perderUm);

        // Atalhos de teclado. Quem confere no computador anda pela vitrine sem
        // tirar a mão do teclado: seta esquerda vendeu 1, seta direita perdeu 1
        // e Enter fecha o item e chama o próximo — a mesma coisa que os três
        // botões da tela fazem. Esc fecha a conferência.
        //
        // Os atalhos só valem no passo das ações, com um item na frente: na
        // contagem e no motivo as setas são do campo e dos botões, não da
        // conferência. Tecla segurada não repete a baixa, e Enter em um botão
        // com foco é do botão — senão o mesmo Enter faria as duas coisas.
        useEffect(() => {
          const digitando = (alvo) => !!alvo && (
            alvo.tagName === 'INPUT'
            || alvo.tagName === 'TEXTAREA'
            || alvo.tagName === 'SELECT'
            || alvo.isContentEditable
          );

          const aoTeclar = (e) => {
            if (e.key === 'Escape') return onClose();
            if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
            if (digitando(e.target)) return;
            if (passo !== 'acoes' || !entrada || !item) return;

            if (e.key === 'Enter') {
              if (e.target && e.target.tagName === 'BUTTON') return;
              e.preventDefault();
              seguir();
            } else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              venderUm();
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              perderUm();
            }
          };

          window.addEventListener('keydown', aoTeclar);
          return () => window.removeEventListener('keydown', aoTeclar);
        }, [passo, entrada, item, temBaixa, index]);

        const botaoGrande = 'btn btn-lg w-full text-[14px]';

        return (
          <div
            role="dialog"
            aria-modal="true"
            aria-label="Checklist da vitrine"
            className="fixed inset-0 z-50 bg-black/30 backdrop-blur-[2px] flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto"
          >
            <div className="bg-white rounded-[24px] w-full max-w-lg my-auto shadow-[0_24px_64px_rgba(0,0,0,0.24)] overflow-hidden">
              {/* Cabeçalho: onde está a conferência e quanto falta */}
              <div className="px-5 pt-4 pb-3.5 border-b hairline space-y-3">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <span className="t-overline">Conferência da vitrine</span>
                    <h2 className="t-title text-[#1d1d1f] mt-0.5">Checklist</h2>
                  </div>
                  <button
                    onClick={onClose}
                    title="Fechar a conferência"
                    aria-label="Fechar a conferência"
                    className="w-8 h-8 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <div className="segmented flex w-full">
                  {[...SHOWCASE_TYPES, 'todas'].map((tipo) => (
                    <button
                      key={tipo}
                      className="flex-1"
                      onClick={() => setEscopo(tipo)}
                      data-active={escopo === tipo}
                    >
                      {tipo === 'todas' ? 'Todas' : SHOWCASE_TYPE_LABELS[tipo]}
                    </button>
                  ))}
                </div>

                {total > 0 && (
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="t-caption tnum">
                        {index >= total ? `${total} de ${total}` : `Item ${index + 1} de ${total}`}
                      </span>
                      <span className="t-caption tnum">
                        {resultados.length} {resultados.length === 1 ? 'respondido' : 'respondidos'}
                      </span>
                    </div>
                    <div className="h-1.5 rounded-full bg-black/[0.07] overflow-hidden">
                      <div
                        className="h-full bg-[#0071e3] rounded-full transition-all"
                        style={{ width: `${Math.min(100, (index / total) * 100)}%` }}
                      />
                    </div>
                  </div>
                )}
              </div>

              {/* Nada montado nesta vitrine */}
              {total === 0 && (
                <div className="px-5 py-10 text-center space-y-3">
                  <p className="t-body text-[#86868b]">Não tem nada na vitrine {escopoLabel} para conferir.</p>
                  <button onClick={onClose} className="btn btn-secondary btn-md">Fechar</button>
                </div>
              )}

              {/* Fim da fila: o resumo do que a conferência registrou */}
              {total > 0 && index >= total && (
                <div className="px-5 py-6 space-y-4">
                  <div className="text-center space-y-2">
                    <div className="w-14 h-14 rounded-full bg-[#34c759]/12 flex items-center justify-center mx-auto">
                      <Icons.CheckCircle2 className="w-7 h-7 text-[#1d7a35]" />
                    </div>
                    <h3 className="t-title text-[#1d1d1f]">Conferência concluída</h3>
                    <p className="t-callout">
                      {total} {total === 1 ? 'item conferido' : 'itens conferidos'} na vitrine {escopoLabel}
                    </p>
                  </div>

                  <div className="flex items-center justify-center gap-2 flex-wrap">
                    {['venda', 'perda', 'ajuste', 'igual', 'pulado']
                      .filter((tipo) => contarResultado(tipo) > 0)
                      .map((tipo) => (
                        <span key={tipo} className={`pill bg-black/[0.05] tnum ${CHECKLIST_RESULTADOS[tipo].text}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${CHECKLIST_RESULTADOS[tipo].dot}`} />
                          {contarResultado(tipo)} {CHECKLIST_RESULTADOS[tipo].label.toLowerCase()}
                        </span>
                      ))}
                  </div>

                  {resultados.length > 0 && (
                    <div className="card-quiet max-h-56 overflow-y-auto divide-hairline">
                      {resultados.map((r) => (
                        <div key={r.chave} className="px-3.5 py-2 flex items-center justify-between gap-2">
                          <span className="text-[12.5px] font-semibold truncate">{r.nome}</span>
                          <span className={`t-caption text-[11px] tnum shrink-0 ${corResposta(r)}`}>
                            {descreverResposta(r)}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => { setIndex(0); setResultados([]); setPasso('acoes'); setUltima(null); }}
                      className="btn btn-secondary btn-md"
                    >
                      Conferir de novo
                    </button>
                    <button onClick={onClose} className="btn btn-primary btn-md">Fechar</button>
                  </div>
                </div>
              )}

              {/* O item que zerou enquanto a conferência andava */}
              {entrada && !item && (
                <div className="px-5 py-8 text-center space-y-3">
                  <p className="t-body text-[#86868b]">
                    <strong className="text-[#1d1d1f]">{entrada.productName}</strong> já saiu da vitrine.
                  </p>
                  <div className="flex justify-center gap-2">
                    <button onClick={voltar} disabled={index === 0} className="btn btn-secondary btn-md disabled:opacity-40">
                      Voltar
                    </button>
                    <button onClick={() => setIndex((i) => i + 1)} className="btn btn-primary btn-md">Próximo</button>
                  </div>
                </div>
              )}

              {/* O item da vez */}
              {entrada && item && (
                <div className="px-5 py-5 space-y-4">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="pill bg-black/[0.05] text-[#6e6e73] tnum">
                      {entrada.slot.sectionTitle} · espaço {entrada.slot.slotNumber}
                    </span>
                    <span className={`pill ${statusInfo.bgClass} ${statusInfo.textClass}`}>
                      {statusInfo.label}
                    </span>
                  </div>

                  <h3 className="t-title text-[#1d1d1f] leading-[1.2]">
                    <mark className={`mark ${statusInfo.markClass}`}>{item.productName}</mark>
                  </h3>

                  <p className="t-caption flex items-center gap-1.5 flex-wrap">
                    <Icons.User className="w-3.5 h-3.5 shrink-0" />
                    {getResponsibleName(product)}
                    <span>·</span>
                    <span className="tnum">fabricado em {formatDateBR(item.manufactureDate)}</span>
                  </p>

                  <div className="card-quiet p-3.5 flex items-end justify-between gap-3">
                    <div>
                      <span className="t-overline">Na vitrine agora</span>
                      <p className="tnum text-[30px] font-extrabold leading-none mt-1.5 text-[#1d1d1f]">
                        {item.currentQty}
                        <span className="text-[13px] font-semibold text-[#86868b] ml-1">{item.unit}</span>
                      </p>
                    </div>
                    <div className="t-caption text-[11px] tnum text-right">
                      <span className="block">lote de {item.producedQty || item.currentQty}</span>
                      {padraoHoje > 0 && <span className="block">padrão de hoje {padraoHoje}</span>}
                    </div>
                  </div>

                  {/* As baixas do item, no gesto da vitrine: toque tira 1,
                      segurar tira o lote todo. Contar o que sobrou continua
                      aqui embaixo, para o espaço que saiu quase inteiro. */}
                  {passo === 'acoes' && (
                    <div className="space-y-2">
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          {...vendeu}
                          title={`Venda 1 (seta esquerda) — segure para vender as ${item.currentQty}`}
                          aria-label="Venda uma unidade, segure para vender tudo"
                          className="btn btn-lg btn-success-quiet text-[14px] px-3"
                        >
                          <Icons.ShoppingCart className="w-5 h-5 shrink-0" />
                        </button>
                        <button
                          {...perdeu}
                          title={`Perda de 1 (seta direita) — segure para perder as ${item.currentQty}`}
                          aria-label="Registre uma perda, segure para perder tudo"
                          className="btn btn-lg btn-danger-quiet text-[14px] px-3"
                        >
                          <Icons.AlertTriangle className="w-5 h-5 shrink-0" />
                        </button>
                      </div>

                      <p className="t-caption text-[11px] text-center">
                        Toque baixa 1 · segure para baixar as <span className="tnum">{item.currentQty}</span> de uma vez ·
                        a perda de 1 entra como vencida
                      </p>

                      {/* Os mesmos três botões no teclado, para quem confere
                          no computador */}
                      <p className="t-caption text-[11px] text-center so-teclado">
                        <span className="tecla">←</span> vendeu 1 ·
                        <span className="tecla ml-1">→</span> perdeu 1 ·
                        <span className="tecla ml-1">Enter</span> próximo item
                      </p>

                      {/* O que já entrou neste item, enquanto a conferência
                          está nele */}
                      {temBaixa && (
                        <p className={`t-caption text-[11px] text-center tnum font-semibold ${corResposta(resposta)}`}>
                          {descreverResposta(resposta)} neste item
                        </p>
                      )}

                      <button
                        onClick={seguir}
                        title={temBaixa ? 'Pronto — próximo item (Enter)' : 'Continua igual — próximo item (Enter)'}
                        className={`${botaoGrande} ${temBaixa ? 'btn-primary' : 'btn-secondary'}`}
                      >
                        <Icons.CheckSquare className="w-4 h-4 shrink-0" />
                        {temBaixa ? 'Pronto — próximo item' : 'Continua igual'}
                      </button>

                      <button onClick={abrirContagem} className="btn btn-sm btn-secondary w-full text-[#6e6e73]">
                        <Icons.Layers className="w-3.5 h-3.5 shrink-0" />
                        Saiu bastante — contar o que sobrou
                      </button>

                      <div className="flex items-center justify-between pt-1">
                        <button
                          onClick={voltar}
                          disabled={index === 0}
                          className="btn btn-sm btn-secondary disabled:opacity-40"
                        >
                          <Icons.ChevronLeft className="w-3.5 h-3.5" />
                          Voltar
                        </button>
                        {!temBaixa && (
                          <button onClick={pular} className="btn btn-sm text-[#6e6e73] hover:bg-black/[0.05]">
                            Pular este
                            <Icons.ChevronRight className="w-3.5 h-3.5" />
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Contagem: a pessoa olha a bandeja e diz quanto restou */}
                  {passo === 'contar' && (
                    <div className="space-y-3">
                      <p className="t-body text-center">
                        Conte o que sobrou na vitrine agora — em {item.unit}
                      </p>

                      <div className="flex items-center justify-center gap-4">
                        <button
                          onClick={() => setRestante((r) => Math.max(0, r - 1))}
                          aria-label="Menos um"
                          className="w-12 h-12 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[22px] font-bold flex items-center justify-center transition-colors"
                        >
                          −
                        </button>
                        {/* A largura vem do invólucro: .field sozinho ocupa a
                            linha inteira */}
                        <div className="w-24 shrink-0">
                          <input
                            type="text"
                            inputMode="numeric"
                            value={restante}
                            onChange={(e) => setRestante(Math.max(0, Number(e.target.value.replace(/\D/g, '')) || 0))}
                            onFocus={(e) => e.target.select()}
                            aria-label="Quantidade que sobrou na vitrine"
                            className="field h-14 text-center text-[26px] font-extrabold tnum"
                          />
                        </div>
                        <button
                          onClick={() => setRestante((r) => r + 1)}
                          aria-label="Mais um"
                          className="w-12 h-12 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[22px] font-bold flex items-center justify-center transition-colors"
                        >
                          +
                        </button>
                      </div>

                      <div className="flex items-center justify-center gap-2">
                        <button onClick={() => setRestante(0)} className="btn btn-sm btn-secondary">Nenhum</button>
                        <button onClick={() => setRestante(Math.floor(item.currentQty / 2))} className="btn btn-sm btn-secondary">
                          Metade
                        </button>
                        <button onClick={() => setRestante(item.currentQty)} className="btn btn-sm btn-secondary tnum">
                          Todos ({item.currentQty})
                        </button>
                      </div>

                      <p className="t-caption text-center">
                        {restante === item.currentQty
                          ? 'Nada saiu deste espaço'
                          : restante > item.currentQty
                            ? `Entram ${restante - item.currentQty} na contagem — sem venda nem perda`
                            : `Saíram ${item.currentQty - restante} ${item.unit} — no próximo passo você diz se foi venda ou perda`}
                      </p>

                      <button onClick={confirmarContagem} className={`${botaoGrande} btn-primary`}>
                        Confirmar
                      </button>
                      <button onClick={() => setPasso('acoes')} className="btn btn-secondary btn-md w-full">
                        Voltar
                      </button>
                    </div>
                  )}

                  {/* O que saiu foi vendido ou foi perdido */}
                  {passo === 'destino' && (
                    <div className="space-y-3">
                      <p className="t-body text-center">
                        Saíram <strong className="text-[#1d1d1f] tnum">{saiu} {item.unit}</strong>. O que aconteceu com eles?
                      </p>
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={confirmarVenda} className="btn btn-lg btn-success text-[14px] px-3">
                          <Icons.ShoppingCart className="w-4 h-4 shrink-0" />
                          Vendidos
                        </button>
                        <button onClick={() => setPasso('motivo')} className="btn btn-lg btn-danger text-[14px] px-3">
                          <Icons.AlertTriangle className="w-4 h-4 shrink-0" />
                          Perdidos
                        </button>
                      </div>
                      <button onClick={() => setPasso('contar')} className="btn btn-secondary btn-md w-full">
                        Voltar
                      </button>
                    </div>
                  )}

                  {/* O motivo da perda, que é o que o relatório separa depois */}
                  {passo === 'motivo' && (
                    <div className="space-y-3">
                      <p className="t-body text-center">
                        Por que <strong className="text-[#1d1d1f] tnum">{saiu} {item.unit}</strong> foram perdidos?
                      </p>
                      <div className="grid grid-cols-2 gap-2">
                        {CHECKLIST_MOTIVOS.map((motivo) => (
                          <button
                            key={motivo.value}
                            onClick={() => confirmarPerda(motivo.value)}
                            className="btn btn-md btn-secondary px-2"
                          >
                            {motivo.label}
                          </button>
                        ))}
                      </div>
                      <button onClick={() => setPasso('acoes')} className="btn btn-secondary btn-md w-full">
                        Voltar
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* A última baixa, enquanto ela ainda pode voltar atrás */}
              {ultima && (
                <div className="px-4 py-2.5 bg-[#1d1d1f] text-white flex items-center justify-between gap-3">
                  <span className="text-[12px] font-semibold tracking-[-0.01em] truncate">
                    {ultima.campo === 'perda' ? 'Perda' : 'Venda'} registrada · <span className="tnum">{ultima.texto}</span>
                  </span>
                  <button onClick={desfazerUltima} className="btn btn-sm bg-white/[0.14] text-white hover:bg-white/25 shrink-0">
                    <Icons.History className="w-3.5 h-3.5" />
                    Desfazer
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // VITRINE FÍSICA
      // ==========================================
      // A vitrine aberta em forma de lista: um cartão por vitrine e, dentro
      // dele, uma linha por item — do mais velho para o mais novo. Quem confere
      // começa por cima e vai descendo, que é a ordem em que o balcão gira: o
      // que está há mais tempo exposto sai primeiro, e o que venceu nunca fica
      // escondido no meio.
      //
      // Em que espaço do móvel o item está não entra aqui: quem procura na
      // vitrine acha pelo nome, e a lista fica limpa. Do móvel fica só o que
      // tem dentro e a porcentagem do padrão de hoje, no alto do cartão.
      //
      // O desenho é o mesmo do pedido de produção: um cartão por móvel e, dentro
      // dele, uma linha por item. Só a quantidade muda de lugar — no pedido ela
      // é uma bolinha na ponta direita; aqui ela vem escrita na frente do nome,
      // porque na conferência o número é a primeira coisa que se lê.
      //
      // A quantidade é de leitura: nesta tela ela só muda por venda ou perda,
      // que é o que de fato acontece no balcão. Acerto de contagem é conversa
      // da lista de apoio, ao lado.
      const ShowcaseGrid = ({ currentUnit, slots, slotItems, products, standardPlans, filterType, onChangeFilterType, onQuickSale, onRecordSellAll, onQuickLoss, onOpenSlot }) => {
        const dayOfWeek = getTodayDayOfWeek();

        const dayPlans = useMemo(
          () => standardPlans.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === dayOfWeek),
          [standardPlans, currentUnit, dayOfWeek]
        );

        const unitSlots = useMemo(() => {
          return slots.filter((s) => s.unit === currentUnit && s.showcaseType === filterType);
        }, [slots, currentUnit, filterType]);

        const blocos = useMemo(() => {
          return groupByShowcase(unitSlots, (slot) => slot).map((bloco) => {
            const espacos = [...bloco.entries].sort((a, b) => a.slotNumber - b.slotNumber);
            const porEspaco = {};
            espacos.forEach((slot) => { porEspaco[slot.id] = slot; });

            const doBloco = slotItems.filter((item) => porEspaco[item.slotId]);

            // Fabricação mais antiga primeiro. Item sem data entra como se
            // fosse de hoje, no fim da fila; empate se resolve pelo nome, para
            // a lista não dançar a cada conferência.
            const linhas = doBloco
              .map((item) => ({ item, slot: porEspaco[item.slotId] }))
              .sort((a, b) =>
                (a.item.manufactureDate || '9999-12-31').localeCompare(b.item.manufactureDate || '9999-12-31')
                || a.item.productName.localeCompare(b.item.productName, 'pt-BR')
              );

            const ocupados = new Set(doBloco.map((item) => item.slotId));
            const livres = espacos.filter((slot) => !ocupados.has(slot.id));
            const totalUn = doBloco.reduce((soma, item) => soma + item.currentQty, 0);

            // Quantos produtos diferentes o móvel está segurando. Dois lotes
            // do mesmo produto — o de ontem e o de hoje, lado a lado — são um
            // produto só: eles dividem o mesmo espaço na vitrine, e contar
            // dois seria dizer que o móvel está mais apertado do que está.
            const produtos = new Set(doBloco.map((item) => item.productId || item.productName));
            // Produto que não coube em espaço próprio está dividindo espaço
            // com outro. É o que faz o móvel passar de 100%: mais produto do
            // que lugar para ele.
            const dividindo = Math.max(0, produtos.size - espacos.length);

            // Quanto o padrão de hoje manda ter neste móvel, somando espaço a
            // espaço. Continua em texto embaixo do nome: o medidor conta
            // espaço, e a unidade é conversa do número
            const totalRef = espacos.reduce(
              (soma, slot) => soma + readSlotFill(slot, slotItems.filter((i) => i.slotId === slot.id), dayPlans).padrao,
              0
            );

            // Onde entra um produto novo deste móvel: o primeiro espaço livre
            // e, com o móvel cheio, o menos ocupado — a mesma escolha que a
            // lista de apoio faz ao alocar
            const ocupacao = (slot) => slotItems.filter((i) => i.slotId === slot.id).length;
            const destino = livres[0]
              || (espacos.length ? espacos.reduce((menos, s) => (ocupacao(s) < ocupacao(menos) ? s : menos), espacos[0]) : null);

            return {
              ...bloco,
              espacos,
              linhas,
              livres,
              destino,
              // O desenho do móvel: quantos espaços ficam lado a lado nele
              colunas: showcaseColumnsFor(currentUnit, bloco.showcaseType),
              totalUn,
              totalRef,
              produtos: produtos.size,
              dividindo,
              // A régua do medidor é o espaço do móvel, e não a unidade: o
              // que a loja lê de longe é quanto da vitrine está tomada
              percent: espacos.length > 0 ? Math.round((produtos.size / espacos.length) * 100) : null
            };
          });
        }, [unitSlots, slotItems, dayPlans]);

        return (
          <div className="space-y-4">
            <div className="card-flat p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="min-w-0">
                <h2 className="t-headline text-[#1d1d1f]">Vitrine física</h2>
                <p className="t-caption mt-0.5">
                  Toque em Venda ou Perda para baixar 1 · segure para baixar tudo
                </p>
              </div>
              <div className="segmented shrink-0">
                {SHOWCASE_TYPES.map((type) => (
                  <button key={type} onClick={() => onChangeFilterType(type)} data-active={filterType === type}>
                    {SHOWCASE_TYPE_LABELS[type]}
                  </button>
                ))}
              </div>
            </div>

            {blocos.length === 0 ? (
              <div className="card text-center py-12 px-4">
                <p className="t-body text-[#86868b]">
                  Nenhuma vitrine {SHOWCASE_TYPE_LABELS[filterType].toLowerCase()} cadastrada nesta unidade.
                </p>
              </div>
            ) : (
              // Um cartão por móvel e, dentro dele, o desenho da vitrine: os
              // espaços nas colunas que aquele móvel tem no balcão
              <div className="space-y-4">
                {blocos.map((bloco) => (
                  <div key={bloco.key} className="card showcase-card p-4 sm:p-5">
                    {/* O nome do móvel, o que tem dentro e o quanto do padrão
                        de hoje está montado */}
                    <div className="flex items-center gap-2.5 pb-3 mb-1 border-b hairline">
                      <div className="min-w-0 flex-1">
                        {/* O quanto do móvel está tomado vem colado no nome
                            dele: a tirinha enche com os produtos que estão
                            nos espaços, e é essa a leitura que se faz de
                            longe. A quantidade em unidades fica embaixo, em
                            texto, para quem quer o número */}
                        <div className="flex items-center gap-2 min-w-0">
                          <h3 className="t-headline text-[#1d1d1f] truncate">{bloco.title}</h3>
                          <FillMeter
                            percent={bloco.percent}
                            title={
                              bloco.dividindo > 0
                                ? `${bloco.produtos} produtos em ${bloco.espacos.length} espaços · ${bloco.dividindo} sem espaço próprio, dividindo com outro`
                                : `${bloco.produtos} de ${bloco.espacos.length} espaços com produto · ${bloco.livres.length} ${bloco.livres.length === 1 ? 'livre' : 'livres'}`
                            }
                            className="shrink-0"
                          />
                        </div>
                        <p className="t-caption tnum mt-0.5">
                          {bloco.produtos} {bloco.produtos === 1 ? 'produto' : 'produtos'} em {bloco.espacos.length} {bloco.espacos.length === 1 ? 'espaço' : 'espaços'} · {bloco.totalUn} un
                          {bloco.totalRef > 0 && ` de ${bloco.totalRef} un do padrão de hoje`}
                        </p>
                      </div>
                      {bloco.destino && (
                        <button
                          onClick={() => onOpenSlot(bloco.destino)}
                          title={`Colocar produto na vitrine ${bloco.title}`}
                          className="btn btn-secondary btn-sm shrink-0"
                        >
                          <Icons.Plus className="w-3.5 h-3.5" />
                          Colocar produto
                        </button>
                      )}
                    </div>

                    {/* O móvel desenhado: cada espaço no lugar em que ele está
                        no balcão, nas colunas daquela vitrine. Espaço vazio
                        fica apagado e chama o produto que falta */}
                    <div className="overflow-x-auto mt-3">
                      <div
                        className="grid gap-px bg-[var(--hairline)] border hairline rounded-xl overflow-hidden"
                        style={{
                          gridTemplateColumns: `repeat(${bloco.colunas}, minmax(0, 1fr))`,
                          minWidth: `${bloco.colunas * 168}px`
                        }}
                      >
                        {bloco.espacos.map((slot) => {
                          const doEspaco = bloco.linhas.filter((l) => l.slot.id === slot.id);

                          return (
                            <div
                              key={slot.id}
                              className={`px-2.5 py-2 bg-[var(--bg-surface)] transition-opacity ${
                                doEspaco.length === 0 ? 'opacity-45 hover:opacity-100' : ''
                              }`}
                            >
                              <div className="flex items-center justify-between gap-1">
                                <span className="t-caption tnum">{slot.slotNumber}</span>
                                {doEspaco.length === 0 && (
                                  <button
                                    onClick={() => onOpenSlot(slot)}
                                    title={`Colocar produto no espaço ${slot.slotNumber} da ${bloco.title}`}
                                    className="t-caption text-[11px] flex items-center gap-1 hover:text-[#1d1d1f] transition-colors"
                                  >
                                    <Icons.Plus className="w-3 h-3" />
                                    Vazio
                                  </button>
                                )}
                              </div>

                              {/* Dois produtos no mesmo espaço ficam um embaixo
                                  do outro, separados por um fio */}
                              {doEspaco.map(({ item }, i) => {
                                const prod = products.find((p) => p.id === item.productId);
                                const statusInfo = getSlotItemStatus(item, prod);

                                return (
                                  <div
                                    key={item.id}
                                    className={i === 0 ? 'mt-0.5' : 'mt-1.5 pt-1.5 border-t hairline'}
                                  >
                                    {/* Quanto tem e de quê — nesta ordem, porque
                                        é assim que se confere de olho no balcão */}
                                    <div className="flex items-baseline gap-1.5 min-w-0">
                                      <span
                                        className="shrink-0"
                                        title={item.producedQty > 0
                                          ? `${item.currentQty} na vitrine, de um lote de ${item.producedQty} ${item.unit}`
                                          : `${item.currentQty} ${item.unit} na vitrine`}
                                      >
                                        <QtyOfBatch
                                          qty={item.currentQty}
                                          produced={item.producedQty || 0}
                                          unit={item.unit}
                                          big
                                        />
                                      </span>
                                      <h5 className="t-headline text-[14px] truncate min-w-0" title={item.productName}>
                                        <mark className={`mark ${statusInfo.markClass}`}>{item.productName}</mark>
                                      </h5>
                                    </div>

                                    {/* Quem responde pelo item e o tempo de
                                        vitrine. Dia a dia é texto miúdo; selo
                                        mesmo, só no último dia e no vencido */}
                                    <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5">
                                      <p className="t-caption text-[11px] flex items-center gap-1 min-w-0">
                                        <Icons.User className="w-3 h-3 shrink-0" />
                                        <span className="truncate">{getResponsibleName(prod)}</span>
                                      </p>
                                      <span className={statusInfo.alerta ? `pill text-[10px] ${statusInfo.bgClass} ${statusInfo.textClass}` : 't-caption text-[11px] tnum'}>
                                        {statusInfo.label}
                                      </span>
                                    </div>

                                    <ItemActions
                                      item={item}
                                      onQuickSale={onQuickSale}
                                      onRecordSellAll={onRecordSellAll}
                                      onQuickLoss={onQuickLoss}
                                      className="mt-2"
                                    />
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // TACTICAL SUPPORT LIST COMPONENT
      // ==========================================
      const SupportList = ({ currentUnit, slotItems, products, slots, showcaseType, onChangeShowcaseType, onUpdateItem, onSetQty, onQuickAllocate, onQuickSale, onRecordSellAll, onQuickLoss, onRemoveItem }) => {
        const [filterText, setFilterText] = useState('');
        const [quickProductName, setQuickProductName] = useState('');
        const [quickQty, setQuickQty] = useState(10);
        const [quickDate, setQuickDate] = useState(getTodayDateString());

        const productNameRef = useRef(null);
        const qtyRef = useRef(null);
        const dateRef = useRef(null);

        const setQuickDateOffset = (offsetDays) => {
          const d = new Date();
          d.setDate(d.getDate() + offsetDays);
          setQuickDate(d.toISOString().split('T')[0]);
        };

        // A lista acompanha a vitrine aberta ao lado: quem está conferindo a
        // vitrine salgada vê só a salgada, na mesma ordem dos espaços. Trocar
        // aqui troca a vitrine física também — é sempre a mesma vitrine.
        const typeLabel = SHOWCASE_TYPE_LABELS[showcaseType];
        const unitSlots = slots.filter((s) => s.unit === currentUnit && s.showcaseType === showcaseType);
        const unitSlotIds = new Set(unitSlots.map((s) => s.id));
        const itemsInUnit = slotItems.filter((item) => unitSlotIds.has(item.slotId));

        // Lançar item é sempre pelo produto, nunca pela vitrine que está aberta
        // na tela: quem acabou de tirar uma leva de doce do forno lança o doce
        // sem largar a conferência da salgada. A lista traz os produtos da
        // vitrine aberta primeiro e, depois, os das outras — cada um com o nome
        // do móvel para onde ele vai. Quem aloca é o produto, e o item cai na
        // vitrine da categoria dele.
        const productOptions = useMemo(() => {
          const daVitrine = [];
          const deOutras = [];

          products.forEach((p) => {
            const tipo = showcaseTypeOfCategory(p.category);
            const opcao = { value: p.name, label: p.name };
            if (tipo === showcaseType) {
              daVitrine.push(opcao);
            } else {
              deOutras.push({ ...opcao, hint: SHOWCASE_TYPE_LABELS[tipo] });
            }
          });

          return [...daVitrine, ...deOutras];
        }, [products, showcaseType]);

        // Para onde vai o que está escrito no campo: produto já cadastrado vai
        // para a vitrine da categoria dele; nome novo entra na vitrine aberta
        const produtoEscolhido = products.find(
          (p) => normalizeName(p.name) === normalizeName(quickProductName)
        );
        const tipoDestino = produtoEscolhido
          ? showcaseTypeOfCategory(produtoEscolhido.category)
          : showcaseType;

        // Quantos outros produtos dividem o mesmo espaço deste item
        const companheiros = (item) =>
          slotItems.filter((i) => i.slotId === item.slotId && i.id !== item.id).length;

        const slotOf = (item) => unitSlots.find((s) => s.id === item.slotId);

        // Mesma leitura da vitrine física: um bloco por móvel (Salgada 1,
        // Salgada 2…) e, dentro dele, os itens do mais velho para o mais novo.
        // Item sem data de fabricação entra como se fosse de hoje, no fim da
        // fila; empate se resolve pelo espaço e depois pelo nome.
        const filteredItems = itemsInUnit
          .filter((item) => item.productName.toLowerCase().includes(filterText.toLowerCase()))
          .sort((a, b) =>
            (a.manufactureDate || '9999-12-31').localeCompare(b.manufactureDate || '9999-12-31')
            || (slotOf(a)?.slotNumber || 0) - (slotOf(b)?.slotNumber || 0)
            || a.productName.localeCompare(b.productName, 'pt-BR')
          );

        const showcaseBlocks = groupByShowcase(filteredItems, slotOf, 'Fora das vitrines');

        const handleQuickSubmit = (e) => {
          e.preventDefault();
          if (!quickProductName.trim()) {
            if (productNameRef.current) productNameRef.current.focus();
            return;
          }

          onQuickAllocate(quickProductName.trim(), Number(quickQty) || 1, quickDate, null, showcaseType);
          setQuickProductName('');
          setTimeout(() => {
            if (productNameRef.current) productNameRef.current.focus();
          }, 50);
        };

        return (
          <div className="card support-panel flex flex-col h-full overflow-hidden">
            <div className="px-4 py-3.5 border-b hairline space-y-2.5">
              <div className="flex justify-between items-center gap-2">
                <div className="min-w-0">
                  <h2 className="t-headline text-[#1d1d1f]">Lista de apoio</h2>
                  <p className="t-caption mt-0.5">Toque baixa 1 · segure baixa tudo</p>
                </div>
                <span className="pill bg-black/[0.05] text-[#6e6e73] tnum shrink-0">{filteredItems.length} itens</span>
              </div>
              {/* Trocar aqui ou na vitrine física dá no mesmo: as duas telas
                  mostram sempre a vitrine escolhida */}
              <div className="segmented flex w-full">
                {SHOWCASE_TYPES.map((type) => (
                  <button
                    key={type}
                    className="flex-1"
                    onClick={() => onChangeShowcaseType(type)}
                    data-active={showcaseType === type}
                  >
                    {SHOWCASE_TYPE_LABELS[type]}
                  </button>
                ))}
              </div>
            </div>

            <div className="support-add-panel px-4 py-4 border-b hairline space-y-3">
              <form onSubmit={handleQuickSubmit} className="space-y-3">
                <div className="flex items-center justify-between gap-2">
                  <span className="t-overline truncate">Adicionar item</span>
                  <span className="t-caption text-[11px] shrink-0">Enter ↵ avança</span>
                </div>

                <div>
                  <label className="t-caption block mb-1">
                    Produto <span className="font-normal">· de qualquer vitrine</span>
                  </label>
                  <PickerField
                    inputRef={productNameRef}
                    placeholder="Digite ou escolha…"
                    value={quickProductName}
                    options={productOptions}
                    onType={setQuickProductName}
                    onPick={(opt) => setQuickProductName(opt.value)}
                    emptyLabel={`Produto novo — entra como ${categoryOfShowcaseType(showcaseType)} ao alocar`}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && quickProductName.trim()) {
                        e.preventDefault();
                        if (qtyRef.current) { qtyRef.current.focus(); qtyRef.current.select(); }
                      }
                    }}
                    className="field field-sm font-semibold"
                  />
                  {/* Sem isto, lançar doce com a salgada aberta parece erro:
                      o item some da lista porque foi para o móvel dele */}
                  <p className={`t-caption text-[11px] mt-1 ${
                    tipoDestino === showcaseType ? '' : 'text-[#0058b0] font-semibold'
                  }`}>
                    Vai para a vitrine {SHOWCASE_TYPE_LABELS[tipoDestino]}
                  </p>
                </div>

                <div className="grid grid-cols-12 gap-2 items-end">
                  <div className="col-span-4">
                    <label className="t-caption block mb-1">Qtd</label>
                    <input
                      ref={qtyRef}
                      type="number"
                      min="1"
                      placeholder="Qtd"
                      value={quickQty}
                      onChange={(e) => setQuickQty(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          if (dateRef.current) dateRef.current.focus();
                        }
                      }}
                      className="field field-sm text-center font-extrabold tnum"
                    />
                  </div>

                  <div className="col-span-5">
                    <label className="t-caption block mb-1">Fabricação</label>
                    <input
                      ref={dateRef}
                      type="date"
                      value={quickDate}
                      onChange={(e) => setQuickDate(e.target.value)}
                      className="field field-sm text-center text-[12px] tnum"
                    />
                  </div>

                  <div className="col-span-3">
                    <button type="submit" className="btn btn-primary w-full h-8 text-[12px]">
                      <Icons.Plus className="w-3.5 h-3.5" />
                      Alocar
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-1.5">
                  <span className="t-caption mr-0.5">Data:</span>
                  <button
                    type="button"
                    onClick={() => setQuickDateOffset(0)}
                    className={`btn h-6 px-2.5 text-[11px] ${
                      quickDate === getTodayDateString() ? 'bg-black/[0.09] text-[#1d1d1f]' : 'btn-secondary'
                    }`}
                  >
                    Hoje
                  </button>
                  <button type="button" onClick={() => setQuickDateOffset(-1)} className="btn btn-secondary h-6 px-2.5 text-[11px]">
                    Ontem
                  </button>
                </div>
              </form>

              <div className="relative pt-3 border-t hairline">
                <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[18px]" />
                <input
                  type="text"
                  placeholder="Filtrar itens…"
                  value={filterText}
                  onChange={(e) => setFilterText(e.target.value)}
                  className="field field-sm field-search"
                />
              </div>
            </div>

            <div role="list" aria-label={`Itens da vitrine ${typeLabel}`} className="support-list flex-1 overflow-y-auto max-h-[620px]">
              {filteredItems.length === 0 ? (
                <div className="text-center py-12 px-4">
                  <p className="t-body text-[#86868b]">Nada na vitrine {typeLabel.toLowerCase()}</p>
                  <p className="t-caption mt-1">Use o formulário acima para alocar</p>
                </div>
              ) : (
                showcaseBlocks.map((bloco) => (
                  <section key={bloco.key} aria-label={bloco.title}>
                    <div className="support-section-header px-4 py-2 border-b hairline sticky top-0 z-10 flex items-center justify-between gap-2">
                      <span className="t-overline">{bloco.title}</span>
                      <span className="t-caption tnum">{bloco.entries.length}</span>
                    </div>

                    {bloco.entries.map((item) => {
                      const product = products.find((p) => p.id === item.productId);
                      const slot = slotOf(item);
                      const statusInfo = getSlotItemStatus(item, product);

                      return (
                        <div key={item.id} role="listitem" className="support-row">
                          {/* Cabeçalho de uma linha: espaço, produto e saldo */}
                          <div className="flex items-start gap-2.5">
                            <span
                              className="support-slot"
                              title={slot ? `Espaço ${slot.slotNumber}` : 'Item de apoio'}
                              aria-label={slot ? `Espaço ${slot.slotNumber}` : 'Item de apoio'}
                            >
                              {slot ? `#${slot.slotNumber}` : 'A'}
                            </span>

                            <div className="min-w-0 flex-1">
                              <div className="flex items-start justify-between gap-2">
                                <div className="min-w-0">
                                  <h4 className="text-[14px] font-semibold leading-[1.35] tracking-[-0.012em] truncate">
                                    <mark className={`mark ${statusInfo.markClass}`}>{item.productName}</mark>
                                  </h4>
                                  <p className="t-caption text-[11px] mt-1 flex items-center gap-1 truncate">
                                    <Icons.User className="w-3 h-3 shrink-0" />
                                    <span className="truncate">{getResponsibleName(product)}</span>
                                    {slot && companheiros(item) > 0 && (
                                      <span className="shrink-0">· espaço dividido</span>
                                    )}
                                  </p>
                                </div>

                                <div className="flex flex-col items-end gap-1 shrink-0">
                                  <div className="support-qty" title={`${item.currentQty} ${item.unit} na vitrine`}>
                                    <strong>{item.currentQty}</strong>
                                    <span className="t-caption text-[10px]">{item.unit}</span>
                                  </div>
                                  <span className={`text-[10px] ${statusInfo.alerta ? `pill ${statusInfo.bgClass} ${statusInfo.textClass}` : 't-caption tnum'}`}>
                                    {statusInfo.label}
                                  </span>
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* Edição compacta, dentro da linha da lista */}
                          <div className="support-fields">
                            <label className="min-w-0">
                              <span className="t-caption text-[10px] block mb-0.5">Fabricação</span>
                              <input
                                type="date"
                                value={item.manufactureDate}
                                onChange={(e) => onUpdateItem({ ...item, manufactureDate: e.target.value })}
                                className="field h-8 px-1.5 text-[11px] text-center tnum"
                              />
                            </label>
                            <label className="min-w-0">
                              <span className="t-caption text-[10px] block mb-0.5 text-center">Produzido</span>
                              <input
                                type="number"
                                min="0"
                                value={item.producedQty || item.currentQty}
                                onChange={(e) =>
                                  onUpdateItem({ ...item, producedQty: Math.max(0, Number(e.target.value) || 0) })
                                }
                                className="field h-8 px-1 text-[12px] font-bold text-center tnum no-spin"
                              />
                            </label>
                            <div className="min-w-0">
                              <span className="t-caption text-[10px] block mb-0.5 text-center">Na vitrine</span>
                              <QtyField
                                value={item.currentQty}
                                onSet={(valor) => onSetQty(item.id, valor)}
                                label={`Quantidade de ${item.productName} na vitrine`}
                                className="h-8 px-1 text-[13px] font-extrabold"
                              />
                            </div>
                          </div>

                          {/* Baixas: sai do estoque e vai para o relatório. É
                              outra coisa da contagem acima, que só corrige. */}
                          <div className="support-actions">
                            <ItemActions
                              item={item}
                              onQuickSale={onQuickSale}
                              onRecordSellAll={onRecordSellAll}
                              onQuickLoss={onQuickLoss}
                            />
                            <button
                              onClick={() => onRemoveItem(item.id)}
                              title="Remover item da vitrine"
                              aria-label="Remover item da vitrine"
                              className="btn w-8 h-[38px] px-0 shrink-0 rounded-xl bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73]"
                            >
                              <Icons.Trash2 className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </section>
                ))
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // ORGANIZAR ITEM DA VITRINE PADRÃO
      //
      // Uma janelinha por espaço: prioridade (A a D), em que dias o item entra,
      // a quantidade ideal e o mínimo. É aqui que "todo dia" vira as sete
      // linhas da semana sem precisar copiar dia por dia.
      // ==========================================
      const PlanOrganizeModal = ({ slot, product, priority, days, idealQty, minQty, onClose, onSave, onRemove }) => {
        if (!slot) return null;
        const [prio, setPrio] = useState(priority || DEFAULT_PRIORITY);
        const [selectedDays, setSelectedDays] = useState(days && days.length ? days : []);
        const [qty, setQty] = useState(idealQty || 1);
        const [min, setMin] = useState(minQty || 0);

        const todoDia = selectedDays.length === WEEK_DAYS.length;

        const toggleDay = (day) =>
          setSelectedDays((atual) =>
            atual.includes(day)
              ? atual.filter((d) => d !== day)
              : WEEK_DAYS.filter((d) => d === day || atual.includes(d))
          );

        const handleSubmit = (e) => {
          e.preventDefault();
          if (selectedDays.length === 0) {
            alert('Marque pelo menos um dia — ou use "Tirar do padrão" para remover o item.');
            return;
          }
          const ideal = Math.max(1, Number(qty) || 1);
          onSave({
            priority: prio,
            days: selectedDays,
            idealQty: ideal,
            // Mínimo acima do padrão chamaria o item para sempre: o teto é o
            // próprio padrão do dia
            minQty: Math.max(0, Math.min(Math.floor(Number(min) || 0), ideal))
          });
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Organizar item</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1 truncate">{product?.name || 'Produto'}</h3>
                  <p className="t-callout mt-1 truncate">
                    {slot.sectionTitle} · espaço #{slot.slotNumber} · {getResponsibleName(product)}
                  </p>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div>
                <label className="t-caption block mb-1.5">Prioridade</label>
                <div className="grid grid-cols-4 gap-1.5">
                  {PRIORITIES.map((p) => (
                    <button
                      key={p.value}
                      type="button"
                      onClick={() => setPrio(p.value)}
                      title={p.hint}
                      className={`h-11 rounded-xl border text-[15px] font-extrabold flex flex-col items-center justify-center gap-1 transition-all ${
                        prio === p.value
                          ? 'border-[#0071e3] bg-[#0071e3]/[0.06] text-[#0058b0]'
                          : 'border-black/[0.08] bg-white text-[#6e6e73] hover:bg-black/[0.03]'
                      }`}
                    >
                      {p.value}
                      <span className={`w-1.5 h-1.5 rounded-full ${p.dot}`} />
                    </button>
                  ))}
                </div>
                <p className="t-caption mt-1.5">{getPriority(prio).title} — {getPriority(prio).hint}</p>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="t-caption">Frequência</label>
                  <button
                    type="button"
                    onClick={() => setSelectedDays(todoDia ? [] : [...WEEK_DAYS])}
                    className="btn btn-secondary h-7 px-2.5 text-[12px]"
                  >
                    {todoDia ? 'Limpar dias' : 'Todo dia'}
                  </button>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {WEEK_DAYS.map((day) => (
                    <button
                      key={day}
                      type="button"
                      onClick={() => toggleDay(day)}
                      title={getDayNameBR(day)}
                      className={`h-10 rounded-xl border text-[12px] font-bold transition-all ${
                        selectedDays.includes(day)
                          ? 'border-[#0071e3] bg-[#0071e3] text-white'
                          : 'border-black/[0.08] bg-white text-[#6e6e73] hover:bg-black/[0.03]'
                      }`}
                    >
                      {getDayShortBR(day)}
                    </button>
                  ))}
                </div>
                <p className="t-caption mt-1.5">
                  {todoDia
                    ? 'O item fica neste espaço nos sete dias da semana.'
                    : `Entra em: ${frequencyTitle(selectedDays)}.`}
                  {' '}Nos dias marcados o espaço passa a ser deste produto; nos desmarcados ele fica livre.
                </p>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="t-caption block mb-1.5">Quantidade ideal por dia</label>
                  <input
                    type="number"
                    min="1"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    title="Quanto este espaço deve ter no dia"
                    className="field field-md text-center font-extrabold tnum"
                  />
                </div>
                <div>
                  <label className="t-caption block mb-1.5">Quantidade mínima</label>
                  <input
                    type="number"
                    min="0"
                    value={min}
                    onChange={(e) => setMin(e.target.value)}
                    title="O pedido de produção chama o item quando o estoque da loja chega neste número. 0 = só quando acabar"
                    className="field field-md text-center font-extrabold tnum"
                  />
                </div>
              </div>
              <p className="t-caption -mt-1">
                O mínimo vale para os dias marcados acima e é ele que chama o item no pedido de
                produção: quando a loja chega nele, o pedido manda fazer a fornada do padrão.
                0 = só quando acabar.
              </p>

              <div className="flex justify-between gap-2 pt-1">
                <button
                  type="button"
                  onClick={() => { onRemove(); onClose(); }}
                  className="btn btn-danger-quiet btn-sm"
                >
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Tirar do padrão
                </button>
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                  <button type="submit" className="btn btn-primary btn-md">Salvar</button>
                </div>
              </div>
            </form>
          </div>
        );
      };

      // ==========================================
      // TABELA DA SEMANA (Vitrine Padrão)
      //
      // A vitrine de cada dia é editada uma de cada vez, então é difícil ver
      // o desenho da semana inteira. Esta tabela abre isso: uma linha por
      // produto, uma coluna por dia, com a quantidade que o padrão pede, o
      // total da semana e a média por dia em que o item entra.
      //
      // A quantidade é digitada na própria célula: dá para montar a semana
      // inteira de um produto sem trocar de dia.
      //
      // A mesma grade edita duas coisas, uma de cada vez: o PADRÃO do dia
      // (quanto a vitrine deve ter) e o MÍNIMO do dia (em que ponto o pedido
      // de produção chama o item). São as duas quantidades que a cozinha
      // precisa por item e por dia, e cada uma tem a sua leitura da semana.
      // ==========================================

      // Os dois números que a grade da semana edita
      const WEEK_FIELDS = [
        {
          value: 'padrao', label: 'Padrão',
          title: 'Quantidade por dia',
          heading: 'A semana inteira',
          hint: 'Clique na quantidade para mudar — 0 tira o produto do dia.',
          cellHint: 'digite a quantidade (0 tira do dia)',
          columnLabel: 'Padrão'
        },
        {
          value: 'minimo', label: 'Mínimo',
          title: 'Quantidade mínima por dia',
          heading: 'O mínimo da semana',
          hint: 'O pedido chama o item quando o estoque da loja chega neste número — 0 é só quando acabar.',
          cellHint: 'digite o mínimo (0 = só quando acabar)',
          columnLabel: 'Mínimo'
        }
      ];

      const getWeekField = (value) => WEEK_FIELDS.find((f) => f.value === value) || WEEK_FIELDS[0];

      // Uma célula da tabela: mostra a quantidade e vira campo ao clicar.
      // Enter e sair do campo gravam, Esc desfaz.
      const WeeklyQtyCell = ({ value, onCommit, title }) => {
        const [texto, setTexto] = useState('');
        const [editando, setEditando] = useState(false);

        useEffect(() => {
          if (!editando) setTexto(value ? String(value) : '');
        }, [value, editando]);

        const gravar = () => {
          setEditando(false);
          const nova = texto.trim() === '' ? 0 : Math.max(0, Math.floor(Number(texto)));
          if (!Number.isFinite(nova) || nova === (value || 0)) {
            setTexto(value ? String(value) : '');
            return;
          }
          onCommit(nova);
        };

        return (
          <input
            type="text"
            inputMode="numeric"
            value={editando ? texto : (value ? String(value) : '')}
            title={title}
            placeholder="—"
            onFocus={(e) => { setEditando(true); setTexto(value ? String(value) : ''); e.target.select(); }}
            onChange={(e) => setTexto(e.target.value.replace(/[^0-9]/g, ''))}
            onBlur={gravar}
            onKeyDown={(e) => {
              if (e.key === 'Enter') { e.currentTarget.blur(); }
              if (e.key === 'Escape') { setTexto(value ? String(value) : ''); setEditando(false); e.currentTarget.blur(); }
            }}
            className={`qty-cell tnum ${value ? 'font-bold text-[#1d1d1f]' : 'text-[#c7c7cc]'}`}
          />
        );
      };

      const WeeklyPlanTable = ({
        currentUnit,
        products,
        slots,
        standardPlans,
        selectedDay,
        onSelectDay,
        onSetWeeklyQty,
        onSetWeeklyMin
      }) => {
        const [aberto, setAberto] = useState(true);
        const [busca, setBusca] = useState('');
        const [ordem, setOrdem] = useState('total');
        const [campo, setCampo] = useState('padrao');
        const [copiado, setCopiado] = useState(false);

        const editandoMinimo = campo === 'minimo';
        const campoAtual = getWeekField(campo);

        const slotById = useMemo(() => {
          const map = {};
          slots.forEach((s) => { map[s.id] = s; });
          return map;
        }, [slots]);

        // Uma linha por produto, somando os espaços que ele ocupa no dia
        const linhas = useMemo(() => {
          const porProduto = {};

          standardPlans
            .filter((sp) => sp.unit === currentUnit)
            .forEach((sp) => {
              if (!porProduto[sp.productId]) {
                const produto = products.find((p) => p.id === sp.productId);
                porProduto[sp.productId] = {
                  id: sp.productId,
                  nome: produto?.name || 'Produto removido',
                  vitrines: [],
                  dias: {},
                  minimos: {},
                  espacos: {},
                  prioridade: null,
                  total: 0,
                  totalMinimo: 0
                };
              }

              const linha = porProduto[sp.productId];
              const slot = slotById[sp.slotId];
              if (slot && !linha.vitrines.includes(slot.sectionTitle)) {
                linha.vitrines.push(slot.sectionTitle);
              }
              linha.dias[sp.dayOfWeek] = (linha.dias[sp.dayOfWeek] || 0) + (sp.idealQty || 0);
              linha.minimos[sp.dayOfWeek] = (linha.minimos[sp.dayOfWeek] || 0) + (sp.minQty || 0);
              linha.espacos[sp.dayOfWeek] = (linha.espacos[sp.dayOfWeek] || 0) + 1;
              linha.total += sp.idealQty || 0;
              linha.totalMinimo += sp.minQty || 0;

              // Quando o produto entra com letras diferentes em dias ou
              // espaços diferentes, vale a mais urgente. A primeira letra que
              // aparece é o ponto de partida: começar do padrão B fazia um
              // item C inteiro ser lido como B.
              const prio = getPriority(sp.priority).value;
              if (linha.prioridade === null || priorityRank(prio) < priorityRank(linha.prioridade)) {
                linha.prioridade = prio;
              }
            });

          return Object.values(porProduto).map((linha) => {
            const diasDoItem = WEEK_DAYS.filter((d) => (linha.dias[d] || 0) > 0);
            const diasAtivos = diasDoItem.length;
            return {
              ...linha,
              prioridade: linha.prioridade || DEFAULT_PRIORITY,
              diasAtivos,
              freqLabel: frequencyLabel(diasDoItem),
              freqTitle: frequencyTitle(diasDoItem),
              todoDia: diasAtivos >= WEEK_DAYS.length,
              media: diasAtivos ? linha.total / diasAtivos : 0,
              mediaMinimo: diasAtivos ? linha.totalMinimo / diasAtivos : 0
            };
          });
        }, [standardPlans, currentUnit, products, slotById]);

        const visiveis = useMemo(() => {
          const termo = normalizeName(busca);
          const lista = termo ? linhas.filter((l) => normalizeName(l.nome).includes(termo)) : linhas;
          return [...lista].sort((a, b) => {
            if (ordem === 'nome') return a.nome.localeCompare(b.nome, 'pt-BR');
            // Por importância: a letra primeiro e, dentro dela, quem entra em
            // mais dias da semana — é a ordem do que a cozinha faz sempre
            if (ordem === 'importancia') {
              return priorityRank(a.prioridade) - priorityRank(b.prioridade)
                || b.diasAtivos - a.diasAtivos
                || a.nome.localeCompare(b.nome, 'pt-BR');
            }
            if (ordem === 'frequencia') {
              return b.diasAtivos - a.diasAtivos
                || priorityRank(a.prioridade) - priorityRank(b.prioridade)
                || a.nome.localeCompare(b.nome, 'pt-BR');
            }
            return b.total - a.total || a.nome.localeCompare(b.nome, 'pt-BR');
          });
        }, [linhas, busca, ordem]);

        // A leitura de baixo acompanha o que está sendo editado: somar padrão
        // com a grade do mínimo na tela daria um total que não é de nada
        const valorDoDia = (linha, day) =>
          (editandoMinimo ? linha.minimos[day] : linha.dias[day]) || 0;

        const totalPorDia = useMemo(() => {
          const contas = {};
          WEEK_DAYS.forEach((d) => {
            contas[d] = visiveis.reduce((acc, l) => acc + valorDoDia(l, d), 0);
          });
          return contas;
        }, [visiveis, editandoMinimo]);

        const totalSemana = useMemo(
