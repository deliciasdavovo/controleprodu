      // A FICHA TÉCNICA DE UM PRODUTO
      //
      // Cada linha é um insumo e o custo que ele coloca no produto — não o
      // custo da receita inteira. É essa leitura que responde "o que está
      // pesando aqui": normalmente é um insumo só, e ele salta da coluna.
      //
      // O rendimento fica no topo porque ele muda tudo: a mesma massa que
      // rende 40 unidades ou 30 é outro custo por unidade.
      // ==========================================
      const RecipeEditor = ({
        produto,
        ficha,
        custoUn,
        supplies,
        supplyPurchases,
        supplyOptions,
        products,
        recipes,
        recipeItems,
        onClose,
        onUpdateRecipe,
        onAddItem,
        onUpdateItem,
        onDeleteItem
      }) => {
        const [novoComponente, setNovoComponente] = useState('');

        const itens = ficha?.itens || [];
        const custoTotal = ficha?.custo || 0;
        const rendimento = ficha?.yieldQty || 1;
        const unidadeVenda = (produto.priceUnit || 'un') === 'kg' ? 'kg' : 'un';
        const preco = Number(produto.price) || 0;

        // A unidade do rendimento pertence ao produto, não à ficha. Fichas
        // antigas podem ter ficado em "un" mesmo quando o produto era vendido
        // por kg; ao abrir, convertemos sem alterar o custo calculado.
        useEffect(() => {
          if (!ficha || ficha.yieldUnit === unidadeVenda) return;
          if (unidadeVenda === 'kg' && Number(ficha.weightPerUnit) > 0) {
            const kg = ((Number(ficha.yieldQty) || 1) * Number(ficha.weightPerUnit)) / 1000;
            // O peso por unidade continua útil: agora ele é a equivalência para
            // usar este produto vendido por kg como "un" em outra ficha.
            onUpdateRecipe({ yieldQty: kg || 1, yieldUnit: 'kg', weightPerUnit: ficha.weightPerUnit });
            return;
          }
          onUpdateRecipe({ yieldUnit: unidadeVenda, weightPerUnit: ficha.weightPerUnit });
        }, [ficha?.id, produto.priceUnit]);
        const cmv = calcularCmv(custoUn, preco);
        const calculavel = preco > 0 && custoUn > 0;

        const opcoesComponentes = useMemo(() => {
          const comprados = supplyOptions.map((o) => ({
            ...o,
            value: `insumo:${o.value}`,
            hint: `Comprado${o.hint ? ` · ${o.hint}` : ''}`
          }));

          const fabricados = products
            .filter((p) => p.id !== produto.id && !produtoDependeDe(p.id, produto.id, recipes, recipeItems))
            .map((p) => {
              const fichaP = fichaDoProduto(p.id, recipes, recipeItems, supplies, supplyPurchases, products);
              const rendimentoP = Number(fichaP?.yieldQty) || 0;
              const unidadeP = fichaP?.yieldUnit || 'un';
              const custoP = fichaP && rendimentoP > 0 ? fichaP.custo / rendimentoP : 0;
              const pesoUnP = Number(fichaP?.weightPerUnit) || 0;
              const equivalenciaP = unidadeP === 'kg' && pesoUnP > 0 ? ` · 1 un = ${pesoUnP} g` : '';
              return {
                value: `produto:${p.id}`,
                label: p.name,
                hint: custoP > 0
                  ? `Fabricação própria · ${formatCurrencyBR(custoP)}/${unidadeP}${equivalenciaP}`
                  : `Fabricação própria · sem ficha/custo${equivalenciaP}`
              };
            });

          return [...comprados, ...fabricados];
        }, [supplyOptions, products, recipes, recipeItems, supplies, supplyPurchases, produto.id]);

        // O fluxo normal da ficha é insumo comprado. Fabricação própria é uma
        // exceção e por isso fica num seletor separado, sem misturar as listas.
        const opcoesInsumos = useMemo(
          () => opcoesComponentes.filter((o) => String(o.value || '').startsWith('insumo:')),
          [opcoesComponentes]
        );
        const opcoesFabricados = useMemo(
          () => opcoesComponentes.filter((o) => String(o.value || '').startsWith('produto:')),
          [opcoesComponentes]
        );

        const interpretarComponente = (value) => {
          const raw = String(value || '');
          if (raw.startsWith('produto:')) {
            return { supplyId: null, componentProductId: raw.slice('produto:'.length) };
          }
          if (raw.startsWith('insumo:')) {
            return { supplyId: raw.slice('insumo:'.length), componentProductId: null };
          }
          return null;
        };

        const adicionar = (opt) => {
          const componente = interpretarComponente(opt?.value);
          if (!componente) return;
          onAddItem(componente);
          setNovoComponente('');
        };

        return (
          <div
            role="dialog"
            aria-modal="true"
            aria-label={`Ficha técnica de ${produto.name}`}
            className="fixed inset-0 z-[90] bg-black/30 backdrop-blur-[2px] flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto"
          >
            <button
              type="button"
              aria-label="Fechar ficha técnica"
              onClick={onClose}
              className="absolute inset-0"
            />
            <div className="relative bg-white rounded-[24px] w-full max-w-5xl max-h-[88vh] overflow-y-auto shadow-[0_24px_64px_rgba(0,0,0,0.24)] border hairline my-auto">
              <div className="p-5 sm:p-6">
            <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
              <div className="min-w-0">
                <div className="t-overline flex items-center gap-1.5 mb-1">
                  <Icons.ClipboardList className="w-3.5 h-3.5" />
                  Ficha técnica
                </div>
                <h3 className="t-title truncate">{produto.name}</h3>
              </div>
              <button type="button" onClick={onClose} title="Fechar ficha" className="w-8 h-8 rounded-full bg-black/[0.05] hover:bg-black/[0.09] flex items-center justify-center shrink-0">
                <Icons.X className="w-4 h-4" />
              </button>
            </div>

            {/* O rendimento usa a mesma unidade em que o produto é vendido.
                Não existe mais uma segunda unidade solta dentro da ficha. */}
            <div className="grid grid-cols-12 gap-2 sm:gap-3 items-end py-4 border-b hairline">
              <div className="col-span-12 sm:col-span-4">
                <label className="t-caption block mb-1">Rendimento da receita</label>
                <div className="flex items-stretch">
                  <input
                    type="number"
                    min="0.001"
                    step="0.001"
                    value={rendimento}
                    onChange={(e) => onUpdateRecipe({
                      yieldQty: Number(e.target.value) || 1,
                      yieldUnit: unidadeVenda,
                      weightPerUnit: ficha?.weightPerUnit
                    })}
                    title={unidadeVenda === 'kg'
                      ? 'Quantos quilos esta receita produz no total'
                      : 'Quantas unidades esta receita produz no total'}
                    className="field field-sm text-right tnum no-spin rounded-r-none border-r-0"
                  />
                  <div
                    className="field field-sm w-16 rounded-l-none bg-black/[0.035] text-[#6e6e73] font-bold flex items-center justify-center cursor-default"
                    title="Esta unidade vem do cadastro do produto"
                  >
                    {unidadeVenda}
                  </div>
                </div>
                <p className="t-nano mt-1.5">
                  {unidadeVenda === 'kg'
                    ? 'Produto vendido por kg · informe o peso total que a receita rende.'
                    : 'Produto vendido por unidade · informe quantas unidades a receita rende.'}
                </p>

                {unidadeVenda === 'kg' && (
                  <div className="mt-3 pt-3 border-t hairline">
                    <label className="t-caption block mb-1">Equivalência para usar por unidade</label>
                    <div className="flex items-center gap-2">
                      <span className="t-callout font-semibold whitespace-nowrap">1 un =</span>
                      <input
                        type="number"
                        min="0"
                        step="0.1"
                        value={ficha?.weightPerUnit || ''}
                        onChange={(e) => onUpdateRecipe({ weightPerUnit: Number(e.target.value) || null })}
                        placeholder="ex: 50"
                        title="Peso em gramas de uma unidade deste produto"
                        className="field field-sm text-right tnum no-spin w-24"
                      />
                      <span className="t-callout font-semibold">g</span>
                    </div>
                    <p className="t-nano mt-1.5">Opcional · permite usar este produto como un em outra ficha técnica.</p>
                  </div>
                )}
              </div>
              <div className="col-span-12 sm:col-span-8 flex flex-wrap items-center gap-4 sm:justify-end">
                <div>
                  <div className="t-caption">Custo da receita</div>
                  <div className="t-metric-xs tnum">{formatCurrencyBR(custoTotal)}</div>
                </div>
                <div>
                  <div className="t-caption">Custo por {produto.priceUnit || 'un'}</div>
                  <div className="t-metric-xs tnum">{custoUn > 0 ? formatCurrencyBR(custoUn) : '—'}</div>
                </div>
                <div>
                  <div className="t-caption">CMV</div>
                  <div className="mt-0.5"><CmvCell cmv={cmv} calculavel={calculavel} natureza="fabricacao" /></div>
                </div>
              </div>
            </div>

            <div className="py-4 border-b hairline">
              <div className="grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_260px] gap-3 items-end">
                <div className="min-w-0">
                  <label className="t-caption block mb-1">Adicionar insumo</label>
                  <PickerField
                    value={novoComponente}
                    options={opcoesInsumos}
                    onPick={adicionar}
                    placeholder="Escolha um insumo…"
                    className="field field-sm"
                  />
                </div>

                <div className="min-w-0">
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <label className="t-caption">Fabricação própria</label>
                    <span className="t-nano">uso eventual</span>
                  </div>
                  <PickerField
                    value=""
                    options={opcoesFabricados}
                    onPick={adicionar}
                    placeholder="Produto da casa…"
                    className="field field-sm bg-black/[0.018]"
                    emptyLabel="Nenhum produto disponível"
                  />
                </div>
              </div>
            </div>

            <div className="rola-x">
              <table className="w-full text-left">
                <thead>
                  <tr className="t-overline-sm border-b hairline">
                    <th className="py-3 pr-3 font-bold">Ingrediente / componente</th>
                    <th className="py-3 px-3 text-right font-bold">Quantidade</th>
                    <th className="py-3 px-3 font-bold">Unidade</th>
                    <th className="py-3 px-3 text-right font-bold">Custo de origem</th>
                    <th className="py-3 px-3 text-right font-bold">Custo na ficha</th>
                    <th className="py-3 px-3 text-right font-bold">Peso no custo</th>
                    <th className="py-3 pl-3 text-right font-bold">Ação</th>
                  </tr>
                </thead>
                <tbody>
                  {itens.length === 0 ? (
                    <tr><td colSpan={7} className="text-center py-10"><p className="t-body ink-quiet">Ficha vazia — escolha o primeiro ingrediente ou produto da casa acima</p></td></tr>
                  ) : itens.map((item) => {
                    const supply = item.supplyId ? supplies.find((s) => s.id === item.supplyId) : null;
                    const componentProduct = item.componentProductId
                      ? products.find((p) => p.id === item.componentProductId)
                      : null;
                    const componentFicha = componentProduct
                      ? fichaDoProduto(componentProduct.id, recipes, recipeItems, supplies, supplyPurchases, products, new Set([produto.id]))
                      : null;
                    const custoLinha = custoDoItemDaFicha(
                      item, supplies, supplyPurchases, products, recipes, recipeItems, new Set([produto.id])
                    );
                    const peso = custoTotal > 0 ? (custoLinha / custoTotal) * 100 : 0;
                    const unidadeBase = supply?.unit || componentFicha?.yieldUnit || 'un';
                    const unidades = supply
                      ? [supply.unit, ...(supply.variationUnit && Number(supply.variationFactor) > 0 ? [supply.variationUnit] : [])]
                      : unidadesDeComponente(unidadeBase, componentFicha?.weightPerUnit);
                    const seletorValue = item.componentProductId
                      ? `produto:${item.componentProductId}`
                      : `insumo:${item.supplyId || ''}`;
                    const rendimentoComponente = Number(componentFicha?.yieldQty) || 0;
                    const custoOrigem = supply
                      ? formatPrecoInsumo(custoUnitarioInsumo(supply.id, supplyPurchases), supply.unit)
                      : (componentFicha && rendimentoComponente > 0 && componentFicha.custo > 0
                        ? `${formatCurrencyBR(componentFicha.custo / rendimentoComponente)}/${unidadeBase}`
                        : '—');
                    return (
                      <tr key={item.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                        <td className="py-2.5 pr-3">
                          <div className="w-40 sm:w-56">
                            <PickerField
                              value={seletorValue}
                              options={opcoesComponentes}
                              onPick={(opt) => {
                                const componente = interpretarComponente(opt.value);
                                if (!componente) return;
                                onUpdateItem({ ...item, ...componente, usageUnit: '' });
                              }}
                              placeholder="Ingrediente"
                              className="field h-8 pl-2.5 text-[12px] font-semibold"
                            />
                          </div>
                        </td>
                        <td className="py-2.5 px-3">
                          <input
                            type="number"
                            min="0"
                            step="0.001"
                            value={item.qty || ''}
                            onChange={(e) => onUpdateItem({ ...item, qty: Number(e.target.value) || 0 })}
                            placeholder="0"
                            className="field h-8 px-2 text-[12px] text-right tnum no-spin w-24 ml-auto block"
                          />
                        </td>
                        <td className="py-2.5 px-3">
                          <div className="w-20">
                            <PickerField
                              value={item.usageUnit || unidadeBase}
                              options={unidades.map((u) => ({ value: u, label: u }))}
                              onPick={(opt) => onUpdateItem({
                                ...item,
                                usageUnit: opt.value === unidadeBase ? '' : opt.value
                              })}
                              title="A unidade em que a quantidade acima está escrita"
                              className="field h-8 pl-2.5 text-[12px]"
                            />
                          </div>
                        </td>
                        <td className="py-2.5 px-3 text-right t-body tnum">
                          {custoOrigem}
                        </td>
                        <td className="py-2.5 px-3 text-right t-body tnum font-semibold">
                          {custoLinha > 0 ? formatCurrencyBR(custoLinha) : '—'}
                        </td>
                        <td className="py-2.5 px-3">
                          <div className="flex items-center justify-end gap-2">
                            <div className="w-16 h-1.5 rounded-full bg-black/[0.06] overflow-hidden">
                              <div className="h-full rounded-full bg-[#0E0937]" style={{ width: `${Math.min(peso, 100)}%` }} />
                            </div>
                            <span className="t-micro tnum w-10 text-right">{peso > 0 ? `${peso.toFixed(0)}%` : '—'}</span>
                          </div>
                        </td>
                        <td className="py-2.5 pl-3 text-right">
                          <button
                            type="button"
                            onClick={() => onDeleteItem(item.id)}
                            title="Tirar componente da ficha"
                            className="w-7 h-7 rounded-full icon-danger flex items-center justify-center ml-auto"
                          >
                            <Icons.Trash2 className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <p className="t-micro pt-3">
              Insumo sem compra e produto da casa sem ficha entram com custo zero — complete a origem para o CMV ficar correto.
            </p>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // CMV
      //
      // A tela de leitura: aqui não se cadastra nada além do preço de venda.
      // Custo vem da ficha técnica, ficha vem dos insumos, insumo vem da
      // compra — e é por isso que a resposta para um CMV alto quase nunca
      // está nesta tela, e sim na anterior.
      //
      // Produção e revenda ficam em painéis separados de propósito: são
      // negócios diferentes, com metas diferentes, e misturar os dois numa
      // tabela só faria a loja comparar coisas que não se comparam.
      // ==========================================
      const CmvView = ({
        products,
        recipes,
        recipeItems,
        supplies,
        supplyPurchases,
        separatedProducts,
        resalePurchases,
        currentUnit,
        unitName,
        onUpdateProduct,
        onUpdateSeparatedProduct,
        onUpdateRecipe,
        onAddRecipeItem,
        onUpdateRecipeItem,
        onDeleteRecipeItem
      }) => {
        const [painel, setPainel] = useState('producao');
        const [ordem, setOrdem] = useState('cmv');
        const [fichaProdutoId, setFichaProdutoId] = useState(null);

        // Cada produto de fabricação com custo, CMV e margem já resolvidos
        const linhasProducao = useMemo(() => products.map((p) => {
          const ficha = fichaDoProduto(p.id, recipes, recipeItems, supplies, supplyPurchases, products);
          const custoUn = custoPorUnidadeDeVenda(p, ficha);
          const preco = Number(p.price) || 0;
          const calculavel = preco > 0 && custoUn > 0;
          const lucro = preco - custoUn;
          return {
            produto: p,
            ficha,
            custoUn,
            preco,
            calculavel,
            cmv: calcularCmv(custoUn, preco),
            lucro,
            margem: preco > 0 ? (lucro / preco) * 100 : 0
          };
        }), [products, recipes, recipeItems, supplies, supplyPurchases]);

        const fichaAberta = linhasProducao.find(
          (linha) => String(linha.produto.id) === String(fichaProdutoId)
        ) || null;

        const supplyOptions = supplies.map((s) => ({
          value: s.id,
          label: s.name,
          hint: formatPrecoInsumo(custoUnitarioInsumo(s.id, supplyPurchases), s.unit)
        }));

        const linhasRevenda = useMemo(() => separatedProducts
          .filter((i) => i.unit === currentUnit)
          .map((item) => {
            const custo = custoRevenda(item, resalePurchases);
            const preco = Number(item.price) || 0;
            const calculavel = preco > 0 && custo > 0;
            const lucro = preco - custo;
            return {
              item,
              custo,
              preco,
              calculavel,
              cmv: calcularCmv(custo, preco),
              lucro,
              margem: preco > 0 ? (lucro / preco) * 100 : 0
            };
          }), [separatedProducts, resalePurchases, currentUnit]);

        // O placar do topo. A média junta os dois mundos porque a pergunta que
        // ela responde é do negócio inteiro ("quanto do meu faturamento vira
        // custo de mercadoria?"); o alerta, não — cada produto é medido pela
        // régua da natureza dele.
        const placar = useMemo(() => {
          const cmvsProducao = linhasProducao.filter((l) => l.calculavel).map((l) => l.cmv);
          const cmvsRevenda = linhasRevenda.filter((l) => l.calculavel).map((l) => l.cmv);
          const todos = [...cmvsProducao, ...cmvsRevenda];
          return {
            media: todos.length ? todos.reduce((a, b) => a + b, 0) / todos.length : 0,
            temMedia: todos.length > 0,
            alertas:
              cmvsProducao.filter((v) => v > CMV_METAS.fabricacao.atencao).length +
              cmvsRevenda.filter((v) => v > CMV_METAS.revenda.atencao).length,
            semPreco: linhasProducao.filter((l) => !l.calculavel).length + linhasRevenda.filter((l) => !l.calculavel).length
          };
        }, [linhasProducao, linhasRevenda]);

        const ordenar = (linhas, nome) => [...linhas].sort((a, b) => {
          if (ordem === 'preco') return b.preco - a.preco;
          if (ordem === 'nome') return nome(a).localeCompare(nome(b), 'pt-BR');
          // Maior CMV primeiro; quem não tem conta fechada vai para o fim
          if (a.calculavel !== b.calculavel) return a.calculavel ? -1 : 1;
          return b.cmv - a.cmv;
        });

        const producaoOrdenada = ordenar(linhasProducao, (l) => l.produto.name);
        const revendaOrdenada = ordenar(linhasRevenda, (l) => l.item.productName);

        const corDaMedia = placar.media === 0 ? '' :
          placar.media < CMV_METAS.fabricacao.bom ? 'ink-fresh' :
          placar.media < CMV_METAS.revenda.bom ? 'ink-last' : 'ink-expired';

        return (
          <div className="space-y-5">
            <div>
              <h2 className="t-display">CMV</h2>
              <p className="t-body mt-1">
                {unitName} · quanto de cada venda vai embora em custo de mercadoria.
              </p>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Package className="w-3.5 h-3.5" />
                  Insumos
                </span>
                <div className="mt-2 t-metric-lg tnum">{supplies.length}</div>
                <p className="t-micro mt-1">cadastrados</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.ClipboardList className="w-3.5 h-3.5" />
                  Fichas
                </span>
                <div className="mt-2 t-metric-lg tnum">{recipes.length}</div>
                <p className="t-micro mt-1">de {products.length} produtos</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.TrendingUp className="w-3.5 h-3.5" />
                  CMV médio
                </span>
                <div className={`mt-2 t-metric-lg tnum ${corDaMedia}`}>
                  {placar.temMedia ? `${placar.media.toFixed(1)}%` : '—'}
                </div>
                <div className="mt-2 h-1 rounded-full bg-black/[0.06] overflow-hidden">
                  <div
                    className={`h-full rounded-full ${placar.media < CMV_METAS.fabricacao.bom ? 'dot-fresh' : placar.media < CMV_METAS.revenda.bom ? 'dot-last' : 'dot-expired'}`}
                    style={{ width: `${Math.min(placar.media, 100)}%` }}
                  />
                </div>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.AlertTriangle className="w-3.5 h-3.5" />
                  CMV alto
                </span>
                <div className={`mt-2 t-metric-lg tnum ${placar.alertas > 0 ? 'ink-expired' : 'ink-fresh'}`}>
                  {placar.alertas}
                </div>
                <p className="t-micro mt-1">
                  {placar.semPreco > 0 ? `${placar.semPreco} sem conta fechada` : 'produtos acima da meta'}
                </p>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
              <div className="segmented flex-1 sm:flex-none sm:inline-flex">
                <button onClick={() => setPainel('producao')} data-active={painel === 'producao'} className="flex-1 sm:flex-none h-9 px-4">
                  Produção ({linhasProducao.length})
                </button>
                <button onClick={() => setPainel('revenda')} data-active={painel === 'revenda'} className="flex-1 sm:flex-none h-9 px-4">
                  Revenda ({linhasRevenda.length})
                </button>
              </div>
              <select
                value={ordem}
                onChange={(e) => setOrdem(e.target.value)}
                className="field field-sm field-select field-auto"
              >
                <option value="cmv">Maior CMV primeiro</option>
                <option value="preco">Maior preço</option>
                <option value="nome">Nome (A–Z)</option>
              </select>
            </div>

            {/* ---------------- PRODUÇÃO ---------------- */}
            {painel === 'producao' && (
              <div className="card p-5 sm:p-6">

            {/* ---------------- REVENDA ---------------- */}

                    <tbody>
                      {revendaOrdenada.length === 0 ? (

      };

      // ==========================================
      // FORNECEDORES
      //
      // A mesma base do CMV, lida de outro jeito. O CMV pergunta "quanto sobra
      // disso que eu vendo"; aqui a pergunta é "o preço mudou, e com quem sai
      // mais barato" — que é o único jeito de mexer no CMV sem mexer no preço
      // de venda.
      //
      // Nada é cadastrado nesta tela: toda compra lançada em Insumos & fichas
      // cai aqui sozinha. A variação de preço também não é digitada — ela sai
      // da comparação de cada compra com a anterior do mesmo item.
      // ==========================================

      // Junta as compras de insumo e as de revenda numa lista só e marca, em
      // cada uma, quanto o preço andou desde a compra anterior daquele item.
      const reunirCompras = (supplies, supplyPurchases, separatedProducts, resalePurchases, currentUnit) => {
        const compras = [];

        supplies.forEach((s) => {
          supplyPurchases.filter((c) => c.supplyId === s.id).forEach((c) => {
            compras.push({
              id: c.id,
              itemId: `s${s.id}`,
              item: s.name,
              tipo: 'Insumo',
              unidade: s.unit,
              fornecedor: (c.supplier || '').trim() || 'Sem fornecedor',
              data: c.purchaseDate || '',
              criadoEm: c.criadoEm,
              qty: Number(c.qty) || 0,
              cost: Number(c.cost) || 0
            });
          });
        });

        separatedProducts.filter((p) => p.unit === currentUnit).forEach((p) => {
          resalePurchases.filter((c) => c.separatedProductId === p.id).forEach((c) => {
            compras.push({
              id: c.id,
              itemId: `r${p.id}`,
              item: p.productName,
              tipo: 'Revenda',
              unidade: c.purchaseUnit || p.priceUnit || 'un',
              fornecedor: (c.supplier || '').trim() || 'Sem fornecedor',
              data: c.purchaseDate || '',
              criadoEm: c.criadoEm,
              qty: Number(c.qty) || 0,
              cost: Number(c.cost) || 0
            });
          });
        });

        compras.forEach((c) => { c.custoUnit = c.qty > 0 ? c.cost / c.qty : 0; });

        // A variação é sempre contra a compra ANTERIOR do mesmo item, em ordem
        // de data. A primeira compra de um item não tem com o que comparar.
        const porItem = {};
        compras.forEach((c) => { (porItem[c.itemId] = porItem[c.itemId] || []).push(c); });
        Object.values(porItem).forEach((lista) => {
          lista.sort((a, b) => {
            const d = (a.data || '').localeCompare(b.data || '');
            return d !== 0 ? d : (a.criadoEm || '').localeCompare(b.criadoEm || '');
          });
          lista.forEach((c, idx) => {
            const anterior = idx > 0 ? lista[idx - 1].custoUnit : 0;
            if (idx === 0 || !(c.custoUnit > 0) || !(anterior > 0)) {
              c.variacaoUnit = null;
              c.variacaoPct = null;
              return;
            }
            c.variacaoUnit = c.custoUnit - anterior;
            c.variacaoPct = (c.variacaoUnit / anterior) * 100;
          });
        });

        return compras;
      };

      // A seta da variação: vermelha subindo, verde caindo. O valor aparece na
      // unidade grande (kg, L), que é como se fala de preço de insumo.
      const VariacaoBadge = ({ variacaoUnit, variacaoPct, unidade }) => {
        if (variacaoUnit === null || variacaoUnit === undefined || Math.abs(variacaoUnit) < 1e-9) {
          return <span className="t-body ink-quiet">—</span>;
        }
        const subiu = variacaoUnit > 0;
        const grande = precoNaUnidadeGrande(Math.abs(variacaoUnit), unidade).valor;
        return (
          <span className={`t-body tnum font-bold ${subiu ? 'ink-expired' : 'ink-fresh'}`}>
            {subiu ? '↑' : '↓'} {formatCurrencyBR(grande)}
            {variacaoPct !== null && variacaoPct !== undefined && (
              <span className="font-semibold"> ({subiu ? '+' : ''}{variacaoPct.toFixed(0)}%)</span>
            )}
          </span>
        );
      };

      const SuppliersView = ({
        supplies,
        supplyPurchases,
        separatedProducts,
        resalePurchases,
        currentUnit,
        unitName
      }) => {
        const [visao, setVisao] = useState('item');
        const [busca, setBusca] = useState('');
        const [tipoFiltro, setTipoFiltro] = useState('todos');
        const [ordem, setOrdem] = useState('variacao_desc');
        const [limite, setLimite] = useState('25');
        const [mesFiltro, setMesFiltro] = useState('');
        const [dataInicio, setDataInicio] = useState('');
        const [dataFim, setDataFim] = useState('');
        const [historicoFornecedor, setHistoricoFornecedor] = useState(null);
        const [historicoItem, setHistoricoItem] = useState(null);

        const todas = useMemo(
          () => reunirCompras(supplies, supplyPurchases, separatedProducts, resalePurchases, currentUnit),
          [supplies, supplyPurchases, separatedProducts, resalePurchases, currentUnit]
        );

        // Tipo + período alimentam também o placar; a busca só estreita a lista.
        const porTipo = tipoFiltro === 'todos' ? todas : todas.filter((c) => c.tipo === tipoFiltro);
        const porPeriodo = porTipo.filter((c) => {
          const data = c.data || '';
          if (mesFiltro && !data.startsWith(mesFiltro)) return false;
          if (dataInicio && (!data || data < dataInicio)) return false;
          if (dataFim && (!data || data > dataFim)) return false;
          return true;
        });
        const termo = busca.trim().toLowerCase();
        const compras = termo
          ? porPeriodo.filter((c) => c.fornecedor.toLowerCase().includes(termo) || c.item.toLowerCase().includes(termo))
          : porPeriodo;

        const mesesDisponiveis = useMemo(() => {
          const valores = [...new Set(todas.map((c) => (c.data || '').slice(0, 7)).filter((m) => /^\d{4}-\d{2}$/.test(m)))].sort().reverse();
          return [
            { value: '', label: 'Todos os meses' },
            ...valores.map((m) => ({
              value: m,
              label: new Date(`${m}-01T12:00:00`).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })
            }))
          ];
        }, [todas]);

        const comprasHistoricoFornecedor = historicoFornecedor
          ? [...porPeriodo.filter((c) => c.fornecedor === historicoFornecedor)].sort((a, b) => {
              const d = (b.data || '').localeCompare(a.data || '');
              return d !== 0 ? d : (b.criadoEm || '').localeCompare(a.criadoEm || '');
            })
          : [];

        const comprasHistoricoItem = historicoItem
          ? [...porPeriodo.filter((c) => c.itemId === historicoItem.itemId)].sort((a, b) => {
              const d = (b.data || '').localeCompare(a.data || '');
              return d !== 0 ? d : (b.criadoEm || '').localeCompare(a.criadoEm || '');
            })
          : [];

        const placar = useMemo(() => ({
          fornecedores: new Set(porPeriodo.filter((c) => c.fornecedor !== 'Sem fornecedor').map((c) => c.fornecedor)).size,
          compras: porPeriodo.length,
          total: porPeriodo.reduce((s, c) => s + c.cost, 0),
          itens: new Set(porPeriodo.map((c) => c.itemId)).size
        }), [porPeriodo]);

        // Um resumo por item: preço atual, o de antes, quanto andou e de
        // quantos fornecedores ele já veio
        const porItem = useMemo(() => {
          const grupos = {};
          compras.forEach((c) => { (grupos[c.itemId] = grupos[c.itemId] || []).push(c); });
          return Object.values(grupos).map((lista) => {
            const emOrdem = [...lista].sort((a, b) => {
              const d = (b.data || '').localeCompare(a.data || '');
              return d !== 0 ? d : (b.criadoEm || '').localeCompare(a.criadoEm || '');
            });
            const atual = emOrdem[0];
            const anterior = emOrdem[1] || null;
            const fornecedoresDoItem = {};
            lista.forEach((c) => {
              if (!c.custoUnit) return;
              const f = fornecedoresDoItem[c.fornecedor] || { soma: 0, n: 0, ultima: '' };
              f.soma += c.custoUnit;
              f.n += 1;
              if ((c.data || '') > f.ultima) f.ultima = c.data || '';
              fornecedoresDoItem[c.fornecedor] = f;
            });
            const medias = Object.entries(fornecedoresDoItem)
              .map(([nome, f]) => ({ nome, medio: f.soma / f.n, ultima: f.ultima }))
              .sort((a, b) => a.medio - b.medio);
            const maisBarato = medias[0] || null;
            const maisCaro = medias[medias.length - 1] || null;
            return {
              itemId: atual.itemId,
              item: atual.item,
              tipo: atual.tipo,
              unidade: atual.unidade,
              atual,
              anterior,
              compras: lista.length,
              medias,
              maisBarato,
              // Quanto daria para economizar trocando o mais caro pelo mais barato
              economiaPct: maisBarato && maisCaro && maisCaro.medio > 0 && medias.length > 1
                ? ((maisCaro.medio - maisBarato.medio) / maisCaro.medio) * 100
                : 0
            };
          });
        }, [compras]);

        const itensOrdenados = useMemo(() => [...porItem].sort((a, b) => {
          const va = a.atual.variacaoPct;
          const vb = b.atual.variacaoPct;
          switch (ordem) {
            case 'variacao_asc': return (va === null ? 1e9 : va) - (vb === null ? 1e9 : vb);
            case 'nome_asc': return a.item.localeCompare(b.item, 'pt-BR');
            case 'preco_asc': return a.atual.custoUnit - b.atual.custoUnit;
            case 'preco_desc': return b.atual.custoUnit - a.atual.custoUnit;
            case 'fornecedores_desc': return b.medias.length - a.medias.length;
            case 'economia_desc': return b.economiaPct - a.economiaPct;
            default: return (vb === null ? -1e9 : vb) - (va === null ? -1e9 : va);
          }
        }), [porItem, ordem]);

        const porFornecedor = useMemo(() => {
          const grupos = {};
          compras.forEach((c) => { (grupos[c.fornecedor] = grupos[c.fornecedor] || []).push(c); });
          return Object.entries(grupos).map(([nome, lista]) => ({
            nome,
            lista,
            total: lista.reduce((s, c) => s + c.cost, 0),
            itens: new Set(lista.map((c) => c.itemId)).size,
            recente: lista.reduce((m, c) => (c.data > m ? c.data : m), '')
          })).sort((a, b) => {
            switch (ordem) {
              case 'total_asc': return a.total - b.total;
              case 'compras_desc': return b.lista.length - a.lista.length;
              case 'recente': return (b.recente || '').localeCompare(a.recente || '');
              case 'nome_asc': return a.nome.localeCompare(b.nome, 'pt-BR');
              default: return b.total - a.total;
            }
          });
        }, [compras, ordem]);

        const extrato = useMemo(() => {
          const lista = [...compras].sort((a, b) => {
            const d = (b.data || '').localeCompare(a.data || '');
            return d !== 0 ? d : (b.criadoEm || '').localeCompare(a.criadoEm || '');
          });
          if (ordem === 'antiga') lista.reverse();
          if (ordem === 'valor_desc') lista.sort((a, b) => b.cost - a.cost);
          if (ordem === 'valor_asc') lista.sort((a, b) => a.cost - b.cost);
          return limite === 'all' ? lista : lista.slice(0, Number(limite));
        }, [compras, ordem, limite]);

        // As opções de ordenação mudam com a visão: ordenar por "maior
        // aumento" não quer dizer nada numa lista de fornecedores
        const OPCOES_ORDEM = {
          item: [
            { v: 'variacao_desc', t: 'Maior aumento de preço' },
            { v: 'variacao_asc', t: 'Maior queda de preço' },
            { v: 'economia_desc', t: 'Maior economia possível' },
            { v: 'preco_desc', t: 'Maior preço atual' },
            { v: 'preco_asc', t: 'Menor preço atual' },

      // ==========================================
      // TELA INICIAL — ESCOLHA DO MÓDULO
      //

      // qual assunto veio resolver. Isso separa o balcão (Vitrine) da gestão
      // de custo (CMV) e reduz a quantidade de informação na primeira tela.
      // ==========================================
      const EntryScreen = ({ onChoose }) => (
        <div className="min-h-screen bg-[var(--bg-canvas)] flex items-center justify-center px-4 py-10">
          <div className="w-full max-w-4xl">

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
              <button

                className="card group text-left p-6 sm:p-8 min-h-[220px] sm:min-h-[260px] flex flex-col justify-between hover:-translate-y-0.5 hover:shadow-apple-lg transition-all"
              >

                  <Icons.LayoutGrid className="w-6 h-6" />

              >

                  <p className="t-body mt-3">Produtos, insumos, fichas técnicas, custos e fornecedores.</p>
                  <span className="inline-flex items-center gap-1.5 mt-5 text-[13px] font-bold text-[#274133]">

      // ==========================================
      // MAIN APP COMPONENT
      // ==========================================
      function App() {
        const [currentUnit, setCurrentUnit] = useState('');
        const [entryMode, setEntryMode] = useState(null);
        const [activeTab, setActiveTab] = useState('vitrine');
        const [selectedDay, setSelectedDay] = useState('segunda');

        // O dia do pedido de produção anda por conta própria: a vitrine padrão
        // é planejamento (fica no dia que está sendo editado) e o pedido é
        // rotina de véspera, então ele abre no dia seguinte ao de hoje. Quem
        // vem da vitrine padrão pelo botão "Gerar pedido" leva o dia de lá.
        const [productionDay, setProductionDay] = useState(getTomorrowDayOfWeek());

        // Qual vitrine está aberta na tela operacional. Fica aqui em cima
        // porque a vitrine física e a lista de apoio mostram sempre a mesma:
        // a lista é a leitura em texto do móvel que está sendo conferido.
        const [showcaseFilter, setShowcaseFilter] = useState('salgada');

        // Conferência item a item por cima da tela da vitrine
        const [checklistAberto, setChecklistAberto] = useState(false);

        // Todo o estado abaixo é espelho do banco — nada é lido ou salvo no navegador
        const [units, setUnits] = useState([]);
        const [products, setProducts] = useState([]);
        const [slots, setSlots] = useState([]);
        const [slotItems, setSlotItems] = useState([]);
        const [standardPlans, setStandardPlans] = useState([]);
        const [lossRecords, setLossRecords] = useState([]);
        const [saleRecords, setSaleRecords] = useState([]);
        const [separatedProducts, setSeparatedProducts] = useState([]);
        const [productionRecords, setProductionRecords] = useState([]);
        // Falso enquanto a tabela production_records não existir no banco
        const [productionReady, setProductionReady] = useState(true);
        // O CMV: insumos, o que foi comprado deles, as fichas técnicas e o que
        // entra em cada uma
        const [supplies, setSupplies] = useState([]);
        const [supplyPurchases, setSupplyPurchases] = useState([]);
        const [recipes, setRecipes] = useState([]);
        const [recipeItems, setRecipeItems] = useState([]);
        const [resalePurchases, setResalePurchases] = useState([]);
        // Falso enquanto as tabelas do CMV não existirem no banco
        const [cmvReady, setCmvReady] = useState(true);
        // Falso enquanto standard_plans não tiver prioridade e frequência
        const [planExtrasReady, setPlanExtrasReady] = useState(true);
        // Falso enquanto standard_plans não tiver a quantidade mínima por dia
        const [planMinReady, setPlanMinReady] = useState(true);

        // { item, mode } — o modo diz se a janela abre em venda ou em perda
        const [decreaseTarget, setDecreaseTarget] = useState(null);
        // Última baixa de um clique (venda ou perda), enquanto ela ainda pode
        // ser desfeita
        const [undoBaixa, setUndoBaixa] = useState(null);
        const [slotToFill, setSlotToFill] = useState(null);
        // O + do canto da tela da vitrine, no celular
        const [quickAddOpen, setQuickAddOpen] = useState(false);

        const [loadState, setLoadState] = useState('loading'); // loading | ready | error
        const [errorMsg, setErrorMsg] = useState('');
        const [pendingWrites, setPendingWrites] = useState(0);
        const [lastSync, setLastSync] = useState(null);

        // Gravações em andamento e digitação pendente seguram o auto-refresh,
        // para não sobrescrever o que a pessoa está fazendo agora
        const busyRef = useRef(0);
        const timersRef = useRef({});

        // Espelho dos itens da vitrine, lido no mesmo instante do clique. O
        // estado do React só chega no próximo render, e a venda de um clique
        // não pode esperar por ele.
        const slotItemsRef = useRef(slotItems);
        slotItemsRef.current = slotItems;
        const aplicarSlotItems = (atualizar) => {
          const proximos = typeof atualizar === 'function' ? atualizar(slotItemsRef.current) : atualizar;
          slotItemsRef.current = proximos;
          setSlotItems(proximos);
        };

        // Mesmo espelho para o histórico de produção: a contagem digitada na
        // lista de apoio corrige o lançamento de produção a cada tecla, e cada
        // uma precisa ler o número que a anterior deixou.
        const productionRecordsRef = useRef(productionRecords);
        productionRecordsRef.current = productionRecords;
        const aplicarProducao = (proximos) => {
          productionRecordsRef.current = proximos;
          setProductionRecords(proximos);
        };

        // Espelho das fichas técnicas, pelo mesmo motivo dos itens da vitrine:
        // criar uma ficha e usar o id dela acontece antes do próximo render
        const recipesRef = useRef(recipes);
        recipesRef.current = recipes;
        const aplicarRecipes = (proximas) => {
          recipesRef.current = proximas;
          setRecipes(proximas);
        };

        // As baixas que já voltaram atrás, para o desfazer não devolver as
        // mesmas unidades duas vezes
        const desfeitasRef = useRef(new Set());

        // Uma baixa de cada vez: gravações em paralelo poderiam chegar ao
        // banco fora de ordem e deixar o saldo do espaço errado
        const baixaQueueRef = useRef(Promise.resolve());
        const enfileirarBaixa = (label, fn) => {
          const tarefa = baixaQueueRef.current.then(() => write(label, fn));
          baixaQueueRef.current = tarefa.catch(() => {});
          return tarefa;
        };

        const applySnapshot = (data) => {
          setUnits(data.units);
          setProducts(data.products);
          setSlots(data.slots);
          aplicarSlotItems(data.slotItems);
          setStandardPlans(data.standardPlans);
          setSaleRecords(data.saleRecords);
          setLossRecords(data.lossRecords);
          setSeparatedProducts(data.separatedProducts);
          setProductionRecords(data.productionRecords);
          setProductionReady(data.productionReady);
          setSupplies(data.supplies);
          setSupplyPurchases(data.supplyPurchases);
          aplicarRecipes(data.recipes);
          setRecipeItems(data.recipeItems);
          setResalePurchases(data.resalePurchases);
          setCmvReady(data.cmvReady);
          setPlanExtrasReady(data.planExtrasReady);
          setPlanMinReady(data.planMinReady);
          setCurrentUnit((atual) => (data.units.some((u) => u.code === atual) ? atual : data.units[0]?.code || ''));
          setLastSync(new Date());
        };

        const reload = async ({ silent = false } = {}) => {
          if (!sb) return;
          try {
            const data = await fetchEverything();
            applySnapshot(data);
            setErrorMsg('');
            setLoadState('ready');
          } catch (e) {
            if (!silent) {
              setErrorMsg(e.message);
              setLoadState('error');
            }
          }
        };

        useEffect(() => { reload(); }, []);

        // Mantém a tela em dia com o que as outras unidades e aparelhos gravaram
        useEffect(() => {
          if (!sb) return;
          const canRefresh = () => busyRef.current === 0 && Object.keys(timersRef.current).length === 0;
          const tick = () => { if (canRefresh() && document.visibilityState === 'visible') reload({ silent: true }); };
          const id = setInterval(tick, 30000);
          window.addEventListener('focus', tick);
          return () => { clearInterval(id); window.removeEventListener('focus', tick); };
        }, []);

        // O "Desfazer" da baixa de um clique vale por alguns segundos: depois
        // disso a barra sai da frente sozinha
        useEffect(() => {
          if (!undoBaixa) return;
          const id = setTimeout(() => setUndoBaixa(null), 8000);
          return () => clearTimeout(id);
        }, [undoBaixa]);

        // Descarta as gravações agendadas ao sair da página
        useEffect(() => () => {
          Object.values(timersRef.current).forEach(clearTimeout);
          timersRef.current = {};
        }, []);

        // Executa a gravação; se o banco recusar, mostra o motivo e recarrega
        // para a tela nunca ficar mostrando algo que não foi salvo
        const write = async (label, fn) => {
          busyRef.current += 1;
          setPendingWrites((n) => n + 1);
          try {
            const resultado = await fn();
            setLastSync(new Date());
            setErrorMsg('');
            return resultado;
          } catch (e) {
            // Recarrega primeiro (o reload limpa a mensagem) e só então avisa,
            // para o aviso não sumir junto
            await reload({ silent: true });
            setErrorMsg(`${label} — ${e.message}`);
          } finally {
            busyRef.current -= 1;
            setPendingWrites((n) => Math.max(0, n - 1));
          }
        };

        // Campos digitados (datas, quantidades, responsável) gravam depois da
        // última tecla, em vez de uma chamada por caractere
        const writeSoon = (key, label, fn) => {
          if (timersRef.current[key]) clearTimeout(timersRef.current[key]);
          timersRef.current[key] = setTimeout(() => {
            delete timersRef.current[key];
            write(label, fn);
          }, 600);
        };

        // Guarda o que foi colocado na vitrine. A tabela é nova: se o banco
        // ainda não a tem, a alocação continua valendo e a tela do histórico
        // explica o que falta rodar — nada de erro em cima de quem está na loja
        const logProduction = async (linhas) => {
          if (linhas.length === 0) return;
          const { data, error } = await sb.from('production_records').insert(linhas).select();
          if (error) {
            setProductionReady(false);
            return;
          }
          setProductionReady(true);
          aplicarProducao([...data.map(fromProduction), ...productionRecordsRef.current]);
        };

        const totalAlerts = useMemo(() => {
          return slotItems.filter((item) => {
            const slot = slots.find((s) => s.id === item.slotId);
            if (slot?.unit !== currentUnit) return false;
            const prod = products.find((p) => p.id === item.productId);
            const statusInfo = getSlotItemStatus(item, prod);
            return statusInfo.status !== 'normal';
          }).length;
        }, [slotItems, slots, products, currentUnit]);

        // Contagem do que está na vitrine: acerta o número e mais nada — não
        // é venda nem perda, então não entra em relatório nenhum. Lê do
        // espelho para pegar o saldo do instante, e o que for reposto acima do
        // lote levanta junto o total produzido, senão a leitura "9 de 8"
        // ficaria sem sentido.
        const handleSetQty = (itemId, valor) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;
          const nova = Math.max(0, Math.round(valor) || 0);
          if (nova === target.currentQty) return;

          handleUpdateItem({
            ...target,
            currentQty: nova,
            producedQty: Math.max(target.producedQty || 0, nova)
          });
        };

        const handleUpdateItem = (updatedItem) => {
          const anterior = slotItemsRef.current.find((i) => i.id === updatedItem.id);
          aplicarSlotItems((prev) => prev.map((i) => i.id === updatedItem.id ? updatedItem : i));
          writeSoon(`item:${updatedItem.id}`, 'Atualizar item da vitrine', () =>
            run('slot_items', sb.from('slot_items').update({
              produced_qty: updatedItem.producedQty,
              current_qty: updatedItem.currentQty,
              manufacture_date: updatedItem.manufactureDate
            }).eq('id', updatedItem.id))
          );
          sincronizarProducao(anterior, updatedItem);
        };

        // A conferência corrige o tamanho da fornada e a data de fabricação
        // depois de o item já ter entrado na vitrine. Sem trazer essa correção
        // para o lançamento de produção, o histórico continua mostrando o
        // número da hora em que o item entrou e a conta por lote fecha errada.
        //
        // O lançamento é achado pelo espaço, produto e data de fabricação que o
        // item tinha antes da mexida — foi assim que ele foi gravado. Cada
        // alocação gravou um item e um lançamento com a mesma quantidade, então
        // o lançamento recebe o número da conferência inteiro, e não a
        // diferença: assim uma correção atrás da outra não acumula erro.
        const sincronizarProducao = (anterior, atual) => {
          if (!anterior || !productionReady) return;

          const novaQty = atual.producedQty || 0;
          const loteAntes = toDayKey(anterior.manufactureDate);
          const loteDepois = toDayKey(atual.manufactureDate);
          if (novaQty === (anterior.producedQty || 0) && loteDepois === loteAntes) return;

          // Campo apagado para digitar outro número: espera o número novo. Para
          // tirar a produção do histórico existe o botão de excluir de lá.
          if (novaQty <= 0) return;

          const registro = productionRecordsRef.current.find(
            (p) => p.unit === currentUnit
              && p.productId === anterior.productId
              && p.slotId === anterior.slotId
              && toDayKey(p.manufactureDate) === loteAntes
          );
          if (!registro) return;

          const novoLote = loteDepois || registro.manufactureDate;
          aplicarProducao(productionRecordsRef.current.map((p) => p.id === registro.id ? {
            ...p, qty: novaQty, manufactureDate: novoLote
          } : p));

          writeSoon(`producao:${registro.id}`, 'Atualizar produção do histórico', () =>
            run('production_records', sb.from('production_records').update({
              qty: novaQty,
              manufacture_date: novoLote
            }).eq('id', registro.id))
          );
        };

        // Venda e perda seguem o mesmo caminho: grava a baixa e acerta o saldo do espaço.
        //
        // Com a venda de um clique, dois toques seguidos no mesmo item chegam
        // aqui antes de a primeira gravação voltar do banco. Por isso o saldo
        // sai do espelho (slotItemsRef), desce na tela na hora e as gravações
        // entram em fila — senão o segundo toque leria o saldo antigo e o
        // banco terminaria com uma unidade a mais.
        const registrarBaixa = (tabela, itemId, qty, extras, label) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || qty <= 0) return;
          const product = products.find((p) => p.id === target.productId);
          const restante = target.currentQty - qty;
          const zerou = restante <= 0;

          aplicarSlotItems(zerou
            ? slotItemsRef.current.filter((i) => i.id !== itemId)
            : slotItemsRef.current.map((i) => i.id === itemId ? { ...i, currentQty: restante } : i));

          return enfileirarBaixa(label, async () => {
            const linhas = await run(tabela, sb.from(tabela).insert({
              unit_code: currentUnit,
              product_id: target.productId,
              product_name: target.productName,
              responsible: cleanResponsible(product?.responsible),
              qty,
              produced_qty: target.producedQty || target.currentQty,
              unit_of_measure: target.unit,
              manufacture_date: target.manufactureDate,
              ...extras
            }).select());

            const registro = linhas[0];
            if (tabela === 'sale_records') {
              setSaleRecords((prev) => [fromSale(registro), ...prev]);
            } else {
              setLossRecords((prev) => [fromLoss(registro), ...prev]);
            }

            // A tela já desceu o saldo; aqui só o banco acompanha
            if (zerou) {
              await run('slot_items', sb.from('slot_items').delete().eq('id', itemId));
            } else {
              await run('slot_items', sb.from('slot_items').update({ current_qty: restante }).eq('id', itemId));
            }

            // O que a baixa de um clique precisa para voltar atrás
            return { tabela, recordId: registro.id, item: target, qty, zerou };
          });
        };

        const handleRecordSale = (itemId, qty) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;
          return registrarBaixa('sale_records', itemId, qty, {
            exposure_days: calculateDaysInShowcase(target.manufactureDate)
          }, 'Registrar venda');
        };

        // Um clique = uma unidade vendida. Sem janela, sem confirmação — e com
        // "Desfazer" na tela por alguns segundos para o clique errado
        const handleQuickSale = async (itemId) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || target.currentQty <= 0) return;
          const baixa = await handleRecordSale(itemId, 1);
          if (baixa) setUndoBaixa(baixa);
        };

        // Apaga o registro da baixa e devolve as unidades ao espaço. Se a baixa
        // tinha zerado o item, o espaço é montado de novo com os mesmos dados.
        //
        // Recebe a baixa por parâmetro porque o desfazer aparece em dois
        // lugares: a barrinha da tela e o checklist, que guarda a última baixa
        // dele mesmo.
        //
        // Desfazer é uma vez só por baixa: o segundo clique na barrinha
        // devolveria as unidades de novo, e a vitrine terminaria com mais do
        // que tinha antes da venda.
        const desfazerBaixa = (alvo) => {
          if (!alvo || desfeitasRef.current.has(alvo.recordId)) return;
          desfeitasRef.current.add(alvo.recordId);
          setUndoBaixa((atual) => (atual && atual.recordId === alvo.recordId ? null : atual));

          enfileirarBaixa('Desfazer baixa', async () => {
            await run(alvo.tabela, sb.from(alvo.tabela).delete().eq('id', alvo.recordId));
            if (alvo.tabela === 'sale_records') {
              setSaleRecords((prev) => prev.filter((s) => s.id !== alvo.recordId));
            } else {
              setLossRecords((prev) => prev.filter((l) => l.id !== alvo.recordId));
            }

            // A baixa levou o item embora: o espaço volta a ser montado com os
            // mesmos dados, em uma linha nova
            if (alvo.zerou) {
              const linhas = await run('slot_items', sb.from('slot_items').insert({
                slot_code: alvo.item.slotId,
                product_id: alvo.item.productId,
                produced_qty: alvo.item.producedQty,
                current_qty: alvo.item.currentQty,
                unit_of_measure: alvo.item.unit,
                min_qty: alvo.item.minQty,
                manufacture_date: alvo.item.manufactureDate,
                entry_date: alvo.item.entryDate
              }).select(SLOT_ITEM_COLUMNS));
              aplicarSlotItems([...slotItemsRef.current, fromSlotItem(linhas[0])]);
              return;
            }

            // Soma sobre o saldo de agora: o balcão pode ter mexido no item
            // entre a venda e o arrependimento
            const atual = slotItemsRef.current.find((i) => i.id === alvo.item.id);
            if (!atual) return;
            const devolvido = atual.currentQty + alvo.qty;
            await run('slot_items', sb.from('slot_items').update({ current_qty: devolvido }).eq('id', alvo.item.id));
            aplicarSlotItems(slotItemsRef.current.map((i) => i.id === alvo.item.id ? { ...i, currentQty: devolvido } : i));
          });
        };

        const handleUndoBaixa = () => desfazerBaixa(undoBaixa);

        const handleRecordLoss = (itemId, qty, reason, details) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;
          return registrarBaixa('loss_records', itemId, qty, {
            loss_date: getTodayDateString(),
            reason,
            details: details || null,
            slot_code: target.slotId
          }, 'Registrar perda');
        };

        // "Vendeu tudo" também sai de um clique, então ganha o mesmo desfazer
        const handleRecordSellAll = async (itemId) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || target.currentQty <= 0) return;
          const baixa = await handleRecordSale(itemId, target.currentQty);
          if (baixa) setUndoBaixa(baixa);
        };

        // Perda rápida: tocar tira uma unidade e segurar tira o que sobrou.
        // O motivo entra como "vencido", que é a perda do dia a dia da vitrine.
        const handleQuickLoss = async (itemId, qty) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || target.currentQty <= 0) return;
          const baixa = await handleRecordLoss(itemId, Math.min(qty, target.currentQty), 'vencido', '');
          if (baixa) setUndoBaixa(baixa);
        };

        const abrirBaixa = (item, mode = 'venda') => setDecreaseTarget({ item, mode });

        // A lixeira do item é o "isso nunca aconteceu": além de tirar o produto
        // do espaço, ela apaga o rastro que a entrada dele deixou — o
        // lançamento de produção que o colocou na vitrine e as baixas que
        // saíram dele. Um item lançado por engano que só sumisse da tela
        // continuaria contando no histórico, no relatório de perdas e na conta
        // do lote, e a loja teria de caçar lançamento por lançamento à mão.
        //
        // O que conta como "dele": o mesmo produto, com a mesma data de
        // fabricação, na mesma unidade — o lote — e gravado depois que o item
        // entrou. O corte pela hora da entrada protege a fornada anterior: um
        // lote igual que já tinha sido vendido antes deste item chegar ao
        // espaço não vai embora junto.
        //
        // A venda não guarda o espaço de onde saiu. Então, quando o mesmo lote
        // ainda está em outro espaço da loja, as vendas ficam onde estão: não
        // dá para saber quais eram deste espaço, e apagar as do vizinho seria
        // pior do que deixar. A perda guarda o espaço, e essa dá para separar.
        const handleRemoveItem = (itemId) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;

          const lote = toDayKey(target.manufactureDate);
          const desde = target.criadoEm ? new Date(target.criadoEm).getTime() : 0;
          const naUnidade = (item) => slots.some((s) => s.id === item.slotId && s.unit === currentUnit);

          const doLote = (r) => r.unit === currentUnit
            && r.productId === target.productId
            && toDayKey(r.manufactureDate) === lote;
          const depoisDaEntrada = (r) => !desde || (r.criadoEm ? new Date(r.criadoEm).getTime() >= desde : true);

          const loteDividido = slotItemsRef.current.some(
            (i) => i.id !== itemId
              && i.productId === target.productId
              && toDayKey(i.manufactureDate) === lote
              && naUnidade(i)
          );

          const vendaDoItem = (v) => !loteDividido && doLote(v) && depoisDaEntrada(v);
          const perdaDoItem = (l) => doLote(l) && depoisDaEntrada(l)
            && (!loteDividido || l.slotId === target.slotId);

          // O lançamento de produção deste item: mesmo espaço, mesmo lote. Cada
          // alocação grava um item e um lançamento no mesmo instante, então,
          // quando o produto entrou duas vezes no dia no mesmo espaço, vale o
          // lançamento mais perto da hora em que este item entrou.
          const candidatos = productionRecordsRef.current.filter(
            (p) => doLote(p) && p.slotId === target.slotId
          );
          const distancia = (p) => Math.abs(new Date(p.timestamp || 0).getTime() - desde);
          const producao = candidatos.length === 0
            ? null
            : candidatos.reduce((perto, p) => (distancia(p) < distancia(perto) ? p : perto));

          const vendas = saleRecords.filter(vendaDoItem);
          const perdas = lossRecords.filter(perdaDoItem);
          const soma = (lista) => lista.reduce((total, r) => total + r.qty, 0);
          const conta = (n, um, muitos) => `${n} ${n === 1 ? um : muitos}`;

          const oQueSai = [
            producao && `o lançamento de ${producao.qty} ${producao.unitOfMeasure} na produção`,
            vendas.length > 0 && `${conta(vendas.length, 'venda', 'vendas')} de ${soma(vendas)} ${target.unit}`,
            perdas.length > 0 && `${conta(perdas.length, 'perda', 'perdas')} de ${soma(perdas)} ${target.unit}`
          ].filter(Boolean);

          const aviso = [`Remover "${target.productName}" da vitrine?`];
          if (oQueSai.length > 0) {
            aviso.push(`Sai também do histórico: ${oQueSai.join(', ')}. Fica como se este item nunca tivesse entrado na vitrine.`);
          }
          if (loteDividido) {
            aviso.push('As vendas desta fornada continuam no histórico: o mesmo produto, do mesmo lote, ainda está em outro espaço da loja.');
          }
          if (!window.confirm(aviso.join('\n\n'))) return;

          aplicarSlotItems(slotItemsRef.current.filter((i) => i.id !== itemId));
          if (producao) aplicarProducao(productionRecordsRef.current.filter((p) => p.id !== producao.id));
          if (vendas.length > 0) setSaleRecords((prev) => prev.filter((v) => !vendaDoItem(v)));
          if (perdas.length > 0) setLossRecords((prev) => prev.filter((l) => !perdaDoItem(l)));

          // O "Desfazer" da última baixa não sobrevive ao item: ele devolveria
          // unidades a um espaço que não existe mais e apagaria um registro que
          // já foi embora junto com o lote
          const apagadas = new Set([...vendas, ...perdas].map((r) => r.id));
          apagadas.forEach((id) => desfeitasRef.current.add(id));
          setUndoBaixa((atual) => (atual && (atual.item.id === itemId || apagadas.has(atual.recordId)) ? null : atual));

          enfileirarBaixa('Remover item da vitrine', async () => {
            await run('slot_items', sb.from('slot_items').delete().eq('id', itemId));

            if (producao) {
              await run('production_records', sb.from('production_records').delete().eq('id', producao.id));
            }

            // As baixas saem por filtro, e não pela lista da tela: a tela carrega
            // as últimas 500 de cada tabela, e uma baixa mais velha que isso
            // continuaria no banco depois de o item ter sido apagado
            const doLoteNoBanco = (query) => {
              const filtrado = query
                .eq('unit_code', currentUnit)
                .eq('product_id', target.productId)
                .eq('manufacture_date', target.manufactureDate);
              return target.criadoEm ? filtrado.gte('created_at', target.criadoEm) : filtrado;
            };

            if (!loteDividido) {
              await run('vendas do item', doLoteNoBanco(sb.from('sale_records').delete()));
            }

            const perdasDoLote = doLoteNoBanco(sb.from('loss_records').delete());
            await run('perdas do item', loteDividido
              ? perdasDoLote.eq('slot_code', target.slotId)
              : perdasDoLote);
          });
        };

        // slotId vindo da vitrine física manda o produto para aquele espaço,
        // mesmo que ele já tenha alguém — é assim que se divide um espaço.
        // Sem slotId, procura um espaço livre do tipo certo.
        const handleQuickAllocate = (productName, qty, manufactureDate, slotId, showcaseTypeHint) => {
          const existente = products.find(
            (p) => p.name.toLowerCase().trim() === productName.toLowerCase().trim()
          );

          const escolhido = slotId ? slots.find((s) => s.id === slotId) : null;

          write('Alocar na vitrine', async () => {
            let product = existente;
            if (product && product.showcaseEnabled === false) {
              throw new Error(`“${product.name}” está marcado como fora da vitrine. Ative “Vai para vitrine” no cadastro de Produtos.`);
            }

            // Produto digitado que ainda não existe entra no catálogo, já na
            // categoria da vitrine em que ele está sendo colocado — o espaço
            // escolhido manda; sem espaço, vale a vitrine aberta na tela
            const tipoDestino = escolhido ? escolhido.showcaseType : showcaseTypeHint;

            if (!product) {
              const linhas = await run('products', sb.from('products').insert({
                name: productName.trim(),
                responsible: '',
                category: tipoDestino ? categoryOfShowcaseType(tipoDestino) : 'salgado',
                is_active: true,
                default_unit: 'un',
                min_replenishment_qty: 10,
                shelf_life_days: 2,
                price: 8.0
              }).select());
              product = fromProduct(linhas[0]);
              setProducts((prev) => [...prev, product].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR')));
            }

            const showcaseType = showcaseTypeOfCategory(product.category);
            const unitSlots = slots.filter((s) => s.unit === currentUnit && s.showcaseType === showcaseType);

            if (!escolhido && unitSlots.length === 0) {
              throw new Error(`nenhum espaço de ${showcaseType} cadastrado na unidade ${getUnitName(units, currentUnit)}`);
            }

            // Produto que já está na vitrine volta para o espaço dele: o lote
            // de ontem e o de hoje ficam na mesma bandeja, como ficam no móvel
            // de verdade. Dar um espaço novo para o mesmo produto tomaria
            // lugar de quem ainda não tem nenhum.
            //
            // Quando a pessoa escolheu um móvel — a janela de colocar produto
            // é por móvel, e não por espaço —, a procura fica dentro dele.
            const espacosDaProcura = escolhido
              ? unitSlots.filter((s) => showcaseKey(s) === showcaseKey(escolhido))
              : unitSlots;
            const mesmoProduto = espacosDaProcura.find((s) =>
              slotItems.some((i) => i.slotId === s.id && i.productId === product.id)
            );

            // Com a vitrine cheia, entra no espaço menos ocupado em vez de
            // empilhar tudo no primeiro
            const ocupacao = (slot) => slotItems.filter((i) => i.slotId === slot.id).length;
            const targetSlot = mesmoProduto
              || escolhido
              || unitSlots.find((s) => ocupacao(s) === 0)
              || unitSlots.reduce((menos, s) => (ocupacao(s) < ocupacao(menos) ? s : menos), unitSlots[0]);

            const dataFabricacao = manufactureDate || getTodayDateString();

            const linhas = await run('slot_items', sb.from('slot_items').insert({
              slot_code: targetSlot.id,
              product_id: product.id,
              produced_qty: qty,
              current_qty: qty,
              unit_of_measure: product.defaultUnit || 'un',
              min_qty: product.minReplenishmentQty || 5,
              manufacture_date: dataFabricacao,
              entry_date: getTodayDateString()
            }).select(SLOT_ITEM_COLUMNS));

            aplicarSlotItems((prev) => [...prev, { ...fromSlotItem(linhas[0]), productName: product.name }]);

            await logProduction([{
              unit_code: currentUnit,
              product_id: product.id,
              product_name: product.name,
              responsible: cleanResponsible(product.responsible),
              qty,
              unit_of_measure: product.defaultUnit || 'un',
              manufacture_date: dataFabricacao,
              slot_code: targetSlot.id,
              source: 'avulso'
            }]);
          });
        };

        // Prioridade e frequência chegaram depois: um banco que ainda não rodou
        // a versão nova do schema.sql continua salvando o padrão sem elas.
        const withPlanExtras = (linha, priority, frequency) =>
          planExtrasReady ? { ...linha, priority, frequency } : linha;

        // O mesmo cuidado com a quantidade mínima por dia: banco que ainda não
        // rodou a versão nova do schema.sql grava o padrão sem ela
        const withPlanMin = (linha, minQty) =>
          planMinReady ? { ...linha, min_qty: Math.max(0, Math.floor(minQty) || 0) } : linha;

        // O mínimo nunca passa do padrão daquele espaço: acima disso o item
        // seria chamado no pedido todo dia, com a vitrine cheia
        const limitarMin = (minQty, idealQty) =>
          Math.max(0, Math.min(Math.floor(Number(minQty) || 0), Math.max(0, idealQty || 0)));

        // Em quantos dias o produto deste espaço fica, contando o dia que
        // acabou de entrar — é o que a coluna "frequency" guarda
        const frequencyFor = (slotId, productId, extraDay) => {
          const dias = new Set(planDaysOf(standardPlans, currentUnit, slotId, productId));
          if (extraDay) dias.add(extraDay);
          return dias.size >= WEEK_DAYS.length ? 'todo_dia' : 'dias';
        };

        const handleUpdatePlanItem = (slotId, productId, idealQty, priority = DEFAULT_PRIORITY) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;
          const existing = standardPlans.find(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay && sp.slotId === slotId
          );
          const prioridade = getPriority(priority).value;
          const frequencia = frequencyFor(slotId, productId, selectedDay);

          // Trocar o produto do espaço zera o mínimo do que estava lá: ele era
          // do outro item. Item novo começa com o mínimo de reposição do
          // catálogo, e a loja ajusta na tabela da semana
          const minimo = existing && existing.productId === productId
            ? limitarMin(existing.minQty, idealQty)
            : limitarMin(defaultMinQty(prod, idealQty), idealQty);

          write('Salvar vitrine padrão', async () => {
            if (existing) {
              await run('standard_plans', sb.from('standard_plans')
                .update(withPlanMin(
                  withPlanExtras({ product_id: productId, ideal_qty: idealQty }, prioridade, frequencia),
                  minimo
                ))
                .eq('id', existing.id));
              setStandardPlans((prev) => prev.map((sp) =>
                sp.id === existing.id
                  ? { ...sp, productId, idealQty, minQty: minimo, priority: prioridade, frequency: frequencia }
                  : sp
              ));
              return;
            }

            const linhas = await run('standard_plans', sb.from('standard_plans').insert(
              withPlanMin(withPlanExtras({
                unit_code: currentUnit,
                day_of_week: selectedDay,
                slot_code: slotId,
                product_id: productId,
                ideal_qty: idealQty,
                unit_of_measure: prod.defaultUnit || 'un'
              }, prioridade, frequencia), minimo)
            ).select());
            setStandardPlans((prev) => [...prev, fromPlan(linhas[0])]);
          });
        };

        // ------------------------------------------
        // Organizar o item: prioridade, dias da semana e quantidade de uma vez.
        // Marcar "todo dia" grava o item nos sete dias; desmarcar um dia tira o
        // item só dele. Se o espaço já tinha outro produto em um dia marcado,
        // esse dia passa a ser deste produto.
        // ------------------------------------------
        const handleUpdatePlanSchedule = (slotId, productId, { priority, days, idealQty, minQty }) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod || !days || days.length === 0) return;

          const minimo = limitarMin(minQty, idealQty);
          const prioridade = getPriority(priority).value;
          const frequencia = days.length >= WEEK_DAYS.length ? 'todo_dia' : 'dias';
          const medida = prod.defaultUnit || 'un';

          const planoDoDia = (day) => standardPlans.find(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.slotId === slotId
          );

          const aApagar = [];
          const aAtualizar = [];
          const aInserir = [];

          WEEK_DAYS.forEach((day) => {
            const existente = planoDoDia(day);
            if (days.includes(day)) {
              if (existente) aAtualizar.push(existente.id);
              else aInserir.push(day);
            } else if (existente && existente.productId === productId) {
              aApagar.push(existente.id);
            }
          });

          write('Organizar item da vitrine padrão', async () => {
            if (aApagar.length > 0) {
              await run('standard_plans', sb.from('standard_plans').delete().in('id', aApagar));
            }

            if (aAtualizar.length > 0) {
              await run('standard_plans', sb.from('standard_plans')
                .update(withPlanMin(withPlanExtras({
                  product_id: productId,
                  ideal_qty: idealQty,
                  unit_of_measure: medida
                }, prioridade, frequencia), minimo))
                .in('id', aAtualizar));
            }

            let novos = [];
            if (aInserir.length > 0) {
              const linhas = await run('standard_plans', sb.from('standard_plans').insert(
                aInserir.map((day) => withPlanMin(withPlanExtras({
                  unit_code: currentUnit,
                  day_of_week: day,
                  slot_code: slotId,
                  product_id: productId,
                  ideal_qty: idealQty,
                  unit_of_measure: medida
                }, prioridade, frequencia), minimo))
              ).select());
              novos = linhas.map(fromPlan);
            }

            setStandardPlans((prev) => [
              ...prev
                .filter((sp) => !aApagar.includes(sp.id))
                .map((sp) => aAtualizar.includes(sp.id)
                  ? {
                    ...sp, productId, idealQty, minQty: minimo,
                    priority: prioridade, frequency: frequencia, unitOfMeasure: medida
                  }
                  : sp),
              ...novos
            ]);
          });
        };

        // ------------------------------------------
        // Editar a quantidade direto na tabela da semana.
        //
        // A célula é o produto em um dia, e o mesmo produto pode estar em mais
        // de um espaço: a quantidade nova é repartida entre os espaços que ele
        // já ocupa naquele dia, mantendo quem tinha mais com mais. Zero tira o
        // produto do dia. Célula vazia coloca o produto no espaço que ele usa
        // nos outros dias — e, se ele estiver ocupado, no primeiro espaço livre
        // da mesma vitrine.
        // ------------------------------------------
        const handleSetWeeklyQty = (day, productId, novaQtd) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;

          const qtd = Math.max(0, Math.floor(Number(novaQtd) || 0));
          const doDia = standardPlans.filter(
