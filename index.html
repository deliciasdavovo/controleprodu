        const [productionRecords, setProductionRecords] = useState([]);
        // Falso enquanto a tabela production_records não existir no banco
        const [productionReady, setProductionReady] = useState(true);
        // Falso enquanto standard_plans não tiver prioridade e frequência
        const [planExtrasReady, setPlanExtrasReady] = useState(true);
        // Falso enquanto standard_plans não tiver a quantidade mínima por dia
        const [planMinReady, setPlanMinReady] = useState(true);

        // { item, mode } — o modo diz se a janela abre em venda ou em perda
        const [decreaseTarget, setDecreaseTarget] = useState(null);
        // Última baixa de um clique (venda ou perda), enquanto ela ainda pode
        // ser desfeita
        const [undoBaixa, setUndoBaixa] = useState(null);
        const [slotToFill, setSlotToFill] = useState(null);

        const [loadState, setLoadState] = useState('loading'); // loading | ready | error
        const [errorMsg, setErrorMsg] = useState('');
        const [pendingWrites, setPendingWrites] = useState(0);
        const [lastSync, setLastSync] = useState(null);

        // Gravações em andamento e digitação pendente seguram o auto-refresh,
        // para não sobrescrever o que a pessoa está fazendo agora
        const busyRef = useRef(0);
        const timersRef = useRef({});

        // Espelho dos itens da vitrine, lido no mesmo instante do clique. O
        // estado do React só chega no próximo render, e a venda de um clique
        // não pode esperar por ele.
        const slotItemsRef = useRef(slotItems);
        slotItemsRef.current = slotItems;
        const aplicarSlotItems = (atualizar) => {
          const proximos = typeof atualizar === 'function' ? atualizar(slotItemsRef.current) : atualizar;
          slotItemsRef.current = proximos;
          setSlotItems(proximos);
        };

        // Mesmo espelho para o histórico de produção: a contagem digitada na
        // lista de apoio corrige o lançamento de produção a cada tecla, e cada
        // uma precisa ler o número que a anterior deixou.
        const productionRecordsRef = useRef(productionRecords);
        productionRecordsRef.current = productionRecords;
        const aplicarProducao = (proximos) => {
          productionRecordsRef.current = proximos;
          setProductionRecords(proximos);
        };

        // Uma baixa de cada vez: gravações em paralelo poderiam chegar ao
        // banco fora de ordem e deixar o saldo do espaço errado
        const baixaQueueRef = useRef(Promise.resolve());
        const enfileirarBaixa = (label, fn) => {
          const tarefa = baixaQueueRef.current.then(() => write(label, fn));
          baixaQueueRef.current = tarefa.catch(() => {});
          return tarefa;
        };

        const applySnapshot = (data) => {
          setUnits(data.units);
          setProducts(data.products);
          setSlots(data.slots);
          aplicarSlotItems(data.slotItems);
          setStandardPlans(data.standardPlans);
          setSaleRecords(data.saleRecords);
          setLossRecords(data.lossRecords);
          setSeparatedProducts(data.separatedProducts);
          setProductionRecords(data.productionRecords);
          setProductionReady(data.productionReady);
          setPlanExtrasReady(data.planExtrasReady);
          setPlanMinReady(data.planMinReady);
          setCurrentUnit((atual) => (data.units.some((u) => u.code === atual) ? atual : data.units[0]?.code || ''));
          setLastSync(new Date());
        };

        const reload = async ({ silent = false } = {}) => {
          if (!sb) return;
          try {
            const data = await fetchEverything();
            applySnapshot(data);
            setErrorMsg('');
            setLoadState('ready');
          } catch (e) {
            if (!silent) {
              setErrorMsg(e.message);
              setLoadState('error');
            }
          }
        };

        useEffect(() => { reload(); }, []);

        // Mantém a tela em dia com o que as outras unidades e aparelhos gravaram
        useEffect(() => {
          if (!sb) return;
          const canRefresh = () => busyRef.current === 0 && Object.keys(timersRef.current).length === 0;
          const tick = () => { if (canRefresh() && document.visibilityState === 'visible') reload({ silent: true }); };
          const id = setInterval(tick, 30000);
          window.addEventListener('focus', tick);
          return () => { clearInterval(id); window.removeEventListener('focus', tick); };
        }, []);

        // O "Desfazer" da baixa de um clique vale por alguns segundos: depois
        // disso a barra sai da frente sozinha
        useEffect(() => {
          if (!undoBaixa) return;
          const id = setTimeout(() => setUndoBaixa(null), 8000);
          return () => clearTimeout(id);
        }, [undoBaixa]);

        // Descarta as gravações agendadas ao sair da página
        useEffect(() => () => {
          Object.values(timersRef.current).forEach(clearTimeout);
          timersRef.current = {};
        }, []);

        // Executa a gravação; se o banco recusar, mostra o motivo e recarrega
        // para a tela nunca ficar mostrando algo que não foi salvo
        const write = async (label, fn) => {
          busyRef.current += 1;
          setPendingWrites((n) => n + 1);
          try {
            const resultado = await fn();
            setLastSync(new Date());
            setErrorMsg('');
            return resultado;
          } catch (e) {
            // Recarrega primeiro (o reload limpa a mensagem) e só então avisa,
            // para o aviso não sumir junto
            await reload({ silent: true });
            setErrorMsg(`${label} — ${e.message}`);
          } finally {
            busyRef.current -= 1;
            setPendingWrites((n) => Math.max(0, n - 1));
          }
        };

        // Campos digitados (datas, quantidades, responsável) gravam depois da
        // última tecla, em vez de uma chamada por caractere
        const writeSoon = (key, label, fn) => {
          if (timersRef.current[key]) clearTimeout(timersRef.current[key]);
          timersRef.current[key] = setTimeout(() => {
            delete timersRef.current[key];
            write(label, fn);
          }, 600);
        };

        // Guarda o que foi colocado na vitrine. A tabela é nova: se o banco
        // ainda não a tem, a alocação continua valendo e a tela do histórico
        // explica o que falta rodar — nada de erro em cima de quem está na loja
        const logProduction = async (linhas) => {
          if (linhas.length === 0) return;
          const { data, error } = await sb.from('production_records').insert(linhas).select();
          if (error) {
            setProductionReady(false);
            return;
          }
          setProductionReady(true);
          aplicarProducao([...data.map(fromProduction), ...productionRecordsRef.current]);
        };

        const totalAlerts = useMemo(() => {
          return slotItems.filter((item) => {
            const slot = slots.find((s) => s.id === item.slotId);
            if (slot?.unit !== currentUnit) return false;
            const prod = products.find((p) => p.id === item.productId);
            const statusInfo = getSlotItemStatus(item, prod);
            return statusInfo.status !== 'normal';
          }).length;
        }, [slotItems, slots, products, currentUnit]);

        // Contagem do que está na vitrine: acerta o número e mais nada — não
        // é venda nem perda, então não entra em relatório nenhum. Lê do
        // espelho para pegar o saldo do instante, e o que for reposto acima do
        // lote levanta junto o total produzido, senão a leitura "9 de 8"
        // ficaria sem sentido.
        const handleSetQty = (itemId, valor) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;
          const nova = Math.max(0, Math.round(valor) || 0);
          if (nova === target.currentQty) return;

          handleUpdateItem({
            ...target,
            currentQty: nova,
            producedQty: Math.max(target.producedQty || 0, nova)
          });
        };

        const handleUpdateItem = (updatedItem) => {
          const anterior = slotItemsRef.current.find((i) => i.id === updatedItem.id);
          aplicarSlotItems((prev) => prev.map((i) => i.id === updatedItem.id ? updatedItem : i));
          writeSoon(`item:${updatedItem.id}`, 'Atualizar item da vitrine', () =>
            run('slot_items', sb.from('slot_items').update({
              produced_qty: updatedItem.producedQty,
              current_qty: updatedItem.currentQty,
              manufacture_date: updatedItem.manufactureDate
            }).eq('id', updatedItem.id))
          );
          sincronizarProducao(anterior, updatedItem);
        };

        // A conferência corrige o tamanho da fornada e a data de fabricação
        // depois de o item já ter entrado na vitrine. Sem trazer essa correção
        // para o lançamento de produção, o histórico continua mostrando o
        // número da hora em que o item entrou e a conta por lote fecha errada.
        //
        // O lançamento é achado pelo espaço, produto e data de fabricação que o
        // item tinha antes da mexida — foi assim que ele foi gravado. Cada
        // alocação gravou um item e um lançamento com a mesma quantidade, então
        // o lançamento recebe o número da conferência inteiro, e não a
        // diferença: assim uma correção atrás da outra não acumula erro.
        const sincronizarProducao = (anterior, atual) => {
          if (!anterior || !productionReady) return;

          const novaQty = atual.producedQty || 0;
          const loteAntes = toDayKey(anterior.manufactureDate);
          const loteDepois = toDayKey(atual.manufactureDate);
          if (novaQty === (anterior.producedQty || 0) && loteDepois === loteAntes) return;

          // Campo apagado para digitar outro número: espera o número novo. Para
          // tirar a produção do histórico existe o botão de excluir de lá.
          if (novaQty <= 0) return;

          const registro = productionRecordsRef.current.find(
            (p) => p.unit === currentUnit
              && p.productId === anterior.productId
              && p.slotId === anterior.slotId
              && toDayKey(p.manufactureDate) === loteAntes
          );
          if (!registro) return;

          const novoLote = loteDepois || registro.manufactureDate;
          aplicarProducao(productionRecordsRef.current.map((p) => p.id === registro.id ? {
            ...p, qty: novaQty, manufactureDate: novoLote
          } : p));

          writeSoon(`producao:${registro.id}`, 'Atualizar produção do histórico', () =>
            run('production_records', sb.from('production_records').update({
              qty: novaQty,
              manufacture_date: novoLote
            }).eq('id', registro.id))
          );
        };

        // Venda e perda seguem o mesmo caminho: grava a baixa e acerta o saldo do espaço.
        //
        // Com a venda de um clique, dois toques seguidos no mesmo item chegam
        // aqui antes de a primeira gravação voltar do banco. Por isso o saldo
        // sai do espelho (slotItemsRef), desce na tela na hora e as gravações
        // entram em fila — senão o segundo toque leria o saldo antigo e o
        // banco terminaria com uma unidade a mais.
        const registrarBaixa = (tabela, itemId, qty, extras, label) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || qty <= 0) return;
          const product = products.find((p) => p.id === target.productId);
          const restante = target.currentQty - qty;
          const zerou = restante <= 0;

          aplicarSlotItems(zerou
            ? slotItemsRef.current.filter((i) => i.id !== itemId)
            : slotItemsRef.current.map((i) => i.id === itemId ? { ...i, currentQty: restante } : i));

          return enfileirarBaixa(label, async () => {
            const linhas = await run(tabela, sb.from(tabela).insert({
              unit_code: currentUnit,
              product_id: target.productId,
              product_name: target.productName,
              responsible: cleanResponsible(product?.responsible),
              qty,
              produced_qty: target.producedQty || target.currentQty,
              unit_of_measure: target.unit,
              manufacture_date: target.manufactureDate,
              ...extras
            }).select());

            const registro = linhas[0];
            if (tabela === 'sale_records') {
              setSaleRecords((prev) => [fromSale(registro), ...prev]);
            } else {
              setLossRecords((prev) => [fromLoss(registro), ...prev]);
            }

            // A tela já desceu o saldo; aqui só o banco acompanha
            if (zerou) {
              await run('slot_items', sb.from('slot_items').delete().eq('id', itemId));
            } else {
              await run('slot_items', sb.from('slot_items').update({ current_qty: restante }).eq('id', itemId));
            }

            // O que a baixa de um clique precisa para voltar atrás
            return { tabela, recordId: registro.id, item: target, qty, zerou };
          });
        };

        const handleRecordSale = (itemId, qty) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;
          return registrarBaixa('sale_records', itemId, qty, {
            exposure_days: calculateDaysInShowcase(target.manufactureDate)
          }, 'Registrar venda');
        };

        // Um clique = uma unidade vendida. Sem janela, sem confirmação — e com
        // "Desfazer" na tela por alguns segundos para o clique errado
        const handleQuickSale = async (itemId) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || target.currentQty <= 0) return;
          const baixa = await handleRecordSale(itemId, 1);
          if (baixa) setUndoBaixa(baixa);
        };

        // Apaga o registro da baixa e devolve as unidades ao espaço. Se a baixa
        // tinha zerado o item, o espaço é montado de novo com os mesmos dados.
        //
        // Recebe a baixa por parâmetro porque o desfazer aparece em dois
        // lugares: a barrinha da tela e o checklist, que guarda a última baixa
        // dele mesmo.
        const desfazerBaixa = (alvo) => {
          if (!alvo) return;
          setUndoBaixa((atual) => (atual && atual.recordId === alvo.recordId ? null : atual));

          enfileirarBaixa('Desfazer baixa', async () => {
            await run(alvo.tabela, sb.from(alvo.tabela).delete().eq('id', alvo.recordId));
            if (alvo.tabela === 'sale_records') {
              setSaleRecords((prev) => prev.filter((s) => s.id !== alvo.recordId));
            } else {
              setLossRecords((prev) => prev.filter((l) => l.id !== alvo.recordId));
            }

            // A baixa levou o item embora: o espaço volta a ser montado com os
            // mesmos dados, em uma linha nova
            if (alvo.zerou) {
              const linhas = await run('slot_items', sb.from('slot_items').insert({
                slot_code: alvo.item.slotId,
                product_id: alvo.item.productId,
                produced_qty: alvo.item.producedQty,
                current_qty: alvo.item.currentQty,
                unit_of_measure: alvo.item.unit,
                min_qty: alvo.item.minQty,
                manufacture_date: alvo.item.manufactureDate,
                entry_date: alvo.item.entryDate
              }).select(SLOT_ITEM_COLUMNS));
              aplicarSlotItems([...slotItemsRef.current, fromSlotItem(linhas[0])]);
              return;
            }

            // Soma sobre o saldo de agora: o balcão pode ter mexido no item
            // entre a venda e o arrependimento
            const atual = slotItemsRef.current.find((i) => i.id === alvo.item.id);
            if (!atual) return;
            const devolvido = atual.currentQty + alvo.qty;
            await run('slot_items', sb.from('slot_items').update({ current_qty: devolvido }).eq('id', alvo.item.id));
            aplicarSlotItems(slotItemsRef.current.map((i) => i.id === alvo.item.id ? { ...i, currentQty: devolvido } : i));
          });
        };

        const handleUndoBaixa = () => desfazerBaixa(undoBaixa);

        const handleRecordLoss = (itemId, qty, reason, details) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target) return;
          return registrarBaixa('loss_records', itemId, qty, {
            loss_date: getTodayDateString(),
            reason,
            details: details || null,
            slot_code: target.slotId
          }, 'Registrar perda');
        };

        // "Vendeu tudo" também sai de um clique, então ganha o mesmo desfazer
        const handleRecordSellAll = async (itemId) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || target.currentQty <= 0) return;
          const baixa = await handleRecordSale(itemId, target.currentQty);
          if (baixa) setUndoBaixa(baixa);
        };

        // Perda rápida: tocar tira uma unidade e segurar tira o que sobrou.
        // O motivo entra como "vencido", que é a perda do dia a dia da vitrine.
        const handleQuickLoss = async (itemId, qty) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || target.currentQty <= 0) return;
          const baixa = await handleRecordLoss(itemId, Math.min(qty, target.currentQty), 'vencido', '');
          if (baixa) setUndoBaixa(baixa);
        };

        const abrirBaixa = (item, mode = 'venda') => setDecreaseTarget({ item, mode });

        const handleRemoveItem = (itemId) => {
          const target = slotItemsRef.current.find((i) => i.id === itemId);
          if (!target || !window.confirm(`Remover "${target.productName}" da vitrine?`)) return;

          aplicarSlotItems(slotItemsRef.current.filter((i) => i.id !== itemId));
          enfileirarBaixa('Remover item da vitrine', () =>
            run('slot_items', sb.from('slot_items').delete().eq('id', itemId))
          );
        };

        // slotId vindo da vitrine física manda o produto para aquele espaço,
        // mesmo que ele já tenha alguém — é assim que se divide um espaço.
        // Sem slotId, procura um espaço livre do tipo certo.
        const handleQuickAllocate = (productName, qty, manufactureDate, slotId, showcaseTypeHint) => {
          const existente = products.find(
            (p) => p.name.toLowerCase().trim() === productName.toLowerCase().trim()
          );

          const escolhido = slotId ? slots.find((s) => s.id === slotId) : null;

          write('Alocar na vitrine', async () => {
            let product = existente;

            // Produto digitado que ainda não existe entra no catálogo, já na
            // categoria da vitrine em que ele está sendo colocado — o espaço
            // escolhido manda; sem espaço, vale a vitrine aberta na tela
            const tipoDestino = escolhido ? escolhido.showcaseType : showcaseTypeHint;

            if (!product) {
              const linhas = await run('products', sb.from('products').insert({
                name: productName.trim(),
                responsible: '',
                category: tipoDestino ? categoryOfShowcaseType(tipoDestino) : 'salgado',
                default_unit: 'un',
                min_replenishment_qty: 10,
                shelf_life_days: 2,
                price: 8.0
              }).select());
              product = fromProduct(linhas[0]);
              setProducts((prev) => [...prev, product].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR')));
            }

            const showcaseType = showcaseTypeOfCategory(product.category);
            const unitSlots = slots.filter((s) => s.unit === currentUnit && s.showcaseType === showcaseType);

            if (!escolhido && unitSlots.length === 0) {
              throw new Error(`nenhum espaço de ${showcaseType} cadastrado na unidade ${getUnitName(units, currentUnit)}`);
            }

            // Produto que já está na vitrine volta para o espaço dele: o lote
            // de ontem e o de hoje ficam na mesma bandeja, como ficam no móvel
            // de verdade. Dar um espaço novo para o mesmo produto tomaria
            // lugar de quem ainda não tem nenhum.
            //
            // Quando a pessoa escolheu um móvel — a janela de colocar produto
            // é por móvel, e não por espaço —, a procura fica dentro dele.
            const espacosDaProcura = escolhido
              ? unitSlots.filter((s) => showcaseKey(s) === showcaseKey(escolhido))
              : unitSlots;
            const mesmoProduto = espacosDaProcura.find((s) =>
              slotItems.some((i) => i.slotId === s.id && i.productId === product.id)
            );

            // Com a vitrine cheia, entra no espaço menos ocupado em vez de
            // empilhar tudo no primeiro
            const ocupacao = (slot) => slotItems.filter((i) => i.slotId === slot.id).length;
            const targetSlot = mesmoProduto
              || escolhido
              || unitSlots.find((s) => ocupacao(s) === 0)
              || unitSlots.reduce((menos, s) => (ocupacao(s) < ocupacao(menos) ? s : menos), unitSlots[0]);

            const dataFabricacao = manufactureDate || getTodayDateString();

            const linhas = await run('slot_items', sb.from('slot_items').insert({
              slot_code: targetSlot.id,
              product_id: product.id,
              produced_qty: qty,
              current_qty: qty,
              unit_of_measure: product.defaultUnit || 'un',
              min_qty: product.minReplenishmentQty || 5,
              manufacture_date: dataFabricacao,
              entry_date: getTodayDateString()
            }).select(SLOT_ITEM_COLUMNS));

            aplicarSlotItems((prev) => [...prev, { ...fromSlotItem(linhas[0]), productName: product.name }]);

            await logProduction([{
              unit_code: currentUnit,
              product_id: product.id,
              product_name: product.name,
              responsible: cleanResponsible(product.responsible),
              qty,
              unit_of_measure: product.defaultUnit || 'un',
              manufacture_date: dataFabricacao,
              slot_code: targetSlot.id,
              source: 'avulso'
            }]);
          });
        };

        // Prioridade e frequência chegaram depois: um banco que ainda não rodou
        // a versão nova do schema.sql continua salvando o padrão sem elas.
        const withPlanExtras = (linha, priority, frequency) =>
          planExtrasReady ? { ...linha, priority, frequency } : linha;

        // O mesmo cuidado com a quantidade mínima por dia: banco que ainda não
        // rodou a versão nova do schema.sql grava o padrão sem ela
        const withPlanMin = (linha, minQty) =>
          planMinReady ? { ...linha, min_qty: Math.max(0, Math.floor(minQty) || 0) } : linha;

        // O mínimo nunca passa do padrão daquele espaço: acima disso o item
        // seria chamado no pedido todo dia, com a vitrine cheia
        const limitarMin = (minQty, idealQty) =>
          Math.max(0, Math.min(Math.floor(Number(minQty) || 0), Math.max(0, idealQty || 0)));

        // Em quantos dias o produto deste espaço fica, contando o dia que
        // acabou de entrar — é o que a coluna "frequency" guarda
        const frequencyFor = (slotId, productId, extraDay) => {
          const dias = new Set(planDaysOf(standardPlans, currentUnit, slotId, productId));
          if (extraDay) dias.add(extraDay);
          return dias.size >= WEEK_DAYS.length ? 'todo_dia' : 'dias';
        };

        const handleUpdatePlanItem = (slotId, productId, idealQty, priority = DEFAULT_PRIORITY) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;
          const existing = standardPlans.find(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay && sp.slotId === slotId
          );
          const prioridade = getPriority(priority).value;
          const frequencia = frequencyFor(slotId, productId, selectedDay);

          // Trocar o produto do espaço zera o mínimo do que estava lá: ele era
          // do outro item. Item novo começa com o mínimo de reposição do
          // catálogo, e a loja ajusta na tabela da semana
          const minimo = existing && existing.productId === productId
            ? limitarMin(existing.minQty, idealQty)
            : limitarMin(defaultMinQty(prod, idealQty), idealQty);

          write('Salvar vitrine padrão', async () => {
            if (existing) {
              await run('standard_plans', sb.from('standard_plans')
                .update(withPlanMin(
                  withPlanExtras({ product_id: productId, ideal_qty: idealQty }, prioridade, frequencia),
                  minimo
                ))
                .eq('id', existing.id));
              setStandardPlans((prev) => prev.map((sp) =>
                sp.id === existing.id
                  ? { ...sp, productId, idealQty, minQty: minimo, priority: prioridade, frequency: frequencia }
                  : sp
              ));
              return;
            }

            const linhas = await run('standard_plans', sb.from('standard_plans').insert(
              withPlanMin(withPlanExtras({
                unit_code: currentUnit,
                day_of_week: selectedDay,
                slot_code: slotId,
                product_id: productId,
                ideal_qty: idealQty,
                unit_of_measure: prod.defaultUnit || 'un'
              }, prioridade, frequencia), minimo)
            ).select());
            setStandardPlans((prev) => [...prev, fromPlan(linhas[0])]);
          });
        };

        // ------------------------------------------
        // Organizar o item: prioridade, dias da semana e quantidade de uma vez.
        // Marcar "todo dia" grava o item nos sete dias; desmarcar um dia tira o
        // item só dele. Se o espaço já tinha outro produto em um dia marcado,
        // esse dia passa a ser deste produto.
        // ------------------------------------------
        const handleUpdatePlanSchedule = (slotId, productId, { priority, days, idealQty, minQty }) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod || !days || days.length === 0) return;

          const minimo = limitarMin(minQty, idealQty);
          const prioridade = getPriority(priority).value;
          const frequencia = days.length >= WEEK_DAYS.length ? 'todo_dia' : 'dias';
          const medida = prod.defaultUnit || 'un';

          const planoDoDia = (day) => standardPlans.find(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.slotId === slotId
          );

          const aApagar = [];
          const aAtualizar = [];
          const aInserir = [];

          WEEK_DAYS.forEach((day) => {
            const existente = planoDoDia(day);
            if (days.includes(day)) {
              if (existente) aAtualizar.push(existente.id);
              else aInserir.push(day);
            } else if (existente && existente.productId === productId) {
              aApagar.push(existente.id);
            }
          });

          write('Organizar item da vitrine padrão', async () => {
            if (aApagar.length > 0) {
              await run('standard_plans', sb.from('standard_plans').delete().in('id', aApagar));
            }

            if (aAtualizar.length > 0) {
              await run('standard_plans', sb.from('standard_plans')
                .update(withPlanMin(withPlanExtras({
                  product_id: productId,
                  ideal_qty: idealQty,
                  unit_of_measure: medida
                }, prioridade, frequencia), minimo))
                .in('id', aAtualizar));
            }

            let novos = [];
            if (aInserir.length > 0) {
              const linhas = await run('standard_plans', sb.from('standard_plans').insert(
                aInserir.map((day) => withPlanMin(withPlanExtras({
                  unit_code: currentUnit,
                  day_of_week: day,
                  slot_code: slotId,
                  product_id: productId,
                  ideal_qty: idealQty,
                  unit_of_measure: medida
                }, prioridade, frequencia), minimo))
              ).select());
              novos = linhas.map(fromPlan);
            }

            setStandardPlans((prev) => [
              ...prev
                .filter((sp) => !aApagar.includes(sp.id))
                .map((sp) => aAtualizar.includes(sp.id)
                  ? {
                    ...sp, productId, idealQty, minQty: minimo,
                    priority: prioridade, frequency: frequencia, unitOfMeasure: medida
                  }
                  : sp),
              ...novos
            ]);
          });
        };

        // ------------------------------------------
        // Editar a quantidade direto na tabela da semana.
        //
        // A célula é o produto em um dia, e o mesmo produto pode estar em mais
        // de um espaço: a quantidade nova é repartida entre os espaços que ele
        // já ocupa naquele dia, mantendo quem tinha mais com mais. Zero tira o
        // produto do dia. Célula vazia coloca o produto no espaço que ele usa
        // nos outros dias — e, se ele estiver ocupado, no primeiro espaço livre
        // da mesma vitrine.
        // ------------------------------------------
        const handleSetWeeklyQty = (day, productId, novaQtd) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;

          const qtd = Math.max(0, Math.floor(Number(novaQtd) || 0));
          const doDia = standardPlans.filter(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.productId === productId
          );

          // Já está no dia: só reparte a quantidade nova (ou tira, se for zero)
          if (doDia.length > 0) {
            if (qtd === 0) {
              const ids = doDia.map((sp) => sp.id);
              write('Tirar o produto do dia', async () => {
                await run('standard_plans', sb.from('standard_plans').delete().in('id', ids));
                setStandardPlans((prev) => prev.filter((sp) => !ids.includes(sp.id)));
              });
              return;
            }

            const ordenados = [...doDia].sort((a, b) => (b.idealQty || 0) - (a.idealQty || 0));
            const base = Math.floor(qtd / ordenados.length);
            const resto = qtd % ordenados.length;
            // Baixar o padrão abaixo do mínimo deixaria o item sendo chamado
            // com a vitrine cheia: o mínimo desce junto
            const fatias = ordenados.map((sp, i) => {
              const nova = base + (i < resto ? 1 : 0);
              return { id: sp.id, qtd: nova, min: limitarMin(sp.minQty, nova) };
            });

            write('Salvar quantidade da semana', async () => {
              for (const fatia of fatias) {
                await run('standard_plans', sb.from('standard_plans')
                  .update(withPlanMin({ ideal_qty: fatia.qtd }, fatia.min)).eq('id', fatia.id));
              }
              setStandardPlans((prev) => prev.map((sp) => {
                const fatia = fatias.find((f) => f.id === sp.id);
                return fatia ? { ...sp, idealQty: fatia.qtd, minQty: fatia.min } : sp;
              }));
            });
            return;
          }

          if (qtd === 0) return;

          // Ainda não entra nesse dia: precisa achar um espaço livre para ele
          const outrosDias = standardPlans.filter(
            (sp) => sp.unit === currentUnit && sp.productId === productId
          );
          const vezesPorEspaco = {};
          outrosDias.forEach((sp) => {
            vezesPorEspaco[sp.slotId] = (vezesPorEspaco[sp.slotId] || 0) + 1;
          });
          const espacoDeCasa = Object.keys(vezesPorEspaco)
            .sort((a, b) => vezesPorEspaco[b] - vezesPorEspaco[a])[0];

          const ocupado = (slotId) => standardPlans.some(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.slotId === slotId
          );

          const slotDeCasa = slots.find((s) => s.id === espacoDeCasa);
          const tipo = slotDeCasa ? slotDeCasa.showcaseType : showcaseTypeOfCategory(prod.category);
          const livres = slots
            .filter((s) => s.unit === currentUnit && !ocupado(s.id))
            .sort((a, b) => (a.shelfNumber || 0) - (b.shelfNumber || 0) || a.slotNumber - b.slotNumber);

          const alvo = (espacoDeCasa && !ocupado(espacoDeCasa) && espacoDeCasa)
            || (slotDeCasa && livres.find((s) => showcaseKey(s) === showcaseKey(slotDeCasa))?.id)
            || livres.find((s) => s.showcaseType === tipo)?.id;

          if (!alvo) {
            alert(
              `Não há espaço livre na vitrine ${tipo} em ${getDayNameBR(day)}. ` +
              'Abra um espaço nesse dia para colocar o produto.'
            );
            return;
          }

          const prioridade = getPriority(outrosDias[0]?.priority).value;
          const frequencia = frequencyFor(alvo, productId, day);
          // O mínimo do dia novo é o que o produto já usa nos outros dias —
          // a loja não precisa redigitar item por item quando ele entra em
          // mais um dia. Sem outros dias, vale o mínimo do catálogo.
          const minimo = limitarMin(
            outrosDias.length > 0
              ? Math.max(...outrosDias.map((sp) => sp.minQty || 0))
              : defaultMinQty(prod, qtd),
            qtd
          );

          write('Colocar o produto no dia', async () => {
            const linhas = await run('standard_plans', sb.from('standard_plans').insert(
              withPlanMin(withPlanExtras({
                unit_code: currentUnit,
                day_of_week: day,
                slot_code: alvo,
                product_id: productId,
                ideal_qty: qtd,
                unit_of_measure: prod.defaultUnit || 'un'
              }, prioridade, frequencia), minimo)
            ).select());
            setStandardPlans((prev) => [...prev, fromPlan(linhas[0])]);
          });
        };

        // ------------------------------------------
        // Editar a quantidade MÍNIMA direto na tabela da semana.
        //
        // É o número que manda no pedido de produção: quando o estoque bom da
        // loja fica igual ou abaixo dele naquele dia, o item é chamado e o
        // pedido pede a fornada do padrão. Zero é "só quando acabar".
        //
        // A célula é o produto em um dia, como a do padrão, e o mesmo produto
        // pode estar em mais de um espaço: o mínimo é repartido entre eles, sem
        // passar do padrão de cada um. Um produto que não entra naquele dia não
        // tem onde guardar mínimo — a célula nem abre para digitar.
        // ------------------------------------------
        const handleSetWeeklyMin = (day, productId, novoMin) => {
          if (!planMinReady) {
            alert(
              'O banco ainda não tem a coluna da quantidade mínima. Rode o arquivo ' +
              'supabase/schema.sql no SQL Editor do Supabase e recarregue a página.'
            );
            return;
          }

          const doDia = standardPlans.filter(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === day && sp.productId === productId
          );
          if (doDia.length === 0) return;

          const padraoDoDia = doDia.reduce((acc, sp) => acc + (sp.idealQty || 0), 0);
          let restante = limitarMin(novoMin, padraoDoDia);

          // Do espaço mais cheio para o mais vazio, cada um leva o quanto o
          // padrão dele aguenta — assim o mínimo do produto no dia fecha
          // exatamente com o número digitado
          const fatias = [...doDia]
            .sort((a, b) => (b.idealQty || 0) - (a.idealQty || 0))
            .map((sp) => {
              const parte = Math.min(restante, sp.idealQty || 0);
              restante -= parte;
              return { id: sp.id, min: parte };
            });

          write('Salvar o mínimo da semana', async () => {
            for (const fatia of fatias) {
              await run('standard_plans', sb.from('standard_plans')
                .update({ min_qty: fatia.min }).eq('id', fatia.id));
            }
            setStandardPlans((prev) => prev.map((sp) => {
              const fatia = fatias.find((f) => f.id === sp.id);
              return fatia ? { ...sp, minQty: fatia.min } : sp;
            }));
          });
        };

        // ------------------------------------------
        // Mínimo digitado na lista da vitrine: é o mínimo daquele espaço no dia
        // aberto, e não do produto na semana inteira. Nunca passa do padrão do
        // espaço — acima disso o item seria chamado com a vitrine cheia.
        // ------------------------------------------
        const handleSetPlanMin = (slotId, novoMin) => {
          if (!planMinReady) {
            alert(
              'O banco ainda não tem a coluna da quantidade mínima. Rode o arquivo ' +
              'supabase/schema.sql no SQL Editor do Supabase e recarregue a página.'
            );
            return;
          }

          const plano = standardPlans.find(
            (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay && sp.slotId === slotId
          );
          if (!plano) return;

          const minimo = limitarMin(novoMin, plano.idealQty);
          if (minimo === (plano.minQty || 0)) return;

          write('Salvar o mínimo do espaço', async () => {
            await run('standard_plans', sb.from('standard_plans')
              .update({ min_qty: minimo }).eq('id', plano.id));
            setStandardPlans((prev) => prev.map((sp) =>
              sp.id === plano.id ? { ...sp, minQty: minimo } : sp
            ));
          });
        };

        const handleRemovePlanItem = (planId) => {
          write('Remover do padrão', async () => {
            await run('standard_plans', sb.from('standard_plans').delete().eq('id', planId));
            setStandardPlans((prev) => prev.filter((sp) => sp.id !== planId));
          });
        };

        const handleCopyDayPlan = (fromDay, toDay) => {
          const origem = standardPlans.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === fromDay);

          write('Copiar o padrão do dia', async () => {
            await run('standard_plans', sb.from('standard_plans')
              .delete().eq('unit_code', currentUnit).eq('day_of_week', toDay));

            let novos = [];
            if (origem.length > 0) {
              const linhas = await run('standard_plans', sb.from('standard_plans').insert(
                origem.map((sp) => withPlanMin(withPlanExtras({
                  unit_code: currentUnit,
                  day_of_week: toDay,
                  slot_code: sp.slotId,
                  product_id: sp.productId,
                  ideal_qty: sp.idealQty,
                  unit_of_measure: sp.unitOfMeasure
                }, getPriority(sp.priority).value, frequencyFor(sp.slotId, sp.productId, toDay)),
                limitarMin(sp.minQty, sp.idealQty)))
              ).select());
              novos = linhas.map(fromPlan);
            }

            setStandardPlans((prev) => [
              ...prev.filter((sp) => !(sp.unit === currentUnit && sp.dayOfWeek === toDay)),
              ...novos
            ]);
          });
        };

        const handleClearDayPlan = (day) => {
          write('Limpar o padrão do dia', async () => {
            await run('standard_plans', sb.from('standard_plans')
              .delete().eq('unit_code', currentUnit).eq('day_of_week', day));
            setStandardPlans((prev) => prev.filter((sp) => !(sp.unit === currentUnit && sp.dayOfWeek === day)));
          });
        };

        const handleApplyProductionToShowcase = (itemsToProduce) => {
          if (itemsToProduce.length === 0) return;
          const today = getTodayDateString();

          write('Lançar produção na vitrine', async () => {
            const linhas = await run('slot_items', sb.from('slot_items').insert(
              itemsToProduce.map((item) => {
                const product = products.find((p) => p.id === item.productId);
                return {
                  slot_code: item.slotId,
                  product_id: item.productId,
                  produced_qty: item.qty,
                  current_qty: item.qty,
                  unit_of_measure: product?.defaultUnit || 'un',
                  min_qty: product?.minReplenishmentQty || 5,
                  manufacture_date: today,
                  entry_date: today
                };
              })
            ).select(SLOT_ITEM_COLUMNS));

            aplicarSlotItems((prev) => [...prev, ...linhas.map(fromSlotItem)]);

            await logProduction(itemsToProduce.map((item) => {
              const product = products.find((p) => p.id === item.productId);
              return {
                unit_code: currentUnit,
                product_id: item.productId,
                product_name: product?.name || item.productName,
                responsible: cleanResponsible(product?.responsible),
                qty: item.qty,
                unit_of_measure: product?.defaultUnit || 'un',
                manufacture_date: today,
                slot_code: item.slotId,
                source: 'pedido'
              };
            }));

            setActiveTab('vitrine');
          });
        };

        const handleUpdateSeparatedQty = (id, delta) => {
          const target = separatedProducts.find((i) => i.id === id);
          if (!target) return;
          const novaQtd = Math.max(0, target.currentQty + delta);

          setSeparatedProducts((prev) => prev.map((i) => i.id === id ? { ...i, currentQty: novaQtd } : i));
          writeSoon(`sep:${id}`, 'Atualizar estoque fora da vitrine', () =>
            run('separated_products', sb.from('separated_products').update({ current_qty: novaQtd }).eq('id', id))
          );
        };

        const handleAddSeparatedProduct = (prod) => {
          write('Cadastrar item fora da vitrine', async () => {
            const linhas = await run('separated_products', sb.from('separated_products').insert({
              unit_code: currentUnit,
              name: prod.productName,
              category: prod.category,
              current_qty: prod.currentQty,
              unit_of_measure: prod.unitOfMeasure || 'un',
              min_qty: prod.minQty || 0,
              price: prod.price
            }).select());
            setSeparatedProducts((prev) => [...prev, fromSeparated(linhas[0])]);
          });
        };

        // O banco não aceita dois produtos com o mesmo nome; a mensagem crua
        // do Postgres não diz isso com clareza para quem está na loja
        const traduzirErroProduto = (error) =>
          new Error(
            error.code === '23505'
              ? 'já existe um produto com esse nome'
              : error.message
          );

        const handleAddProduct = (prod) => {
          write('Cadastrar produto', async () => {
            const { data, error } = await sb.from('products').insert({
              name: prod.name,
              responsible: prod.responsible,
              category: prod.category,
              default_unit: prod.defaultUnit,
              min_replenishment_qty: prod.minReplenishmentQty,
              shelf_life_days: prod.shelfLifeDays,
              price: prod.price
            }).select();
            if (error) throw traduzirErroProduto(error);
            setProducts((prev) => [...prev, fromProduct(data[0])].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR')));
          });
        };

        const handleUpdateProduct = (updated) => {
          setProducts((prev) => prev.map((p) => p.id === updated.id ? updated : p));

          const campos = {
            responsible: cleanResponsible(updated.responsible),
            category: updated.category,
            shelf_life_days: updated.shelfLifeDays,
            price: updated.price
          };
          // Nome vazio é apenas uma passagem da digitação: não vai para o banco
          const nome = (updated.name || '').trim();
          if (nome) campos.name = nome;

          writeSoon(`produto:${updated.id}`, 'Atualizar produto', async () => {
            const { error } = await sb.from('products').update(campos).eq('id', updated.id);
            if (error) throw traduzirErroProduto(error);
          });
        };

        // Lançamento errado sai do histórico. A baixa já aconteceu lá atrás:
        // apagar o registro não devolve nada para a vitrine
        const handleDeleteSale = (id) => {
          const alvo = saleRecords.find((s) => s.id === id);
          if (!alvo) return;
          const ok = window.confirm(
            `Excluir a venda de ${alvo.qty} ${alvo.unitOfMeasure} de "${alvo.productName}"?\n\n` +
            'O lançamento sai do histórico. O estoque da vitrine não muda.'
          );
          if (!ok) return;

          write('Excluir venda', async () => {
            await run('sale_records', sb.from('sale_records').delete().eq('id', id));
            setSaleRecords((prev) => prev.filter((s) => s.id !== id));
          });
        };

        const handleDeleteLoss = (id) => {
          const alvo = lossRecords.find((l) => l.id === id);
          if (!alvo) return;
          const ok = window.confirm(
            `Excluir a perda de ${alvo.qty} ${alvo.unitOfMeasure} de "${alvo.productName}"?\n\n` +
            'O lançamento sai do relatório e do histórico. O estoque da vitrine não muda.'
          );
          if (!ok) return;

          write('Excluir perda', async () => {
            await run('loss_records', sb.from('loss_records').delete().eq('id', id));
            setLossRecords((prev) => prev.filter((l) => l.id !== id));
          });
        };

        const handleDeleteProduction = (id) => {
          const alvo = productionRecords.find((p) => p.id === id);
          if (!alvo) return;
          const ok = window.confirm(
            `Excluir a produção de ${alvo.qty} ${alvo.unitOfMeasure} de "${alvo.productName}"?\n\n` +
            'O lançamento sai do histórico. O que está na vitrine agora não muda.'
          );
          if (!ok) return;

          write('Excluir produção', async () => {
            await run('production_records', sb.from('production_records').delete().eq('id', id));
            aplicarProducao(productionRecordsRef.current.filter((p) => p.id !== id));
          });
        };

        // Troca o dia de um registro guardado com hora (a venda) sem perder a
        // hora em que ele aconteceu
        const comDiaNovo = (timestamp, dia) => {
          const base = timestamp ? new Date(timestamp) : new Date();
          const [ano, mes, d] = String(dia).split('-').map(Number);
          if (!ano || !mes || !d) return base.toISOString();
          base.setFullYear(ano, mes - 1, d);
          return base.toISOString();
        };

        // Corrigir um lançamento que já está no histórico: quantidade, lote,
        // dia e — na perda — o motivo. Igual ao excluir, mexe só no registro:
        // a baixa aconteceu lá atrás e a vitrine de agora não volta atrás.
        const handleEditRecord = (tipo, id, campos) => {
          const qty = Math.max(1, Math.floor(campos.qty) || 1);
          const lote = campos.manufactureDate || null;
          const tamanhoLote = campos.producedQty == null ? null : Math.max(0, Math.floor(campos.producedQty) || 0);

          if (tipo === 'venda') {
            const alvo = saleRecords.find((s) => s.id === id);
            if (!alvo) return;
            const dia = campos.dia || toDayKey(alvo.timestamp);
            const soldAt = comDiaNovo(alvo.timestamp, dia);
            // O tempo de vitrine é a distância entre o lote e o dia da venda
            const exposicao = daysBetweenKeys(lote, dia);

            setSaleRecords((prev) => prev.map((s) => s.id === id ? {
              ...s, qty, producedQty: tamanhoLote, manufactureDate: lote, exposureDays: exposicao, timestamp: soldAt
            } : s));

            write('Corrigir venda', () =>
              run('sale_records', sb.from('sale_records').update({
                qty,
                produced_qty: tamanhoLote,
                manufacture_date: lote,
                exposure_days: exposicao,
                sold_at: soldAt
              }).eq('id', id))
            );
            return;
          }

          if (tipo === 'perda') {
            const alvo = lossRecords.find((l) => l.id === id);
            if (!alvo) return;
            const dia = campos.dia || alvo.lossDate;
            const reason = campos.reason || alvo.reason;
            const details = campos.details || '';

            setLossRecords((prev) => prev.map((l) => l.id === id ? {
              ...l, qty, producedQty: tamanhoLote, manufactureDate: lote, lossDate: dia, reason, details
            } : l));

            write('Corrigir perda', () =>
              run('loss_records', sb.from('loss_records').update({
                qty,
                produced_qty: tamanhoLote,
                manufacture_date: lote,
                loss_date: dia,
                reason,
                details: details || null
              }).eq('id', id))
            );
            return;
          }

          const alvo = productionRecordsRef.current.find((p) => p.id === id);
          if (!alvo) return;

          aplicarProducao(productionRecordsRef.current.map((p) => p.id === id ? {
            ...p, qty, manufactureDate: lote
          } : p));

          write('Corrigir produção', () =>
            run('production_records', sb.from('production_records').update({
              qty,
              manufacture_date: lote
            }).eq('id', id))
          );
        };

        const handleDeleteProduct = (id) => {
          const emUso = slotItems.some((i) => i.productId === id);
          if (emUso) {
            setErrorMsg('Este produto está na vitrine agora. Dê baixa nele antes de excluir.');
            return;
          }

          write('Excluir produto', async () => {
            const { error } = await sb.from('products').delete().eq('id', id);
            // A trava do banco (on delete restrict) impede apagar produto com histórico
            if (error) throw new Error(
              error.code === '23503'
                ? 'o produto tem lançamentos ligados a ele e não pode ser apagado'
                : error.message
            );
            setProducts((prev) => prev.filter((p) => p.id !== id));
          });
        };

        if (!isSupabaseConfigured) return <SetupScreen />;
        if (!sb) return (
          <ConnectionErrorScreen
            message="A biblioteca do Supabase não carregou. Verifique a conexão com a internet ou algum bloqueador de scripts."
            onRetry={() => window.location.reload()}
          />
        );
        if (loadState === 'loading') return <LoadingScreen />;
        if (loadState === 'error') return <ConnectionErrorScreen message={errorMsg} onRetry={() => { setLoadState('loading'); reload(); }} />;

        return (
          <div className="min-h-screen flex flex-col font-sans">
            <Navbar
              units={units}
              currentUnit={currentUnit}
              onUnitChange={setCurrentUnit}
              activeTab={activeTab}
              onTabChange={setActiveTab}
              totalAlerts={totalAlerts}
            />

            {errorMsg && (
              <div className="bg-[#ff3b30]/10 border-b border-[#ff3b30]/20">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex items-center gap-2">
                  <Icons.AlertTriangle className="w-4 h-4 text-[#c9271d] shrink-0" />
                  <span className="t-callout text-[#c9271d] flex-1">{errorMsg}</span>
                  <button onClick={() => setErrorMsg('')} className="w-6 h-6 rounded-full hover:bg-[#ff3b30]/15 text-[#c9271d] flex items-center justify-center shrink-0">
                    <Icons.X className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            )}

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-9">
              {activeTab === 'vitrine' && (
                <div className="space-y-5">
                  <div className="flex flex-wrap items-end justify-between gap-3">
                    <div>
                      <div className="t-overline mb-2">
                        {getUnitName(units, currentUnit)}
                      </div>
                      <h2 className="t-display">Vitrine operacional</h2>
                    </div>
                    <div className="flex items-center gap-3 flex-wrap">
                      {totalAlerts > 0 && (
                        <span className="pill bg-black/[0.05] text-[#6e6e73] h-7 px-3 tnum">
                          {totalAlerts} {totalAlerts === 1 ? 'item precisa de atenção' : 'itens precisam de atenção'}
                        </span>
                      )}
                      {/* A conferência item a item: a tela pergunta, a pessoa
                          responde, e a venda ou a perda já fica registrada */}
                      <button
                        onClick={() => setChecklistAberto(true)}
                        title="Conferir a vitrine produto por produto"
                        className="btn btn-primary btn-md"
                      >
                        <Icons.CheckSquare className="w-4 h-4" />
                        Conferir vitrine
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                  <div className="lg:col-span-7 xl:col-span-8">
                    <ShowcaseGrid
                      currentUnit={currentUnit}
                      slots={slots}
                      slotItems={slotItems}
                      products={products}
                      standardPlans={standardPlans}
                      filterType={showcaseFilter}
                      onChangeFilterType={setShowcaseFilter}
                      onQuickSale={handleQuickSale}
                      onRecordSellAll={handleRecordSellAll}
                      onQuickLoss={handleQuickLoss}
                      onOpenSlot={setSlotToFill}
                    />
                  </div>
                  <div className="lg:col-span-5 xl:col-span-4 lg:sticky lg:top-[76px]">
                    <SupportList
                      currentUnit={currentUnit}
                      slotItems={slotItems}
                      products={products}
                      slots={slots}
                      showcaseType={showcaseFilter}
                      onChangeShowcaseType={setShowcaseFilter}
                      onUpdateItem={handleUpdateItem}
                      onSetQty={handleSetQty}
                      onQuickAllocate={handleQuickAllocate}
                      onQuickSale={handleQuickSale}
                      onRecordSellAll={handleRecordSellAll}
                      onQuickLoss={handleQuickLoss}
                      onRemoveItem={handleRemoveItem}
                    />
                  </div>
                  </div>
                </div>
              )}

              {activeTab === 'padrao' && (
                <StandardShowcaseView
                  currentUnit={currentUnit}
                  unitName={getUnitName(units, currentUnit)}
                  slots={slots}
                  products={products}
                  standardPlans={standardPlans}
                  selectedDay={selectedDay}
                  onSelectDay={setSelectedDay}
                  onUpdatePlanItem={handleUpdatePlanItem}
                  onRemovePlanItem={handleRemovePlanItem}
                  onUpdatePlanSchedule={handleUpdatePlanSchedule}
                  onSetPlanMin={handleSetPlanMin}
                  onSetWeeklyQty={handleSetWeeklyQty}
                  onSetWeeklyMin={handleSetWeeklyMin}
                  onCopyDayPlan={handleCopyDayPlan}
                  onClearDayPlan={handleClearDayPlan}
                  onGenerateProductionOrder={() => { setProductionDay(selectedDay); setActiveTab('producao'); }}
                />
              )}

              {activeTab === 'producao' && (
                <ProductionOrderView
                  currentUnit={currentUnit}
                  unitName={getUnitName(units, currentUnit)}
                  slots={slots}
                  slotItems={slotItems}
                  products={products}
                  standardPlans={standardPlans}
                  selectedDay={productionDay}
                  onSelectDay={setProductionDay}
                  onApplyProductionToShowcase={handleApplyProductionToShowcase}
                />
              )}

              {activeTab === 'perdas' && (
                <LossesReportView
                  currentUnit={currentUnit}
                  unitName={getUnitName(units, currentUnit)}
                  lossRecords={lossRecords}
                  onDeleteLoss={handleDeleteLoss}
                />
              )}

              {activeTab === 'historico' && (
                <HistoryView
                  currentUnit={currentUnit}
                  unitName={getUnitName(units, currentUnit)}
                  products={products}
                  saleRecords={saleRecords}
                  lossRecords={lossRecords}
                  productionRecords={productionRecords}
                  productionReady={productionReady}
                  slots={slots}
                  onDeleteSale={handleDeleteSale}
                  onDeleteLoss={handleDeleteLoss}
                  onDeleteProduction={handleDeleteProduction}
                  onEditRecord={handleEditRecord}
                />
              )}

              {activeTab === 'fora' && (
                <SeparatedProductsView
                  currentUnit={currentUnit}
                  unitName={getUnitName(units, currentUnit)}
                  separatedProducts={separatedProducts}
                  onUpdateQty={handleUpdateSeparatedQty}
                  onAddSeparatedProduct={handleAddSeparatedProduct}
                />
              )}

              {activeTab === 'produtos' && (
                <ProductCatalogView
                  products={products}
                  onAddProduct={handleAddProduct}
                  onUpdateProduct={handleUpdateProduct}
                  onDeleteProduct={handleDeleteProduct}
                />
              )}
            </main>

            <SlotAddModal
              slot={slotToFill}
              itemsInSlot={slotToFill ? slotItems.filter((i) => i.slotId === slotToFill.id) : []}
              /* O móvel inteiro, e não só o espaço sugerido: é ele que diz se
                 o produto digitado já está exposto em algum lugar daqui */
              itemsInShowcase={slotToFill ? itemsOfShowcase(slots, slotItems, slotToFill) : []}
              products={products}
              onClose={() => setSlotToFill(null)}
              onConfirm={handleQuickAllocate}
            />

            {/* A chave remonta a janela a cada abertura: o modo (venda ou
                perda) e a quantidade sempre começam do zero */}
            {decreaseTarget && (
              <ItemDecreaseModal
                key={`${decreaseTarget.item.id}:${decreaseTarget.mode}`}
                item={slotItems.find((i) => i.id === decreaseTarget.item.id) || decreaseTarget.item}
                initialMode={decreaseTarget.mode}
                onClose={() => setDecreaseTarget(null)}
                onRecordSale={handleRecordSale}
                onRecordLoss={handleRecordLoss}
                onRecordSellAll={handleRecordSellAll}
              />
            )}

            {/* A chave remonta a conferência a cada abertura: ela sempre começa
                no primeiro item da vitrine que está aberta */}
            {checklistAberto && (
              <ShowcaseChecklist
                key={showcaseFilter}
                currentUnit={currentUnit}
                slots={slots}
                slotItems={slotItems}
                products={products}
                standardPlans={standardPlans}
                showcaseType={showcaseFilter}
                onRecordSale={handleRecordSale}
                onRecordLoss={handleRecordLoss}
                onSetQty={handleSetQty}
                onUndoBaixa={desfazerBaixa}
                onClose={() => setChecklistAberto(false)}
              />
            )}

            {undoBaixa && (
              <UndoBaixaBar info={undoBaixa} onUndo={handleUndoBaixa} onDismiss={() => setUndoBaixa(null)} />
            )}

            <footer className="mt-auto border-t hairline">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-2">
                <div className="flex items-center gap-2">
                  <span className={`w-1.5 h-1.5 rounded-full ${pendingWrites > 0 ? 'bg-[#ff9f0a]' : 'bg-[#34c759]'}`} />
                  <span className="t-caption">
                    {pendingWrites > 0
                      ? 'Salvando no Supabase…'
                      : lastSync
                        ? `Salvo no Supabase · ${lastSync.toLocaleTimeString('pt-BR')}`
                        : 'Conectado ao Supabase'}
                  </span>
                  <button
                    onClick={() => reload()}
                    title="Buscar as alterações das outras unidades agora"
                    className="t-caption underline underline-offset-2 hover:text-[#1d1d1f] transition-colors"
                  >
                    Atualizar
                  </button>
                </div>
                <div className="t-caption">
                  Unidade <strong className="text-[#1d1d1f] font-bold">{getUnitName(units, currentUnit)}</strong>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
