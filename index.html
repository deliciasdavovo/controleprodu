              const product = products.find((p) => p.id === item.productId);
              return getSlotItemStatus(item, product).status !== 'expired';
            })
            .reduce((acc, item) => acc + item.currentQty, 0);

        // Uma linha por produto em cada vitrine, juntando os espaços que o
        // padrão do dia reservou para ele
        const orderList = useMemo(() => {
          const grupos = [];
          const porChave = {};

          dayPlans.forEach((plan) => {
            const slot = slotById[plan.slotId];
            if (!slot) return;
            const chave = `${showcaseKey(slot)}|${plan.productId}`;

            if (!porChave[chave]) {
              porChave[chave] = {
                key: chave,
                showcaseType: slot.showcaseType,
                shelfNumber: slot.shelfNumber,
                showcaseTitle: slot.sectionTitle,
                productId: plan.productId,
                unitOfMeasure: plan.unitOfMeasure,
                plans: []
              };
              grupos.push(porChave[chave]);
            }
            porChave[chave].plans.push({ slot, idealQty: plan.idealQty });
          });

          return grupos.map((grupo) => {
            const product = products.find((p) => p.id === grupo.productId);
            const idealQty = grupo.plans.reduce((acc, p) => acc + p.idealQty, 0);
            const estoque = stockByShowcaseProduct[grupo.key] || { good: 0, expired: 0, lastDay: 0 };
            const currentQty = estoque.good;
            const neededQty = Math.max(0, idealQty - currentQty);

            // Gatilho do pedido: o item só é pedido quando o estoque bom chega
            // no mínimo, ou quando tem peça vencida para repor. Assim a lista
            // não vive pedindo 2 unidades de algo que está quase cheio.
            const minQty = Math.max(1, Math.ceil(idealQty * MIN_STOCK_RATIO));
            const belowMin = currentQty <= minQty;
            const triggered = neededQty > 0 && (belowMin || estoque.expired > 0);

            // Espalha o que falta pelos espaços planejados, começando por quem
            // está mais vazio; nenhum espaço recebe mais do que o ideal dele
            let restante = neededQty;
            const targets = grupo.plans
              .map((p) => ({
                slotId: p.slot.id,
                slotNumber: p.slot.slotNumber,
                falta: Math.max(0, p.idealQty - qtyInSlot(p.slot.id, grupo.productId))
              }))
              .sort((a, b) => b.falta - a.falta)
              .map((alvo) => {
                const qty = Math.min(restante, alvo.falta);
                restante -= qty;
                return { ...alvo, qty };
              })
              .filter((alvo) => alvo.qty > 0);

            // Sobra quando algum espaço da vitrine está com excesso: vai para o
            // espaço mais vazio para o total da vitrine bater com o padrão
            if (restante > 0 && grupo.plans.length > 0) {
              const primeiro = grupo.plans
                .slice()
                .sort((a, b) => qtyInSlot(a.slot.id, grupo.productId) - qtyInSlot(b.slot.id, grupo.productId))[0];
              const existente = targets.find((t) => t.slotId === primeiro.slot.id);
              if (existente) existente.qty += restante;
              else targets.push({ slotId: primeiro.slot.id, slotNumber: primeiro.slot.slotNumber, qty: restante });
            }

            return {
              key: grupo.key,
              showcaseType: grupo.showcaseType,
              shelfNumber: grupo.shelfNumber,
              showcaseTitle: grupo.showcaseTitle,
              slotLabel: grupo.plans
                .map((p) => `#${p.slot.slotNumber}`)
                .sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }))
                .join(', '),
              productId: grupo.productId,
              productName: product?.name || 'Produto',
              responsible: getResponsibleName(product),
              idealQty,
              currentQty,
              expiredQty: estoque.expired,
              lastDayQty: estoque.lastDay,
              minQty,
              belowMin,
              triggered,
              neededQty,
              targets,
              unitOfMeasure: grupo.unitOfMeasure
            };
          });
        }, [dayPlans, slotById, slotItems, products, stockByShowcaseProduct]);

        const pendingItems = orderList.filter((item) => item.triggered);

        // Falta pequena, ainda acima do mínimo: fica de fora do pedido, mas a
        // loja continua sabendo que existe
        const aboveMinItems = orderList.filter((item) => item.neededQty > 0 && !item.triggered);

        const responsibleOptions = Array.from(new Set(pendingItems.map((item) => item.responsible)))
          .sort((a, b) => a.localeCompare(b, 'pt-BR'));

        // Se o responsável escolhido não tem mais nada a produzir, volta para "todos"
        const activeResponsible = responsibleOptions.includes(responsibleFilter) ? responsibleFilter : 'todos';

        const itemsNeedingProduction = activeResponsible === 'todos'
          ? pendingItems
          : pendingItems.filter((item) => item.responsible === activeResponsible);

        // O pedido é entregue por pessoa: cada responsável recebe a lista do
        // que ele tem para produzir, com a vitrine anotada em cada item.
        const responsibleBlocks = useMemo(() => {
          const blocos = [];
          const porNome = {};

          itemsNeedingProduction.forEach((item) => {
            if (!porNome[item.responsible]) {
              porNome[item.responsible] = { key: item.responsible, title: item.responsible, entries: [] };
              blocos.push(porNome[item.responsible]);
            }
            porNome[item.responsible].entries.push(item);
          });

          // Cada lista sai na ordem das vitrines; quem não tem responsável fica no fim
          blocos.forEach((bloco) => bloco.entries.sort(compareShowcase));

          return blocos.sort((a, b) => {
            if (a.title === NO_RESPONSIBLE_LABEL) return 1;
            if (b.title === NO_RESPONSIBLE_LABEL) return -1;
            return a.title.localeCompare(b.title, 'pt-BR');
          });
        }, [itemsNeedingProduction]);

        const handleApplyAll = () => {
          if (itemsNeedingProduction.length === 0) return;
          // Cada linha pode cair em mais de um espaço da mesma vitrine
          const payload = itemsNeedingProduction.flatMap((item) =>
            item.targets.map((alvo) => ({
              slotId: alvo.slotId,
              productId: item.productId,
              qty: alvo.qty,
              productName: item.productName
            }))
          );
          if (payload.length === 0) return;
          onApplyProductionToShowcase(payload);
          alert('Produção lançada na vitrine com sucesso!');
        };

        const totalNeeded = itemsNeedingProduction.reduce((a, b) => a + b.neededQty, 0);

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                  <div className="t-overline flex items-center gap-1.5 mb-2">
                    <Icons.ChefHat className="w-3.5 h-3.5" />
                    Cozinha e padaria
                  </div>
                  <h2 className="t-display">Pedido de produção</h2>
                  <p className="t-body mt-1.5 max-w-lg">
                    {getDayNameBR(selectedDay)} · {unitName} — o item é chamado quando o estoque
                    chega no mínimo ({Math.round(MIN_STOCK_RATIO * 100)}% do padrão do dia) ou quando
                    tem peça vencida para repor. O vencido não conta como estoque.
                  </p>
                </div>

                <button
                  onClick={handleApplyAll}
                  disabled={itemsNeedingProduction.length === 0}
                  className="btn btn-primary btn-md shrink-0 disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Plus className="w-4 h-4" />
                  Lançar na vitrine
                  {totalNeeded > 0 && <span className="tnum opacity-80">+{totalNeeded}</span>}
                </button>
              </div>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b hairline">
                <h3 className="t-headline text-[#1d1d1f]">Checklist de preparo</h3>
                <div className="flex items-center gap-2">
                  <select
                    value={activeResponsible}
                    onChange={(e) => setResponsibleFilter(e.target.value)}
                    className="field field-sm field-select field-auto"
                  >
                    <option value="todos">Todos os responsáveis</option>
                    {responsibleOptions.map((name) => (
                      <option key={name} value={name}>{name}</option>
                    ))}
                  </select>
                  <span className="pill bg-black/[0.05] text-[#6e6e73] tnum shrink-0">
                    {itemsNeedingProduction.length} a produzir
                  </span>
                </div>
              </div>

              {itemsNeedingProduction.length === 0 ? (
                <div className="text-center py-14 space-y-2">
                  <Icons.CheckCircle2 className="w-11 h-11 text-[#34c759] mx-auto" />
                  <h4 className="t-title text-[#1d1d1f]">Vitrine abastecida</h4>
                  <p className="t-callout">
                    Nada no mínimo nem vencido — não precisa produzir agora
                  </p>
                </div>
              ) : (
                <div className="space-y-6 pt-1">
                  {responsibleBlocks.map((bloco) => (
                    <div key={bloco.key}>
                      <div className="flex items-center gap-2.5 pb-1.5">
                        <span className="w-7 h-7 shrink-0 rounded-full bg-[#0071e3]/10 text-[#0058b0] text-[10px] font-extrabold flex items-center justify-center tracking-tight">
                          {getResponsibleInitials(bloco.title === NO_RESPONSIBLE_LABEL ? '' : bloco.title)}
                        </span>
                        <span className="t-headline text-[#1d1d1f] uppercase tracking-[0.02em] truncate">
                          {bloco.title}
                        </span>
                        <span className="t-caption tnum shrink-0">{bloco.entries.length} item(ns)</span>
                        <span className="flex-1 h-px bg-black/[0.06]" />
                        <span className="pill bg-[#ff9f0a]/12 text-[#8a5200] tnum shrink-0">
                          +{bloco.entries.reduce((acc, i) => acc + i.neededQty, 0)}
                        </span>
                      </div>

                      {bloco.entries.map((item) => {
                        const isChecked = !!completedItems[item.key];
                        return (
                          <div key={item.key} className="py-3.5 flex items-center justify-between gap-4 border-b hairline last:border-0">
                            <div className="flex items-center gap-3 min-w-0">
                              <button
                                type="button"
                                onClick={() => setCompletedItems((prev) => ({ ...prev, [item.key]: !prev[item.key] }))}
                                className="text-[#c7c7cc] hover:text-[#34c759] transition-colors shrink-0"
                              >
                                {isChecked ? <Icons.CheckSquare className="w-5 h-5 text-[#34c759]" /> : <Icons.Square className="w-5 h-5" />}
                              </button>
                              <div className="min-w-0">
                                <h4 className={`t-headline truncate ${isChecked ? 'line-through text-[#a1a1a6]' : 'text-[#1d1d1f]'}`}>
                                  {item.productName}
                                </h4>
                                <p className="t-caption mt-0.5 truncate">{item.showcaseTitle} · {item.slotLabel}</p>
                                <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                  {item.expiredQty > 0 && (
                                    <span className="pill bg-[#ff3b30]/10 text-[#c9271d] text-[10px] tnum">
                                      <Icons.AlertTriangle className="w-3 h-3" />
                                      {item.expiredQty} vencido(s) · repor
                                    </span>
                                  )}
                                  {item.lastDayQty > 0 && (
                                    <span className="pill bg-[#ff9f0a]/12 text-[#a35e00] text-[10px] tnum">
                                      {item.lastDayQty} no último dia
                                    </span>
                                  )}
                                  {item.belowMin && (
                                    <span className="pill bg-black/[0.05] text-[#6e6e73] text-[10px] tnum">
                                      No mínimo · {item.minQty} {item.unitOfMeasure}
                                    </span>
                                  )}
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-4 shrink-0">
                              <div className="t-caption hidden sm:block tnum text-right">
                                Ideal {item.idealQty} · na vitrine {item.currentQty}
                              </div>
                              <div className="tnum bg-[#ff9f0a]/12 text-[#8a5200] font-extrabold text-[13px] px-3 py-1.5 rounded-full whitespace-nowrap">
                                +{item.neededQty} {item.unitOfMeasure}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              )}

              {aboveMinItems.length > 0 && (
                <div className="pt-4 mt-2 border-t hairline">
                  <p className="t-caption">
                    {aboveMinItems.length} item(ns) com falta pequena, ainda acima do mínimo —
                    entram no pedido quando chegarem em {Math.round(MIN_STOCK_RATIO * 100)}% do padrão:{' '}
                    <span className="text-[#1d1d1f] font-semibold">
                      {aboveMinItems.map((i) => `${i.productName} (${i.currentQty}/${i.idealQty})`).join(', ')}
                    </span>
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // LOSSES REPORT VIEW
      // ==========================================
      const LossesReportView = ({ currentUnit, unitName, lossRecords, onDeleteLoss }) => {

        // Se o responsável escolhido não aparece mais nos registros, volta para "todos"
        const activeResponsible = lossResponsibles.includes(selectedResponsible) ? selectedResponsible : 'todos';

        const filteredLosses = unitLosses.filter((l) => {
          const matchesText = l.productName.toLowerCase().includes(filterText.toLowerCase());
          const matchesReason = selectedReason === 'todos' || l.reason === selectedReason;
          const matchesResponsible =
            activeResponsible === 'todos' || cleanResponsible(l.responsible) === activeResponsible;
          return matchesText && matchesReason && matchesResponsible;

        return (
          <div className="space-y-5">
            <div>
              <h2 className="t-display">Relatório de perdas</h2>
              <p className="t-body mt-1">{unitName}</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Itens perdidos
                </span>
                <div className="mt-2 tnum text-[34px] leading-none font-extrabold tracking-[-0.03em] text-[#ff3b30]">
                  {totalLossQty}
                  <span className="text-[15px] font-semibold text-[#86868b] tracking-normal"> un</span>
                </div>
                <p className="t-caption mt-2 tnum">{unitLosses.length} lançamento(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.AlertTriangle className="w-3.5 h-3.5" />
                  Desperdício
                </span>
                <div className="mt-2 t-title text-[#1d1d1f]">Atenção à validade</div>
                <p className="t-caption mt-2">Mantenha a rotação de estoque em dia</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.TrendingUp className="w-3.5 h-3.5" />
                  Recomendação
                </span>
                <div className="mt-2 t-title text-[#1d1d1f]">Ajustar o padrão</div>
                <p className="t-caption mt-2">Reduza a quantidade ideal nos dias de menor movimento</p>
              </div>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b hairline">
                <h3 className="t-headline text-[#1d1d1f]">Registro detalhado</h3>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder="Buscar produto…"
                    value={filterText}
                    onChange={(e) => setFilterText(e.target.value)}
                    className="field field-sm field-auto"
                  />
                  {lossResponsibles.length > 0 && (
                    <select
                      value={activeResponsible}
                      onChange={(e) => setSelectedResponsible(e.target.value)}
                      className="field field-sm field-select field-auto"
                    >
                      <option value="todos">Todos os responsáveis</option>
                      {lossResponsibles.map((r) => (
                        <option key={r} value={r}>{r}</option>
                      ))}
                    </select>
                  )}
                  <select
                    value={selectedReason}
                    onChange={(e) => setSelectedReason(e.target.value)}
                    className="field field-sm field-select field-auto"
                  >
                    <option value="todos">Todos os motivos</option>
                    <option value="vencido">Vencidos</option>
                    <option value="danificado">Danificados</option>
                    <option value="qualidade">Qualidade</option>
                    <option value="quebrado">Quebrados</option>

                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="t-overline text-[10px]">
                      <th className="py-3 pr-3 font-bold">Data</th>

                  <tbody>
                    {filteredLosses.length === 0 ? (

      };

      // ==========================================
      // HISTORY VIEW — PRODUÇÃO, VENDAS E PERDAS
      //
      // Navega por dia ou por semana, e mostra os três tipos de lançamento
      // juntos na aba "Tudo". Cada venda diz o quanto o produto ficou na
      // vitrine em relação à validade dele.
      // ==========================================
      const HistoryView = ({
        currentUnit,
        unitName,
        products,
        slots,
        saleRecords,
        lossRecords,
        productionRecords,
        productionReady,
        onDeleteLoss,
        onDeleteProduction
      }) => {
        const [activeTab, setActiveTab] = useState('tudo');
        const [periodo, setPeriodo] = useState('dia');
        const [refDia, setRefDia] = useState(getTodayDateString());

        const hoje = getTodayDateString();
        const inicio = periodo === 'semana' ? startOfWeekKey(refDia) : refDia;
        const fim = periodo === 'semana' ? shiftDayKey(inicio, 6) : refDia;
        // Chave AAAA-MM-DD compara certo como texto
        const noPeriodo = (dia) => periodo === 'tudo' || (dia >= inicio && dia <= fim);

        const shelfLifeDe = (productId) => products.find((p) => p.id === productId)?.shelfLifeDays;

        // A produção é contada pelo dia de fabricação, não pela hora do lançamento
        const producao = productionRecords
          .filter((p) => p.unit === currentUnit)
          .map((p) => ({ ...p, dia: toDayKey(p.manufactureDate || p.timestamp) }))
          .filter((p) => noPeriodo(p.dia));

        const vendas = saleRecords
          .filter((s) => s.unit === currentUnit)
          .map((s) => ({ ...s, dia: toDayKey(s.timestamp) }))
          .filter((s) => noPeriodo(s.dia));

        const perdas = lossRecords
          .filter((l) => l.unit === currentUnit)
          .map((l) => ({ ...l, dia: toDayKey(l.lossDate) }))
          .filter((l) => noPeriodo(l.dia));

        const totalProduzido = producao.reduce((acc, p) => acc + p.qty, 0);
        const totalVendido = vendas.reduce((acc, s) => acc + s.qty, 0);
        const totalPerdido = perdas.reduce((acc, l) => acc + l.qty, 0);
        const eficiencia = totalVendido + totalPerdido > 0
          ? ((totalVendido / (totalVendido + totalPerdido)) * 100).toFixed(1) + '%'
          : '—';

        // Como as vendas saíram em relação à validade
        const frescor = vendas.reduce((acc, s) => {
          const info = getExposureInfo(s.exposureDays, shelfLifeDe(s.productId));
          acc[info.status] = (acc[info.status] || 0) + s.qty;
          return acc;
        }, {});

        const tudo = [
          ...producao.map((r) => ({ ...r, tipo: 'producao' })),
          ...vendas.map((r) => ({ ...r, tipo: 'venda' })),
          ...perdas.map((r) => ({ ...r, tipo: 'perda' }))
        ].sort((a, b) => (a.dia === b.dia ? 0 : a.dia < b.dia ? 1 : -1));

        const slotLabel = (slotId) => {
          const slot = slots.find((s) => s.id === slotId);
          return slot ? `${slot.sectionTitle} · #${slot.slotNumber}` : '—';
        };

        const SOURCE_LABELS = { avulso: 'Lançamento avulso', pedido: 'Pedido de produção' };

        const TIPOS = {
          producao: { label: 'Produção', pill: 'bg-[#0071e3]/10 text-[#0058b0]' },
          venda: { label: 'Venda', pill: 'bg-[#34c759]/12 text-[#1d7a35]' },
          perda: { label: 'Perda', pill: 'bg-[#ff3b30]/10 text-[#c9271d]' }
        };

        const mover = (passo) => setRefDia((atual) => shiftDayKey(atual, periodo === 'semana' ? passo * 7 : passo));

        const rotulo = periodo === 'semana'
          ? `${formatDateBR(inicio)} a ${formatDateBR(fim)}`
          : formatDateBR(refDia);
        const subrotulo = periodo === 'semana'
          ? (inicio === startOfWeekKey(hoje) ? 'Esta semana' : 'Semana')
          : (refDia === hoje ? 'Hoje' : weekdayName(refDia));
        const noFuturo = periodo === 'semana' ? inicio >= startOfWeekKey(hoje) : refDia >= hoje;

        const vazioLabel = periodo === 'tudo' ? '' : periodo === 'semana' ? ' nesta semana' : ' neste dia';

        const abas = [
          { id: 'tudo', label: `Tudo (${tudo.length})` },
          { id: 'producao', label: `Produção (${producao.length})` },
          { id: 'vendas', label: `Vendas (${vendas.length})` },
          { id: 'perdas', label: `Perdas (${perdas.length})` }
        ];

        const Exposicao = ({ record }) => {
          const info = getExposureInfo(record.exposureDays, shelfLifeDe(record.productId));
          return (
            <span className={`pill ${info.bgClass} ${info.textClass}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${info.dotClass}`} />
              {info.label}
            </span>
          );
        };

        const BotaoExcluir = ({ onClick, title }) => (
          <button
            onClick={onClick}
            title={title}
            className="w-7 h-7 rounded-full text-[#86868b] hover:bg-[#ff3b30]/10 hover:text-[#c9271d] flex items-center justify-center ml-auto transition-colors"
          >
            <Icons.Trash2 className="w-4 h-4" />
          </button>
        );

        return (
          <div className="space-y-5">
            <div>
              <h2 className="t-display">Histórico da vitrine</h2>
              <p className="t-body mt-1">Produção, vendas e perdas — {unitName}</p>
            </div>

            {/* Navegação por período */}
            <div className="card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="segmented">
                {[
                  { id: 'dia', label: 'Por dia' },
                  { id: 'semana', label: 'Por semana' },
                  { id: 'tudo', label: 'Tudo' }
                ].map((op) => (
                  <button key={op.id} onClick={() => setPeriodo(op.id)} data-active={periodo === op.id}>
                    {op.label}
                  </button>
                ))}
              </div>

              {periodo === 'tudo' ? (
                <span className="t-callout tnum">
                  {tudo.length} lançamento(s) desde o começo
                </span>
              ) : (
                <div className="flex items-center gap-2">
                  <button onClick={() => mover(-1)} title="Anterior" className="btn btn-secondary w-8 h-8 px-0 shrink-0">
                    <Icons.ChevronLeft className="w-4 h-4" />
                  </button>

                  <div className="text-center min-w-[172px]">
                    <div className="t-headline text-[#1d1d1f] tnum">{rotulo}</div>
                    <div className="t-caption capitalize">{subrotulo}</div>
                  </div>

                  <button
                    onClick={() => mover(1)}
                    disabled={noFuturo}
                    title="Próximo"
                    className="btn btn-secondary w-8 h-8 px-0 shrink-0 disabled:opacity-35 disabled:pointer-events-none"
                  >
                    <Icons.ChevronRight className="w-4 h-4" />
                  </button>

                  <button onClick={() => setRefDia(hoje)} className="btn btn-secondary btn-sm shrink-0">
                    Hoje
                  </button>
                </div>
              )}
            </div>

            {/* Números do período escolhido */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.ChefHat className="w-3.5 h-3.5" />
                  Produzido
                </span>
                <div className="mt-2 tnum text-[34px] leading-none font-extrabold tracking-[-0.03em] text-[#0071e3]">
                  {totalProduzido}
                  <span className="text-[15px] font-semibold text-[#86868b] tracking-normal"> itens</span>
                </div>
                <p className="t-caption mt-2 tnum">{producao.length} lançamento(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.ShoppingCart className="w-3.5 h-3.5" />
                  Vendido
                </span>
                <div className="mt-2 tnum text-[34px] leading-none font-extrabold tracking-[-0.03em] text-[#1d7a35]">
                  {totalVendido}
                  <span className="text-[15px] font-semibold text-[#86868b] tracking-normal"> itens</span>
                </div>
                <p className="t-caption mt-2 tnum">{vendas.length} baixa(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Perdido
                </span>
                <div className="mt-2 tnum text-[34px] leading-none font-extrabold tracking-[-0.03em] text-[#c9271d]">
                  {totalPerdido}
                  <span className="text-[15px] font-semibold text-[#86868b] tracking-normal"> itens</span>
                </div>
                <p className="t-caption mt-2 tnum">{perdas.length} lançamento(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.TrendingUp className="w-3.5 h-3.5" />
                  Aproveitamento
                </span>
                <div className="mt-2 tnum text-[34px] leading-none font-extrabold tracking-[-0.03em] text-[#1d1d1f]">
                  {eficiencia}
                </div>
                <p className="t-caption mt-2">Vendas sobre vendas + perdas</p>
              </div>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-wrap items-center gap-3 pb-4 border-b hairline">
                <div className="segmented">
                  {abas.map((aba) => (
                    <button key={aba.id} onClick={() => setActiveTab(aba.id)} data-active={activeTab === aba.id}>
                      {aba.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Como as vendas saíram em relação à validade */}
              {(activeTab === 'vendas' || activeTab === 'tudo') && vendas.length > 0 && (
                <div className="flex flex-wrap items-center gap-2 pt-3.5 pb-1">
                  <span className="t-caption">Saída das vendas:</span>
                  {frescor.fresco > 0 && (
                    <span className="pill bg-[#34c759]/12 text-[#1d7a35] tnum">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#34c759]" />
                      {frescor.fresco} dentro da validade
                    </span>
                  )}
                  {frescor.limite > 0 && (
                    <span className="pill bg-[#ff9f0a]/12 text-[#a35e00] tnum">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#ff9f0a]" />
                      {frescor.limite} no último dia
                    </span>
                  )}
                  {frescor.vencido > 0 && (
                    <span className="pill bg-[#ff3b30]/10 text-[#c9271d] tnum">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#ff3b30]" />
                      {frescor.vencido} depois da validade
                    </span>
                  )}
                  {frescor.indefinido > 0 && (
                    <span className="pill bg-black/[0.05] text-[#6e6e73] tnum">{frescor.indefinido} sem validade definida</span>
                  )}
                </div>
              )}

              {!productionReady && (activeTab === 'producao' || activeTab === 'tudo') && (
                <div className="card-quiet p-4 flex items-start gap-2.5 mt-3">
                  <Icons.AlertTriangle className="w-4 h-4 text-[#a35e00] shrink-0 mt-0.5" />
                  <p className="t-callout">
                    O histórico de produção ainda não existe neste banco. Abra o Supabase → SQL Editor e rode
                    o arquivo <strong className="text-[#1d1d1f] font-bold">supabase/schema.sql</strong> de novo:
                    ele cria a tabela <code className="text-[12px] bg-black/[0.05] px-1 py-0.5 rounded">production_records</code> sem
                    mexer no que já está gravado.
                  </p>
                </div>
              )}

              {/* ---------- TUDO JUNTO ---------- */}
              {activeTab === 'tudo' && (
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="t-overline text-[10px]">
                        <th className="py-3 pr-3 font-bold">Data</th>
                        <th className="py-3 px-3 font-bold">Tipo</th>
                        <th className="py-3 px-3 font-bold">Produto</th>
                        <th className="py-3 px-3 font-bold">Responsável</th>
                        <th className="py-3 px-3 text-center font-bold">Qtd</th>
                        <th className="py-3 px-3 font-bold">Detalhe</th>
                        <th className="py-3 pl-3 text-right font-bold">Ação</th>
                      </tr>
                    </thead>
                    <tbody>
                      {tudo.length === 0 ? (
                        <tr>
                          <td colSpan={7} className="text-center py-10">
                            <p className="t-body text-[#86868b]">Nenhum lançamento{vazioLabel}</p>
                            <p className="t-caption mt-1">Produção, vendas e perdas aparecem juntas aqui</p>
                          </td>
                        </tr>
                      ) : (
                        tudo.map((r) => (
                          <tr key={`${r.tipo}-${r.id}`} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                            <td className="py-3 pr-3 t-callout tnum whitespace-nowrap">{formatDateBR(r.dia)}</td>
                            <td className="py-3 px-3">
                              <span className={`pill ${TIPOS[r.tipo].pill}`}>{TIPOS[r.tipo].label}</span>
                            </td>
                            <td className="py-3 px-3 text-[13px] font-semibold text-[#1d1d1f] tracking-[-0.01em]">{r.productName}</td>
                            <td className="py-3 px-3 t-callout whitespace-nowrap">{cleanResponsible(r.responsible) || '—'}</td>
                            <td className="py-3 px-3 text-center">
                              {r.tipo === 'producao' ? (
                                <QtyOfBatch qty={r.qty} unit={r.unitOfMeasure} sign="+" className="text-[#0071e3]" />
                              ) : r.tipo === 'venda' ? (
                                <QtyOfBatch qty={r.qty} produced={r.producedQty} unit={r.unitOfMeasure} className="text-[#1d7a35]" />
                              ) : (
                                <QtyOfBatch qty={r.qty} produced={r.producedQty} unit={r.unitOfMeasure} sign="−" className="text-[#c9271d]" />
                              )}
                            </td>
                            <td className="py-3 px-3">
                              {r.tipo === 'producao' ? (
                                <span className="t-callout tnum">{slotLabel(r.slotId)}</span>
                              ) : r.tipo === 'venda' ? (
                                <Exposicao record={r} />
                              ) : (
                                <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize">{r.reason}</span>
                              )}
                            </td>
                            <td className="py-3 pl-3 text-right">
                              {r.tipo === 'producao' && <BotaoExcluir onClick={() => onDeleteProduction(r.id)} title="Excluir este lançamento de produção" />}
                              {r.tipo === 'perda' && <BotaoExcluir onClick={() => onDeleteLoss(r.id)} title="Excluir esta perda" />}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )}

              {/* ---------- PRODUÇÃO ---------- */}
              {activeTab === 'producao' && (
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="t-overline text-[10px]">
                        <th className="py-3 pr-3 font-bold">Fabricação</th>
                        <th className="py-3 px-3 font-bold">Produto</th>
                        <th className="py-3 px-3 font-bold">Responsável</th>
                        <th className="py-3 px-3 text-center font-bold">Qtd</th>
                        <th className="py-3 px-3 font-bold">Espaço</th>
                        <th className="py-3 px-3 font-bold">Origem</th>
                        <th className="py-3 pl-3 text-right font-bold">Ação</th>
                      </tr>
                    </thead>
                    <tbody>
                      {producao.length === 0 ? (
                        <tr>
                          <td colSpan={7} className="text-center py-10">
                            <p className="t-body text-[#86868b]">Nenhuma produção lançada{vazioLabel}</p>
                            <p className="t-caption mt-1">
                              Cada item colocado na vitrine — pela lista de apoio ou pelo pedido de produção — aparece aqui
                            </p>
                          </td>
                        </tr>
                      ) : (
                        producao.map((p) => (
                          <tr key={p.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                            <td className="py-3 pr-3 t-callout tnum whitespace-nowrap">{formatDateBR(p.dia)}</td>
                            <td className="py-3 px-3 text-[13px] font-semibold text-[#1d1d1f] tracking-[-0.01em]">{p.productName}</td>
                            <td className="py-3 px-3 t-callout whitespace-nowrap">{cleanResponsible(p.responsible) || '—'}</td>
                            <td className="py-3 px-3 text-center">
                              <QtyOfBatch qty={p.qty} unit={p.unitOfMeasure} sign="+" className="text-[#0071e3]" />
                            </td>
                            <td className="py-3 px-3 t-callout tnum whitespace-nowrap">{slotLabel(p.slotId)}</td>
                            <td className="py-3 px-3">
                              <span className="pill bg-black/[0.05] text-[#6e6e73]">{SOURCE_LABELS[p.source] || p.source}</span>
                            </td>
                            <td className="py-3 pl-3 text-right">
                              <BotaoExcluir onClick={() => onDeleteProduction(p.id)} title="Excluir este lançamento de produção" />
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )}

              {/* ---------- VENDAS ---------- */}
              {activeTab === 'vendas' && (
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="t-overline text-[10px]">
                        <th className="py-3 pr-3 font-bold">Data</th>
                        <th className="py-3 px-3 font-bold">Produto</th>
                        <th className="py-3 px-3 font-bold">Responsável</th>
                        <th className="py-3 px-3 text-center font-bold">Qtd</th>
                        <th className="py-3 pl-3 font-bold">Como saiu da vitrine</th>
                      </tr>
                    </thead>
                    <tbody>
                      {vendas.length === 0 ? (
                        <tr>
                          <td colSpan={5} className="text-center py-10">
                            <p className="t-body text-[#86868b]">Nenhuma venda registrada{vazioLabel}</p>
                          </td>
                        </tr>
                      ) : (
                        vendas.map((s) => (
                          <tr key={s.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                            <td className="py-3 pr-3 t-callout tnum whitespace-nowrap">{formatDateBR(s.dia)}</td>
                            <td className="py-3 px-3 text-[13px] font-semibold text-[#1d1d1f] tracking-[-0.01em]">{s.productName}</td>
                            <td className="py-3 px-3 t-callout whitespace-nowrap">{cleanResponsible(s.responsible) || '—'}</td>
                            <td className="py-3 px-3 text-center">
                              <QtyOfBatch qty={s.qty} produced={s.producedQty} unit={s.unitOfMeasure} className="text-[#1d7a35]" />
                            </td>
                            <td className="py-3 pl-3"><Exposicao record={s} /></td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )}

              {/* ---------- PERDAS ---------- */}
              {activeTab === 'perdas' && (
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="t-overline text-[10px]">
                        <th className="py-3 pr-3 font-bold">Data</th>
                        <th className="py-3 px-3 font-bold">Produto</th>
                        <th className="py-3 px-3 font-bold">Responsável</th>
                        <th className="py-3 px-3 text-center font-bold">Qtd</th>
                        <th className="py-3 px-3 font-bold">Motivo</th>
                        <th className="py-3 pl-3 text-right font-bold">Ação</th>
                      </tr>
                    </thead>
                    <tbody>
                      {perdas.length === 0 ? (
                        <tr>
                          <td colSpan={6} className="text-center py-10">
                            <p className="t-body text-[#86868b]">Nenhuma perda registrada{vazioLabel}</p>
                          </td>
                        </tr>
                      ) : (
                        perdas.map((l) => (
                          <tr key={l.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                            <td className="py-3 pr-3 t-callout tnum whitespace-nowrap">{formatDateBR(l.dia)}</td>
                            <td className="py-3 px-3 text-[13px] font-semibold text-[#1d1d1f] tracking-[-0.01em]">{l.productName}</td>
                            <td className="py-3 px-3 t-callout whitespace-nowrap">{cleanResponsible(l.responsible) || '—'}</td>
                            <td className="py-3 px-3 text-center">
                              <QtyOfBatch qty={l.qty} produced={l.producedQty} unit={l.unitOfMeasure} sign="−" className="text-[#c9271d]" />
                            </td>
                            <td className="py-3 px-3">
                              <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize">{l.reason}</span>
                            </td>
                            <td className="py-3 pl-3 text-right">
                              <BotaoExcluir onClick={() => onDeleteLoss(l.id)} title="Excluir esta perda" />
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        );
      };
      // ==========================================
      // SEPARATED PRODUCTS VIEW (Fora da Vitrine)
      // ==========================================
      const SeparatedProductsView = ({ currentUnit, unitName, separatedProducts, onUpdateQty, onAddSeparatedProduct }) => {
        const [showModal, setShowModal] = useState(false);
        const [name, setName] = useState('');
        const [category, setCategory] = useState('revenda');
        const [qty, setQty] = useState(10);
        const [price, setPrice] = useState(7.0);

        const unitItems = separatedProducts.filter((i) => i.unit === currentUnit);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          // O id vem do banco; aqui só descrevemos o item
          onAddSeparatedProduct({
            productName: name.trim(),
            category,
            currentQty: qty,
            unitOfMeasure: 'un',
            minQty: 5,
            price
          });
          setName('');
          setShowModal(false);
        };

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="t-overline flex items-center gap-1.5 mb-2">
                  <Icons.Coffee className="w-3.5 h-3.5" />
                  Fora da vitrine
                </div>
                <h2 className="t-display">Revenda e cafeteria</h2>
                <p className="t-body mt-1.5 max-w-lg">
                  Bebidas, cafés preparados e encomendas — {unitName}.
                </p>
              </div>

              <button onClick={() => setShowModal(true)} className="btn btn-primary btn-md shrink-0">
                <Icons.Plus className="w-4 h-4" />
                Novo item
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
              {unitItems.map((item) => (
                <div key={item.id} className="card p-4 flex flex-col justify-between gap-4">
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="t-overline">{item.category}</span>
                      <span className="tnum text-[13px] font-bold text-[#1d1d1f]">{formatCurrencyBR(item.price)}</span>
                    </div>
                    <h4 className="t-headline text-[#1d1d1f]">{item.productName}</h4>
                  </div>

                  <div className="flex items-end justify-between pt-3 border-t hairline">
                    <div>
                      <span className="t-caption block">Estoque</span>
                      <span className="tnum text-[22px] leading-tight font-extrabold tracking-[-0.02em] text-[#1d1d1f]">
                        {item.currentQty}
                        <span className="text-[12px] font-semibold text-[#86868b] tracking-normal"> {item.unitOfMeasure}</span>
                      </span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={() => onUpdateQty(item.id, -1)}
                        className="w-8 h-8 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#1d1d1f] font-bold flex items-center justify-center transition-colors"
                      >
                        −
                      </button>
                      <button
                        onClick={() => onUpdateQty(item.id, 1)}
                        className="w-8 h-8 rounded-full bg-[#0071e3] hover:bg-[#0077ed] text-white font-bold flex items-center justify-center transition-colors"
                      >
                        +
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
                  <h3 className="t-title text-[#1d1d1f]">Novo item fora da vitrine</h3>
                  <div>
                    <label className="t-caption block mb-1">Nome</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Ex: Coca-Cola 350 ml"
                      className="field field-md"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="t-caption block mb-1">Categoria</label>
                      <select value={category} onChange={(e) => setCategory(e.target.value)} className="field field-md">
                        <option value="revenda">Revenda</option>
                        <option value="cafeteria">Cafeteria</option>
                        <option value="encomenda">Encomenda</option>
                      </select>
                    </div>
                    <div>
                      <label className="t-caption block mb-1">Preço (R$)</label>
                      <input
                        type="number"
                        step="0.01"
                        value={price}
                        onChange={(e) => setPrice(Number(e.target.value) || 0)}
                        className="field field-md tnum"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="t-caption block mb-1">Estoque inicial</label>
                    <input
                      type="number"
                      value={qty}
                      onChange={(e) => setQty(Number(e.target.value) || 0)}
                      className="field field-md tnum"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button type="button" onClick={() => setShowModal(false)} className="btn btn-secondary btn-md">Cancelar</button>
                    <button type="submit" className="btn btn-primary btn-md">Salvar</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // PRODUCT CATALOG VIEW
      // ==========================================
      const ProductCatalogView = ({ products, onAddProduct, onUpdateProduct, onDeleteProduct }) => {
        const [filterText, setFilterText] = useState('');
        const [filterResponsible, setFilterResponsible] = useState('todos');

        // Linha de cadastro: um produto por vez, sem sair do teclado
        const BLANK_DRAFT = { name: '', responsible: '', category: 'salgado', shelfLifeDays: 2, price: 8.5 };
        const [draft, setDraft] = useState(BLANK_DRAFT);

        const nameRef = useRef(null);
        const responsibleRef = useRef(null);
        const categoryRef = useRef(null);
        const shelfLifeRef = useRef(null);
        const priceRef = useRef(null);

        const responsibleOptions = listResponsibles(products);
        const hasUnassigned = products.some((p) => !cleanResponsible(p.responsible));

        const productOptions = products.map((p) => ({ value: p.name, label: p.name }));
        const responsiblePickerOptions = responsibleOptions.map((r) => ({ value: r, label: r }));

        // Nome igual ao de um produto já cadastrado: a linha passa a editar aquele produto
        const findByName = (value) =>
          normalizeName(value)
            ? products.find((p) => normalizeName(p.name) === normalizeName(value)) || null
            : null;

        const matched = findByName(draft.name);

        const setField = (field, value) => setDraft((d) => ({ ...d, [field]: value }));

        // Ao reconhecer um produto existente, a linha carrega os dados dele para ajuste
        const handleDraftName = (value) => {
          const found = findByName(value);
          setDraft((d) => found
            ? {
                name: value,
                responsible: found.responsible || '',
                category: found.category,
                shelfLifeDays: found.shelfLifeDays,
                price: found.price
              }
            : { ...d, name: value });
        };

        // Enter passa para o próximo campo; no último, o formulário salva sozinho
        const goToField = (ref) => (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const el = ref.current;
          if (!el) return;
          el.focus();
          if (el.select) el.select();
        };

        const filtered = products.filter((p) => {
          const matchesText = p.name.toLowerCase().includes(filterText.toLowerCase());
          const matchesResponsible =
            filterResponsible === 'todos' ||
            (filterResponsible === 'sem' ? !cleanResponsible(p.responsible) : cleanResponsible(p.responsible) === filterResponsible);
          return matchesText && matchesResponsible;
        });

        const handleSubmit = (e) => {
          e.preventDefault();
          const nome = draft.name.trim();
          if (!nome) {
            if (nameRef.current) nameRef.current.focus();
            return;
          }

          const dados = {
            name: nome,
            responsible: cleanResponsible(draft.responsible),
            category: draft.category,
            shelfLifeDays: Math.max(1, Number(draft.shelfLifeDays) || 1),
            price: Math.max(0, Number(draft.price) || 0)
          };

          if (matched) {
            onUpdateProduct({ ...matched, ...dados });
          } else {
            // O id vem do banco; aqui só descrevemos o produto
            onAddProduct({ ...dados, defaultUnit: 'un', minReplenishmentQty: 5 });
          }

          // Responsável e categoria continuam preenchidos: quem cadastra costuma
          // lançar vários itens seguidos da mesma pessoa
          setDraft({ ...BLANK_DRAFT, responsible: dados.responsible, category: dados.category });
          setTimeout(() => {
            if (nameRef.current) nameRef.current.focus();
          }, 50);
        };

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7">
              <div className="t-overline flex items-center gap-1.5 mb-2">
                <Icons.Package className="w-3.5 h-3.5" />
                Cadastro
              </div>
              <h2 className="t-display">Catálogo de produtos</h2>
              <p className="t-body mt-1.5">Salgados, doces e sobremesas da casa.</p>

              <form onSubmit={handleSubmit} className="mt-5 pt-5 border-t hairline">
                <div className="flex items-center justify-between mb-3">
                  <span className="t-overline">Cadastrar na linha</span>
                  <span className="t-caption text-[11px]">Enter ↵ avança e salva</span>
                </div>

                <div className="grid grid-cols-12 gap-2 sm:gap-3 items-end">
                  <div className="col-span-12 md:col-span-3">
                    <label className="t-caption block mb-1">Produto</label>
                    <PickerField
                      inputRef={nameRef}
                      placeholder="Digite ou busque…"
                      value={draft.name}
                      options={productOptions}
                      onType={handleDraftName}
                      onPick={(opt) => handleDraftName(opt.label)}
                      emptyLabel="Nome novo — vai entrar como produto novo"
                      onKeyDown={goToField(responsibleRef)}
                      className="field field-md font-semibold"
                    />
                  </div>

                  <div className="col-span-7 md:col-span-3">
                    <label className="t-caption block mb-1">Responsável</label>
                    <PickerField
                      inputRef={responsibleRef}
                      placeholder="Ex: Dona Rita"
                      value={draft.responsible}
                      options={responsiblePickerOptions}
                      onType={(texto) => setField('responsible', texto)}
                      onPick={(opt) => setField('responsible', opt.value)}
                      emptyLabel="Responsável novo — é criado ao salvar"
                      onKeyDown={goToField(categoryRef)}
                      className="field field-md"
                    />
                  </div>

                  <div className="col-span-5 md:col-span-2">
                    <label className="t-caption block mb-1">Categoria</label>
                    <select
                      ref={categoryRef}
                      value={draft.category}
                      onChange={(e) => setField('category', e.target.value)}
                      onKeyDown={goToField(shelfLifeRef)}
                      className="field field-md field-select"
                    >
                      {PRODUCT_CATEGORIES.map((c) => (
                        <option key={c.value} value={c.value}>{c.label}</option>
                      ))}
                    </select>
                  </div>

                  <div className="col-span-4 md:col-span-1">
                    <label className="t-caption block mb-1">Validade</label>
                    <input
                      ref={shelfLifeRef}
                      type="number"
                      min="1"
                      title="Validade em dias a partir da fabricação"
                      value={draft.shelfLifeDays}
                      onChange={(e) => setField('shelfLifeDays', e.target.value)}
                      onKeyDown={goToField(priceRef)}
                      className="field field-md text-center tnum"
                    />
                  </div>

                  <div className="col-span-4 md:col-span-1">
                    <label className="t-caption block mb-1">Preço</label>
                    <input
                      ref={priceRef}
                      type="number"
                      step="0.01"
                      min="0"
                      value={draft.price}
                      onChange={(e) => setField('price', e.target.value)}
                      className="field field-md text-right tnum"
                    />
                  </div>

                  <div className="col-span-4 md:col-span-2">
                    <button
                      type="submit"
                      title={matched ? 'Salvar alterações do produto' : 'Cadastrar produto'}
                      className="btn btn-primary btn-md w-full"
                    >
                      {matched ? <Icons.CheckCircle2 className="w-4 h-4" /> : <Icons.Plus className="w-4 h-4" />}
                      {matched ? 'Salvar' : 'Cadastrar'}
                    </button>
                  </div>
                </div>

                <p className="t-caption text-[11px] mt-2">
                  {matched
                    ? `“${matched.name}” já está no catálogo — os campos acima atualizam o cadastro dele.`
                    : 'Validade em dias contados da fabricação. Um nome já cadastrado abre o produto para edição.'}
                </p>
              </form>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-col sm:flex-row sm:items-center gap-2 pb-4">
                <div className="relative flex-1 max-w-sm">
                  <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[11px]" />
                  <input
                    type="text"
                    placeholder="Pesquisar produto…"
                    value={filterText}
                    onChange={(e) => setFilterText(e.target.value)}
                    className="field field-sm field-search"
                  />
                </div>
                <select
                  value={filterResponsible}
                  onChange={(e) => setFilterResponsible(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  <option value="todos">Todos os responsáveis</option>
                  {responsibleOptions.map((r) => (
                    <option key={r} value={r}>{r}</option>
                  ))}
                  {hasUnassigned && <option value="sem">{NO_RESPONSIBLE_LABEL}</option>}
                </select>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="t-overline text-[10px] border-b hairline">
                      <th className="py-3 pr-3 font-bold sticky left-0 bg-white z-10">Produto</th>
                      <th className="py-3 px-3 font-bold">Responsável</th>
                      <th className="py-3 px-3 font-bold">Categoria</th>
                      <th className="py-3 px-3 text-center font-bold">Validade</th>
                      <th className="py-3 px-3 text-right font-bold">Preço</th>
                      <th className="py-3 pl-3 text-right font-bold">Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length === 0 ? (
                      <tr><td colSpan={6} className="text-center py-10"><p className="t-body text-[#86868b]">Nenhum produto encontrado</p></td></tr>
                    ) : (
                      filtered.map((p) => (
                        <tr key={p.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                          <td className="py-2.5 pr-3 sticky left-0 bg-white z-10">
                            <input
                              type="text"
                              value={p.name}
                              onChange={(e) => onUpdateProduct({ ...p, name: e.target.value })}
                              placeholder="Nome do produto"
                              title="Nome do produto"
                              className="field h-8 px-2.5 text-[13px] font-semibold w-36 sm:w-56"
                            />
                          </td>
                          <td className="py-2.5 px-3">
                            <div className="w-32 sm:w-40">
                              <PickerField
                                value={p.responsible || ''}
                                options={responsiblePickerOptions}
                                onType={(texto) => onUpdateProduct({ ...p, responsible: texto })}
                                onPick={(opt) => onUpdateProduct({ ...p, responsible: opt.value })}
                                placeholder="Quem responde…"
                                title="Responsável pelo produto"
                                emptyLabel="Responsável novo"
                                className="field h-8 pl-2.5 text-[12px]"
                              />
                            </div>
                          </td>
                          <td className="py-2.5 px-3">
                            <select
                              value={p.category}
                              onChange={(e) => onUpdateProduct({ ...p, category: e.target.value })}
                              title="Categoria do produto"
                              className="field field-select h-8 pl-2.5 text-[12px] w-28 sm:w-32"
                            >
                              {PRODUCT_CATEGORIES.map((c) => (
                                <option key={c.value} value={c.value}>{c.label}</option>
                              ))}
                            </select>
                          </td>
                          <td className="py-2.5 px-3">
                            <div className="flex items-center justify-center gap-1.5">
                              <input
                                type="number"
                                min="1"
                                value={p.shelfLifeDays}
                                onChange={(e) => onUpdateProduct({ ...p, shelfLifeDays: Math.max(1, Number(e.target.value) || 1) })}
                                title="Validade em dias a partir da fabricação"
                                className="field h-8 px-2 text-[12px] text-center tnum w-14 sm:w-16"
                              />
                              <span className="t-caption text-[11px] whitespace-nowrap hidden sm:inline">dia(s)</span>
                            </div>
                          </td>
                          <td className="py-2.5 px-3">
                            <div className="flex items-center justify-end gap-1.5">
                              <span className="t-caption text-[11px] hidden sm:inline">R$</span>
                              <input
                                type="number"
                                step="0.01"
                                min="0"
                                value={p.price}
                                onChange={(e) => onUpdateProduct({ ...p, price: Math.max(0, Number(e.target.value) || 0) })}
                                title="Preço de venda"
                                className="field h-8 px-2 text-[12px] text-right font-bold tnum w-20 sm:w-24"
                              />
                            </div>
                          </td>
                          <td className="py-2.5 pl-3 text-right">
                            <button
                              onClick={() => onDeleteProduct(p.id)}
                              title="Excluir produto"
                              className="w-7 h-7 rounded-full text-[#86868b] hover:bg-[#ff3b30]/10 hover:text-[#c9271d] flex items-center justify-center ml-auto transition-colors"
                            >
                              <Icons.Trash2 className="w-4 h-4" />
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>

              <p className="t-caption text-[11px] pt-3">
                Toque em qualquer campo da tabela para corrigir o produto — o app salva sozinho.
              </p>
            </div>
          </div>
        );
      };

      // ==========================================
      // SLOT ADD MODAL
      //
      // Coloca produto em um espaço escolhido a dedo. Serve tanto para o
      // espaço livre quanto para dividir um que já tem produto — a vitrine
      // de verdade aceita duas coisas no mesmo lugar.
      // ==========================================
      const SlotAddModal = ({ slot, itemsInSlot, products, onClose, onConfirm }) => {
        if (!slot) return null;
        const [productName, setProductName] = useState('');
        const [qty, setQty] = useState(10);
        const [date, setDate] = useState(getTodayDateString());

        // O espaço pertence a uma vitrine, então a lista mostra só os produtos
        // daquela vitrine — nada de doce aparecendo na vitrine salgada
        const categoriaDaVitrine = categoryOfShowcaseType(slot.showcaseType);
        const productOptions = productsForShowcaseType(products, slot.showcaseType)
          .map((p) => ({ value: p.name, label: p.name }));
        const dividindo = itemsInSlot.length > 0;

        const handleSubmit = (e) => {
          e.preventDefault();
          const nome = productName.trim();
          if (!nome) return;
          onConfirm(nome, Math.max(1, Number(qty) || 1), date, slot.id);
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">{dividindo ? 'Dividir espaço' : 'Colocar na vitrine'}</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1">{slot.sectionTitle} · #{slot.slotNumber}</h3>
                  <p className="t-callout mt-1">
                    {dividindo
                      ? `Já tem ${itemsInSlot.length === 1 ? 'um produto' : `${itemsInSlot.length} produtos`} aqui — o novo divide o mesmo espaço.`
                      : 'Espaço livre.'}
                  </p>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              {dividindo && (
                <div className="card-quiet p-3 space-y-1">
                  {itemsInSlot.map((item) => (
                    <div key={item.id} className="flex items-center justify-between gap-2">
                      <span className="text-[12px] font-semibold text-[#1d1d1f] truncate">{item.productName}</span>
                      <span className="t-caption tnum shrink-0">{item.currentQty} {item.unit}</span>
                    </div>
                  ))}
                </div>
              )}

              <div>
                <label className="t-caption block mb-1">
                  Produto <span className="font-normal">· só os de {categoriaDaVitrine} desta vitrine</span>
                </label>
                <PickerField
                  placeholder="Digite ou escolha…"
                  value={productName}
                  options={productOptions}
                  onType={setProductName}
                  onPick={(opt) => setProductName(opt.label)}
                  emptyLabel={`Nenhum produto de ${categoriaDaVitrine} com esse nome — ao colocar, ele entra no catálogo`}
                  className="field field-md font-semibold"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="t-caption block mb-1">Quantidade</label>
                  <input
                    type="number"
                    min="1"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    className="field field-md text-center font-extrabold tnum"
                  />
                </div>
                <div>
                  <label className="t-caption block mb-1">Fabricação</label>
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="field field-md text-center tnum"
                  />
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-1">
                <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                <button type="submit" className="btn btn-primary btn-md">
                  <Icons.Plus className="w-4 h-4" />
                  {dividindo ? 'Dividir espaço' : 'Colocar'}
                </button>
              </div>
            </form>
          </div>
        );
      };

      // ==========================================
      // ITEM DECREASE MODAL
      // ==========================================
      const ItemDecreaseModal = ({ item, onClose, onRecordSale, onRecordLoss, onRecordSellAll }) => {
        if (!item) return null;
        const [mode, setMode] = useState('venda');
        const [qty, setQty] = useState(1);
        const [reason, setReason] = useState('vencido');
        const [details, setDetails] = useState('');

        const handleConfirm = () => {
          if (qty <= 0) return;
          if (mode === 'venda') {
            onRecordSale(item.id, qty);
          } else {
            onRecordLoss(item.id, qty, reason, details);
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-[20px] max-w-md w-full p-6 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Baixa de produto</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1">{item.productName}</h3>
                  <p className="t-callout mt-1 tnum">
                    Estoque atual: <strong className="text-[#1d1d1f] font-bold">{item.currentQty} {item.unit}</strong>
                  </p>
                </div>
                <button onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2 my-5">
                <button
                  type="button"
                  onClick={() => setMode('venda')}
                  className={`btn btn-md ${mode === 'venda' ? 'bg-[#34c759] text-[#06300f]' : 'btn-secondary'}`}
                >
                  <Icons.ShoppingCart className="w-4 h-4" /> Venda
                </button>
                <button
                  type="button"
                  onClick={() => setMode('perda')}
                  className={`btn btn-md ${mode === 'perda' ? 'btn-danger' : 'btn-secondary'}`}
                >
                  <Icons.AlertTriangle className="w-4 h-4" /> Perda
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="t-caption block mb-1.5">Quantidade</label>
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setQty((q) => Math.max(1, q - 1))}
                      className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                    >
                      −
                    </button>
                    <input
                      type="number"
                      min="1"
                      max={item.currentQty}
                      value={qty}
                      onChange={(e) => setQty(Math.min(item.currentQty, Math.max(1, Number(e.target.value) || 1)))}
                      className="field field-md w-20 text-center text-[17px] font-extrabold tnum"
                    />
                    <button
                      onClick={() => setQty((q) => Math.min(item.currentQty, q + 1))}
                      className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                    >
                      +
                    </button>
                  </div>
                </div>

                {mode === 'perda' && (
                  <div className="space-y-3 p-4 bg-[#ff3b30]/[0.05] rounded-2xl">
                    <div>
                      <label className="t-caption block mb-1">Motivo</label>
                      <select value={reason} onChange={(e) => setReason(e.target.value)} className="field field-sm">
                        <option value="vencido">Produto vencido</option>
                        <option value="danificado">Avaria física</option>
                        <option value="qualidade">Alteração de sabor ou textura</option>
                        <option value="quebrado">Queda ou quebra</option>
                      </select>
                    </div>
                    <div>
                      <label className="t-caption block mb-1">Detalhes</label>
                      <input
                        type="text"
                        value={details}
                        onChange={(e) => setDetails(e.target.value)}
                        placeholder="Observações"
                        className="field field-sm"
                      />
                    </div>
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => { onRecordSellAll(item.id); onClose(); }}
                  className="btn btn-secondary w-full btn-md"
                >
                  <Icons.CheckCircle2 className="w-4 h-4 text-[#34c759]" />
                  <span className="tnum">Vendeu tudo ({item.currentQty})</span>
                </button>
              </div>

              <div className="flex justify-end gap-2 mt-6">
                <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                <button
                  type="button"
                  onClick={handleConfirm}
                  className={`btn btn-md ${mode === 'venda' ? 'bg-[#34c759] text-[#06300f] hover:bg-[#46d46b]' : 'btn-danger'}`}
                >
                  Confirmar {mode === 'venda' ? 'venda' : 'perda'}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // TELAS DE ESTADO DA CONEXÃO
      // ==========================================
      const CenteredCard = ({ children }) => (
        <div className="min-h-screen flex items-center justify-center p-6 font-sans">
          <div className="card p-7 sm:p-8 max-w-lg w-full space-y-4">{children}</div>
        </div>
      );

      const LoadingScreen = () => (
        <CenteredCard>
          <div className="t-overline">Delícias da Vovó</div>
          <h1 className="t-title text-[#1d1d1f]">Carregando a vitrine…</h1>
          <p className="t-body">Buscando os dados no Supabase.</p>
        </CenteredCard>
      );

      const SetupScreen = () => (
        <CenteredCard>
          <div className="t-overline flex items-center gap-1.5">
            <Icons.AlertTriangle className="w-3.5 h-3.5" />
            Configuração pendente
          </div>
          <h1 className="t-title text-[#1d1d1f]">Falta ligar o Supabase</h1>
          <p className="t-body">
            Abra o <strong>index.html</strong>, procure por <code className="text-[13px] bg-black/[0.05] px-1.5 py-0.5 rounded">SUPABASE_URL</code> e
            preencha as duas linhas com os dados do seu projeto.
          </p>
          <ol className="t-callout space-y-1.5 list-decimal pl-4">
            <li>No Supabase, abra <strong>Project Settings → API</strong>.</li>
            <li>Copie a <strong>Project URL</strong> para <code className="text-[12px]">SUPABASE_URL</code>.</li>
            <li>Copie a chave <strong>anon public</strong> para <code className="text-[12px]">SUPABASE_ANON_KEY</code>.</li>
            <li>Rode o arquivo <strong>supabase/schema.sql</strong> no SQL Editor, se ainda não rodou.</li>
          </ol>
        </CenteredCard>
      );

      const ConnectionErrorScreen = ({ message, onRetry }) => (
        <CenteredCard>
          <div className="t-overline flex items-center gap-1.5">
            <Icons.AlertTriangle className="w-3.5 h-3.5" />
            Sem conexão com o banco
          </div>
          <h1 className="t-title text-[#1d1d1f]">Não deu para carregar os dados</h1>
          <p className="t-body break-words">{message}</p>
          <p className="t-callout">
