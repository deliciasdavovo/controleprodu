                <h2 className="text-xl font-black text-slate-900 flex items-center gap-2">
                  <Icons.Package className="w-5 h-5 text-amber-600" />
                  Catálogo de Produtos - Delícias da Vovó
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">Cadastre novos salgados, doces e sobremesas.</p>
              </div>

              <button
                onClick={() => setShowModal(true)}
                className="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-amber-950 font-bold rounded-xl text-xs shadow-xs flex items-center gap-1.5"
              >
                <Icons.Plus className="w-4 h-4" />
                Cadastrar Novo Produto
              </button>
            </div>

            <div className="bg-white rounded-2xl p-5 border border-slate-200 space-y-4">
              <div className="relative max-w-sm">
                <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5" />
                <input
                  type="text"
                  placeholder="Pesquisar produto..."
                  value={filterText}
                  onChange={(e) => setFilterText(e.target.value)}
                  className="w-full text-xs pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl"
                />
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                      <th className="py-2.5 px-3">Nome do Produto</th>
                      <th className="py-2.5 px-3">Categoria</th>
                      <th className="py-2.5 px-3 text-center">Validade</th>
                      <th className="py-2.5 px-3 text-right">Preço</th>
                      <th className="py-2.5 px-3 text-right">Ação</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filtered.map((p) => (
                      <tr key={p.id} className="hover:bg-slate-50">
                        <td className="py-2.5 px-3 font-bold text-slate-900">{p.name}</td>
                        <td className="py-2.5 px-3 capitalize font-semibold text-amber-800">{p.category}</td>
                        <td className="py-2.5 px-3 text-center text-slate-600">{p.shelfLifeDays} dia(s)</td>
                        <td className="py-2.5 px-3 text-right font-extrabold text-emerald-600">{formatCurrencyBR(p.price)}</td>
                        <td className="py-2.5 px-3 text-right">
                          <button
                            onClick={() => onDeleteProduct(p.id)}
                            className="p-1.5 text-slate-400 hover:text-red-600 rounded"
                          >
                            <Icons.Trash2 className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSubmit} className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-200">
                  <h3 className="text-base font-bold text-slate-900">Novo Produto</h3>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nome:</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Ex: Coxinha de Carne..."
                      className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Categoria:</label>
                      <select
                        value={category}
                        onChange={(e) => setCategory(e.target.value)}
                        className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                      >
                        <option value="salgado">Salgado</option>
                        <option value="doce">Doce</option>
                        <option value="sobremesa">Sobremesa</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Preço (R$):</label>
                      <input
                        type="number"
                        step="0.01"
                        value={price}
                        onChange={(e) => setPrice(Number(e.target.value) || 0)}
                        className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Validade (Dias):</label>
                    <input
                      type="number"
                      value={shelfLifeDays}
                      onChange={(e) => setShelfLifeDays(Number(e.target.value) || 1)}
                      className="w-full text-xs py-2 px-3 border border-slate-300 rounded-xl"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-xs font-semibold text-slate-600">Cancelar</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold bg-amber-500 text-amber-950 rounded-xl">Salvar</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // ITEM DECREASE MODAL
      // ==========================================
      const ItemDecreaseModal = ({ item, onClose, onRecordSale, onRecordLoss, onRecordSellAll }) => {
        if (!item) return null;
        const [mode, setMode] = useState('venda');
        const [qty, setQty] = useState(1);
        const [reason, setReason] = useState('vencido');
        const [details, setDetails] = useState('');

        const handleConfirm = () => {
          if (qty <= 0) return;
          if (mode === 'venda') {
            onRecordSale(item.id, qty);
          } else {
            onRecordLoss(item.id, qty, reason, details);
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
              <div className="flex items-start justify-between pb-3 border-b border-slate-100">
                <div>
                  <span className="text-xs font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-md">
                    Baixa de Produto
                  </span>
                  <h3 className="text-base font-bold text-slate-900 mt-1">{item.productName}</h3>
                  <p className="text-xs text-slate-500 mt-0.5">Estoque atual: <strong>{item.currentQty} {item.unit}</strong></p>
                </div>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2 my-4">
                <button
                  type="button"
                  onClick={() => setMode('venda')}
                  className={`py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border ${
                    mode === 'venda' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200'
                  }`}
                >
                  <Icons.ShoppingCart className="w-4 h-4" /> Registrar Venda
                </button>
                <button
                  type="button"
                  onClick={() => setMode('perda')}
                  className={`py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border ${
                    mode === 'perda' ? 'bg-red-600 text-white border-red-600' : 'bg-slate-50 text-slate-700 border-slate-200'
                  }`}
                >
                  <Icons.AlertTriangle className="w-4 h-4" /> Registrar Perda
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Quantidade:</label>
                  <div className="flex items-center gap-3">
                    <button onClick={() => setQty((q) => Math.max(1, q - 1))} className="w-8 h-8 rounded bg-slate-100 font-bold">-</button>
                    <input
                      type="number"
                      min="1"
                      max={item.currentQty}
                      value={qty}
                      onChange={(e) => setQty(Math.min(item.currentQty, Math.max(1, Number(e.target.value) || 1)))}
                      className="w-16 text-center font-bold text-base py-1 border border-slate-300 rounded"
                    />
                    <button onClick={() => setQty((q) => Math.min(item.currentQty, q + 1))} className="w-8 h-8 rounded bg-slate-100 font-bold">+</button>
                  </div>
                </div>

                {mode === 'perda' && (
                  <div className="space-y-2 p-3 bg-red-50 rounded-xl border border-red-200">
                    <div>
                      <label className="block text-xs font-semibold text-red-900 mb-1">Motivo:</label>
                      <select
                        value={reason}
                        onChange={(e) => setReason(e.target.value)}
                        className="w-full text-xs py-1.5 px-2 bg-white border border-red-200 rounded-lg"
                      >
                        <option value="vencido">Produto Vencido / Expirado</option>
                        <option value="danificado">Avaria Física / Amassado</option>
                        <option value="qualidade">Alteração de Sabor / Textura</option>
                        <option value="quebrado">Queda / Quebrado</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-red-900 mb-1">Detalhes:</label>
                      <input
                        type="text"
                        value={details}
                        onChange={(e) => setDetails(e.target.value)}
                        placeholder="Observações..."
                        className="w-full text-xs py-1.5 px-2 bg-white border border-red-200 rounded-lg"
                      />
                    </div>
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => { onRecordSellAll(item.id); onClose(); }}
                  className="w-full py-2 bg-blue-50 hover:bg-blue-100 text-blue-900 rounded-xl text-xs font-bold border border-blue-200 flex items-center justify-center gap-2"
                >
                  <Icons.CheckCircle2 className="w-4 h-4 text-blue-600" /> Vendeu tudo ({item.currentQty})
                </button>
              </div>

              <div className="flex justify-end gap-2 mt-6">
                <button type="button" onClick={onClose} className="px-4 py-2 text-xs font-semibold text-slate-600">Cancelar</button>
                <button
                  type="button"
                  onClick={handleConfirm}
                  className={`px-5 py-2 text-xs font-bold text-white rounded-xl ${mode === 'venda' ? 'bg-emerald-600' : 'bg-red-600'}`}
                >
                  Confirmar {mode === 'venda' ? 'Venda' : 'Perda'}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // MAIN APP COMPONENT
      // ==========================================
      function App() {
        const [currentUnit, setCurrentUnit] = useState('matriz');
        const [activeTab, setActiveTab] = useState('vitrine');

        const [products, setProducts] = useState(() => loadLocal('products', INITIAL_PRODUCTS));
        const [slots] = useState(generateInitialSlots);
        const [slotItems, setSlotItems] = useState(() => loadLocal('slotItems', generateInitialSlotItems()));
        const [standardPlans, setStandardPlans] = useState(() => loadLocal('standardPlans', generateInitialStandardPlans()));
        const [selectedDay, setSelectedDay] = useState('segunda');

        const [lossRecords, setLossRecords] = useState(() => loadLocal('lossRecords', []));
        const [saleRecords, setSaleRecords] = useState(() => loadLocal('saleRecords', []));
        const [separatedProducts, setSeparatedProducts] = useState(() => loadLocal('separatedProducts', generateInitialSeparatedProducts()));

        const [decreaseModalItem, setDecreaseModalItem] = useState(null);

        useEffect(() => saveLocal('products', products), [products]);
        useEffect(() => saveLocal('slotItems', slotItems), [slotItems]);
        useEffect(() => saveLocal('standardPlans', standardPlans), [standardPlans]);
        useEffect(() => saveLocal('lossRecords', lossRecords), [lossRecords]);
        useEffect(() => saveLocal('saleRecords', saleRecords), [saleRecords]);
        useEffect(() => saveLocal('separatedProducts', separatedProducts), [separatedProducts]);

        const totalAlerts = useMemo(() => {
          return slotItems.filter((item) => {
            const slot = slots.find((s) => s.id === item.slotId);
            if (slot?.unit !== currentUnit) return false;
            const prod = products.find((p) => p.id === item.productId);
            const statusInfo = getSlotItemStatus(item, prod);
            return statusInfo.status !== 'normal';
          }).length;
        }, [slotItems, slots, products, currentUnit]);

        const handleIncrementQty = (itemId) => {
          setSlotItems((prev) => prev.map((item) => item.id === itemId ? { ...item, currentQty: item.currentQty + 1 } : item));
        };

        const handleUpdateItem = (updatedItem) => {
          setSlotItems((prev) => prev.map((i) => i.id === updatedItem.id ? updatedItem : i));
        };

        const handleRecordSale = (itemId, qty) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (!target) return;

          const newSale = {
            id: generateUniqueId('sale'),
            unit: currentUnit,
            productId: target.productId,
            productName: target.productName,
            qty,
            producedQty: target.producedQty || target.currentQty,
            unitOfMeasure: target.unit,
            timestamp: new Date().toISOString(),
            manufactureDate: target.manufactureDate,
            exposureDays: calculateDaysInShowcase(target.manufactureDate)
          };
          setSaleRecords((prev) => [newSale, ...prev]);

          if (target.currentQty - qty <= 0) {
            setSlotItems((prev) => prev.filter((i) => i.id !== itemId));
          } else {
            setSlotItems((prev) => prev.map((i) => i.id === itemId ? { ...i, currentQty: i.currentQty - qty } : i));
          }
        };

        const handleRecordLoss = (itemId, qty, reason, details) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (!target) return;

          const newLoss = {
            id: generateUniqueId('loss'),
            unit: currentUnit,
            productId: target.productId,
            productName: target.productName,
            qty,
            producedQty: target.producedQty || target.currentQty,
            unitOfMeasure: target.unit,
            manufactureDate: target.manufactureDate,
            lossDate: getTodayDateString(),
            reason,
            details,
            slotId: target.slotId
          };
          setLossRecords((prev) => [newLoss, ...prev]);

          if (target.currentQty - qty <= 0) {
            setSlotItems((prev) => prev.filter((i) => i.id !== itemId));
          } else {
            setSlotItems((prev) => prev.map((i) => i.id === itemId ? { ...i, currentQty: i.currentQty - qty } : i));
          }
        };

        const handleRecordSellAll = (itemId) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (target) handleRecordSale(itemId, target.currentQty);
        };

        const handleRemoveItem = (itemId) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (target && window.confirm(`Remover "${target.productName}" da vitrine?`)) {
            setSlotItems((prev) => prev.filter((i) => i.id !== itemId));
          }
        };

        const handleQuickAllocate = (productName, qty, manufactureDate) => {
          let product = products.find(
            (p) => p.name.toLowerCase().trim() === productName.toLowerCase().trim()
          );

          if (!product) {
            product = {
              id: generateUniqueId('p'),
              name: productName,
              category: 'salgado',
              compatibleShowcases: ['salgada'],
              defaultUnit: 'un',
              minReplenishmentQty: 10,
              shelfLifeDays: 2,
              price: 8.0
            };
            setProducts((prev) => [...prev, product]);
          }

          const prodCategory = product.category || 'salgado';
          const showcaseType = prodCategory === 'salgado' ? 'salgada' : prodCategory === 'doce' ? 'doce' : 'sobremesa';
          const unitSlots = slots.filter((s) => s.unit === currentUnit && s.showcaseType === showcaseType);

          if (unitSlots.length === 0) {
            alert(`Nenhum espaço físico compatível na unidade ${currentUnit}.`);
            return;
          }

          let targetSlot = unitSlots.find((s) => !slotItems.some((i) => i.slotId === s.id));
          if (!targetSlot) {
            targetSlot = unitSlots[0];
          }

          const newItem = {
            id: generateUniqueId('item'),
            slotId: targetSlot.id,
            productId: product.id,
            productName: product.name,
            producedQty: qty,
            currentQty: qty,
            unit: product.defaultUnit || 'un',
            minQty: product.minReplenishmentQty || 5,
            manufactureDate: manufactureDate || getTodayDateString(),
            entryDate: getTodayDateString()
          };

          setSlotItems((prev) => [...prev, newItem]);
        };

        const handleUpdatePlanItem = (slotId, productId, idealQty) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;

          setStandardPlans((prev) => {
            const existing = prev.find((sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay && sp.slotId === slotId);
            if (existing) {
              return prev.map((sp) => sp.id === existing.id ? { ...sp, productId, idealQty } : sp);
            }
            return [...prev, {
              id: generateUniqueId('sp'),
              unit: currentUnit,
              dayOfWeek: selectedDay,
              slotId,
              productId,
              idealQty,
              unitOfMeasure: prod.defaultUnit
            }];
          });
        };

        const handleRemovePlanItem = (planId) => {
          setStandardPlans((prev) => prev.filter((sp) => sp.id !== planId));
        };

        const handleCopyDayPlan = (fromDay, toDay) => {
          setStandardPlans((prev) => {
            const sourcePlans = prev.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === fromDay);
            const otherPlans = prev.filter((sp) => !(sp.unit === currentUnit && sp.dayOfWeek === toDay));
            const copied = sourcePlans.map((sp) => ({ ...sp, id: generateUniqueId('sp'), dayOfWeek: toDay }));
            return [...otherPlans, ...copied];
          });
        };

        const handleClearDayPlan = (day) => {
          setStandardPlans((prev) => prev.filter((sp) => !(sp.unit === currentUnit && sp.dayOfWeek === day)));
        };

        const handleApplyProductionToShowcase = (itemsToProduce) => {
          const today = getTodayDateString();
          itemsToProduce.forEach((item) => {
            const product = products.find((p) => p.id === item.productId);
            const newItem = {
              id: generateUniqueId('item'),
              slotId: item.slotId,
              productId: item.productId,
              productName: item.productName,
              producedQty: item.qty,
              currentQty: item.qty,
              unit: product?.defaultUnit || 'un',
              minQty: product?.minReplenishmentQty || 5,
              manufactureDate: today,
              entryDate: today
            };
            setSlotItems((prev) => [...prev, newItem]);
          });
          setActiveTab('vitrine');
        };

        const handleUpdateSeparatedQty = (id, delta) => {
          setSeparatedProducts((prev) =>
            prev.map((i) => i.id === id ? { ...i, currentQty: Math.max(0, i.currentQty + delta) } : i)
          );
        };

        const handleAddSeparatedProduct = (prod) => {
          const newItem = { ...prod, id: generateUniqueId('sep') };
          setSeparatedProducts((prev) => [...prev, newItem]);
        };

        return (
          <div className="min-h-screen bg-slate-100 text-slate-900 flex flex-col font-sans">
            <Navbar
              currentUnit={currentUnit}
              onUnitChange={setCurrentUnit}
              activeTab={activeTab}
              onTabChange={setActiveTab}
              totalAlerts={totalAlerts}
            />

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
              {activeTab === 'vitrine' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  <div className="lg:col-span-7 xl:col-span-8">
                    <ShowcaseGrid
                      currentUnit={currentUnit}
                      slots={slots}
                      slotItems={slotItems}
                      products={products}
                      onIncrementQty={handleIncrementQty}
                      onOpenDecreaseModal={setDecreaseModalItem}
                    />
                  </div>
                  <div className="lg:col-span-5 xl:col-span-4 sticky top-20">
                    <SupportList
                      currentUnit={currentUnit}
                      slotItems={slotItems}
                      products={products}
                      slots={slots}
                      onUpdateItem={handleUpdateItem}
                      onQuickAllocate={handleQuickAllocate}
                      onRecordSellAll={handleRecordSellAll}
                      onOpenDecreaseModal={setDecreaseModalItem}
                      onRemoveItem={handleRemoveItem}
                    />
                  </div>
                </div>
              )}

              {activeTab === 'padrao' && (
                <StandardShowcaseView
                  currentUnit={currentUnit}
                  slots={slots}
                  products={products}
                  standardPlans={standardPlans}
                  selectedDay={selectedDay}
                  onSelectDay={setSelectedDay}
                  onUpdatePlanItem={handleUpdatePlanItem}
                  onRemovePlanItem={handleRemovePlanItem}
                  onCopyDayPlan={handleCopyDayPlan}
                  onClearDayPlan={handleClearDayPlan}
                  onGenerateProductionOrder={() => setActiveTab('producao')}
                />
              )}

              {activeTab === 'producao' && (
                <ProductionOrderView
                  currentUnit={currentUnit}
                  slots={slots}
                  slotItems={slotItems}
                  products={products}
                  standardPlans={standardPlans}
                  selectedDay={selectedDay}
                  onApplyProductionToShowcase={handleApplyProductionToShowcase}
                />
              )}

              {activeTab === 'perdas' && (
                <LossesReportView
                  currentUnit={currentUnit}
                  lossRecords={lossRecords}
                />
              )}

              {activeTab === 'historico' && (
                <HistoryView
                  currentUnit={currentUnit}
                  saleRecords={saleRecords}
                  lossRecords={lossRecords}
                />
              )}

              {activeTab === 'fora' && (
                <SeparatedProductsView
                  currentUnit={currentUnit}
                  separatedProducts={separatedProducts}
                  onUpdateQty={handleUpdateSeparatedQty}
                  onAddSeparatedProduct={handleAddSeparatedProduct}
                />
              )}

              {activeTab === 'produtos' && (
                <ProductCatalogView
                  products={products}
                  onAddProduct={(p) => setProducts((prev) => [...prev, p])}
                  onDeleteProduct={(id) => setProducts((prev) => prev.filter((p) => p.id !== id))}
                />
              )}
            </main>

            <ItemDecreaseModal
              item={decreaseModalItem}
              onClose={() => setDecreaseModalItem(null)}
              onRecordSale={handleRecordSale}
              onRecordLoss={handleRecordLoss}
              onRecordSellAll={handleRecordSellAll}
            />

            <footer className="px-6 py-3 bg-slate-900 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400 mt-auto">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse" />
                <span className="text-emerald-400 font-bold uppercase text-[11px]">Sistema Operante</span>
                <span>• Delícias da Vovó</span>
              </div>
              <div>
                Unidade: <strong className="text-white">{currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'}</strong>
              </div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
