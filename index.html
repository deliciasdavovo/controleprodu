              <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
                  <h3 className="t-title text-[#1d1d1f]">Novo item fora da vitrine</h3>
                  <div>
                    <label className="t-caption block mb-1">Nome</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Ex: Coca-Cola 350 ml"
                      className="field field-md"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="t-caption block mb-1">Categoria</label>
                      <select value={category} onChange={(e) => setCategory(e.target.value)} className="field field-md">
                        <option value="revenda">Revenda</option>
                        <option value="cafeteria">Cafeteria</option>
                        <option value="encomenda">Encomenda</option>
                      </select>
                    </div>
                    <div>
                      <label className="t-caption block mb-1">Preço (R$)</label>
                      <input
                        type="number"
                        step="0.01"
                        value={price}
                        onChange={(e) => setPrice(Number(e.target.value) || 0)}
                        className="field field-md tnum"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="t-caption block mb-1">Estoque inicial</label>
                    <input
                      type="number"
                      value={qty}
                      onChange={(e) => setQty(Number(e.target.value) || 0)}
                      className="field field-md tnum"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button type="button" onClick={() => setShowModal(false)} className="btn btn-secondary btn-md">Cancelar</button>
                    <button type="submit" className="btn btn-primary btn-md">Salvar</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // PRODUCT CATALOG VIEW
      // ==========================================
      const ProductCatalogView = ({ products, onAddProduct, onDeleteProduct }) => {
        const [filterText, setFilterText] = useState('');
        const [showModal, setShowModal] = useState(false);

        const [name, setName] = useState('');
        const [category, setCategory] = useState('salgado');
        const [price, setPrice] = useState(8.5);
        const [shelfLifeDays, setShelfLifeDays] = useState(2);

        const filtered = products.filter((p) => p.name.toLowerCase().includes(filterText.toLowerCase()));

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          onAddProduct({
            id: generateUniqueId('p'),
            name: name.trim(),
            category,
            compatibleShowcases: [category === 'salgado' ? 'salgada' : category === 'doce' ? 'doce' : 'sobremesa'],
            defaultUnit: 'un',
            minReplenishmentQty: 5,
            shelfLifeDays,
            price
          });
          setName('');
          setShowModal(false);
        };

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div className="t-overline flex items-center gap-1.5 mb-2">
                  <Icons.Package className="w-3.5 h-3.5" />
                  Cadastro
                </div>
                <h2 className="t-display">Catálogo de produtos</h2>
                <p className="t-body mt-1.5">Salgados, doces e sobremesas da casa.</p>
              </div>

              <button onClick={() => setShowModal(true)} className="btn btn-primary btn-md shrink-0">
                <Icons.Plus className="w-4 h-4" />
                Novo produto
              </button>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="relative max-w-sm pb-4">
                <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[11px]" />
                <input
                  type="text"
                  placeholder="Pesquisar produto…"
                  value={filterText}
                  onChange={(e) => setFilterText(e.target.value)}
                  className="field field-sm field-search"
                />
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="t-overline text-[10px] border-b hairline">
                      <th className="py-3 pr-3 font-bold">Produto</th>
                      <th className="py-3 px-3 font-bold">Categoria</th>
                      <th className="py-3 px-3 text-center font-bold">Validade</th>
                      <th className="py-3 px-3 text-right font-bold">Preço</th>
                      <th className="py-3 pl-3 text-right font-bold">Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length === 0 ? (
                      <tr><td colSpan={5} className="text-center py-10"><p className="t-body text-[#86868b]">Nenhum produto encontrado</p></td></tr>
                    ) : (
                      filtered.map((p) => (
                        <tr key={p.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                          <td className="py-3 pr-3 text-[13px] font-semibold text-[#1d1d1f] tracking-[-0.01em]">{p.name}</td>
                          <td className="py-3 px-3">
                            <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize">{p.category}</span>
                          </td>
                          <td className="py-3 px-3 text-center t-callout tnum whitespace-nowrap">{p.shelfLifeDays} dia(s)</td>
                          <td className="py-3 px-3 text-right tnum text-[13px] font-bold text-[#1d1d1f]">{formatCurrencyBR(p.price)}</td>
                          <td className="py-3 pl-3 text-right">
                            <button
                              onClick={() => onDeleteProduct(p.id)}
                              title="Excluir produto"
                              className="w-7 h-7 rounded-full text-[#86868b] hover:bg-[#ff3b30]/10 hover:text-[#c9271d] flex items-center justify-center ml-auto transition-colors"
                            >
                              <Icons.Trash2 className="w-4 h-4" />
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
                  <h3 className="t-title text-[#1d1d1f]">Novo produto</h3>
                  <div>
                    <label className="t-caption block mb-1">Nome</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Ex: Coxinha de carne"
                      className="field field-md"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="t-caption block mb-1">Categoria</label>
                      <select value={category} onChange={(e) => setCategory(e.target.value)} className="field field-md">
                        <option value="salgado">Salgado</option>
                        <option value="doce">Doce</option>
                        <option value="sobremesa">Sobremesa</option>
                      </select>
                    </div>
                    <div>
                      <label className="t-caption block mb-1">Preço (R$)</label>
                      <input
                        type="number"
                        step="0.01"
                        value={price}
                        onChange={(e) => setPrice(Number(e.target.value) || 0)}
                        className="field field-md tnum"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="t-caption block mb-1">Validade (dias)</label>
                    <input
                      type="number"
                      value={shelfLifeDays}
                      onChange={(e) => setShelfLifeDays(Number(e.target.value) || 1)}
                      className="field field-md tnum"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button type="button" onClick={() => setShowModal(false)} className="btn btn-secondary btn-md">Cancelar</button>
                    <button type="submit" className="btn btn-primary btn-md">Salvar</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        );
      };

      // ==========================================
      // ITEM DECREASE MODAL
      // ==========================================
      const ItemDecreaseModal = ({ item, onClose, onRecordSale, onRecordLoss, onRecordSellAll }) => {
        if (!item) return null;
        const [mode, setMode] = useState('venda');
        const [qty, setQty] = useState(1);
        const [reason, setReason] = useState('vencido');
        const [details, setDetails] = useState('');

        const handleConfirm = () => {
          if (qty <= 0) return;
          if (mode === 'venda') {
            onRecordSale(item.id, qty);
          } else {
            onRecordLoss(item.id, qty, reason, details);
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-[20px] max-w-md w-full p-6 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Baixa de produto</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1">{item.productName}</h3>
                  <p className="t-callout mt-1 tnum">
                    Estoque atual: <strong className="text-[#1d1d1f] font-bold">{item.currentQty} {item.unit}</strong>
                  </p>
                </div>
                <button onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2 my-5">
                <button
                  type="button"
                  onClick={() => setMode('venda')}
                  className={`btn btn-md ${mode === 'venda' ? 'bg-[#34c759] text-[#06300f]' : 'btn-secondary'}`}
                >
                  <Icons.ShoppingCart className="w-4 h-4" /> Venda
                </button>
                <button
                  type="button"
                  onClick={() => setMode('perda')}
                  className={`btn btn-md ${mode === 'perda' ? 'btn-danger' : 'btn-secondary'}`}
                >
                  <Icons.AlertTriangle className="w-4 h-4" /> Perda
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="t-caption block mb-1.5">Quantidade</label>
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setQty((q) => Math.max(1, q - 1))}
                      className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                    >
                      −
                    </button>
                    <input
                      type="number"
                      min="1"
                      max={item.currentQty}
                      value={qty}
                      onChange={(e) => setQty(Math.min(item.currentQty, Math.max(1, Number(e.target.value) || 1)))}
                      className="field field-md w-20 text-center text-[17px] font-extrabold tnum"
                    />
                    <button
                      onClick={() => setQty((q) => Math.min(item.currentQty, q + 1))}
                      className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                    >
                      +
                    </button>
                  </div>
                </div>

                {mode === 'perda' && (
                  <div className="space-y-3 p-4 bg-[#ff3b30]/[0.05] rounded-2xl">
                    <div>
                      <label className="t-caption block mb-1">Motivo</label>
                      <select value={reason} onChange={(e) => setReason(e.target.value)} className="field field-sm">
                        <option value="vencido">Produto vencido</option>
                        <option value="danificado">Avaria física</option>
                        <option value="qualidade">Alteração de sabor ou textura</option>
                        <option value="quebrado">Queda ou quebra</option>
                      </select>
                    </div>
                    <div>
                      <label className="t-caption block mb-1">Detalhes</label>
                      <input
                        type="text"
                        value={details}
                        onChange={(e) => setDetails(e.target.value)}
                        placeholder="Observações"
                        className="field field-sm"
                      />
                    </div>
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => { onRecordSellAll(item.id); onClose(); }}
                  className="btn btn-secondary w-full btn-md"
                >
                  <Icons.CheckCircle2 className="w-4 h-4 text-[#34c759]" />
                  <span className="tnum">Vendeu tudo ({item.currentQty})</span>
                </button>
              </div>

              <div className="flex justify-end gap-2 mt-6">
                <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                <button
                  type="button"
                  onClick={handleConfirm}
                  className={`btn btn-md ${mode === 'venda' ? 'bg-[#34c759] text-[#06300f] hover:bg-[#46d46b]' : 'btn-danger'}`}
                >
                  Confirmar {mode === 'venda' ? 'venda' : 'perda'}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // MAIN APP COMPONENT
      // ==========================================
      function App() {
        const [currentUnit, setCurrentUnit] = useState('matriz');
        const [activeTab, setActiveTab] = useState('vitrine');

        const [products, setProducts] = useState(() => loadLocal('products', INITIAL_PRODUCTS));
        const [slots] = useState(generateInitialSlots);
        const [slotItems, setSlotItems] = useState(() => loadLocal('slotItems', generateInitialSlotItems()));
        const [standardPlans, setStandardPlans] = useState(() => loadLocal('standardPlans', generateInitialStandardPlans()));
        const [selectedDay, setSelectedDay] = useState('segunda');

        const [lossRecords, setLossRecords] = useState(() => loadLocal('lossRecords', []));
        const [saleRecords, setSaleRecords] = useState(() => loadLocal('saleRecords', []));
        const [separatedProducts, setSeparatedProducts] = useState(() => loadLocal('separatedProducts', generateInitialSeparatedProducts()));

        const [decreaseModalItem, setDecreaseModalItem] = useState(null);

        useEffect(() => saveLocal('products', products), [products]);
        useEffect(() => saveLocal('slotItems', slotItems), [slotItems]);
        useEffect(() => saveLocal('standardPlans', standardPlans), [standardPlans]);
        useEffect(() => saveLocal('lossRecords', lossRecords), [lossRecords]);
        useEffect(() => saveLocal('saleRecords', saleRecords), [saleRecords]);
        useEffect(() => saveLocal('separatedProducts', separatedProducts), [separatedProducts]);

        const totalAlerts = useMemo(() => {
          return slotItems.filter((item) => {
            const slot = slots.find((s) => s.id === item.slotId);
            if (slot?.unit !== currentUnit) return false;
            const prod = products.find((p) => p.id === item.productId);
            const statusInfo = getSlotItemStatus(item, prod);
            return statusInfo.status !== 'normal';
          }).length;
        }, [slotItems, slots, products, currentUnit]);

        const handleIncrementQty = (itemId) => {
          setSlotItems((prev) => prev.map((item) => item.id === itemId ? { ...item, currentQty: item.currentQty + 1 } : item));
        };

        const handleUpdateItem = (updatedItem) => {
          setSlotItems((prev) => prev.map((i) => i.id === updatedItem.id ? updatedItem : i));
        };

        const handleRecordSale = (itemId, qty) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (!target) return;

          const newSale = {
            id: generateUniqueId('sale'),
            unit: currentUnit,
            productId: target.productId,
            productName: target.productName,
            qty,
            producedQty: target.producedQty || target.currentQty,
            unitOfMeasure: target.unit,
            timestamp: new Date().toISOString(),
            manufactureDate: target.manufactureDate,
            exposureDays: calculateDaysInShowcase(target.manufactureDate)
          };
          setSaleRecords((prev) => [newSale, ...prev]);

          if (target.currentQty - qty <= 0) {
            setSlotItems((prev) => prev.filter((i) => i.id !== itemId));
          } else {
            setSlotItems((prev) => prev.map((i) => i.id === itemId ? { ...i, currentQty: i.currentQty - qty } : i));
          }
        };

        const handleRecordLoss = (itemId, qty, reason, details) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (!target) return;

          const newLoss = {
            id: generateUniqueId('loss'),
            unit: currentUnit,
            productId: target.productId,
            productName: target.productName,
            qty,
            producedQty: target.producedQty || target.currentQty,
            unitOfMeasure: target.unit,
            manufactureDate: target.manufactureDate,
            lossDate: getTodayDateString(),
            reason,
            details,
            slotId: target.slotId
          };
          setLossRecords((prev) => [newLoss, ...prev]);

          if (target.currentQty - qty <= 0) {
            setSlotItems((prev) => prev.filter((i) => i.id !== itemId));
          } else {
            setSlotItems((prev) => prev.map((i) => i.id === itemId ? { ...i, currentQty: i.currentQty - qty } : i));
          }
        };

        const handleRecordSellAll = (itemId) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (target) handleRecordSale(itemId, target.currentQty);
        };

        const handleRemoveItem = (itemId) => {
          const target = slotItems.find((i) => i.id === itemId);
          if (target && window.confirm(`Remover "${target.productName}" da vitrine?`)) {
            setSlotItems((prev) => prev.filter((i) => i.id !== itemId));
          }
        };

        const handleQuickAllocate = (productName, qty, manufactureDate) => {
          let product = products.find(
            (p) => p.name.toLowerCase().trim() === productName.toLowerCase().trim()
          );

          if (!product) {
            product = {
              id: generateUniqueId('p'),
              name: productName,
              category: 'salgado',
              compatibleShowcases: ['salgada'],
              defaultUnit: 'un',
              minReplenishmentQty: 10,
              shelfLifeDays: 2,
              price: 8.0
            };
            setProducts((prev) => [...prev, product]);
          }

          const prodCategory = product.category || 'salgado';
          const showcaseType = prodCategory === 'salgado' ? 'salgada' : prodCategory === 'doce' ? 'doce' : 'sobremesa';
          const unitSlots = slots.filter((s) => s.unit === currentUnit && s.showcaseType === showcaseType);

          if (unitSlots.length === 0) {
            alert(`Nenhum espaço físico compatível na unidade ${currentUnit}.`);
            return;
          }

          let targetSlot = unitSlots.find((s) => !slotItems.some((i) => i.slotId === s.id));
          if (!targetSlot) {
            targetSlot = unitSlots[0];
          }

          const newItem = {
            id: generateUniqueId('item'),
            slotId: targetSlot.id,
            productId: product.id,
            productName: product.name,
            producedQty: qty,
            currentQty: qty,
            unit: product.defaultUnit || 'un',
            minQty: product.minReplenishmentQty || 5,
            manufactureDate: manufactureDate || getTodayDateString(),
            entryDate: getTodayDateString()
          };

          setSlotItems((prev) => [...prev, newItem]);
        };

        const handleUpdatePlanItem = (slotId, productId, idealQty) => {
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;

          setStandardPlans((prev) => {
            const existing = prev.find((sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay && sp.slotId === slotId);
            if (existing) {
              return prev.map((sp) => sp.id === existing.id ? { ...sp, productId, idealQty } : sp);
            }
            return [...prev, {
              id: generateUniqueId('sp'),
              unit: currentUnit,
              dayOfWeek: selectedDay,
              slotId,
              productId,
              idealQty,
              unitOfMeasure: prod.defaultUnit
            }];
          });
        };

        const handleRemovePlanItem = (planId) => {
          setStandardPlans((prev) => prev.filter((sp) => sp.id !== planId));
        };

        const handleCopyDayPlan = (fromDay, toDay) => {
          setStandardPlans((prev) => {
            const sourcePlans = prev.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === fromDay);
            const otherPlans = prev.filter((sp) => !(sp.unit === currentUnit && sp.dayOfWeek === toDay));
            const copied = sourcePlans.map((sp) => ({ ...sp, id: generateUniqueId('sp'), dayOfWeek: toDay }));
            return [...otherPlans, ...copied];
          });
        };

        const handleClearDayPlan = (day) => {
          setStandardPlans((prev) => prev.filter((sp) => !(sp.unit === currentUnit && sp.dayOfWeek === day)));
        };

        const handleApplyProductionToShowcase = (itemsToProduce) => {
          const today = getTodayDateString();
          itemsToProduce.forEach((item) => {
            const product = products.find((p) => p.id === item.productId);
            const newItem = {
              id: generateUniqueId('item'),
              slotId: item.slotId,
              productId: item.productId,
              productName: item.productName,
              producedQty: item.qty,
              currentQty: item.qty,
              unit: product?.defaultUnit || 'un',
              minQty: product?.minReplenishmentQty || 5,
              manufactureDate: today,
              entryDate: today
            };
            setSlotItems((prev) => [...prev, newItem]);
          });
          setActiveTab('vitrine');
        };

        const handleUpdateSeparatedQty = (id, delta) => {
          setSeparatedProducts((prev) =>
            prev.map((i) => i.id === id ? { ...i, currentQty: Math.max(0, i.currentQty + delta) } : i)
          );
        };

        const handleAddSeparatedProduct = (prod) => {
          const newItem = { ...prod, id: generateUniqueId('sep') };
          setSeparatedProducts((prev) => [...prev, newItem]);
        };

        return (
          <div className="min-h-screen flex flex-col font-sans">
            <Navbar
              currentUnit={currentUnit}
              onUnitChange={setCurrentUnit}
              activeTab={activeTab}
              onTabChange={setActiveTab}
              totalAlerts={totalAlerts}
            />

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-7 sm:py-9">
              {activeTab === 'vitrine' && (
                <div className="space-y-5">
                  <div className="flex flex-wrap items-end justify-between gap-3">
                    <div>
                      <div className="t-overline mb-2">
                        {currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'}
                      </div>
                      <h2 className="t-display">Vitrine operacional</h2>
                    </div>
                    {totalAlerts > 0 && (
                      <span className="pill bg-[#ff9f0a]/12 text-[#8a5200] h-7 px-3 tnum">
                        <Icons.AlertTriangle className="w-3.5 h-3.5" />
                        {totalAlerts} {totalAlerts === 1 ? 'item precisa de atenção' : 'itens precisam de atenção'}
                      </span>
                    )}
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                  <div className="lg:col-span-7 xl:col-span-8">
                    <ShowcaseGrid
                      currentUnit={currentUnit}
                      slots={slots}
                      slotItems={slotItems}
                      products={products}
                      onIncrementQty={handleIncrementQty}
                      onOpenDecreaseModal={setDecreaseModalItem}
                    />
                  </div>
                  <div className="lg:col-span-5 xl:col-span-4 lg:sticky lg:top-[76px]">
                    <SupportList
                      currentUnit={currentUnit}
                      slotItems={slotItems}
                      products={products}
                      slots={slots}
                      onUpdateItem={handleUpdateItem}
                      onQuickAllocate={handleQuickAllocate}
                      onRecordSellAll={handleRecordSellAll}
                      onOpenDecreaseModal={setDecreaseModalItem}
                      onRemoveItem={handleRemoveItem}
                    />
                  </div>
                  </div>
                </div>
              )}

              {activeTab === 'padrao' && (
                <StandardShowcaseView
                  currentUnit={currentUnit}
                  slots={slots}
                  products={products}
                  standardPlans={standardPlans}
                  selectedDay={selectedDay}
                  onSelectDay={setSelectedDay}
                  onUpdatePlanItem={handleUpdatePlanItem}
                  onRemovePlanItem={handleRemovePlanItem}
                  onCopyDayPlan={handleCopyDayPlan}
                  onClearDayPlan={handleClearDayPlan}
                  onGenerateProductionOrder={() => setActiveTab('producao')}
                />
              )}

              {activeTab === 'producao' && (
                <ProductionOrderView
                  currentUnit={currentUnit}
                  slots={slots}
                  slotItems={slotItems}
                  products={products}
                  standardPlans={standardPlans}
                  selectedDay={selectedDay}
                  onApplyProductionToShowcase={handleApplyProductionToShowcase}
                />
              )}

              {activeTab === 'perdas' && (
                <LossesReportView
                  currentUnit={currentUnit}
                  lossRecords={lossRecords}
                />
              )}

              {activeTab === 'historico' && (
                <HistoryView
                  currentUnit={currentUnit}
                  saleRecords={saleRecords}
                  lossRecords={lossRecords}
                />
              )}

              {activeTab === 'fora' && (
                <SeparatedProductsView
                  currentUnit={currentUnit}
                  separatedProducts={separatedProducts}
                  onUpdateQty={handleUpdateSeparatedQty}
                  onAddSeparatedProduct={handleAddSeparatedProduct}
                />
              )}

              {activeTab === 'produtos' && (
                <ProductCatalogView
                  products={products}
                  onAddProduct={(p) => setProducts((prev) => [...prev, p])}
                  onDeleteProduct={(id) => setProducts((prev) => prev.filter((p) => p.id !== id))}
                />
              )}
            </main>

            <ItemDecreaseModal
              item={decreaseModalItem}
              onClose={() => setDecreaseModalItem(null)}
              onRecordSale={handleRecordSale}
              onRecordLoss={handleRecordLoss}
              onRecordSellAll={handleRecordSellAll}
            />

            <footer className="mt-auto border-t hairline">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-2">
                <div className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 bg-[#34c759] rounded-full" />
                  <span className="t-caption">Sistema operante · Delícias da Vovó</span>
                </div>
                <div className="t-caption">
                  Unidade <strong className="text-[#1d1d1f] font-bold">{currentUnit === 'matriz' ? 'Matriz' : 'Vila Nova'}</strong>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
