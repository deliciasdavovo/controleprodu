          definirQtd(row.key, row.orderQty > 0 ? 0 : (row.idealQty > 0 ? row.idealQty : 1));

        const voltarAoSugerido = () => setQuantidades({});
        const preencherTudo = () => {
          const novo = {};
          orderList.forEach((item) => { novo[item.key] = item.idealQty; });
          setQuantidades(novo);
        };
        const zerarTudo = () => {
          const novo = {};
          orderList.forEach((item) => { novo[item.key] = 0; });
          setQuantidades(novo);
        };

        const visiveis = useMemo(() => {
          let lista = rows;
          if (mostrar === 'pedido') lista = lista.filter((r) => r.noPedido);
          else if (mostrar === 'fora') lista = lista.filter((r) => !r.noPedido);

          // O item de todo dia é a rotina da cozinha; o de alguns dias é o
          // que muda de acordo com o movimento. Ver um sem o outro ajuda a
          // enxergar o que é fixo na semana.
          if (frequencia === 'todo-dia') lista = lista.filter((r) => r.todoDia);
          else if (frequencia === 'alguns') lista = lista.filter((r) => !r.todoDia);

          return lista;
        }, [rows, mostrar, frequencia]);

        // Os blocos da planilha. Por vitrine, é a vitrine do dia em lista:
        // os móveis na ordem da loja e, dentro deles, os espaços em ordem.
        // Por responsável, é a ordem de quem produz — o que não pode faltar
        // primeiro. "Nenhum" deixa a planilha corrida, em ordem alfabética.
        const blocos = useMemo(() => {
          const porOrdemDaVitrine = (a, b) =>
            compareShowcase(a.showcaseSort, b.showcaseSort) ||
            (a.targets[0]?.slotNumber || 0) - (b.targets[0]?.slotNumber || 0) ||
            a.productName.localeCompare(b.productName, 'pt-BR');

          const porOrdemDaProducao = (a, b) =>
            priorityRank(a.priority) - priorityRank(b.priority) ||
            a.productName.localeCompare(b.productName, 'pt-BR');

          if (agrupar === 'nenhum') {
            return [{
              key: '__tudo__',
              title: '',
              entries: [...visiveis].sort((a, b) => a.productName.localeCompare(b.productName, 'pt-BR'))
            }];
          }

          const lista = [];
          const porChave = {};

          [...visiveis]
            .sort(agrupar === 'vitrine' ? porOrdemDaVitrine : porOrdemDaProducao)
            .forEach((row) => {
              const chave = agrupar === 'vitrine' ? row.showcaseTitle : row.responsible;
              if (!porChave[chave]) {
                porChave[chave] = { key: chave, title: chave, entries: [] };
                lista.push(porChave[chave]);
              }
              porChave[chave].entries.push(row);
            });

          if (agrupar === 'responsavel') {
            lista.sort((a, b) => {
              if (a.title === NO_RESPONSIBLE_LABEL) return 1;
              if (b.title === NO_RESPONSIBLE_LABEL) return -1;
              return a.title.localeCompare(b.title, 'pt-BR');
            });
          }

          return lista;
        }, [visiveis, agrupar]);

        // A ordem em que as células da coluna Produzir aparecem na tela — é
        // por ela que ↑ ↓ e Enter andam
        const ordemNaTela = useMemo(() => blocos.flatMap((b) => b.entries), [blocos]);

        const irPara = (indice) => {
          const alvo = celulas.current[indice];
          if (alvo) { alvo.focus(); alvo.select(); }
        };

        const noPedido = rows.filter((r) => r.noPedido);
        const totalUn = noPedido.reduce((acc, r) => acc + r.orderQty, 0);
        const chamados = rows.filter((r) => r.suggested).length;
        const mexido = Object.keys(quantidades).length > 0;

        const somaDe = (entries, campo) => entries.reduce((acc, r) => acc + (r[campo] || 0), 0);

        // ------------------------------------------
        // Sai em texto, do jeito que vai para o WhatsApp ou para o papel:
        // o nome de quem produz em cima e, embaixo, quantidade e item. Sem
        // espaço, sem vitrine, sem prioridade — esse detalhe está na planilha.
        // É o mesmo texto no "Copiar pedido" e no "Copiar lista" de cada
        // bloco; muda só quais itens entram.
        // ------------------------------------------
        const textoPorResponsavel = (itens) => {
          const porResponsavel = new Map();
          itens.forEach((item) => {
            if (!porResponsavel.has(item.responsible)) porResponsavel.set(item.responsible, []);
            porResponsavel.get(item.responsible).push(item);
          });

          // Quem está sem responsável cadastrado fica por último
          const nomes = [...porResponsavel.keys()].sort((a, b) => {
            if (a === NO_RESPONSIBLE_LABEL) return 1;
            if (b === NO_RESPONSIBLE_LABEL) return -1;
            return a.localeCompare(b, 'pt-BR');
          });

          return nomes
            .map((nome) => {
              const linhas = porResponsavel.get(nome)
                .slice()
                .sort((a, b) => a.productName.localeCompare(b.productName, 'pt-BR'))
                .map((p) => `${p.orderQty} ${p.unitOfMeasure} — ${p.productName}`);
              return [nome.toUpperCase(), ...linhas].join('\n');
            })
            .join('\n\n');
        };

        const copiarTexto = async (chave, texto) => {
          const ok = await copyTextToClipboard(texto);
          if (!ok) {
            alert('Não consegui copiar sozinho. Selecione o texto da planilha e copie na mão.');
            return;
          }
          setCopiado(chave);
          setTimeout(() => setCopiado((atual) => (atual === chave ? '' : atual)), 2000);
        };

        // O pedido inteiro, separado por quem produz
        const copiarTudo = () => {
          if (noPedido.length === 0) return;
          copiarTexto('__tudo__', textoPorResponsavel(noPedido));
        };

        // A lista de um bloco só — a vitrine, ou a pessoa — no mesmo formato:
        // responsável em cima, quantidade e item embaixo
        const copiarBloco = (bloco) => {
          const itens = bloco.entries.filter((item) => item.noPedido);
          if (itens.length === 0) return;
          copiarTexto(bloco.key, textoPorResponsavel(itens));
        };

        // A planilha inteira separada por tabulação: cola direto no Excel ou
        // no Google Planilhas, do mesmo jeito que a tabela da semana
        const copiarPlanilha = () => {
          const cabecalho = [
            'Produto', 'Prioridade', 'Frequência', 'Dias', 'Vitrine', 'Espaços', 'Padrão', 'Na loja',
            'Vencido', 'Falta', 'Mínimo', 'Produzir', 'Unidade', 'Responsável', 'Situação'
          ];

          const linhas = ordemNaTela.map((r) => [
            r.productName, r.priority, r.freqLabel, r.freqTitle, r.showcaseTitle, r.espacosLabel,
            r.idealQty, r.currentQty, r.expiredQty, r.neededQty, r.minQty, r.orderQty,
            r.unitOfMeasure, r.responsible, r.situacao
          ].join('\t'));

          const total = ['Total', '', '', '', '', '',
            somaDe(ordemNaTela, 'idealQty'), somaDe(ordemNaTela, 'currentQty'),
            somaDe(ordemNaTela, 'expiredQty'), somaDe(ordemNaTela, 'neededQty'), '',
            somaDe(ordemNaTela, 'orderQty'), '', '', ''
          ].join('\t');

          copiarTexto('__planilha__', [cabecalho.join('\t'), ...linhas, total].join('\n'));
        };

        const handleApplyAll = () => {
          if (noPedido.length === 0) return;
          // A quantidade digitada é repartida entre os espaços do padrão, na
          // proporção que ele manda
          const payload = noPedido.flatMap((item) =>
            spreadOrderQty(item.orderQty, item.targets).map((alvo) => ({
              slotId: alvo.slotId,
              productId: item.productId,
              qty: alvo.qty,
              productName: item.productName
            }))
          );
          if (payload.length === 0) return;
          onApplyProductionToShowcase(payload);
          alert('Produção lançada na vitrine com sucesso!');
        };

        // Uma linha da planilha. O índice é a posição dela na coluna
        // Produzir, para as setas saberem para onde ir.
        const renderLinha = (row, indice) => (
          <tr key={row.key} data-fora={!row.noPedido}>
            <td data-sticky="true" style={{ left: 0 }} className="px-1.5 text-center">
              <button
                type="button"
                onClick={() => alternar(row)}
                title={row.noPedido
                  ? `Tirar ${row.productName} do pedido`
                  : `Colocar ${row.productName} no pedido — ${row.idealQty} ${row.unitOfMeasure}`}
                data-on={row.noPedido}
                className="sheet-check"
              >
                {row.noPedido && <Icons.Check className="w-3 h-3" />}
              </button>
            </td>

            <td
              data-sticky="true"
              style={{ left: '34px' }}
              className="max-w-[150px] sm:max-w-[230px] overflow-hidden text-ellipsis font-semibold text-[#1d1d1f]"
              title={`${row.productName} · ${row.localLabel}`}
            >
              {row.productName}
            </td>

            <td className="text-center text-[#6e6e73] font-bold" title={getPriority(row.priority).hint}>
              {row.priority}
            </td>
            {/* Em quantos dias da semana o item entra no padrão: o de todo
                dia fica escrito em preto, o resto em cinza */}
            <td
              className={`overflow-hidden text-ellipsis ${
                row.todoDia ? 'text-[#1d1d1f] font-semibold' : 'text-[#86868b]'
              }`}
              title={`${row.productName} entra em: ${row.freqTitle}`}
            >
              {row.freqLabel}
            </td>
            <td className="text-[#6e6e73] overflow-hidden text-ellipsis" title={row.localLabel}>
              {agrupar === 'vitrine' ? row.espacosLabel : row.localLabel}
            </td>

            <td className="num">{row.idealQty}</td>
            <td className="num" title={`${row.currentQty} ${row.unitOfMeasure} bons na loja, em qualquer vitrine`}>
              {row.currentQty}
            </td>
            <td className={`num ${row.expiredQty > 0 ? 'ink-expired font-bold' : 'ink-muted'}`}
                title={row.expiredQty > 0 ? `${row.expiredQty} vencido(s) para repor` : 'Nada vencido'}>
              {row.expiredQty || '—'}
            </td>
            <td className="num">{row.neededQty || '—'}</td>
            <td
              className={`num ${row.belowMin ? 'text-[#0E0937] font-bold' : 'text-[#86868b]'}`}
              title={
                row.minQty > 0
                  ? `Mínimo de ${row.productName} em ${getDayNameBR(selectedDay).toLowerCase()}: ${row.minQty} ${row.unitOfMeasure}`
                    + ` — na loja tem ${row.currentQty}.`
                    + ` ${row.belowMin ? 'Está no mínimo, por isso é chamado.' : 'Acima do mínimo.'}`
                    + ' Para mudar, digite na tabela da semana, na aba Vitrine padrão.'
                  : 'Sem mínimo neste dia — o item só é chamado quando acaba.'
                    + ' Para dar um mínimo, digite na tabela da semana, na aba Vitrine padrão.'
              }
            >
              {row.minQty || '—'}
            </td>

            <td data-fim="true" className="p-0">
              <OrderQtyCell
                value={row.orderQty}
                cellRef={(el) => { celulas.current[indice] = el; }}
                onMove={(passo) => irPara(indice + passo)}
                onCommit={(nova) => definirQtd(row.key, nova)}
                title={`Quanto produzir de ${row.productName} — o padrão do dia pede ${row.idealQty} ${row.unitOfMeasure}. 0 tira do pedido.`}
              />
            </td>
            <td className="text-[#86868b]">{row.unitOfMeasure}</td>
            <td className="text-[#6e6e73] max-w-[130px] overflow-hidden text-ellipsis" title={row.responsible}>
              {row.responsible}
            </td>

            <td className="text-[11px]">
              <span className={
                row.situacao === 'Chamado' ? 'text-[#0E0937] font-semibold'
                  : row.situacao === 'Escolhido' ? 'text-[#1d1d1f] font-semibold'
                    : 'text-[#86868b]'
              }>
                {row.situacao}
              </span>
              {row.lastDayQty > 0 && (
                <span className="ink-last ml-1.5 tnum">· {row.lastDayQty} no último dia</span>
              )}
              {row.foraDoPlano > 0 && (
                <span className="text-[#86868b] ml-1.5 tnum">· {row.foraDoPlano} em outro espaço</span>
              )}
            </td>
          </tr>
        );

        let indice = -1;

        return (
          <div className="space-y-3">
            {/* Barra do pedido: dia, leitura e os botões. Sem cartão grande —
                a tela é a planilha, o resto é moldura */}
            <div className="card-flat px-4 py-3 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="min-w-0">
                <h2 className="t-title text-[#1d1d1f]">Pedido de produção</h2>
                <p className="t-caption mt-0.5">
                  {unitName} · {rows.length} {rows.length === 1 ? 'produto' : 'produtos'} no padrão de{' '}
                  {getDayNameBR(selectedDay).toLowerCase()} · {chamados} chamado(s) pela conta ·
                  digite na coluna <strong className="text-[#1d1d1f] font-semibold">Produzir</strong>;
                  0 tira do pedido
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2 shrink-0">
                <select
                  value={selectedDay}
                  onChange={(e) => onSelectDay(e.target.value)}
                  title="O dia que o pedido monta — abre no dia seguinte ao de hoje"
                  className="field field-sm field-select field-auto"
                >
                  {WEEK_DAYS.map((day) => (
                    <option key={day} value={day}>
                      {getDayNameBR(day)}
                      {day === hoje ? ' (hoje)' : day === amanha ? ' (amanhã)' : ''}
                    </option>
                  ))}
                </select>

                <button
                  onClick={copiarPlanilha}
                  disabled={rows.length === 0}
                  title="A planilha inteira separada por tabulação — cola direto no Excel"
                  className="btn btn-secondary btn-sm disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Copy className="w-3.5 h-3.5" />
                  {copiado === '__planilha__' ? 'Copiado!' : 'Copiar planilha'}
                </button>
                <button
                  onClick={copiarTudo}
                  disabled={noPedido.length === 0}
                  title="Responsável, quantidade e item — para mandar no WhatsApp"
                  className="btn btn-secondary btn-sm disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Copy className="w-3.5 h-3.5" />
                  {copiado === '__tudo__' ? 'Copiado!' : 'Copiar pedido'}
                </button>
                <button
                  onClick={handleApplyAll}
                  disabled={noPedido.length === 0}
                  className="btn btn-primary btn-sm disabled:opacity-40 disabled:pointer-events-none"
                >
                  <Icons.Plus className="w-3.5 h-3.5" />
                  Lançar na vitrine
                  {totalUn > 0 && <span className="tnum opacity-80">{totalUn} un</span>}
                </button>
              </div>
            </div>

            {/* Os controles da planilha: como ler e o que mostrar */}
            <div className="card-flat px-4 py-2.5 flex flex-wrap items-center gap-x-4 gap-y-2">
              <label className="flex items-center gap-2">
                <span className="t-caption">Agrupar</span>
                <select
                  value={agrupar}
                  onChange={(e) => setAgrupar(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  <option value="vitrine">Por vitrine (a vitrine do dia)</option>
                  <option value="responsavel">Por responsável (quem produz)</option>
                  <option value="nenhum">Sem grupo (A-Z)</option>
                </select>
              </label>

              <label className="flex items-center gap-2">
                <span className="t-caption">Mostrar</span>
                <select
                  value={mostrar}
                  onChange={(e) => setMostrar(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  <option value="tudo">Todo o padrão do dia</option>
                  <option value="pedido">Só o que vai ser produzido</option>
                  <option value="fora">Só o que ficou de fora</option>
                </select>
              </label>

              <label className="flex items-center gap-2">
                <span className="t-caption">Frequência</span>
                <select
                  value={frequencia}
                  onChange={(e) => setFrequencia(e.target.value)}
                  title="Em quantos dias da semana o item entra no padrão"
                  className="field field-sm field-select field-auto"
                >
                  <option value="todas">Toda frequência</option>
                  <option value="todo-dia">Só os de todo dia</option>
                  <option value="alguns">Só os de alguns dias</option>
                </select>
              </label>

              <div className="flex flex-wrap items-center gap-2 ml-auto">
                <span className="t-caption tnum">
                  {noPedido.length} no pedido · {totalUn} un
                </span>
                <button onClick={preencherTudo} className="btn btn-secondary btn-sm" title="Colocar a quantidade do padrão em todas as linhas">
                  Preencher com o padrão
                </button>
                <button onClick={zerarTudo} className="btn btn-secondary btn-sm" title="Zerar a coluna Produzir">
                  Zerar
                </button>
                {mexido && (
                  <button onClick={voltarAoSugerido} className="btn btn-secondary btn-sm" title="Desfazer o que foi digitado e voltar ao que a conta sugere">
                    Voltar ao sugerido
                  </button>
                )}
              </div>
            </div>

            {rows.length === 0 ? (
              <div className="card-flat text-center py-14 px-4 space-y-2">
                <h4 className="t-title text-[#1d1d1f]">Sem padrão para {getDayNameBR(selectedDay)}</h4>
                <p className="t-callout">
                  Monte a vitrine deste dia na aba Vitrine padrão para o pedido ter o que calcular
                </p>
              </div>
            ) : visiveis.length === 0 ? (
              <div className="card-flat text-center py-12 px-4">
                <p className="t-callout">
                  {mostrar === 'pedido'
                    ? 'Nada marcado para produzir — digite a quantidade na coluna Produzir'
                    : 'Todo o padrão do dia está no pedido'}
                </p>
              </div>
            ) : (
              // Uma planilha por bloco: cada vitrine (ou cada responsável) tem
              // a sua, com o nome do móvel em cima, o subtotal no rodapé dela e
              // o "Copiar lista" ao lado do título. Antes era tudo uma tabela
              // só, com uma linha cinza separando — e a vitrine se perdia no
              // meio das linhas.
              <div className="space-y-4">
                {blocos.map((bloco) => {
                  const base = indice + 1;
                  indice += bloco.entries.length;
                  const temPedido = bloco.entries.some((i) => i.noPedido);

                  return (
                    <div key={bloco.key} className="card-flat overflow-hidden">
                      {bloco.title && (
                        <div className="px-4 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b hairline bg-[var(--bg-elevated)]">
                          <div className="min-w-0">
                            <h3 className="t-headline text-[#1d1d1f] truncate" title={bloco.title}>
                              {bloco.title}
                            </h3>
                            <p className="t-caption tnum mt-0.5">
                              {bloco.entries.length} {bloco.entries.length === 1 ? 'item' : 'itens'} ·
                              {' '}{somaDe(bloco.entries, 'idealQty')} un no padrão ·
                              {' '}{somaDe(bloco.entries, 'currentQty')} na loja ·
                              {' '}<strong className="text-[#0E0937] font-bold">
                                {somaDe(bloco.entries, 'orderQty')} un a produzir
                              </strong>
                            </p>
                          </div>
                          {temPedido && (
                            <button
                              onClick={() => copiarBloco(bloco)}
                              className="btn btn-secondary btn-sm shrink-0 self-start sm:self-auto"
                              title={`Copiar a lista de ${bloco.title} — responsável e itens`}
                            >
                              <Icons.Copy className="w-3.5 h-3.5" />
                              {copiado === bloco.key ? 'Copiado!' : 'Copiar lista'}
                            </button>
                          )}
                        </div>
                      )}

                      <div className="rola-x">
                        <table className="sheet">
                          <SheetCols />
                          <thead>
                            <tr>
                              <th data-sticky="true" style={{ left: 0 }} className="w-[34px]" title="Entra no pedido">✓</th>
                              <th data-sticky="true" style={{ left: '34px' }}>Produto</th>
                              <th className="text-center" title="A–D: a importância do item, para ordenar e filtrar a lista">P</th>
                              <th title="Em quantos dias da semana o item entra no padrão">Freq.</th>
                              <th>{agrupar === 'vitrine' ? 'Espaços' : 'Vitrine'}</th>
                              <th className="num" title="Quantidade que o padrão do dia manda ter">Padrão</th>
                              <th className="num" title="Estoque bom, em qualquer vitrine da loja">Na loja</th>
                              <th className="num" title="Peças vencidas, que vão sair da vitrine">Venc.</th>
                              <th className="num" title="Padrão menos o que está na loja">Falta</th>
                              <th className="num" title="Quantidade mínima do item neste dia — o item é chamado quando o estoque bom chega nela. Digite na tabela da semana, na aba Vitrine padrão">Mín.</th>
                              <th data-fim="true" className="num" style={{ width: '88px' }} title="Digite aqui — 0 tira do pedido">Produzir</th>
                              <th>Un</th>
                              <th>Responsável</th>
                              {/* A última coluna estica: é ela que come a sobra
                                  da largura, e não a célula que se digita */}
                              <th style={{ width: '99%' }}>Situação</th>
                            </tr>
                          </thead>

                          <tbody>
                            {bloco.entries.map((row, i) => renderLinha(row, base + i))}
                          </tbody>

                          <tfoot>
                            <tr>
                              <td data-sticky="true" style={{ left: 0 }} />
                              <td data-sticky="true" style={{ left: '34px' }}>
                                {bloco.title ? 'Total do móvel' : 'Total'}
                              </td>
                              <td colSpan={3} className="t-micro">
                                {bloco.entries.length} {bloco.entries.length === 1 ? 'linha' : 'linhas'}
                              </td>
                              <td className="num">{somaDe(bloco.entries, 'idealQty')}</td>
                              <td className="num">{somaDe(bloco.entries, 'currentQty')}</td>
                              <td className="num">{somaDe(bloco.entries, 'expiredQty') || '—'}</td>
                              <td className="num">{somaDe(bloco.entries, 'neededQty') || '—'}</td>
                              <td />
                              <td data-fim="true" className="num text-[#0E0937]">{somaDe(bloco.entries, 'orderQty')}</td>
                              <td colSpan={3} className="t-micro">
                                {bloco.entries.filter((i) => i.noPedido).length} item(ns) no pedido
                              </td>
                            </tr>
                          </tfoot>
                        </table>
                      </div>
                    </div>
                  );
                })}

                {/* O fecho do dia, somando todos os blocos */}
                <div className="card-flat px-4 py-3 flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
                  <span className="t-headline text-[#1d1d1f]">Total do dia</span>
                  <span className="t-callout tnum">
                    {visiveis.length} {visiveis.length === 1 ? 'linha' : 'linhas'} ·
                    {' '}{somaDe(visiveis, 'idealQty')} un no padrão ·
                    {' '}{somaDe(visiveis, 'currentQty')} na loja ·
                    {' '}{somaDe(visiveis, 'neededQty')} de falta
                  </span>
                  <span className="t-headline tnum text-[#0E0937]">
                    {somaDe(visiveis, 'orderQty')} un a produzir
                    <span className="t-caption ml-1.5">em {noPedido.length} item(ns)</span>
                  </span>
                </div>
              </div>
            )}

            <p className="t-caption px-1">
              A conta chama o item quando o estoque bom da loja fica igual ou abaixo da
              <strong className="text-[#1d1d1f] font-semibold"> quantidade mínima
              de {getDayNameBR(selectedDay).toLowerCase()}</strong> — a que está digitada na tabela da
              semana, na aba Vitrine padrão — ou quando tem peça vencida para repor; o vencido não conta
              como estoque e mínimo zero é "só quando acabar". A quantidade sugerida é a do padrão do
              dia — a fornada inteira, nunca "mais 1" para completar bandeja. A letra A–D não entra na
              conta: ela só organiza as listas. Quando o produto ocupa mais de um espaço, a quantidade
              digitada é repartida entre eles na proporção do padrão. No teclado: ↑ ↓ andam pela coluna,
              Enter desce, Tab vai para a próxima célula.
            </p>
          </div>
        );
      };

      // ==========================================
      // LOSSES REPORT VIEW
      // ==========================================
      const LossesReportView = ({ currentUnit, unitName, lossRecords, onDeleteLoss }) => {
        const [filterText, setFilterText] = useState('');
        const [selectedReason, setSelectedReason] = useState('todos');
        const [selectedResponsible, setSelectedResponsible] = useState('todos');

        const unitLosses = lossRecords.filter((l) => l.unit === currentUnit);

        const lossResponsibles = Array.from(
          new Set(unitLosses.map((l) => cleanResponsible(l.responsible)).filter(Boolean))
        ).sort((a, b) => a.localeCompare(b, 'pt-BR'));

        // Se o responsável escolhido não aparece mais nos registros, volta para "todos"
        const activeResponsible = lossResponsibles.includes(selectedResponsible) ? selectedResponsible : 'todos';

        const filteredLosses = unitLosses.filter((l) => {
          const matchesText = l.productName.toLowerCase().includes(filterText.toLowerCase());
          const matchesReason = selectedReason === 'todos' || l.reason === selectedReason;
          const matchesResponsible =
            activeResponsible === 'todos' || cleanResponsible(l.responsible) === activeResponsible;
          return matchesText && matchesReason && matchesResponsible;
        });

        const totalLossQty = unitLosses.reduce((acc, l) => acc + l.qty, 0);

        // A leitura da semana. Um total sozinho não diz se a coisa está
        // melhorando ou piorando: o que responde isso é a semana contra a
        // anterior e o desenho dos sete dias. E perda que já aconteceu só vira
        // decisão quando se sabe por que ela aconteceu e em qual produto — daí
        // o motivo que mais pesa e o produto que mais perde virem do lado.
        const semana = useMemo(() => {
          const dias = lastDayKeys(7);
          const anteriores = lastDayKeys(14).slice(0, 7);

          const noDia = (chave) => unitLosses.filter((l) => toDayKey(l.lossDate) === chave);
          const somar = (registros) => registros.reduce((soma, l) => soma + l.qty, 0);

          const serie = dias.map((d) => somar(noDia(d)));
          const total = serie.reduce((soma, v) => soma + v, 0);
          const antes = somar(unitLosses.filter((l) => anteriores.includes(toDayKey(l.lossDate))));
          const daSemana = unitLosses.filter((l) => dias.includes(toDayKey(l.lossDate)));

          // O que mais pesa dentro da semana: motivo e produto campeões
          const maior = (registros, chave) => {
            const soma = {};
            registros.forEach((l) => {
              const k = chave(l);
              if (!soma[k]) soma[k] = { chave: k, qty: 0, lancamentos: 0 };
              soma[k].qty += l.qty;
              soma[k].lancamentos += 1;
            });
            return Object.values(soma).sort((x, y) => y.qty - x.qty)[0] || null;
          };

          return {
            serie,
            total,
            hoje: serie[serie.length - 1] || 0,
            media: Math.round((total / 7) * 10) / 10,
            variacao: antes > 0 ? Math.round(((total - antes) / antes) * 100) : null,
            antes,
            motivo: maior(daSemana, (l) => l.reason || 'sem motivo'),
            produto: maior(daSemana, (l) => l.productName)
          };
        }, [unitLosses]);

        return (
          <div className="space-y-5">
            <div>
              <h2 className="t-display">Relatório de perdas</h2>
              <p className="t-body mt-1 tnum">
                {unitName} · {totalLossQty} un em {unitLosses.length} {unitLosses.length === 1 ? 'lançamento' : 'lançamentos'}
              </p>
            </div>

            {/* A semana em três leituras: quanto se perdeu e para onde isso
                está indo, por que se perdeu e em que produto. Cada cartão traz
                o número grande em cima e o que ele significa embaixo. */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="card p-5 flex flex-col">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Perdas · 7 dias
                </span>
                <div className="mt-2 t-metric-lg">
                  {semana.total}
                  <span className="t-metric-unit">un</span>
                </div>
                <p className="t-callout mt-1.5 font-semibold">
                  {semana.variacao === null ? (
                    <span className="text-[#86868b]">sem semana anterior para comparar</span>
                  ) : (
                    <>
                      <Delta percent={semana.variacao} />
                      <span className="text-[#86868b] font-medium"> vs. os 7 dias anteriores ({semana.antes} un)</span>
                    </>
                  )}
                </p>
                {/* O caminho até o número de hoje, dia a dia */}
                <div className="mt-3 ink-expired">
                  <Sparkline
                    values={semana.serie}
                    title={`Perdas dos últimos 7 dias: ${semana.serie.join(', ')} un`}
                  />
                </div>
                <p className="t-caption mt-2 tnum">
                  hoje {semana.hoje} un · média de {semana.media} un por dia
                </p>
              </div>

              <div className="card p-5 flex flex-col">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Discard className="w-3.5 h-3.5" />
                  Motivo que mais pesa
                </span>
                {semana.motivo ? (
                  <>
                    <div className="mt-2 t-title text-[#1d1d1f] capitalize">{semana.motivo.chave}</div>
                    <p className="t-callout mt-1.5 tnum font-semibold text-[#6e6e73]">
                      {semana.motivo.qty} un · {Math.round((semana.motivo.qty / (semana.total || 1)) * 100)}% das perdas da semana
                    </p>
                    <p className="t-caption mt-auto pt-3 tnum">
                      {semana.motivo.lancamentos} {semana.motivo.lancamentos === 1 ? 'lançamento' : 'lançamentos'} nos últimos 7 dias
                    </p>
                  </>
                ) : (
                  <>
                    <div className="mt-2 t-title text-[#1d1d1f]">Nenhuma perda</div>
                    <p className="t-caption mt-1.5">Nada foi lançado nos últimos 7 dias</p>
                  </>
                )}
              </div>

              <div className="card p-5 flex flex-col">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Package className="w-3.5 h-3.5" />
                  Produto que mais perde
                </span>
                {semana.produto ? (
                  <>
                    <div className="mt-2 t-title text-[#1d1d1f]">{semana.produto.chave}</div>
                    <p className="t-callout mt-1.5 tnum font-semibold text-[#6e6e73]">
                      {semana.produto.qty} un · {Math.round((semana.produto.qty / (semana.total || 1)) * 100)}% das perdas da semana
                    </p>
                    <button
                      onClick={() => setFilterText(semana.produto.chave)}
                      className="btn btn-secondary btn-sm mt-auto self-start"
                    >
                      <Icons.Search className="w-3.5 h-3.5" />
                      Ver os lançamentos
                    </button>
                  </>
                ) : (
                  <>
                    <div className="mt-2 t-title text-[#1d1d1f]">Nenhum</div>
                    <p className="t-caption mt-1.5">Nada foi lançado nos últimos 7 dias</p>
                  </>
                )}
              </div>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b hairline">
                <h3 className="t-headline text-[#1d1d1f]">Registro detalhado</h3>
                {/* No celular os três filtros em uma linha só não cabiam, e
                    como o select cresce com a opção mais longa eles esticavam
                    a página inteira. Agora a linha quebra: a busca ocupa a
                    largura toda e os dois seletores dividem a linha de baixo */}
                <div className="grid grid-cols-2 gap-2 sm:flex sm:items-center">
                  <input
                    type="text"
                    placeholder="Buscar produto…"
                    value={filterText}
                    onChange={(e) => setFilterText(e.target.value)}
                    className="field field-sm field-auto col-span-2 sm:col-auto"
                  />
                  {lossResponsibles.length > 0 && (
                    <select
                      value={activeResponsible}
                      onChange={(e) => setSelectedResponsible(e.target.value)}
                      className="field field-sm field-select field-auto min-w-0"
                    >
                      <option value="todos">Todos os responsáveis</option>
                      {lossResponsibles.map((r) => (
                        <option key={r} value={r}>{r}</option>
                      ))}
                    </select>
                  )}
                  <select
                    value={selectedReason}
                    onChange={(e) => setSelectedReason(e.target.value)}
                    className="field field-sm field-select field-auto min-w-0"
                  >
                    <option value="todos">Todos os motivos</option>
                    <option value="vencido">Vencidos</option>
                    <option value="danificado">Danificados</option>
                    <option value="qualidade">Qualidade</option>
                    <option value="quebrado">Quebrados</option>
                  </select>
                </div>
              </div>

              <div className="rola-x">
                <table className="w-full text-left tabela-larga">
                  <thead>
                    <tr className="t-overline-sm">
                      <th className="py-3 pr-3 font-bold">Data</th>
                      <th className="py-3 px-3 font-bold">Produto</th>
                      <th className="py-3 px-3 font-bold">Responsável</th>
                      <th className="py-3 px-3 text-center font-bold">Qtd</th>
                      <th className="py-3 px-3 font-bold">Motivo</th>
                      <th className="py-3 px-3 font-bold">Detalhes</th>
                      <th className="py-3 pl-3 text-right font-bold">Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredLosses.length === 0 ? (
                      <tr>
                        <td colSpan={7} className="text-center py-10">
                          <p className="t-body text-[#86868b]">Nenhuma perda registrada</p>
                        </td>
                      </tr>
                    ) : (
                      filteredLosses.map((r) => (
                        <tr key={r.id} className="border-t hairline hover:bg-black/[0.015] transition-colors">
                          <td className="py-3 pr-3 t-callout tnum whitespace-nowrap">
                            <DateWithBatch dia={r.lossDate} manufactureDate={r.manufactureDate} />
                          </td>
                          <td className="py-3 px-3 text-[13px] font-semibold text-[#1d1d1f] tracking-[-0.01em]">{r.productName}</td>
                          <td className="py-3 px-3 t-callout whitespace-nowrap">{cleanResponsible(r.responsible) || '—'}</td>
                          <td className="py-3 px-3 text-center">
                            <QtyOfBatch qty={r.qty} produced={r.producedQty} unit={r.unitOfMeasure} sign="−" className="ink-expired" />
                          </td>
                          <td className="py-3 px-3">
                            <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize">{r.reason}</span>
                          </td>
                          <td className="py-3 px-3 t-callout">{r.details || '—'}</td>
                          <td className="py-3 pl-3 text-right">
                            <button
                              onClick={() => onDeleteLoss(r.id)}
                              title="Excluir esta perda"
                              className="w-7 h-7 rounded-full icon-danger flex items-center justify-center ml-auto"
                            >
                              <Icons.Trash2 className="w-4 h-4" />
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // CORRIGIR UM LANÇAMENTO DO HISTÓRICO
      //
      // Venda, perda e produção entram com um clique só, então errar a
      // quantidade ou o lote é fácil. Aqui o lançamento é acertado no lugar,
      // sem precisar excluir e lançar de novo.
      //
      // Só o registro muda: o que está na vitrine agora fica como está — a
      // mesma regra que já vale para excluir um lançamento.
      // ==========================================
      const HistoryEditModal = ({ registro, onClose, onSave }) => {
        if (!registro) return null;

        const ehProducao = registro.tipo === 'producao';
        const ehPerda = registro.tipo === 'perda';

        const [qty, setQty] = useState(String(registro.qty || 1));
        const [lote, setLote] = useState(toDayKey(registro.manufactureDate));
        const [dia, setDia] = useState(registro.dia || '');
        const [loteQty, setLoteQty] = useState(registro.producedQty ? String(registro.producedQty) : '');
        const [reason, setReason] = useState(registro.reason || 'vencido');
        const [details, setDetails] = useState(registro.details || '');

        const titulo = ehProducao ? 'Corrigir produção' : ehPerda ? 'Corrigir perda' : 'Corrigir venda';
        const rotuloData = ehPerda ? 'Data da perda' : 'Data da venda';

        const numero = (texto) => {
          const n = Math.floor(Number(texto));
          return Number.isFinite(n) ? n : NaN;
        };

        const salvar = useCliqueUnico((quantidade) => {
          const tamanhoLote = loteQty.trim() === '' ? null : Math.max(0, numero(loteQty) || 0);

          onSave(registro.tipo, registro.id, {
            qty: quantidade,
            // Na produção o dia do histórico é a própria data de fabricação
            dia: ehProducao ? (lote || registro.dia) : (dia || registro.dia),
            manufactureDate: lote || null,
            producedQty: ehProducao ? null : tamanhoLote,
            reason,
            details: details.trim()
          });
          onClose();
        });

        const handleSubmit = (e) => {
          e.preventDefault();
          const quantidade = numero(qty);
          if (!(quantidade >= 1)) {
            alert('A quantidade precisa ser 1 ou mais. Para tirar o lançamento do histórico, use o botão de excluir.');
            return;
          }
          salvar(quantidade);
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)] max-h-[90vh] overflow-y-auto">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">{titulo}</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1 truncate">{registro.productName}</h3>
                  <p className="t-callout mt-1 truncate">
                    {cleanResponsible(registro.responsible) || NO_RESPONSIBLE_LABEL}
                  </p>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div>
                <label className="t-caption block mb-1.5">Quantidade</label>
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setQty((q) => String(Math.max(1, (numero(q) || 1) - 1)))}
                    className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                  >
                    −
                  </button>
                  <input
                    type="number"
                    min="1"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    className="field field-md w-24 text-center text-[17px] font-extrabold tnum"
                  />
                  <button
                    type="button"
                    onClick={() => setQty((q) => String(Math.max(1, (numero(q) || 0) + 1)))}
                    className="w-9 h-9 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[15px] flex items-center justify-center transition-colors"
                  >
                    +
                  </button>
                  <span className="t-callout">{registro.unitOfMeasure || 'un'}</span>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {!ehProducao && (
                  <div>
                    <label className="t-caption block mb-1.5">{rotuloData}</label>
                    <input
                      type="date"
                      value={dia}
                      onChange={(e) => setDia(e.target.value)}
                      className="field field-md text-center text-[13px] tnum"
                    />
                  </div>
                )}
                <div>
                  <label className="t-caption block mb-1.5">Data de fabricação</label>
                  <input
                    type="date"
                    value={lote}
                    onChange={(e) => setLote(e.target.value)}
                    className="field field-md text-center text-[13px] tnum"
                  />
                </div>
              </div>

              {!ehProducao && (
                <div>
                  <label className="t-caption block mb-1.5">Tamanho do lote</label>
                  <input
                    type="number"
                    min="0"
                    value={loteQty}
                    placeholder="Não informado"
                    onChange={(e) => setLoteQty(e.target.value)}
                    className="field field-md text-center font-extrabold tnum"
                  />
                  <p className="t-caption mt-1.5">
                    Quanto tinha na fornada de onde saiu esta baixa — é o número depois da barra, como em "5/8".
                  </p>
                </div>
              )}

              {ehPerda && (
                <div className="space-y-3 p-4 surface-expired rounded-2xl">
                  <div>
                    <label className="t-caption block mb-1">Motivo</label>
                    <select value={reason} onChange={(e) => setReason(e.target.value)} className="field field-sm">
                      <option value="vencido">Produto vencido</option>
                      <option value="danificado">Avaria física</option>
                      <option value="qualidade">Alteração de sabor ou textura</option>
                      <option value="quebrado">Queda ou quebra</option>
                    </select>
                  </div>
                  <div>
                    <label className="t-caption block mb-1">Detalhes</label>
                    <input
                      type="text"
                      value={details}
                      onChange={(e) => setDetails(e.target.value)}
                      placeholder="Observações"
                      className="field field-sm"
                    />
                  </div>
                </div>
              )}

              <p className="t-caption flex items-start gap-1.5 pt-1">
                <Icons.AlertTriangle className="w-3.5 h-3.5 shrink-0 mt-0.5" />
                <span>Muda só este lançamento do histórico. O que está na vitrine agora continua igual.</span>
              </p>

              <div className="flex justify-end gap-2 pt-1">
                <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                <button type="submit" className="btn btn-primary btn-md">Salvar</button>
              </div>
            </form>
          </div>
        );
      };

      // ==========================================
      // HISTORY VIEW — PRODUÇÃO, VENDAS E PERDAS
      //
      // Navega por dia ou por semana, e mostra os três tipos de lançamento
      // juntos na aba "Tudo". Cada venda diz o quanto o produto ficou na
      // vitrine em relação à validade dele. Cada linha pode ser corrigida ou
      // excluída: o que entrou com um clique só tem de dar para acertar.
      // ==========================================
      const HistoryView = ({
        currentUnit,
        unitName,
        products,
        slots,
        saleRecords,
        lossRecords,
        productionRecords,
        productionReady,
        onDeleteSale,
        onDeleteLoss,
        onDeleteProduction,
        onEditRecord
      }) => {
        const [activeTab, setActiveTab] = useState('tudo');
        const [periodo, setPeriodo] = useState('dia');
        const [refDia, setRefDia] = useState(getTodayDateString());
        // Na aba de lotes: uma linha por lote, ou tudo somado por produto
        const [agrupamento, setAgrupamento] = useState('lote');
        const [itensAbertos, setItensAbertos] = useState([]);
        // Lotes abertos na aba "Por lote": abrir mostra os lançamentos que
        // formaram a linha, para corrigir sem trocar de aba
        const [lotesAbertos, setLotesAbertos] = useState([]);
        // Lançamento aberto para correção (venda, perda ou produção)
        const [emCorrecao, setEmCorrecao] = useState(null);

        const hoje = getTodayDateString();
        const inicio = periodo === 'semana' ? startOfWeekKey(refDia) : refDia;
        const fim = periodo === 'semana' ? shiftDayKey(inicio, 6) : refDia;
        // Chave AAAA-MM-DD compara certo como texto
        const noPeriodo = (dia) => periodo === 'tudo' || (dia >= inicio && dia <= fim);

        const shelfLifeDe = (productId) => products.find((p) => p.id === productId)?.shelfLifeDays;

        // Quanto tempo o item ficou na vitrine: da fabricação até a saída.
        // A venda guarda esse número quando é lançada; a perda a gente refaz
        // pelas datas, que é a mesma conta.
        const tempoDeVitrine = (r) => {
          if (!r) return null;
          if (r.exposureDays !== null && r.exposureDays !== undefined) return r.exposureDays;
          const saida = r.dia || toDayKey(r.lossDate || r.timestamp);
          return daysBetweenKeys(r.manufactureDate, saida);
        };

        // A produção é contada pelo dia de fabricação, não pela hora do lançamento
        const producao = productionRecords
          .filter((p) => p.unit === currentUnit)
          .map((p) => ({ ...p, dia: toDayKey(p.manufactureDate || p.timestamp) }))
          .filter((p) => noPeriodo(p.dia));

        const vendas = saleRecords
          .filter((s) => s.unit === currentUnit)
          .map((s) => ({ ...s, dia: toDayKey(s.timestamp) }))
          .filter((s) => noPeriodo(s.dia));

        const perdas = lossRecords
          .filter((l) => l.unit === currentUnit)
          .map((l) => ({ ...l, dia: toDayKey(l.lossDate) }))
          .filter((l) => noPeriodo(l.dia));

        const totalProduzido = producao.reduce((acc, p) => acc + p.qty, 0);
        const totalVendido = vendas.reduce((acc, s) => acc + s.qty, 0);
        const totalPerdido = perdas.reduce((acc, l) => acc + l.qty, 0);
        const eficiencia = totalVendido + totalPerdido > 0
          ? ((totalVendido / (totalVendido + totalPerdido)) * 100).toFixed(1) + '%'
          : '—';

        // Como as vendas saíram em relação à validade
        const frescor = vendas.reduce((acc, s) => {
          const info = getExposureInfo(s.exposureDays, shelfLifeDe(s.productId));
          acc[info.status] = (acc[info.status] || 0) + s.qty;
          return acc;
        }, {});

        const tudo = [
          ...producao.map((r) => ({ ...r, tipo: 'producao' })),
          ...vendas.map((r) => ({ ...r, tipo: 'venda' })),
          ...perdas.map((r) => ({ ...r, tipo: 'perda' }))
        ].sort((a, b) => (a.dia === b.dia ? 0 : a.dia < b.dia ? 1 : -1));

        // ------------------------------------------
        // RESUMO POR LOTE
        //
        // Um lote é um produto com uma data de fabricação: a fornada da
        // manhã é um lote, a mesma coxinha assada no dia seguinte é outro.
        // Produção, venda e perda do período caem cada uma na sua coluna do
        // mesmo lote, então dá para ler numa linha só quanto saiu de cada
        // fornada e quanto ainda está de pé.
        // ------------------------------------------
        const SEM_LOTE = '__sem-lote__';
        const chaveProduto = (r) => r.productId || r.productName;
        const diaDoLote = (r) => toDayKey(r.manufactureDate) || '';

        const mapaLotes = new Map();
        const doLote = (r) => {
          const chave = `${chaveProduto(r)}|${diaDoLote(r) || SEM_LOTE}`;
          if (!mapaLotes.has(chave)) {
            mapaLotes.set(chave, {
              key: chave,
              productKey: chaveProduto(r),
              productId: r.productId,
              productName: r.productName,
              unitOfMeasure: r.unitOfMeasure || 'un',
              manufactureDate: diaDoLote(r),
              produzido: 0,
              vendido: 0,
              perdido: 0,
              // Tamanho do lote guardado na baixa: serve de referência quando
              // a fornada foi feita antes do período que está na tela
              loteRef: 0,
              // Dias × unidades de cada baixa: dividido pelas unidades dá o
              // tempo médio que o lote passou na vitrine antes de sair
              diasSaida: 0,
              unidadesSaida: 0,
              // Os lançamentos que formaram a linha, para corrigir daqui
              registros: []
            });
          }
          return mapaLotes.get(chave);
        };

        // Cada baixa entra na média de tempo de vitrine do lote pesada pela
        // quantidade: 10 unidades vendidas no mesmo dia contam mais que 1
        // vendida no dia seguinte.
        const somaTempo = (lote, registro) => {
          const dias = tempoDeVitrine(registro);
          if (dias === null || dias === undefined) return;
          lote.diasSaida += dias * registro.qty;
          lote.unidadesSaida += registro.qty;
        };

        producao.forEach((p) => {
          const lote = doLote(p);
          lote.produzido += p.qty;
          lote.registros.push({ ...p, tipo: 'producao' });
        });
        vendas.forEach((s) => {
          const lote = doLote(s);
          lote.vendido += s.qty;
          lote.loteRef = Math.max(lote.loteRef, s.producedQty || 0);
          lote.registros.push({ ...s, tipo: 'venda' });
          somaTempo(lote, s);
        });
        perdas.forEach((l) => {
          const lote = doLote(l);
          lote.perdido += l.qty;
          lote.loteRef = Math.max(lote.loteRef, l.producedQty || 0);
          lote.registros.push({ ...l, tipo: 'perda' });
          somaTempo(lote, l);
        });

        // base = o total do lote. Quando a fornada é mais antiga que o período
        // escolhido, não há produção para somar; aí vale o tamanho do lote que
        // veio junto com a baixa, e a linha fica marcada como estimada.
        const comBase = (linha) => {
          const estimado = linha.produzido === 0 && linha.loteRef > 0;
          const base = estimado ? linha.loteRef : linha.produzido;
          return {
            ...linha,
            base,
            estimado,
            sobra: Math.max(0, base - linha.vendido - linha.perdido),
            // Tempo médio de vitrine do que já saiu e, para o que ficou,
            // quantos dias a fornada tem hoje
            tempoMedio: linha.unidadesSaida > 0 ? linha.diasSaida / linha.unidadesSaida : null,
            idade: linha.manufactureDate ? daysBetweenKeys(linha.manufactureDate, hoje) : null,
            registros: [...linha.registros].sort((a, b) => (a.dia === b.dia ? 0 : a.dia < b.dia ? 1 : -1))
          };
        };

        const lotes = [...mapaLotes.values()]
          .map(comBase)
          .sort((a, b) =>
            a.manufactureDate === b.manufactureDate
              ? a.productName.localeCompare(b.productName, 'pt-BR')
              : (a.manufactureDate < b.manufactureDate ? 1 : -1)
          );

        // Mesmo resumo, com os lotes do produto somados numa linha só
        const mapaItens = new Map();
        lotes.forEach((lote) => {
          if (!mapaItens.has(lote.productKey)) {
            mapaItens.set(lote.productKey, {
              key: lote.productKey,
              productId: lote.productId,
              productName: lote.productName,
              unitOfMeasure: lote.unitOfMeasure,
              produzido: 0,
              vendido: 0,
              perdido: 0,
              base: 0,
              sobra: 0,
              estimado: false,
              diasSaida: 0,
              unidadesSaida: 0,
              lotes: []
            });
          }
          const item = mapaItens.get(lote.productKey);
          item.produzido += lote.produzido;
          item.vendido += lote.vendido;
          item.perdido += lote.perdido;
          item.base += lote.base;
          item.sobra += lote.sobra;
          item.estimado = item.estimado || lote.estimado;
          item.diasSaida += lote.diasSaida;
          item.unidadesSaida += lote.unidadesSaida;
          item.lotes.push(lote);
        });

        const itens = [...mapaItens.values()]
          .map((item) => ({
            ...item,
            // A média do item é a dos lotes dele, também pesada pelas unidades
            tempoMedio: item.unidadesSaida > 0 ? item.diasSaida / item.unidadesSaida : null,
            idade: null
          }))
          .sort((a, b) => b.base - a.base || a.productName.localeCompare(b.productName, 'pt-BR'));

        // Somas da tabela de lotes: usam a base de cada lote, então o rodapé
        // fecha com a coluna mesmo quando parte dos lotes veio estimada.
        const totalBase = lotes.reduce((acc, l) => acc + l.base, 0);
        const totalSobra = lotes.reduce((acc, l) => acc + l.sobra, 0);
        // Tempo de vitrine do período inteiro: a média de todas as baixas
        const totalUnidadesSaida = lotes.reduce((acc, l) => acc + l.unidadesSaida, 0);
        const tempoMedioGeral = totalUnidadesSaida > 0
          ? lotes.reduce((acc, l) => acc + l.diasSaida, 0) / totalUnidadesSaida
          : null;

        const alternarItem = (chave) =>
          setItensAbertos((abertos) =>
            abertos.includes(chave) ? abertos.filter((k) => k !== chave) : [...abertos, chave]
          );

        const alternarLote = (chave) =>
          setLotesAbertos((abertos) =>
            abertos.includes(chave) ? abertos.filter((k) => k !== chave) : [...abertos, chave]
          );

        const slotLabel = (slotId) => {
          const slot = slots.find((s) => s.id === slotId);
          return slot ? `${slot.sectionTitle} · #${slot.slotNumber}` : '—';
        };

        const SOURCE_LABELS = { avulso: 'Lançamento avulso', pedido: 'Pedido de produção' };

        // A leitura do tempo de vitrine em palavras: a coluna do lado já diz
        // quantos dias, aqui fica só o que aquilo significa para a validade
        const EXPOSURE_STATUS_LABELS = {
          fresco: 'Dentro da validade',
          limite: 'Último dia de validade',
          vencido: 'Passou da validade',
          indefinido: 'Sem validade definida'
        };

        const rotuloValidade = (r) =>
          EXPOSURE_STATUS_LABELS[getExposureInfo(tempoDeVitrine(r), shelfLifeDe(r.productId)).status] || '—';

        const TIPOS = {
          producao: { label: 'Produção', pill: 'bg-[#0E0937]/10 text-[#0E0937]' },
          venda: { label: 'Venda', pill: 'tone-fresh' },
          perda: { label: 'Perda', pill: 'tone-expired' }
        };

        const mover = (passo) => setRefDia((atual) => shiftDayKey(atual, periodo === 'semana' ? passo * 7 : passo));

        const rotulo = periodo === 'semana'
          ? `${formatDateBR(inicio)} a ${formatDateBR(fim)}`
          : formatDateBR(refDia);
        const subrotulo = periodo === 'semana'
          ? (inicio === startOfWeekKey(hoje) ? 'Esta semana' : 'Semana')
          : (refDia === hoje ? 'Hoje' : weekdayName(refDia));
        const noFuturo = periodo === 'semana' ? inicio >= startOfWeekKey(hoje) : refDia >= hoje;

        const vazioLabel = periodo === 'tudo' ? '' : periodo === 'semana' ? ' nesta semana' : ' neste dia';

        // Quanto existe na unidade inteira, sem olhar o período. Serve para
        // dizer, na tabela vazia, que o lançamento existe — só não é deste dia.
        const naUnidade = {
          producao: productionRecords.filter((p) => p.unit === currentUnit).length,
          vendas: saleRecords.filter((s) => s.unit === currentUnit).length,
          perdas: lossRecords.filter((l) => l.unit === currentUnit).length
        };
        const foraDoPeriodo = {
          producao: naUnidade.producao - producao.length,
          vendas: naUnidade.vendas - vendas.length,
          perdas: naUnidade.perdas - perdas.length
        };
        foraDoPeriodo.tudo = foraDoPeriodo.producao + foraDoPeriodo.vendas + foraDoPeriodo.perdas;

        const abas = [
          { id: 'tudo', label: `Tudo (${tudo.length})` },
          { id: 'lotes', label: `Por lote (${lotes.length})` },
          { id: 'producao', label: `Produção (${producao.length})` },
          { id: 'vendas', label: `Vendas (${vendas.length})` },
          { id: 'perdas', label: `Perdas (${perdas.length})` }
        ];

        const Exposicao = ({ record }) => {
          const info = getExposureInfo(record.exposureDays, shelfLifeDe(record.productId));
          return (
            <span className={`pill ${info.bgClass} ${info.textClass}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${info.dotClass}`} />
              {info.label}
            </span>
          );
        };

        // O mesmo tempo de vitrine da venda, em versão curta para caber numa
        // coluna: só os dias, com a cor que a validade do produto dá.
        const TempoVitrine = ({ record }) => {
          const dias = tempoDeVitrine(record);
          if (dias === null || dias === undefined) {
            return <span className="t-empty">—</span>;
          }
          const info = getExposureInfo(dias, shelfLifeDe(record.productId));
          return (
            <span className={`pill ${info.bgClass} ${info.textClass} tnum`} title={info.label}>
              <span className={`w-1.5 h-1.5 rounded-full ${info.dotClass}`} />
              {dias === 0 ? 'no mesmo dia' : `${dias}d`}
            </span>
          );
        };

        // Tempo de vitrine da linha do resumo: a média do que já saiu do lote.
        // Lote que ainda não teve baixa mostra a idade da fornada, que é o
        // tempo que ele está na vitrine agora.
        const TempoLote = ({ linha }) => {
          if (linha.tempoMedio === null || linha.tempoMedio === undefined) {
            if (linha.idade === null || linha.idade === undefined) {
              return <span className="t-empty">—</span>;
            }
            return (
              <span className="t-caption tnum whitespace-nowrap" title="Ainda não saiu nada deste lote">
                {linha.idade}d de fornada
              </span>
            );
          }
          const media = Math.round(linha.tempoMedio * 10) / 10;
          const info = getExposureInfo(Math.round(linha.tempoMedio), shelfLifeDe(linha.productId));
          return (
            <span
              className={`pill ${info.bgClass} ${info.textClass} tnum`}
              title={`Média do que saiu do lote — ${info.label}`}
            >
              <span className={`w-1.5 h-1.5 rounded-full ${info.dotClass}`} />
              {media === 0 ? 'no mesmo dia' : `${media}d`}
            </span>
          );
        };

        // Número do resumo por lote. Zero vira travessão para a coluna que
        // importa saltar aos olhos; "fraco" é o total só estimado pelo lote.
        const Numero = ({ valor, className = 'text-[#1d1d1f]', fraco = false, sufixo }) =>
          valor > 0 ? (
            <span className="tnum whitespace-nowrap">
              <span className={`text-[13px] font-extrabold ${fraco ? 'text-[#86868b]' : className}`}>{valor}</span>
              {sufixo && <span className="t-unit"> {sufixo}</span>}
            </span>
          ) : (
            <span className="t-empty">—</span>
          );

        // Quanto do que saiu do lote virou venda, e não perda
        const Aproveitamento = ({ vendido, perdido }) => {
          const saiu = vendido + perdido;
          if (saiu === 0) return <span className="t-empty">—</span>;
          const pct = Math.round((vendido / saiu) * 100);
          const cor =
            pct >= 90 ? 'tone-fresh'
            : pct >= 70 ? 'tone-last'
            : 'tone-expired';
          return <span className={`pill ${cor} tnum`}>{pct}%</span>;
        };

        const BotaoExcluir = ({ onClick, title }) => (
          <button
            onClick={onClick}
            title={title}
            className="w-7 h-7 rounded-full icon-danger flex items-center justify-center"
          >
            <Icons.Trash2 className="w-4 h-4" />
          </button>
        );

        const BotaoCorrigir = ({ registro, tipo, title }) => (
          <button
            onClick={() => setEmCorrecao({ ...registro, tipo: tipo || registro.tipo })}
            title={title}
            className="w-7 h-7 rounded-full text-[#86868b] hover:bg-[#0E0937]/10 hover:text-[#0E0937] flex items-center justify-center transition-colors"
          >
            <Icons.Pencil className="w-4 h-4" />
          </button>
        );

        // Os botões de cada linha, sempre encostados na direita da coluna
        const Acoes = ({ children }) => (
          <span className="flex items-center justify-end gap-0.5">{children}</span>
        );

        const excluirDoTipo = {
          producao: onDeleteProduction,
          venda: onDeleteSale,
          perda: onDeleteLoss
        };

        // O que formou a linha do resumo, aberto embaixo dela: cada produção,
        // venda e perda daquele lote com os mesmos botões das outras abas.
        // Assim dá para acertar a fornada sem ir procurar o lançamento na aba
        // "Tudo".
        const LancamentosDoLote = ({ lote, colSpan }) => (
          <tr className="bg-black/[0.02]">
            <td colSpan={colSpan} className="px-3 pt-1 pb-3">
              {lote.registros.length === 0 ? (
                <p className="t-caption">
                  Nada para corrigir aqui: este lote só aparece pelo tamanho guardado na baixa, e os
                  lançamentos dele são de outro período.
                </p>
              ) : (
                <div className="space-y-1.5">
                  {lote.registros.map((r) => (
                    <div
                      key={`${r.tipo}-${r.id}`}
                      className="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-xl bg-white border hairline px-3 py-2"
                    >
                      <span className={`pill ${TIPOS[r.tipo].pill}`}>{TIPOS[r.tipo].label}</span>
                      <span className="t-callout tnum whitespace-nowrap">{formatDateBR(r.dia)}</span>
                      <span className="text-[13px] font-extrabold text-[#1d1d1f] tnum whitespace-nowrap">
                        {r.qty} <span className="t-unit">{r.unitOfMeasure || 'un'}</span>
                      </span>
                      {r.tipo !== 'producao' && <TempoVitrine record={r} />}
                      {r.tipo === 'perda' && (
                        <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize">{r.reason}</span>
                      )}
                      <span className="t-caption truncate">{cleanResponsible(r.responsible) || NO_RESPONSIBLE_LABEL}</span>
                      <span className="ml-auto flex items-center gap-0.5">
                        <BotaoCorrigir registro={r} title={`Corrigir ${TIPOS[r.tipo].label.toLowerCase()}`} />
                        <BotaoExcluir
                          onClick={() => excluirDoTipo[r.tipo](r.id)}
                          title={`Excluir ${TIPOS[r.tipo].label.toLowerCase()}`}
                        />
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </td>
          </tr>
        );

        // Tabela vazia no período escolhido não quer dizer histórico vazio: a
        // produção é contada pelo dia da fabricação, então o que foi lançado
        // hoje com fornada de ontem aparece em ontem. Quando existe coisa fora
        // do período, a tabela diz onde procurar em vez de só ficar em branco.
        const Vazio = ({ colSpan, titulo, dica, fora = 0 }) => (
          <tr>
            <td colSpan={colSpan} className="text-center py-10">
              <p className="t-body text-[#86868b]">{titulo}{vazioLabel}</p>
              {dica && <p className="t-caption mt-1 max-w-md mx-auto">{dica}</p>}
              {periodo !== 'tudo' && fora > 0 && (
                <div className="mt-4 space-y-2">
                  <p className="t-caption tnum">{fora} lançamento(s) em outras datas</p>
                  <button onClick={() => setPeriodo('tudo')} className="btn btn-secondary btn-sm mx-auto">
                    <Icons.History className="w-3.5 h-3.5" />
                    Ver o histórico inteiro
                  </button>
                </div>
              )}
            </td>
          </tr>
        );

        return (
          <div className="space-y-5">
            <div>
              <h2 className="t-display">Histórico da vitrine</h2>
              <p className="t-body mt-1">Produção, vendas e perdas — {unitName}</p>
            </div>

            {/* Navegação por período */}
            <div className="card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="segmented">
                {[
                  { id: 'dia', label: 'Por dia' },
                  { id: 'semana', label: 'Por semana' },
                  { id: 'tudo', label: 'Tudo' }
                ].map((op) => (
                  <button key={op.id} onClick={() => setPeriodo(op.id)} data-active={periodo === op.id}>
                    {op.label}
                  </button>
                ))}
              </div>

              {periodo === 'tudo' ? (
                <span className="t-callout tnum">
                  {tudo.length} lançamento(s) desde o começo
                </span>
              ) : (
                <div className="flex items-center gap-2 min-w-0">
                  <button onClick={() => mover(-1)} title="Anterior" className="btn btn-secondary w-8 h-8 px-0 shrink-0">
                    <Icons.ChevronLeft className="w-4 h-4" />
                  </button>

                  {/* A data no meio segurava 172px fixos: com as duas setas e o
                      "Hoje" do lado, a linha não cabia em tela de 320px. Agora
                      ela encolhe com a tela e só reserva a largura no desktop */}
                  <div className="text-center min-w-0 flex-1 sm:flex-none sm:min-w-[172px]">
                    <div className="t-headline text-[#1d1d1f] tnum">{rotulo}</div>
                    <div className="t-caption capitalize">{subrotulo}</div>
                  </div>

                  <button
                    onClick={() => mover(1)}
                    disabled={noFuturo}
                    title="Próximo"
                    className="btn btn-secondary w-8 h-8 px-0 shrink-0 disabled:opacity-35 disabled:pointer-events-none"
                  >
                    <Icons.ChevronRight className="w-4 h-4" />
                  </button>

                  <button onClick={() => setRefDia(hoje)} className="btn btn-secondary btn-sm shrink-0">
                    Hoje
                  </button>
                </div>
              )}
            </div>

            {/* Números do período escolhido */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.ChefHat className="w-3.5 h-3.5" />
                  Produzido
                </span>
                <div className="mt-2 t-metric-lg text-[#0E0937]">
                  {totalProduzido}
                  <span className="t-metric-unit">itens</span>
                </div>
                <p className="t-caption mt-2 tnum">{producao.length} lançamento(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.ShoppingCart className="w-3.5 h-3.5" />
                  Vendido
                </span>
                <div className="mt-2 t-metric-lg ink-fresh">
                  {totalVendido}
                  <span className="t-metric-unit">itens</span>
                </div>
                <p className="t-caption mt-2 tnum">{vendas.length} baixa(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Perdido
                </span>
                <div className="mt-2 t-metric-lg ink-expired">
                  {totalPerdido}
                  <span className="t-metric-unit">itens</span>
                </div>
                <p className="t-caption mt-2 tnum">{perdas.length} lançamento(s)</p>
              </div>

              <div className="card p-5">
                <span className="t-overline flex items-center gap-1.5">
                  <Icons.TrendingUp className="w-3.5 h-3.5" />
                  Aproveitamento
                </span>
                <div className="mt-2 t-metric-lg">
                  {eficiencia}
                </div>
                <p className="t-caption mt-2">Vendas sobre vendas + perdas</p>
              </div>
            </div>

            <div className="card p-5 sm:p-6 space-y-1">
              <div className="flex flex-wrap items-center gap-3 pb-4 border-b hairline">
                <div className="segmented">
                  {abas.map((aba) => (
                    <button key={aba.id} onClick={() => setActiveTab(aba.id)} data-active={activeTab === aba.id}>

                            <td className="py-3 px-3">
                              <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize">{l.reason}</span>
                            </td>
                            <td className="py-3 pl-3 text-right">
                              <Acoes>
                                <BotaoCorrigir registro={l} tipo="perda" title="Corrigir esta perda" />
                                <BotaoExcluir onClick={() => onDeleteLoss(l.id)} title="Excluir esta perda" />
                              </Acoes>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* Montada só quando há lançamento aberto: assim cada correção
                começa com os valores do registro escolhido */}
            {emCorrecao && (
              <HistoryEditModal
                key={`${emCorrecao.tipo}-${emCorrecao.id}`}
                registro={emCorrecao}
                onClose={() => setEmCorrecao(null)}
                onSave={onEditRecord}
              />
            )}
          </div>
        );
      };
      // ==========================================
      // SEPARATED PRODUCTS VIEW (Fora da Vitrine)
      // ==========================================
      const SeparatedProductsView = ({ currentUnit, unitName, separatedProducts, onUpdateQty, onAddSeparatedProduct }) => {

              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
              {unitItems.map((item) => (
                <div key={item.id} className="card p-4 flex flex-col justify-between gap-4">

                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="t-overline">{item.category}</span>
                      <span className="tnum text-[13px] font-bold text-[#1d1d1f]">{formatCurrencyBR(item.price)}</span>
                    </div>
                    <h4 className="t-headline text-[#1d1d1f]">{item.productName}</h4>
                  </div>

                  <div className="flex items-end justify-between pt-3 border-t hairline">
                    <div>
                      <span className="t-caption block">Estoque</span>
                      <span className="t-metric-sm">
                        {item.currentQty}
                        <span className="text-[12px] font-semibold text-[#86868b] tracking-normal"> {item.unitOfMeasure}</span>
                      </span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={() => onUpdateQty(item.id, -1)}

            {showModal && (

                  <h3 className="t-title text-[#1d1d1f]">Novo item fora da vitrine</h3>

                      type="number"
