  <style id="banco-v2-css">
.banco-v2-tabs{display:flex;gap:5px;overflow-x:auto;padding:5px;background:#f5f5f2;border:1px solid #e5e7e3;border-radius:10px}
.banco-v2-tab{white-space:nowrap;border:0;background:transparent;padding:10px 15px;border-radius:7px;color:#536157;font:600 12px Manrope,Arial,sans-serif;cursor:pointer}
.banco-v2-tab.is-active{background:#274b38;color:white;box-shadow:0 1px 3px #0002}
.banco-v2-layout{display:grid;grid-template-columns:minmax(220px,34%) minmax(0,1fr);gap:12px;align-items:start}
.banco-v2-list{min-width:0;overflow:hidden}
.banco-v2-list-title{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid #e8e9e6;font-size:13px}
.banco-v2-list-title span{font-size:11px;color:#77837a}
.banco-v2-list-scroll{max-height:65vh;overflow-y:auto}
.banco-v2-item{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;padding:13px 16px;border:0;border-bottom:1px solid #eff0ed;background:#fff;cursor:pointer}
.banco-v2-item:hover{background:#f4f7f4}
.banco-v2-item.is-active{background:#eef4ef;border-left:3px solid #2f5d45;padding-left:13px}
.banco-v2-item-name{font-size:12px;font-weight:600;color:#28362e}
.banco-v2-item small{font-size:10px;color:#77837a}
.banco-v2-details{min-width:0;overflow:hidden}
.banco-v2-details-head{display:flex;justify-content:space-between;align-items:start;gap:14px;padding:18px 20px;border-bottom:1px solid #e8e9e6}
.banco-v2-details-head h3{font-size:17px;font-weight:650;line-height:1.3;margin-top:5px;color:#243d2e}
.banco-v2-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;padding:20px}
.banco-v2-field{display:flex;flex-direction:column;gap:7px;min-width:0;font-size:12px}
.banco-v2-label{display:block;color:#7b857e;font-size:10px;letter-spacing:.02em;font-weight:650}
.banco-v2-field strong{font-weight:600;color:#2c3e31}
.banco-v2-help{margin:0 20px 20px;padding:11px 13px;border-radius:8px;background:#f5f7f4;font-size:11px;color:#66766b}
.banco-v2-tags{display:flex;flex-wrap:wrap;gap:8px}
.banco-v2-tag{padding:7px 10px;border:1px solid #dce5dd;border-radius:7px;background:#f5f8f5;color:#2f5d45;font-size:12px}
@media(max-width:740px){.banco-v2-layout{grid-template-columns:minmax(0,1fr)}.banco-v2-list-scroll{max-height:230px}.banco-v2-fields{grid-template-columns:minmax(0,1fr);padding:15px}.banco-v2-details-head{padding:15px;flex-wrap:wrap}.banco-v2-help{margin:0 15px 15px}.banco-v2-tab{padding:9px 12px;font-size:11px}}
</style>
  <style id="banco-v2-table-css">
.banco-v2-table{width:100%;min-width:950px;border-collapse:collapse;font-size:12px}
.banco-v2-table th{white-space:nowrap;background:#f5f6f3;padding:11px 12px;border-bottom:1px solid #dfe4df;font-weight:650}
.banco-v2-table td{padding:7px 10px;border-bottom:1px solid #ecefea;vertical-align:middle}
.banco-v2-table tbody tr:nth-child(even){background:#fbfcfa}
.banco-v2-table tbody tr:hover{background:#f1f6f1}
.banco-v2-table tbody tr:nth-child(even) td.sticky{background:#fbfcfa}
.banco-v2-table tbody tr:hover td.sticky{background:#f1f6f1}
.banco-v2-table th:first-child{position:sticky;left:0;z-index:12;min-width:220px}
.banco-v2-table .field{font-size:12px;min-width:120px}
.banco-v2-table-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #e5eae5;font-size:12px}
.banco-v2-table-meta span{font-size:11px;color:#77837a}
.banco-v2-product{text-align:left;border:0;background:transparent;color:#294734;font-weight:650;font-size:12px;cursor:pointer}
.banco-v2-product:hover{text-decoration:underline}
@media(max-width:740px){.banco-v2-table-meta{flex-wrap:wrap}.banco-v2-table th:first-child{min-width:180px}}
</style>
