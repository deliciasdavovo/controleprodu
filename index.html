                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ))
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // ORGANIZAR ITEM DA VITRINE PADRÃO
      //
      // Uma janelinha por espaço: prioridade (A a D), em que dias o item entra
      // e a quantidade ideal. É aqui que "todo dia" vira as sete linhas da
      // semana sem precisar copiar dia por dia.
      // ==========================================
      const PlanOrganizeModal = ({ slot, product, priority, days, idealQty, onClose, onSave, onRemove }) => {
        if (!slot) return null;
        const [prio, setPrio] = useState(priority || DEFAULT_PRIORITY);
        const [selectedDays, setSelectedDays] = useState(days && days.length ? days : []);
        const [qty, setQty] = useState(idealQty || 1);

        const todoDia = selectedDays.length === WEEK_DAYS.length;

        const toggleDay = (day) =>
          setSelectedDays((atual) =>
            atual.includes(day)
              ? atual.filter((d) => d !== day)
              : WEEK_DAYS.filter((d) => d === day || atual.includes(d))
          );

        const handleSubmit = (e) => {
          e.preventDefault();
          if (selectedDays.length === 0) {
            alert('Marque pelo menos um dia — ou use "Tirar do padrão" para remover o item.');
            return;
          }
          onSave({ priority: prio, days: selectedDays, idealQty: Math.max(1, Number(qty) || 1) });
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/25 backdrop-blur-[2px] flex items-center justify-center p-4 z-50">
            <form onSubmit={handleSubmit} className="bg-white rounded-[20px] max-w-md w-full p-6 space-y-4 shadow-[0_24px_64px_rgba(0,0,0,0.24)]">
              <div className="flex items-start justify-between gap-3 pb-4 border-b hairline">
                <div className="min-w-0">
                  <span className="t-overline">Organizar item</span>
                  <h3 className="t-title text-[#1d1d1f] mt-1 truncate">{product?.name || 'Produto'}</h3>
                  <p className="t-callout mt-1 truncate">
                    {slot.sectionTitle} · espaço #{slot.slotNumber} · {getResponsibleName(product)}
                  </p>
                </div>
                <button type="button" onClick={onClose} className="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.09] text-[#6e6e73] flex items-center justify-center shrink-0 transition-colors">
                  <Icons.X className="w-4 h-4" />
                </button>
              </div>

              <div>
                <label className="t-caption block mb-1.5">Prioridade</label>
                <div className="grid grid-cols-4 gap-1.5">
                  {PRIORITIES.map((p) => (
                    <button
                      key={p.value}
                      type="button"
                      onClick={() => setPrio(p.value)}
                      title={p.hint}
                      className={`h-11 rounded-xl border text-[15px] font-extrabold transition-all ${
                        prio === p.value
                          ? 'border-[#0071e3] bg-[#0071e3]/[0.06] text-[#0058b0]'
                          : 'border-black/[0.08] bg-white text-[#6e6e73] hover:bg-black/[0.03]'
                      }`}
                    >
                      {p.value}
                    </button>
                  ))}
                </div>
                <p className="t-caption mt-1.5">{getPriority(prio).title} — {getPriority(prio).hint}</p>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="t-caption">Frequência</label>
                  <button
                    type="button"
                    onClick={() => setSelectedDays(todoDia ? [] : [...WEEK_DAYS])}
                    className="btn btn-secondary h-7 px-2.5 text-[12px]"
                  >
                    {todoDia ? 'Limpar dias' : 'Todo dia'}
                  </button>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {WEEK_DAYS.map((day) => (
                    <button
                      key={day}
                      type="button"
                      onClick={() => toggleDay(day)}
                      title={getDayNameBR(day)}
                      className={`h-10 rounded-xl border text-[12px] font-bold transition-all ${
                        selectedDays.includes(day)
                          ? 'border-[#0071e3] bg-[#0071e3] text-white'
                          : 'border-black/[0.08] bg-white text-[#6e6e73] hover:bg-black/[0.03]'
                      }`}
                    >
                      {getDayShortBR(day)}
                    </button>
                  ))}
                </div>
                <p className="t-caption mt-1.5">
                  {todoDia
                    ? 'O item fica neste espaço nos sete dias da semana.'
                    : `Entra em: ${frequencyTitle(selectedDays)}.`}
                  {' '}Nos dias marcados o espaço passa a ser deste produto; nos desmarcados ele fica livre.
                </p>
              </div>

              <div>
                <label className="t-caption block mb-1.5">Quantidade ideal por dia</label>
                <input
                  type="number"
                  min="1"
                  value={qty}
                  onChange={(e) => setQty(e.target.value)}
                  className="field field-md text-center font-extrabold tnum"
                />
              </div>

              <div className="flex justify-between gap-2 pt-1">
                <button
                  type="button"
                  onClick={() => { onRemove(); onClose(); }}
                  className="btn btn-sm bg-[#ff3b30]/10 text-[#c9271d] hover:bg-[#ff3b30]/16"
                >
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Tirar do padrão
                </button>
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="btn btn-secondary btn-md">Cancelar</button>
                  <button type="submit" className="btn btn-primary btn-md">Salvar</button>
                </div>
              </div>
            </form>
          </div>
        );
      };

      // ==========================================
      // TABELA DA SEMANA (Vitrine Padrão)
      //
      // A vitrine de cada dia é editada uma de cada vez, então é difícil ver
      // o desenho da semana inteira. Esta tabela abre isso: uma linha por
      // produto, uma coluna por dia, com a quantidade que o padrão pede, o
      // total da semana e a média por dia em que o item entra.
      //
      // A quantidade é digitada na própria célula: dá para montar a semana
      // inteira de um produto sem trocar de dia.
      // ==========================================

      // Uma célula da tabela: mostra a quantidade e vira campo ao clicar.
      // Enter e sair do campo gravam, Esc desfaz.
      const WeeklyQtyCell = ({ value, onCommit, title }) => {
        const [texto, setTexto] = useState('');
        const [editando, setEditando] = useState(false);

        useEffect(() => {
          if (!editando) setTexto(value ? String(value) : '');
        }, [value, editando]);

        const gravar = () => {
          setEditando(false);
          const nova = texto.trim() === '' ? 0 : Math.max(0, Math.floor(Number(texto)));
          if (!Number.isFinite(nova) || nova === (value || 0)) {
            setTexto(value ? String(value) : '');
            return;
          }
          onCommit(nova);
        };

        return (
          <input
            type="text"
            inputMode="numeric"
            value={editando ? texto : (value ? String(value) : '')}
            title={title}
            placeholder="·"
            onFocus={(e) => { setEditando(true); setTexto(value ? String(value) : ''); e.target.select(); }}
            onChange={(e) => setTexto(e.target.value.replace(/[^0-9]/g, ''))}
            onBlur={gravar}
            onKeyDown={(e) => {
              if (e.key === 'Enter') { e.currentTarget.blur(); }
              if (e.key === 'Escape') { setTexto(value ? String(value) : ''); setEditando(false); e.currentTarget.blur(); }
            }}
            className={`w-full min-w-11 h-8 rounded-lg bg-transparent border border-transparent text-center tnum
              hover:border-black/[0.12] focus:outline-none focus:bg-white focus:border-[#0071e3]
              focus:shadow-[0_0_0_3px_rgba(0,113,227,0.16)] transition-colors ${
                value ? 'font-bold text-[#1d1d1f]' : 'text-[#c7c7cc]'
              }`}
          />
        );
      };

      const WeeklyPlanTable = ({
        currentUnit,
        products,
        slots,
        standardPlans,
        selectedDay,
        onSelectDay,
        onSetWeeklyQty
      }) => {
        const [aberto, setAberto] = useState(true);
        const [busca, setBusca] = useState('');
        const [ordem, setOrdem] = useState('total');
        const [copiado, setCopiado] = useState(false);

        const slotById = useMemo(() => {
          const map = {};
          slots.forEach((s) => { map[s.id] = s; });
          return map;
        }, [slots]);

        // Uma linha por produto, somando os espaços que ele ocupa no dia
        const linhas = useMemo(() => {
          const porProduto = {};

          standardPlans
            .filter((sp) => sp.unit === currentUnit)
            .forEach((sp) => {
              if (!porProduto[sp.productId]) {
                const produto = products.find((p) => p.id === sp.productId);
                porProduto[sp.productId] = {
                  id: sp.productId,
                  nome: produto?.name || 'Produto removido',
                  vitrines: [],
                  dias: {},
                  espacos: {},
                  total: 0
                };
              }

              const linha = porProduto[sp.productId];
              const slot = slotById[sp.slotId];
              if (slot && !linha.vitrines.includes(slot.sectionTitle)) {
                linha.vitrines.push(slot.sectionTitle);
              }
              linha.dias[sp.dayOfWeek] = (linha.dias[sp.dayOfWeek] || 0) + (sp.idealQty || 0);
              linha.espacos[sp.dayOfWeek] = (linha.espacos[sp.dayOfWeek] || 0) + 1;
              linha.total += sp.idealQty || 0;
            });

          return Object.values(porProduto).map((linha) => {
            const diasAtivos = WEEK_DAYS.filter((d) => (linha.dias[d] || 0) > 0).length;
            return { ...linha, diasAtivos, media: diasAtivos ? linha.total / diasAtivos : 0 };
          });
        }, [standardPlans, currentUnit, products, slotById]);

        const visiveis = useMemo(() => {
          const termo = normalizeName(busca);
          const lista = termo ? linhas.filter((l) => normalizeName(l.nome).includes(termo)) : linhas;
          return [...lista].sort((a, b) =>
            ordem === 'nome'
              ? a.nome.localeCompare(b.nome, 'pt-BR')
              : b.total - a.total || a.nome.localeCompare(b.nome, 'pt-BR')
          );
        }, [linhas, busca, ordem]);

        const totalPorDia = useMemo(() => {
          const contas = {};
          WEEK_DAYS.forEach((d) => {
            contas[d] = visiveis.reduce((acc, l) => acc + (l.dias[d] || 0), 0);
          });
          return contas;
        }, [visiveis]);

        const totalSemana = useMemo(
          () => visiveis.reduce((acc, l) => acc + l.total, 0),
          [visiveis]
        );

        // A célula mais cheia da tabela dá a régua do sombreado: quanto mais
        // perto dela, mais forte o azul do fundo
        const maiorCelula = useMemo(() => {
          let maior = 0;
          visiveis.forEach((l) => {
            WEEK_DAYS.forEach((d) => { maior = Math.max(maior, l.dias[d] || 0); });
          });
          return maior;
        }, [visiveis]);

        const fundoDaCelula = (qtd) => {
          if (!qtd || !maiorCelula) return undefined;
          return { backgroundColor: `rgba(0, 113, 227, ${(0.05 + (qtd / maiorCelula) * 0.16).toFixed(3)})` };
        };

        const formatarMedia = (valor) =>
          (Math.round(valor * 10) / 10).toString().replace('.', ',');

        // Sai com tabulação: cola direto no Excel ou no Google Planilhas
        const handleCopy = async () => {
          const linhasTexto = [
            ['Produto', ...WEEK_DAYS.map(getDayShortBR), 'Total semana'].join('\t'),
            ...visiveis.map((l) =>
              [l.nome, ...WEEK_DAYS.map((d) => l.dias[d] || 0), l.total].join('\t')
            ),
            ['Total', ...WEEK_DAYS.map((d) => totalPorDia[d]), totalSemana].join('\t')
          ];

          const ok = await copyTextToClipboard(linhasTexto.join('\n'));
          if (ok) {
            setCopiado(true);
            setTimeout(() => setCopiado(false), 2000);
          }
        };

        return (
          <div className="card p-4 sm:p-5">
            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="t-overline flex items-center gap-1.5 mb-1.5">
                  <Icons.ClipboardList className="w-3.5 h-3.5" />
                  Quantidade por dia
                </div>
                <h3 className="t-title text-[#1d1d1f]">A semana inteira</h3>
                <p className="t-caption mt-1">
                  {linhas.length} produtos no padrão · {WEEK_DAYS.reduce((acc, d) => acc + (totalPorDia[d] || 0), 0)} un na semana
                </p>
                <p className="t-caption mt-0.5">
                  Clique na quantidade para mudar — 0 tira o produto do dia.
                </p>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {aberto && (
                  <button onClick={handleCopy} className="btn btn-secondary btn-sm">
                    <Icons.Copy className="w-3.5 h-3.5" />
                    {copiado ? 'Copiado!' : 'Copiar tabela'}
                  </button>
                )}
                <button onClick={() => setAberto(!aberto)} className="btn btn-secondary btn-sm">
                  {aberto ? 'Esconder' : 'Mostrar'}
                </button>
              </div>
            </div>

            {aberto && (
              <>
                <div className="flex flex-col sm:flex-row sm:items-center gap-2 mt-4">
                  <div className="relative flex-1 max-w-xs">
                    <Icons.Search className="w-3.5 h-3.5 text-[#86868b] absolute left-3 top-[11px]" />
                    <input
                      type="text"
                      placeholder="Pesquisar produto…"
                      value={busca}
                      onChange={(e) => setBusca(e.target.value)}
                      className="field field-sm field-search"
                    />
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="t-caption mr-0.5">Ordenar</span>
                    <button
                      onClick={() => setOrdem('total')}
                      className={`btn h-8 px-3 text-[12px] ${ordem === 'total' ? 'btn-primary' : 'btn-secondary'}`}
                    >
                      Maior total
                    </button>
                    <button
                      onClick={() => setOrdem('nome')}
                      className={`btn h-8 px-3 text-[12px] ${ordem === 'nome' ? 'btn-primary' : 'btn-secondary'}`}
                    >
                      A-Z
                    </button>
                  </div>
                </div>

                {visiveis.length === 0 ? (
                  <p className="t-body text-center py-10">
                    {linhas.length === 0
                      ? 'Nenhum item no padrão ainda — monte a vitrine de um dia para a semana aparecer aqui.'
                      : 'Nenhum produto com esse nome.'}
                  </p>
                ) : (
                  <div className="mt-3 overflow-x-auto">
                    <table className="w-full border-collapse text-[13px]">
                      <thead>
                        <tr>
                          <th
                            className="sticky left-0 z-10 text-left t-overline font-bold px-2.5 py-2 border-b border-r hairline w-[136px] sm:w-[240px]"
                            style={{ background: 'var(--bg-surface)' }}
                          >
                            Produto
                          </th>
                          {WEEK_DAYS.map((day) => (
                            <th key={day} className="px-1 pb-2 border-b hairline">
                              <button
                                onClick={() => onSelectDay(day)}
                                title={`Editar a vitrine de ${getDayNameBR(day)}`}
                                className={`w-full min-w-11 rounded-lg px-2 py-1.5 text-[12px] font-bold transition-colors ${
                                  selectedDay === day
                                    ? 'bg-[#0071e3] text-white'
                                    : 'text-[#6e6e73] hover:bg-black/[0.05]'
                                }`}
                              >
                                {getDayShortBR(day)}
                              </button>
                            </th>
                          ))}
                          <th className="text-right t-overline font-bold px-2.5 py-2 border-b hairline whitespace-nowrap">
                            Total
                          </th>
                        </tr>
                      </thead>

                      <tbody>
                        {visiveis.map((linha) => (
                          <tr key={linha.id} className="border-b hairline">
                            <td
                              className="sticky left-0 z-10 px-2.5 py-1.5 border-r hairline w-[136px] sm:w-[240px] max-w-[136px] sm:max-w-[240px]"
                              style={{ background: 'var(--bg-surface)' }}
                            >
                              <p className="font-semibold text-[#1d1d1f] truncate" title={linha.nome}>
                                {linha.nome}
                              </p>
                              {linha.vitrines.length > 0 && (
                                <p className="t-caption text-[11px] truncate">{linha.vitrines.join(' · ')}</p>
                              )}
                            </td>

                            {WEEK_DAYS.map((day) => {
                              const qtd = linha.dias[day] || 0;
                              const espacos = linha.espacos[day] || 0;
                              return (
                                <td
                                  key={day}
                                  className={`px-1 py-1 ${
                                    selectedDay === day ? 'ring-1 ring-inset ring-[#0071e3]/25' : ''
                                  }`}
                                  style={fundoDaCelula(qtd)}
                                >
                                  <WeeklyQtyCell
                                    value={qtd}
                                    title={
                                      espacos > 1
                                        ? `${linha.nome} · ${getDayNameBR(day)} — ${espacos} espaços; a quantidade é repartida entre eles`
                                        : `${linha.nome} · ${getDayNameBR(day)} — digite a quantidade (0 tira do dia)`
                                    }
                                    onCommit={(nova) => onSetWeeklyQty(day, linha.id, nova)}
                                  />
                                </td>
                              );
                            })}

                            <td className="text-right px-2.5 py-1.5 whitespace-nowrap">
                              <span className="tnum font-extrabold text-[#1d1d1f]">{linha.total}</span>
                              {linha.diasAtivos > 1 && (
                                <span className="t-caption tnum text-[11px] block">
                                  {formatarMedia(linha.media)}/dia
                                </span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>

                      <tfoot>
                        <tr>
                          <td
                            className="sticky left-0 z-10 px-2.5 py-2 t-overline font-bold border-r hairline"
                            style={{ background: 'var(--bg-surface)' }}
                          >
                            Total do dia
                          </td>
                          {WEEK_DAYS.map((day) => (
                            <td
                              key={day}
                              className={`text-center tnum font-extrabold px-1 py-2 ${
                                selectedDay === day ? 'text-[#0071e3]' : 'text-[#1d1d1f]'
                              }`}
                            >
                              {totalPorDia[day] || 0}
                            </td>
                          ))}
                          <td className="text-right tnum font-extrabold px-2.5 py-2 text-[#1d1d1f]">
                            {totalSemana}
                          </td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                )}
              </>
            )}
          </div>
        );
      };

      // ==========================================
      // STANDARD SHOWCASE VIEW (Vitrine Padrão)
      //
      // Uma tabela por vitrine, uma embaixo da outra: cada linha é um espaço
      // e as colunas mostram o que importa para organizar o item — produto,
      // prioridade, dias e quantidade. O mesmo desenho da tabela da semana,
      // para o olho não precisar trocar de formato no meio da tela.
      // ==========================================
      const StandardShowcaseView = ({
        currentUnit,
        unitName,
        slots,
        products,
        standardPlans,
        selectedDay,
        onSelectDay,
        onUpdatePlanItem,
        onRemovePlanItem,
        onUpdatePlanSchedule,
        onSetWeeklyQty,
        onCopyDayPlan,
        onClearDayPlan,
        onGenerateProductionOrder
      }) => {
        const [targetCopyDay, setTargetCopyDay] = useState('terca');
        const [priorityFilter, setPriorityFilter] = useState('todas');
        const [organizing, setOrganizing] = useState(null);

        const unitSlots = slots.filter((s) => s.unit === currentUnit);
        const dayPlans = standardPlans.filter(
          (sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay
        );

        const planOf = (slotId) => dayPlans.find((sp) => sp.slotId === slotId);
        const productOf = (productId) => products.find((p) => p.id === productId);

        // Uma coluna por vitrine de verdade (Salgada 1, Salgada 2, Doce…)
        const showcases = useMemo(() => {
          const colunas = [];
          const porChave = {};

          unitSlots.forEach((slot) => {
            const chave = showcaseKey(slot);
            if (!porChave[chave]) {
              porChave[chave] = {
                key: chave,
                title: slot.sectionTitle,
                showcaseType: slot.showcaseType,
                shelfNumber: slot.shelfNumber,
                slots: []
              };
              colunas.push(porChave[chave]);
            }
            porChave[chave].slots.push(slot);
          });

          colunas.forEach((c) => c.slots.sort((a, b) => a.slotNumber - b.slotNumber));
          return colunas.sort(compareShowcase);
        }, [unitSlots]);

        const handleCopy = () => {
          if (selectedDay === targetCopyDay) {
            alert('Selecione um dia de destino diferente do atual.');
            return;
          }
          onCopyDayPlan(selectedDay, targetCopyDay);
          alert(`Padrão de ${getDayNameBR(selectedDay)} copiado para ${getDayNameBR(targetCopyDay)}!`);
        };

        const handleClear = () => {
          if (confirm(`Limpar todo o padrão de ${getDayNameBR(selectedDay)}?`)) {
            onClearDayPlan(selectedDay);
          }
        };

        // Quantos itens do dia tem em cada prioridade — vira o filtro do topo
        const countByPriority = useMemo(() => {
          const contas = {};
          PRIORITIES.forEach((p) => { contas[p.value] = 0; });
          dayPlans.forEach((sp) => { contas[getPriority(sp.priority).value] += 1; });
          return contas;
        }, [dayPlans]);

        const matchesFilter = (plan) =>
          priorityFilter === 'todas' || (plan && getPriority(plan.priority).value === priorityFilter);

        return (
          <div className="space-y-5">
            <div className="card p-6 sm:p-7">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                  <div className="t-overline flex items-center gap-1.5 mb-2">
                    <Icons.Calendar className="w-3.5 h-3.5" />
                    Planejamento semanal
                  </div>
                  <h2 className="t-display">Vitrine padrão</h2>
                  <p className="t-body mt-1.5 max-w-lg">
                    Defina como a vitrine deve ser montada em cada dia — {unitName}.
                    Clique nas etiquetas do item para dar prioridade (A a D) e escolher
                    os dias em que ele entra.
                  </p>
                </div>

                <button onClick={onGenerateProductionOrder} className="btn btn-primary btn-md shrink-0">
                  <Icons.ChefHat className="w-4 h-4" />
                  Gerar pedido de produção
                </button>
              </div>

              <div className="flex items-center gap-2 mt-6 overflow-x-auto pb-1 scrollbar-none">
                {WEEK_DAYS.map((day) => {
                  const count = standardPlans.filter(
                    (sp) => sp.unit === currentUnit && sp.dayOfWeek === day
                  ).length;

                  return (
                    <button
                      key={day}
                      onClick={() => onSelectDay(day)}
                      className={`btn h-9 px-3.5 text-[13px] shrink-0 ${
                        selectedDay === day ? 'btn-primary' : 'btn-secondary'
                      }`}
                    >
                      <span>{getDayNameBR(day)}</span>
                      <span className={`tnum text-[11px] px-1.5 rounded-full ${
                        selectedDay === day ? 'bg-white/22 text-white' : 'bg-black/[0.06] text-[#6e6e73]'
                      }`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="card-flat p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-1.5">
                <span className="t-callout mr-1">Prioridade</span>
                <button
                  onClick={() => setPriorityFilter('todas')}
                  className={`btn h-8 px-3 text-[12px] ${priorityFilter === 'todas' ? 'btn-primary' : 'btn-secondary'}`}
                >
                  Todas
                </button>
                {PRIORITIES.map((p) => (
                  <button
                    key={p.value}
                    onClick={() => setPriorityFilter(priorityFilter === p.value ? 'todas' : p.value)}
                    title={p.title}
                    className={`btn h-8 px-3 text-[12px] ${priorityFilter === p.value ? 'btn-primary' : 'btn-secondary'}`}
                  >
                    <span className={`w-1.5 h-1.5 rounded-full ${p.dot}`} />
                    {p.value}
                    <span className="tnum opacity-70">{countByPriority[p.value]}</span>
                  </button>
                ))}
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <span className="t-callout flex items-center gap-1.5">
                  <Icons.Copy className="w-4 h-4 text-[#6e6e73]" />
                  Copiar <strong className="text-[#1d1d1f] font-bold">{getDayNameBR(selectedDay)}</strong> para
                </span>
                <select
                  value={targetCopyDay}
                  onChange={(e) => setTargetCopyDay(e.target.value)}
                  className="field field-sm field-select field-auto"
                >
                  {WEEK_DAYS.map((d) => (
                    <option key={d} value={d}>{getDayNameBR(d)}</option>
                  ))}
                </select>
                <button onClick={handleCopy} className="btn btn-secondary btn-sm">
                  Copiar
                </button>
                <button onClick={handleClear} className="btn btn-sm bg-[#ff3b30]/10 text-[#c9271d] hover:bg-[#ff3b30]/16">
                  <Icons.Trash2 className="w-3.5 h-3.5" />
                  Limpar padrão
                </button>
              </div>
            </div>

            {/* Uma tabela por vitrine, uma embaixo da outra */}
            {showcases.map((vitrine) => {
              const planejados = vitrine.slots.filter((s) => planOf(s.id));
              const total = planejados.reduce((acc, s) => acc + (planOf(s.id)?.idealQty || 0), 0);
              // O espaço da vitrine salgada só oferece produto salgado
              const productOptions = [
                { value: '', label: 'Espaço vazio', muted: true },
                ...productsForShowcaseType(products, vitrine.showcaseType).map((p) => ({ value: p.id, label: p.name }))
              ];

              return (
                <div key={vitrine.key} className="card p-4 sm:p-5">
                  <div className="flex items-center justify-between gap-2 pb-3 border-b hairline">
                    <div className="min-w-0">
                      <h3 className="t-headline text-[#1d1d1f] truncate">{vitrine.title}</h3>
                      <p className="t-caption tnum mt-0.5">
                        {planejados.length}/{vitrine.slots.length} espaços · {total} un em {getDayNameBR(selectedDay)}
                      </p>
                    </div>
                    <span className="pill bg-black/[0.05] text-[#6e6e73] capitalize shrink-0">
                      {vitrine.showcaseType}
                    </span>
                  </div>

                  <table className="w-full border-collapse text-[13px]">
                    <thead>
                      <tr className="t-overline">
                        <th className="text-left font-bold py-2 w-8">#</th>
                        <th className="text-left font-bold py-2">Produto</th>
                        <th className="hidden sm:table-cell text-left font-bold py-2 px-2 w-[190px]">
                          Prioridade e dias
                        </th>
                        <th className="hidden lg:table-cell text-left font-bold py-2 px-2 w-[150px]">
                          Responsável
                        </th>
                        <th className="text-right font-bold py-2 w-[104px]">Qtd</th>
                      </tr>
                    </thead>

                    <tbody>
                      {vitrine.slots.map((slot) => {
                        const planItem = planOf(slot.id);
                        const product = planItem ? productOf(planItem.productId) : null;
                        const dias = planItem
                          ? planDaysOf(standardPlans, currentUnit, slot.id, planItem.productId)
                          : [];
                        const prio = getPriority(planItem?.priority);
                        const apagado = planItem && !matchesFilter(planItem);
                        // Produto de outra categoria que já estava aqui continua
                        // aparecendo, senão o campo ficaria em branco com o
                        // espaço ocupado
                        const opcoes = product && !productOptions.some((o) => o.value === product.id)
                          ? [...productOptions, { value: product.id, label: product.name }]
                          : productOptions;

                        const etiquetas = planItem && (
                          <button
                            type="button"
                            onClick={() => setOrganizing({ slot, plan: planItem, product, dias })}
                            title={`${prio.title} · ${frequencyTitle(dias)} — clique para mudar`}
                            className="flex items-center gap-1 min-w-0 max-w-full hover:opacity-80 transition-opacity"
                          >
                            <span className={`pill text-[10px] font-extrabold shrink-0 ${prio.pill}`}>{prio.value}</span>
                            <span className="pill bg-black/[0.05] text-[#6e6e73] text-[10px] min-w-0">
                              <Icons.Calendar className="w-3 h-3 shrink-0" />
                              <span className="truncate">{frequencyLabel(dias)}</span>
                            </span>
                          </button>
                        );

                        return (
                          <tr
                            key={slot.id}
                            className={`border-b hairline transition-opacity ${apagado ? 'opacity-35' : ''} ${
                              planItem ? '' : 'bg-black/[0.015]'
                            }`}
                          >
                            <td className="t-caption tnum py-1.5 align-middle">{slot.slotNumber}</td>

                            <td className="py-1.5 pr-2 align-middle">
                              <PickerField
                                value={planItem?.productId || ''}
                                options={opcoes}
                                placeholder="Espaço vazio"
                                emptyLabel="Nenhum produto desta vitrine com esse nome"
                                onPick={(opt) => {
                                  if (!opt.value) {
                                    if (planItem) onRemovePlanItem(planItem.id);
                                    return;
                                  }
                                  const prod = products.find((p) => p.id === opt.value);
                                  const qty = planItem?.idealQty || (prod ? prod.minReplenishmentQty * 2 : 10);
                                  onUpdatePlanItem(slot.id, opt.value, qty, planItem?.priority || DEFAULT_PRIORITY);
                                }}
                                className="field field-sm font-semibold w-full"
                              />
                              {/* Em tela estreita as colunas de baixo somem: as
                                  etiquetas continuam aqui, embaixo do nome */}
                              {planItem && (
                                <div className="sm:hidden mt-1">{etiquetas}</div>
                              )}
                            </td>

                            <td className="hidden sm:table-cell py-1.5 px-2 align-middle">
                              {planItem ? etiquetas : <span className="t-caption">—</span>}
                            </td>

                            <td className="hidden lg:table-cell py-1.5 px-2 align-middle">
                              {planItem ? (
                                <span className="t-caption flex items-center gap-1 min-w-0">
                                  <Icons.User className="w-3 h-3 shrink-0" />
                                  <span className="truncate">{getResponsibleName(product)}</span>
                                </span>
                              ) : (
                                <span className="t-caption">—</span>
                              )}
                            </td>

                            <td className="py-1.5 align-middle">
                              {planItem ? (
                                <div className="flex items-center justify-end gap-1.5">
                                  <button
                                    onClick={() => onUpdatePlanItem(slot.id, planItem.productId, Math.max(1, planItem.idealQty - 1), planItem.priority)}
                                    title="Tirar uma unidade"
                                    className="w-6 h-6 rounded-full bg-black/[0.05] hover:bg-black/[0.09] font-bold text-[13px] flex items-center justify-center transition-colors shrink-0"
                                  >
                                    −
                                  </button>
                                  <span className="tnum text-[13px] font-extrabold text-[#1d1d1f] min-w-5 text-center">
                                    {planItem.idealQty}
                                  </span>
                                  <button
                                    onClick={() => onUpdatePlanItem(slot.id, planItem.productId, planItem.idealQty + 1, planItem.priority)}
                                    title="Colocar uma unidade"
                                    className="w-6 h-6 rounded-full bg-[#0071e3] text-white font-bold text-[13px] flex items-center justify-center hover:bg-[#0077ed] transition-colors shrink-0"
                                  >
                                    +
                                  </button>
                                </div>
                              ) : (
                                <p className="t-caption text-right">—</p>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>

                    <tfoot>
                      <tr>
                        <td colSpan={2} className="t-overline font-bold py-2">Total da vitrine</td>
                        <td className="hidden sm:table-cell" />
                        <td className="hidden lg:table-cell" />
                        <td className="tnum font-extrabold text-right py-2 text-[#1d1d1f]">{total}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              );
            })}

            <WeeklyPlanTable
              currentUnit={currentUnit}
              products={products}
              slots={slots}
              standardPlans={standardPlans}
              selectedDay={selectedDay}
              onSelectDay={onSelectDay}
              onSetWeeklyQty={onSetWeeklyQty}
            />

            {organizing && (
              <PlanOrganizeModal
                slot={organizing.slot}
                product={organizing.product}
                priority={organizing.plan.priority}
                days={organizing.dias}
                idealQty={organizing.plan.idealQty}
                onClose={() => setOrganizing(null)}
                onSave={({ priority, days, idealQty }) =>
                  onUpdatePlanSchedule(organizing.slot.id, organizing.plan.productId, { priority, days, idealQty })
                }
                onRemove={() => onRemovePlanItem(organizing.plan.id)}
              />
            )}
          </div>
        );
      };

      // ==========================================
      // PRODUCTION ORDER VIEW
      //
      // O pedido sai separado por pessoa: cada responsável tem o seu cartão,
      // com os itens agrupados por vitrine e um botão que copia a lista dele
      // em texto — pronto para mandar no WhatsApp ou imprimir.
      // ==========================================
      const ProductionOrderView = ({
        currentUnit,
        unitName,
        slots,
        slotItems,
        products,
        standardPlans,
        selectedDay,
        onApplyProductionToShowcase
      }) => {
        const [completedItems, setCompletedItems] = useState({});
        const [responsibleFilter, setResponsibleFilter] = useState('todos');
        const [copiado, setCopiado] = useState('');

        const dayPlans = useMemo(
          () => standardPlans.filter((sp) => sp.unit === currentUnit && sp.dayOfWeek === selectedDay),
          [standardPlans, currentUnit, selectedDay]
        );

        const slotById = useMemo(() => {
          const map = {};
          slots.forEach((s) => { map[s.id] = s; });
          return map;
        }, [slots]);

        // Quanto de cada produto já existe em cada vitrine, somando todos os
        // espaços dela. Antes a conta olhava só para o espaço planejado, então
        // o produto colocado no espaço do lado — o que acontece o tempo todo —
        // era pedido de novo mesmo já estando na vitrine.
        //
        // O que está vencido não entra na conta: ele vai sair da vitrine, então
        // precisa ser refeito. O que está no último dia conta como estoque, mas
        // fica marcado na lista para a loja decidir se adianta a produção.
        const stockByShowcaseProduct = useMemo(() => {
          const map = {};
          slotItems.forEach((item) => {
            const slot = slotById[item.slotId];
            if (!slot || slot.unit !== currentUnit) return;
            const product = products.find((p) => p.id === item.productId);
            const status = getSlotItemStatus(item, product).status;
            const key = `${showcaseKey(slot)}|${item.productId}`;
            const atual = map[key] || { good: 0, expired: 0, lastDay: 0 };

            if (status === 'expired') atual.expired += item.currentQty;
            else {
              atual.good += item.currentQty;
              if (status === 'warning') atual.lastDay += item.currentQty;
            }
            map[key] = atual;
          });
          return map;
        }, [slotItems, slotById, products, currentUnit]);

        // Estoque bom em um espaço só — usado para espalhar a produção
        const qtyInSlot = (slotId, productId) =>
          slotItems
            .filter((item) => {
              if (item.slotId !== slotId || item.productId !== productId) return false;
              const product = products.find((p) => p.id === item.productId);
              return getSlotItemStatus(item, product).status !== 'expired';
            })
            .reduce((acc, item) => acc + item.currentQty, 0);

        // Uma linha por produto em cada vitrine, juntando os espaços que o
        // padrão do dia reservou para ele
        const orderList = useMemo(() => {
          const grupos = [];
          const porChave = {};

          dayPlans.forEach((plan) => {
            const slot = slotById[plan.slotId];
            if (!slot) return;
            const chave = `${showcaseKey(slot)}|${plan.productId}`;

            if (!porChave[chave]) {
              porChave[chave] = {
                key: chave,
                showcaseType: slot.showcaseType,
                shelfNumber: slot.shelfNumber,
                showcaseTitle: slot.sectionTitle,
                productId: plan.productId,
                unitOfMeasure: plan.unitOfMeasure,
                plans: []
              };
              grupos.push(porChave[chave]);
            }
            porChave[chave].plans.push({ slot, idealQty: plan.idealQty, priority: plan.priority });
          });

          return grupos.map((grupo) => {
            const product = products.find((p) => p.id === grupo.productId);
            const idealQty = grupo.plans.reduce((acc, p) => acc + p.idealQty, 0);
            const estoque = stockByShowcaseProduct[grupo.key] || { good: 0, expired: 0, lastDay: 0 };
            const currentQty = estoque.good;
            const neededQty = Math.max(0, idealQty - currentQty);

            // Quando o mesmo produto ocupa dois espaços com letras diferentes,
            // vale a mais urgente
            const priority = grupo.plans
              .map((p) => getPriority(p.priority).value)
              .sort((a, b) => priorityRank(a) - priorityRank(b))[0] || DEFAULT_PRIORITY;

            // Gatilho do pedido: o item só é pedido quando o estoque bom chega
            // no mínimo da prioridade dele, ou quando tem peça vencida para
            // repor. Assim a lista não vive pedindo 2 unidades de algo cheio.
            const minQty = Math.max(1, Math.ceil(idealQty * minStockRatio(priority)));
            const belowMin = currentQty <= minQty;
            const triggered = neededQty > 0 && (belowMin || estoque.expired > 0);

            // Espalha o que falta pelos espaços planejados, começando por quem
            // está mais vazio; nenhum espaço recebe mais do que o ideal dele
            let restante = neededQty;
            const targets = grupo.plans
              .map((p) => ({
                slotId: p.slot.id,
                slotNumber: p.slot.slotNumber,
                falta: Math.max(0, p.idealQty - qtyInSlot(p.slot.id, grupo.productId))
              }))
              .sort((a, b) => b.falta - a.falta)
              .map((alvo) => {
                const qty = Math.min(restante, alvo.falta);
                restante -= qty;
                return { ...alvo, qty };
              })
              .filter((alvo) => alvo.qty > 0);

            // Sobra quando algum espaço da vitrine está com excesso: vai para o
            // espaço mais vazio para o total da vitrine bater com o padrão
            if (restante > 0 && grupo.plans.length > 0) {
              const primeiro = grupo.plans
                .slice()
                .sort((a, b) => qtyInSlot(a.slot.id, grupo.productId) - qtyInSlot(b.slot.id, grupo.productId))[0];
              const existente = targets.find((t) => t.slotId === primeiro.slot.id);
              if (existente) existente.qty += restante;
              else targets.push({ slotId: primeiro.slot.id, slotNumber: primeiro.slot.slotNumber, qty: restante });
            }

            return {
              key: grupo.key,
              showcaseType: grupo.showcaseType,
              shelfNumber: grupo.shelfNumber,
              showcaseTitle: grupo.showcaseTitle,
              slotLabel: grupo.plans
                .map((p) => `#${p.slot.slotNumber}`)
                .sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }))
                .join(', '),
              productId: grupo.productId,
              productName: product?.name || 'Produto',
              responsible: getResponsibleName(product),
              priority,
              idealQty,
              currentQty,
              expiredQty: estoque.expired,
              lastDayQty: estoque.lastDay,
              minQty,
              belowMin,
              triggered,
              neededQty,
              targets,
              unitOfMeasure: grupo.unitOfMeasure
            };
          });
        }, [dayPlans, slotById, slotItems, products, stockByShowcaseProduct]);

        const pendingItems = orderList.filter((item) => item.triggered);

        // Falta pequena, ainda acima do mínimo: fica de fora do pedido, mas a
        // loja continua sabendo que existe
        const aboveMinItems = orderList.filter((item) => item.neededQty > 0 && !item.triggered);

        // Só entram nomes que a loja cadastrou no produto — nada de nome
        // inventado. Quem está sem responsável cai no bloco "Sem responsável".
        const responsibleOptions = Array.from(new Set(pendingItems.map((item) => item.responsible)))
          .sort((a, b) => a.localeCompare(b, 'pt-BR'));

        // Se o responsável escolhido não tem mais nada a produzir, volta para "todos"
        const activeResponsible = responsibleOptions.includes(responsibleFilter) ? responsibleFilter : 'todos';

        const itemsNeedingProduction = activeResponsible === 'todos'
          ? pendingItems
          : pendingItems.filter((item) => item.responsible === activeResponsible);

        // O pedido é entregue por pessoa: cada responsável recebe a lista do
        // que ele tem para produzir, separada por vitrine e na ordem da
        // prioridade — o que não pode faltar aparece primeiro.
        const responsibleBlocks = useMemo(() => {
          const blocos = [];
          const porNome = {};

          itemsNeedingProduction.forEach((item) => {
            if (!porNome[item.responsible]) {
              porNome[item.responsible] = { key: item.responsible, title: item.responsible, entries: [] };
              blocos.push(porNome[item.responsible]);
            }
            porNome[item.responsible].entries.push(item);
          });

          blocos.forEach((bloco) => {
            bloco.total = bloco.entries.reduce((acc, i) => acc + i.neededQty, 0);
            // Dentro da pessoa: um grupo por vitrine, itens por prioridade
            bloco.groups = groupByShowcase(bloco.entries, (item) => ({
              showcaseType: item.showcaseType,
              shelfNumber: item.shelfNumber,
              sectionTitle: item.showcaseTitle
            }));
            bloco.groups.forEach((g) =>
              g.entries.sort(
                (a, b) =>
                  priorityRank(a.priority) - priorityRank(b.priority) ||
                  a.productName.localeCompare(b.productName, 'pt-BR')
              )
            );
          });

          return blocos.sort((a, b) => {
            if (a.title === NO_RESPONSIBLE_LABEL) return 1;
            if (b.title === NO_RESPONSIBLE_LABEL) return -1;
            return a.title.localeCompare(b.title, 'pt-BR');
          });
        }, [itemsNeedingProduction]);

        // ------------------------------------------
        // Lista em texto puro, do jeito que vai para o WhatsApp ou para o papel
        // ------------------------------------------
        const blockToText = (bloco) => {
          const linhas = [
            `PEDIDO DE PRODUÇÃO — ${getDayNameBR(selectedDay)}`,
            `${unitName} · ${bloco.title}`,
            ''
          ];

          bloco.groups.forEach((grupo) => {
            linhas.push(grupo.title.toUpperCase());
            grupo.entries.forEach((item) => {
              const avisos = [];
              if (item.expiredQty > 0) avisos.push(`${item.expiredQty} vencido(s) para repor`);
              if (item.lastDayQty > 0) avisos.push(`${item.lastDayQty} no último dia`);
              linhas.push(
                `[ ] ${item.productName} — ${item.neededQty} ${item.unitOfMeasure}` +
                ` (${item.priority} · espaço ${item.slotLabel} · vitrine ${item.currentQty}/${item.idealQty})` +
                (avisos.length ? ` · ${avisos.join(', ')}` : '')
              );
            });
            linhas.push('');
          });

          linhas.push(`Total: ${bloco.total} un em ${bloco.entries.length} item(ns)`);
          return linhas.join('\n');
        };

        const copiarTexto = async (chave, texto) => {
          const ok = await copyTextToClipboard(texto);
          if (!ok) {
            alert('Não consegui copiar sozinho. Selecione o texto da lista e copie na mão.');
            return;
          }
          setCopiado(chave);
          setTimeout(() => setCopiado((atual) => (atual === chave ? '' : atual)), 2000);
        };

        // "Copiar tudo" é a lista de produzir, e nada mais: quantidade e item.
        // Sem responsável, sem espaço, sem vitrine, sem prioridade — quem quer
        // esse detalhe usa o "Copiar lista" de cada pessoa.
        //
        // O mesmo produto pode ser chamado por mais de uma vitrine, então as
        // quantidades são somadas: uma linha por produto.
        const copiarTudo = () => {
          if (itemsNeedingProduction.length === 0) return;

          const porProduto = new Map();
          itemsNeedingProduction.forEach((item) => {
            const chave = `${item.productName}|${item.unitOfMeasure}`;
            const atual = porProduto.get(chave);
            if (atual) atual.qty += item.neededQty;
            else porProduto.set(chave, { name: item.productName, unit: item.unitOfMeasure, qty: item.neededQty });
          });

          const linhas = [...porProduto.values()]
            .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'))
            .map((p) => `${p.qty} ${p.unit} — ${p.name}`);

          copiarTexto('__tudo__', linhas.join('\n'));

        const handleApplyAll = () => {
          if (itemsNeedingProduction.length === 0) return;

              slotId: alvo.slotId,
              productId: item.productId,
              qty: alvo.qty,
              productName: item.productName
            }))
          );
          if (payload.length === 0) return;
          onApplyProductionToShowcase(payload);
