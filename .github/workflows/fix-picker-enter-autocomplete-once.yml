name: Fix autocomplete Enter
on:
  push:
    paths:
      - '.github/workflows/fix-picker-enter-autocomplete-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_picker_enter_autocomplete.py
      - name: Verify
        run: |
          grep -q '2026-09-05-autocomplete-enter-1' index.html
          grep -Fq 'const escolha = visible[active >= 0 ? active : 0];' index.html
          grep -Fq 'e.stopPropagation();' index.html
      - name: Commit
        run: |
          git config user.name 'DDV Autocomplete'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Enter selection in autocomplete'
          git push
