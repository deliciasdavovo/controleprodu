name: Inspect variation fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-variation-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show variation contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['variationUnit','variationFactor','rotuloVariacao','variation_unit','variation_factor']:
              print('\n###', needle)
              pos=0
              count=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  count+=1
                  a=max(0,i-500); b=min(len(s),i+900)
                  print(s[a:b].replace('\r',''))
                  print('\n---')
                  pos=i+len(needle)
                  if count>=8: break
              print('COUNT_SHOWN',count)
          PY
