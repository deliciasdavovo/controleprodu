name: Validar sintaxe JSX

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar JSX para detectar erros de sintaxe
        run: |
          npx --yes esbuild@0.25.12 src/embalagens.jsx --loader:.jsx=jsx --outfile=/tmp/embalagens-validado.js
          npx --yes esbuild@0.25.12 src/app.jsx --loader:.jsx=jsx --outfile=/tmp/controleprodu-validado.js

      - name: Validar scripts do livro e das fichas de receita
        run: |
          node --check src/recipe-production-fields.js
          node --check src/recipe-export-layout.js
          node --check src/recipe-book.js
          node --check src/recipe-book-bulk.js
          node -e "const x=require('./src/pedidos-cardapio-photos.json');if(!Array.isArray(x.photos)||!x.photos.length)process.exit(1)"
