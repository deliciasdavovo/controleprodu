name: Fix internal catalog rows
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_internal_catalog_rows.py'
      - '.github/workflows/fix-internal-catalog-rows-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_internal_catalog_rows.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert ") : ehSupply ? (\n                                  <input value={x.name} onChange={(e) => onUpdateSupply" in s
          assert '2026-09-04-cadastros-mestre-copiar-ficha-1' in s
          print('verify ok')
          PY
      - name: Commit
        run: |
          git config user.name "DDV Catalog"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix packaging and cleaning row editing"
          git push
