name: Inspect cost display
on:
  push:
    paths:
      - '.github/workflows/inspect-cost-display-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant code
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8').splitlines()
          markers = [
            'formatPrecoInsumo',
            'HISTÓRICO DE COMPRAS DO ITEM',
            'Histórico de compras do item',
            'Custo unit.',
            'Custo unitário',
            'ItemPurchase',
            'PurchaseHistoryModal'
          ]
          for m in markers:
            hits=[i for i,line in enumerate(s) if m in line]
            for i in hits[:8]:
              a=max(0,i-35); b=min(len(s),i+90)
              print(f'\n===== {m} @ line {i+1} =====')
              for n in range(a,b): print(f'{n+1:05d}: {s[n]}')
          PY
