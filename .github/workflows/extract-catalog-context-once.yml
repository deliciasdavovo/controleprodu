name: Extract catalog context
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/extract_catalog_context.py'
      - '.github/workflows/extract-catalog-context-once.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: python3 .github/scripts/extract_catalog_context.py
      - name: Commit
        run: |
          git config user.name "DDV Catalog"
          git config user.email "actions@users.noreply.github.com"
          git add .github/catalog_context.txt
          git commit -m "Extract catalog context"
          git push
