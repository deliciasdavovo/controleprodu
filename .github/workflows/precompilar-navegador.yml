name: Precompilar React do navegador

on:
  push:
    branches:
      - main
      - fix/precompilar-jsx-para-abertura-rapida
      - feat/embalagens-variacoes-por-produto-2026-10-14
      - fix/mobile-menu-upload-embalagens-2026-10-14
      - feat/manual-pdf-embalagens-com-fotos-2026-10-15
    paths:
      - 'src/**'
      - 'index.html'
      - '.github/workflows/precompilar-navegador.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar-e-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar compilador e navegador de teste
        run: |
          npm install --no-save esbuild@0.25.12 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Compilar JSX para JavaScript simples
        run: |
          mkdir -p compiled
          npx esbuild src/embalagens.jsx --loader:.jsx=jsx --jsx=transform --format=iife --target=es2018 --minify --outfile=compiled/embalagens.js
          npx esbuild src/app.jsx --loader:.jsx=jsx --jsx=transform --format=iife --target=es2018 --minify --outfile=compiled/app.js
          wc -c compiled/*.js
      - name: Abrir site local, CMV e Embalagens no Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site-log.txt 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1300, height: 850 } });
            const fatal = [];
            page.on('pageerror', e => fatal.push(String(e.stack || e.message).slice(0, 500)));
            try {
              const start = Date.now();
              const response = await page.goto('http://127.0.0.1:8765/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => {
                const el = document.querySelector('#root');
                return el && el.innerText.includes('Entrar no CMV');
              }, null, {timeout: 45000});
              console.log('TEMPO_TELA_INICIAL_MS:', Date.now() - start);
              await page.getByRole('button', {name:/Entrar no CMV/i}).first().click();
              await page.getByRole('button', {name:/^Embalagens$/i}).first().click();
              await page.getByText('Guia de embalagens por produto', {exact:true}).waitFor({state:'visible',timeout:20000});
              await page.getByText('Salgados', {exact:true}).first().waitFor({state:'visible',timeout:12000});
              await page.getByText('Doces e sobremesas', {exact:true}).first().waitFor({state:'visible',timeout:12000});
              console.log('AGRUPAMENTOS_CARREGADOS:', true);
              await page.route('**/rest/v1/packaging_matrices**', route => {
                if (['POST','PUT','PATCH','DELETE'].includes(route.request().method()))
                  return route.fulfill({status:201, contentType:'application/json',body:''});
                return route.continue();
              });
              await page.locator('.emb2-btn-nova').first().click();
              await page.locator('.emb2-var-card').first().waitFor({state:'visible',timeout:12000});
              console.log('VARIACAO_ADICIONADA_NA_LINHA:', true);
              await page.locator('.emb2-botao-escolher').first().click();
              await page.locator('.emb2-modal-cartao').first().waitFor({state:'visible',timeout:12000});
              const jpeg = await page.evaluate(() => {
                const c = document.createElement('canvas'); c.width=32; c.height=32;
                const ctx=c.getContext('2d'); ctx.fillStyle='#bdcfc1'; ctx.fillRect(0,0,32,32);
                return c.toDataURL('image/jpeg',.8).split(',')[1];
              });
              const file = {name:'foto-embalagem.jpg',mimeType:'image/jpeg',buffer:Buffer.from(jpeg,'base64')};
              await page.locator('.emb2-modal-enviar input[type=file]').first().setInputFiles(file);
              await page.locator('.emb2-modal-cartao img').first().waitFor({state:'visible',timeout:12000});
              console.log('UPLOAD_FOTO_NA_ESCOLHA_OK:', true);
              await page.locator('.emb2-modal-usar').first().click();
              await page.locator('.emb2-modal-rodape button').first().click();
              await page.locator('.emb2-item').first().waitFor({state:'visible',timeout:12000});
              console.log('SELECAO_EMBALAGEM_OK:', true);
              // O PDF de manual deve carregar a foto incorporada no próprio arquivo.
              const [manual] = await Promise.all([
                page.waitForEvent('popup',{timeout:15000}),
                page.getByRole('button',{name:'Manual com fotos (PDF)'}).click()
              ]);
              await manual.waitForLoadState('domcontentloaded');
              await manual.locator('.embalagem-foto').first().waitFor({state:'visible',timeout:12000});
              const sample = await manual.locator('.embalagem-foto').first().evaluate(img=>({
                src:img.getAttribute('src'),w:img.naturalWidth,h:img.naturalHeight
              }));
              if(!sample.src.startsWith('data:image/jpeg;base64,') || sample.w<=0 || sample.h<=0)
                throw new Error('Manual sem foto JPEG integrada no HTML');
              if(!await manual.locator('.grupo-cabecalho').count() ||
                 !await manual.locator('.produto-cabecalho').count() ||
                 !await manual.locator('.variacao-titulo').count())
                throw new Error('Manual sem grupos, produtos ou variações');
              const pdf = await manual.pdf({format:'A4',printBackground:true});
              const imagensNoPDF = (pdf.toString('latin1').match(/\/Subtype\s*\/Image/g)||[]).length;
              if(pdf.length<4000 || imagensNoPDF<1)
                throw new Error('O PDF salvo não incorporou as imagens: bytes='+pdf.length+', imagens='+imagensNoPDF);
              console.log('MANUAL_PDF_TESTADO:',JSON.stringify({
                arquivoBytes:pdf.length, imagensNoPDF,
                produtos:await manual.locator('.produto').count(),
                variacoes:await manual.locator('.variacao').count()
              }));
              await manual.close();
              // Navegação real de celular: tocar "Mais" não pode deslocar a tela
              // ou prender a barra lateral dentro do cabeçalho sticky.
              const mobile = await browser.newContext({viewport:{width:390,height:844},
                deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const mpage = await mobile.newPage();
              const mfatal=[];
              mpage.on('pageerror',e=>mfatal.push(e.message));
              await mpage.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:60000});
              await mpage.getByRole('button',{name:/Entrar no CMV/i}).first().click();
              await mpage.locator('.controle-mobile-bottom-link[aria-label="Todas as áreas"]').click();
              await mpage.locator('.controle-mobile-drawer').waitFor({state:'visible',timeout:12000});
              const drawer = await mpage.evaluate(() => {
                const el=document.querySelector('.controle-mobile-drawer');
                const overlay=document.querySelector('.controle-mobile-overlay');
                const r=el.getBoundingClientRect();
                return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                  drawerLeft:r.left,drawerRight:r.right,
                  z:Number(getComputedStyle(overlay).zIndex),
                  parent:overlay.parentElement.tagName};
              });
              console.log('MENU_MOBILE_METRICAS:', JSON.stringify(drawer));
              if(drawer.parent!=='BODY' || drawer.z<100 || drawer.drawerRight>390 ||
                 drawer.scrollWidth>drawer.width+2) throw new Error('Menu mobile fora dos limites da tela');
              await mpage.locator('.controle-mobile-drawer .controle-mobile-link').filter({hasText:'Embalagens'}).click();
              await mpage.locator('.emb2-btn-nova').first().waitFor({state:'visible',timeout:15000});
              await mpage.locator('.emb2-btn-nova').first().click();
              await mpage.locator('.emb2-botao-escolher').first().click();
              await mpage.locator('.emb2-modal-cartao').first().waitFor({state:'visible',timeout:12000});
              const dialog=await mpage.evaluate(()=>{
                const el=document.querySelector('.emb2-modal'),r=el.getBoundingClientRect();
                return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                  left:r.left,right:r.right,bottom:r.bottom,height:r.height};
              });
              console.log('SELETOR_MOBILE_METRICAS:',JSON.stringify(dialog));
              if(dialog.left< -1||dialog.right>dialog.width+1||dialog.scrollWidth>dialog.width+2||
                 dialog.bottom>844+2)throw new Error('Seletor de embalagens fora da tela mobile');
              await mpage.locator('.emb2-modal-enviar input[type=file]').first().setInputFiles(file);
              await mpage.locator('.emb2-modal-cartao img').first().waitFor({state:'visible',timeout:12000});
              await mpage.locator('.emb2-modal-usar').first().click();
              await mpage.getByRole('button',{name:'Concluir'}).click();
              console.log('MENU_E_UPLOAD_MOBILE_OK:',true);
              console.log('ERROS_MOBILE:',JSON.stringify(mfatal));
              if(mfatal.length)throw new Error('Erros de JS no celular');
              await mobile.close();
              console.log('NAVEGACAO_CMV_EMBALAGENS_OK:', true);
              console.log('ERROS_NAVEGADOR:', JSON.stringify(fatal));
              if (!response || response.status() >= 400 || fatal.length) {
                throw new Error('Navegador apresentou falha de execucao.');
              }
            } finally { await browser.close(); }
          })().catch(e => {console.error(e.stack || e); process.exit(1)});
          NODE
      - name: Publicar scripts compilados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f compiled/embalagens.js compiled/app.js
          if git diff --staged --quiet; then
            echo "Compilados ja estao atualizados."
          else
            git commit -m "Atualiza scripts compilados do navegador [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
