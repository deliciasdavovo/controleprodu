name: Add item purchase history

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add_item_purchase_history.py'
      - '.github/workflows/add-item-purchase-history-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply item history
        run: python3 .github/scripts/add_item_purchase_history.py

      - name: Verify
        run: |
          grep -q '2026-09-02-item-historico-compras-1' index.html
          grep -q 'Histórico de compras do item' index.html
          grep -q 'setHistoricoItem' index.html
          grep -q 'comprasHistoricoItem' index.html

      - name: Commit
        run: |
          git config user.name "DDV Item History"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add purchase history cart by item"
          git push
