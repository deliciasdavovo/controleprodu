name: Dedupe mirrored purchases

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/dedupe_mirrored_purchases.py'
      - '.github/workflows/dedupe-mirrored-purchases-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/dedupe_mirrored_purchases.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '2026-09-03-insumo-revenda-um-form-2' in s
          assert 'espelhoDoInsumo' in s
          assert '120000' in s
          print('verify ok')
          PY
      - name: Commit
        run: |
          git config user.name "DDV Unified Purchase"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Avoid double counting shared supply resale purchases"
          git push
