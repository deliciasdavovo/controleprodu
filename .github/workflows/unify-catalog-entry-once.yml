name: Unify catalog entry

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/unify_catalog_entry.py'
      - '.github/workflows/unify-catalog-entry-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/unify_catalog_entry.py

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '2026-09-03-cadastro-unificado-1' in s
          assert 'const UnifiedCatalogEntry = ({' in s
          assert 'O que você quer cadastrar?' in s
          assert "['fabricacao', 'insumo', 'revenda']" in s
          assert 'Cadastros novos ficam em Produtos → Cadastro geral' in s
          assert 'price_unit: prod.priceUnit' in s
          assert 'supplies={supplies}' in s
          assert 'onAddSupply={handleAddSupply}' in s
          assert 'onAddSeparatedProduct={handleAddSeparatedProduct}' in s
          print('verify ok')
          PY

      - name: Commit
        run: |
          git config user.name "DDV Unified Catalog"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Unify product supply and resale entry"
          git push
