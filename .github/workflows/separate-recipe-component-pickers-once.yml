name: Separate recipe component pickers

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/separate_recipe_component_pickers.py'
      - '.github/workflows/separate-recipe-component-pickers-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/separate_recipe_component_pickers.py

      - name: Verify
        run: |
          grep -q '2026-09-02-ficha-seletores-separados-1' index.html
          grep -q '>Adicionar insumo<' index.html
          grep -q '>Fabricação própria<' index.html
          grep -q 'options={opcoesInsumos}' index.html
          grep -q 'options={opcoesFabricados}' index.html

      - name: Commit
        run: |
          git config user.name "DDV Recipe Pickers"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Separate supply and manufactured recipe pickers"
          git push
