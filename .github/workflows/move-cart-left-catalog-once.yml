name: Move purchase cart left in catalog
on:
  push:
    paths:
      - '.github/workflows/move-cart-left-catalog-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/move_cart_left_catalog.py
      - name: Verify
        run: |
          grep -q '2026-09-04-carrinho-esquerda-item-1' index.html
          grep -q 'shrink-0' index.html
          grep -q 'title={`Histórico de compras' index.html
          grep -q 'min-w-\[80px\]' index.html
      - name: Commit
        run: |
          git config user.name 'DDV Catalog'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Move purchase history cart left of item'
          git push
