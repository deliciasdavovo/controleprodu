name: Diagnosticar abertura do Controle Produ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - '.github/workflows/testar-abertura.yml'

jobs:
  abrir-no-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Abrir pagina real e capturar erros
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const alerts = [];
            const log = (tipo, mensagem) => {
              if (alerts.length < 35) alerts.push({ tipo, mensagem: String(mensagem).slice(0, 350) });
            };
            page.on('pageerror', error => log('pageerror', error.stack || error.message));
            page.on('console', msg => {
              if (msg.type() === 'error') log('console', msg.text());
            });
            page.on('requestfailed', req => log('requestfailed', req.url() + ': ' + req.failure()?.errorText));
            page.on('response', r => {
              if (r.status() >= 400) log('http-' + r.status(), r.url());
            });
            try {
              const response = await page.goto('https://deliciasdavovo.github.io/controleprodu/index.html?revisao=' + process.env.GITHUB_SHA, {
                waitUntil: 'domcontentloaded', timeout: 60000
              });
              await page.waitForTimeout(18000);
              const state = await page.evaluate(() => {
                const root = document.getElementById('root');
                return {
                  title: document.title,
                  href: location.href,
                  statusText: root ? root.innerText.slice(0, 1700) : '(sem #root)',
                  htmlLength: root ? root.innerHTML.length : 0,
                  babelLoaded: !!window.Babel,
                  reactLoaded: !!window.React,
                  supabaseLoaded: !!window.supabase,
                  packagingLoaded: !!window.PackagingMatrixView,
                  scripts: [...document.scripts].filter(x => x.src).map(x => x.getAttribute('src')),
                };
              });
              console.log('STATUS_HTTP:', response?.status());
              console.log('ESTADO_DOM:', JSON.stringify(state, null, 2));
              console.log('ERROS:', JSON.stringify(alerts, null, 2));
              if (state.babelLoaded || !state.scripts.includes('./compiled/app.js') ||
                  !state.scripts.includes('./compiled/embalagens.js')) {
                throw new Error('CDN entregou a versão antiga da página, ainda dependente do Babel.');
              }
              await page.screenshot({ path: '/tmp/controleprodu-abertura.png', fullPage: false });
              if (!response || response.status() >= 400 || !state.htmlLength ||
                  state.statusText.includes('Carregando Controle Produ')) {
                throw new Error('A pagina nao terminou de abrir no Chromium.');
              }
              console.log('PAGINA_ABRIU_NAVEGADOR: SIM');
              const entrarCMV = page.getByRole('button', { name: /Entrar no CMV/i });
              console.log('BOTAO_ENTRAR_CMV:', await entrarCMV.count());
              if (await entrarCMV.count() < 1) throw new Error('Botao de entrada CMV nao apareceu');
              await entrarCMV.first().click();
              await page.waitForTimeout(6000);
              console.log('TEXTO_APOS_CMV:', (await page.locator('#root').innerText()).slice(0, 1100));
              const botaoEmbalagens = page.getByRole('button', { name: /^Embalagens$/i });
              console.log('BOTAO_EMBALAGENS:', await botaoEmbalagens.count());
              if (await botaoEmbalagens.count() < 1) throw new Error('Botao Embalagens nao existe');
              await botaoEmbalagens.first().click();
              await page.waitForTimeout(5000);
              console.log('TEXTO_EMBALAGENS:', (await page.locator('#root').innerText()).slice(0, 2200));
              console.log('ERROS_DEPOIS:', JSON.stringify(alerts, null, 2));
              if ((await page.locator('body').innerText()).includes('Erro ao carregar:')) {
                throw new Error('A aba Embalagens apresentou erro ao carregar.');
              }
              if (!(await page.getByText('Guia de embalagens por produto', {exact:true}).count()) ||
                  !(await page.locator('.emb2-grupo').count()) ||
                  !(await page.locator('.emb2-btn-nova').count())) {
                throw new Error('O guia com produtos agrupados e variacoes nao apareceu.');
              }
              console.log('GRUPOS_EMBALAGENS:', await page.locator('.emb2-grupo').count());
              console.log('PRODUTOS_COM_VARIACAO:', await page.locator('.emb2-btn-nova').count());
              console.log('ABA_EMBALAGENS_ABRIU: SIM');
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e.stack || e); process.exit(1) });
          NODE
