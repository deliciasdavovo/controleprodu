name: Fix picker design

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_picker_design.py'
      - '.github/workflows/fix-picker-design-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply picker design
        run: python3 .github/scripts/fix_picker_design.py

      - name: Verify
        run: |
          grep -q '2026-09-02-picker-design-1' index.html
          grep -q 'Insumo novo — será cadastrado ao salvar' index.html
          grep -q 'Fornecedor novo — será salvo com esta compra' index.html
          grep -q 'picker-disabled' index.html
          grep -q 'PRODUCT_CATEGORIES' index.html
          ! grep -q '<datalist id="cadastro-insumos-list"' index.html

      - name: Commit
        run: |
          git config user.name "DDV Picker Design"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Use site-styled pickers in CMV forms"
          git push
