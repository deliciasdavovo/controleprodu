name: Add hybrid supply resale type

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add_hybrid_catalog_type.py'
      - '.github/workflows/add-hybrid-catalog-type-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/add_hybrid_catalog_type.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
            '2026-09-03-tipo-insumo-revenda-1',
            "{ value: 'insumo_revenda', label: 'Insumo + revenda' }",
            'TIPOS_TABELA',
            "tipo: 'insumo_revenda'",
            'resaleSource: rev',
            'alterarTipoDaTabela',
            'atualizarCompraLinha',
            'Itens híbridos aparecem uma única vez na tabela.'
          ]
          for x in checks:
            assert x in s, x
          block = s[s.index('const cadastrosUnificados'):s.index('const supplyOptions', s.index('const cadastrosUnificados'))]
          assert ".filter((x) => !supplies.some" in block
          assert 'options={TIPOS_TABELA}' in s
          print('verify ok')
          PY
      - name: Commit
        run: |
          git config user.name "DDV Hybrid Type"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Show supply resale items as one hybrid type"
          git push
