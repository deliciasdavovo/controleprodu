name: Refine unified catalog

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/refine_unified_catalog.py'
      - '.github/workflows/refine-unified-catalog-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinement
        run: python3 .github/scripts/refine_unified_catalog.py
      - name: Verify
        run: |
          grep -q '2026-09-03-cadastro-unificado-2' index.html
          grep -q "label: 'Cadastros'" index.html
          grep -q 'currentUnit={currentUnit}' index.html
          grep -q 'Cadastros novos ficam em Cadastros' index.html
      - name: Commit
        run: |
          git config user.name "DDV Unified Catalog"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine unified catalog by unit"
          git push
