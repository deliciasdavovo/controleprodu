name: Add recipe components and partial modal

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add_recipe_components_and_partial_modal.py'
      - '.github/workflows/add-recipe-components-partial-modal-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix patch script quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/add_recipe_components_and_partial_modal.py')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          for i, line in enumerate(lines):
              if 'title="Tirar insumo da ficha"' in line:
                  lines[i] = "'                            title=\"Tirar insumo da ficha\"',\n"
              elif 'title="Tirar componente da ficha"' in line:
                  lines[i] = "'                            title=\"Tirar componente da ficha\"',\n"
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/add_recipe_components_and_partial_modal.py

      - name: Apply recipe component patch
        run: python3 .github/scripts/add_recipe_components_and_partial_modal.py

      - name: Verify
        run: |
          grep -q '2026-09-02-ficha-parcial-componentes-1' index.html
          grep -q 'Fabricação própria' index.html
          grep -q 'Histórico de compras do item' index.html
          grep -q 'component_product_id' index.html
          grep -q 'component_product_id' supabase/schema.sql
          test -f supabase/migrations/20260902_recipe_product_components.sql
          grep -q 'max-w-5xl max-h-\[88vh\]' index.html

      - name: Commit
        run: |
          git config user.name "DDV Recipe Components"
          git config user.email "actions@users.noreply.github.com"
          git add index.html supabase/schema.sql supabase/migrations/20260902_recipe_product_components.sql
          git commit -m "Add manufactured products to technical sheets"
          git push
