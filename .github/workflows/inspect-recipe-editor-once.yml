name: Inspect recipe editor structure
on:
  push:
    paths:
      - '.github/workflows/inspect-recipe-editor-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant code
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8').splitlines()
          markers = [
            'const SuppliesRecipesView',
            'const RecipeEditor',
            'const opcoesInsumos',
            'Fabricação própria',
            'Adicionar insumo',
            '<RecipeEditor',
            'const PickerField'
          ]
          seen=[]
          for m in markers:
            for i,line in enumerate(s):
              if m in line:
                a=max(0,i-25); b=min(len(s),i+90)
                key=(a,b)
                if key in seen: continue
                seen.append(key)
                print(f'\n===== {m} @ line {i+1} =====')
                for n in range(a,b):
                  print(f'{n+1:05d}: {s[n]}')
                break
          PY
