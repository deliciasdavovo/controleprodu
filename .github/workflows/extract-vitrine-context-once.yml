name: Extract vitrine context
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/extract_vitrine_context.py'
      - '.github/workflows/extract-vitrine-context-once.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: python3 .github/scripts/extract_vitrine_context.py
      - name: Commit
        run: |
          git config user.name "DDV Vitrine"
          git config user.email "actions@users.noreply.github.com"
          git add .github/vitrine_context.txt
          git commit -m "Extract vitrine context"
          git push
