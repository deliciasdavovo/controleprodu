name: Fix autocomplete Enter insumo

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_insumo_enter_autocomplete.py'
      - '.github/workflows/fix-insumo-enter-autocomplete-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python3 .github/scripts/fix_insumo_enter_autocomplete.py

      - name: Conferir correção
        run: |
          grep -q 'primeiraSugestaoCadastro' index.html
          grep -q 'data-insumo-field="nome"' index.html
          grep -q 'data-insumo-field="fornecedor"' index.html
          grep -q 'data-insumo-field="qtd"' index.html
          grep -q 'data-insumo-field="custo"' index.html
          grep -q '2026-09-01-insumo-enter-autocomplete-3' index.html

      - name: Commit
        run: |
          git config user.name "DDV CMV Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Enter autocomplete in supply purchase form"
          git push
