name: Unify single entry form
on:
  push:
    paths:
      - '.github/workflows/unify-single-entry-form-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/unify_single_entry_form.py
      - name: Verify
        run: |
          grep -q '2026-09-04-formulario-unico-enter-1' index.html
          grep -q 'onKeyDown={avancarEntradaRapida}' index.html
          grep -q 'Um formulário só para tudo' index.html
          grep -q '>Equiv.<' index.html
          grep -q '>Preço venda<' index.html
      - name: Commit
        run: |
          git config user.name 'DDV Catalog'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore one-form purchase entry and Enter flow'
          git push
