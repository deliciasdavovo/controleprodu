name: Inspect autocomplete Enter
on:
  push:
    paths:
      - '.github/workflows/inspect-autocomplete-enter-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant code
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8').splitlines()
          markers = [
            'const PickerField',
            'panelMinWidth = 0',
            "e.key === 'Enter'",
            'avancarEntradaRapida',
            'const selecionarCadastro',
            'onPick={selecionarCadastro}',
            'inputProps = {}'
          ]
          seen=[]
          for m in markers:
            for i,line in enumerate(s):
              if m in line:
                a=max(0,i-55); b=min(len(s),i+150)
                key=(a,b)
                if key in seen: continue
                seen.append(key)
                print(f'\n===== {m} @ line {i+1} =====')
                for n in range(a,b): print(f'{n+1:05d}: {s[n]}')
                break
          PY
