name: Fix CMV insumo e ficha

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_cmv_insumo_ficha.py'
      - '.github/workflows/fix-cmv-insumo-ficha-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python3 .github/scripts/fix_cmv_insumo_ficha.py

      - name: Conferir marcadores
        run: |
          grep -q '2026-09-01-cmv-insumo-ficha-1' index.html
          grep -q 'Cadastrar + compra' index.html
          grep -q 'fixed inset-0 z-\[90\]' index.html

      - name: Commit
        run: |
          git config user.name "DDV CMV Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix insumo purchase flow and technical sheet opening"
          git push
