name: Fix picker e revenda de insumo

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_picker_revenda.py'
      - '.github/workflows/fix-picker-revenda-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python3 .github/scripts/fix_picker_revenda.py

      - name: Conferir correções
        run: |
          grep -q 'z-index: 140' index.html
          grep -q 'Revenda também' index.html
          grep -q 'onAddSeparatedProduct={handleAddSeparatedProduct}' index.html
          grep -q '2026-09-01-picker-revenda-2' index.html

      - name: Commit
        run: |
          git config user.name "DDV CMV Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix ingredient picker and resale option"
          git push
