name: Fix cost display units
on:
  push:
    paths:
      - '.github/workflows/fix-cost-display-units-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_cost_display_units.py
      - name: Verify
        run: |
          grep -q '2026-09-05-custo-kg-litro-unidade-1' index.html
          test "$(grep -c "formatPrecoInsumo(c.custoUnit, c.unidade)" index.html)" -ge 2
      - name: Commit
        run: |
          git config user.name 'DDV Cost'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show purchase costs per kg L or unit'
          git push
