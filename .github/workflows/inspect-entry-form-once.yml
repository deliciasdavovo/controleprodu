name: Inspect entry form
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-entry-form-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show form context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['Também é revenda?', 'Unidade base', 'Classe', 'Cadastro + compra']:
              print('\n###',needle)
              i=s.find(needle, s.find('const SuppliesRecipesView'))
              print('POS',i)
              if i>=0:
                  print(s[max(0,i-3000):min(len(s),i+5000)])
          PY
