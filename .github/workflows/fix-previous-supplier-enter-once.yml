name: Fix previous supplier Enter
on:
  push:
    paths:
      - '.github/workflows/fix-previous-supplier-enter-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_previous_supplier_enter.py
      - name: Verify
        run: |
          grep -q '2026-09-05-fornecedor-anterior-enter-1' index.html
          grep -Fq "hint: 'Última compra'" index.html
          grep -Fq 'value: compraExistente.supplier' index.html
      - name: Commit
        run: |
          git config user.name 'DDV Supplier Suggestion'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Prioritize previous supplier in purchase autocomplete'
          git push
