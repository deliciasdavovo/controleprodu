name: Add manufactured unit equivalence

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add_manufactured_unit_equivalence.py'
      - '.github/workflows/add-manufactured-unit-equivalence-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/add_manufactured_unit_equivalence.py

      - name: Verify
        run: |
          grep -q '2026-09-02-fabricacao-equivalencia-unidade-1' index.html
          grep -q 'Equivalência para usar por unidade' index.html
          grep -q "1 un =" index.html
          grep -q "unidadesDeComponente(unidadeBase, componentFicha?.weightPerUnit)" index.html
          grep -q "fichaComponente.weightPerUnit" index.html

      - name: Commit
        run: |
          git config user.name "DDV Manufactured Unit"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Support unit equivalence for manufactured products"
          git push
