name: Restore supply equivalence v2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/restore_supply_equivalence_v2.py'
      - '.github/workflows/restore-supply-equivalence-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/restore_supply_equivalence_v2.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['2026-09-03-equivalencia-insumo-1','UNIDADES_EQUIVALENCIA','Equivalência / variação','>Equiv.<','1 fatia = 30 g','variationUnit: x.variationUnit','variationFactor: x.variationFactor']
          for c in checks: assert c in s, c
          assert 'variation_unit: updated.variationUnit || null' in s
          assert 'variation_factor: updated.variationFactor || null' in s
          print('verify ok')
          PY
      - name: Commit
        run: |
          git config user.name "DDV Equivalence"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore supply equivalence in unified entry form"
          git push
