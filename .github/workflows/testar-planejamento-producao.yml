name: Validar telas de planejamento e producao

on:
  pull_request:
    paths:
      - 'src/app.jsx'
      - 'styles/main.css'
      - 'index.html'
      - '.github/workflows/testar-planejamento-producao.yml'
  push:
    branches: [main]
    paths:
      - 'src/app.jsx'
      - 'styles/main.css'
      - 'index.html'
      - '.github/workflows/testar-planejamento-producao.yml'

jobs:
  abrir-telas:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: |
          npm install --no-save esbuild@0.25.12 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Compilar o codigo da interface
        run: |
          mkdir -p compiled
          npx esbuild src/app.jsx --loader:.jsx=jsx --jsx=transform --format=iife --target=es2018 --minify --outfile=compiled/app.js
          npx esbuild src/embalagens.jsx --loader:.jsx=jsx --jsx=transform --format=iife --target=es2018 --minify --outfile=compiled/embalagens.js
      - name: Validar abertura e navegacao real
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site-log.txt 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const errors=[];
            const page=await browser.newPage({viewport:{width:1350,height:850}});
            page.on('pageerror',e=>{ errors.push(e.message); console.log('PAGE_ERROR:',e.stack||e.message); });
            try {
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('.controle-side').waitFor({state:'visible',timeout:45000});
              await page.locator('.production-board').waitFor({state:'visible',timeout:10000});
              await page.locator('.plan-day-tabs button').first().waitFor({state:'visible',timeout:10000});
              // Padrão usa uma vitrine virtual: salgado em 4 colunas, doces em 3.
              const gridFour = page.locator('.production-board .virtual-showcase-grid[data-cols="4"]').first();
              const gridThree = page.locator('.production-board .virtual-showcase-grid[data-cols="3"]').first();
              if(await gridFour.count()){
                const cols=await gridFour.evaluate(el=>getComputedStyle(el).gridTemplateColumns.split(' ').length);
                if(cols!==4)throw new Error('Vitrine salgada deveria ter 4 colunas, encontrou '+cols);
              }
              if(await gridThree.count()){
                const cols=await gridThree.evaluate(el=>getComputedStyle(el).gridTemplateColumns.split(' ').length);
                if(cols!==3)throw new Error('Vitrine doce/sobremesa deveria ter 3 colunas, encontrou '+cols);
              }
              await page.locator('.controle-side').getByRole('button',{name:'Produção',exact:true}).click();
              console.log('DESKTOP_ABA_ANTES:',(await page.locator('#root').innerText()).slice(0,700));
              await page.locator('.production-checklist').waitFor({state:'visible',timeout:12000});
              await page.locator('.checklist-summary').waitFor({state:'visible',timeout:10000});
              // Exercita o checklist sem gravar nada no banco: item avulso,
              // checkbox OK e campo de observações para WhatsApp.
              await page.locator('.checklist-notes').fill('Separar encomenda após a produção');
              await page.getByPlaceholder('Ex.: 2 bolos para encomenda').fill('Item de teste');
              await page.getByRole('button',{name:'Incluir item',exact:true}).click();
              const check=page.getByRole('checkbox',{name:'OK, produzir Item de teste'});
              await check.waitFor({state:'visible'});
              if(!(await check.isChecked()))throw new Error('Item extra não foi marcado para produzir');
              await check.uncheck();
              if(await check.isChecked())throw new Error('Não foi possível desmarcar o OK');
              await check.check();
              if(!(await check.isChecked()))throw new Error('Não foi possível marcar o OK');
              await page.getByRole('button',{name:'Slots',exact:true}).click();
              await page.locator('.production-slots-view').waitFor({state:'visible'});
              const slotCheck=page.getByRole('checkbox',{name:'OK, produzir Item de teste'});
              if(!(await slotCheck.isChecked()))throw new Error('A marcação OK não persistiu na visualização Slots');
              await page.getByRole('button',{name:'Lista',exact:true}).click();
              await page.locator('.production-list-view').waitFor({state:'visible'});
              if(!(await check.isChecked()))throw new Error('A marcação OK não persistiu ao voltar à Lista');
              console.log('DESKTOP: Lista e Slots preservam o checklist e 4/3 colunas');
              console.log('DESKTOP: Checklist, itens extras e notas funcionando');
              console.log('DESKTOP: Planejamento e checklist abriram');
              // Abre o modal de XML sem salvar dados; deve permanecer na área
              // visível do navegador, mesmo dentro da tela de cadastros.
              await page.locator('.controle-side').getByRole('button',{name:'Cadastros e fichas',exact:true}).click();
              await page.locator('.lark-cadastros-ui').waitFor({state:'visible',timeout:12000});
              await page.getByRole('button',{name:'XML',exact:true}).first().click();
              await page.locator('.invoice-modal-viewport').waitFor({state:'visible',timeout:10000});
              const modalBounds=await page.locator('.invoice-modal-viewport > div.relative').first().boundingBox();
              if(!modalBounds || modalBounds.x < -2 || modalBounds.y < -2 ||
                modalBounds.x + modalBounds.width > 1352 ||
                modalBounds.y + modalBounds.height > 852) {
                throw new Error('Modal de NF-e saiu dos limites da tela desktop: '+JSON.stringify(modalBounds));
              }
              await page.getByRole('button',{name:'Fechar importação XML'}).click();
              console.log('DESKTOP: Modal de NF-e dentro da tela');
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              mobile.on('pageerror',e=>errors.push('mobile: '+e.message));
              await mobile.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:60000});
              await mobile.locator('.production-board').waitFor({state:'visible',timeout:45000});
              await mobile.locator('.plan-day-tabs button').first().waitFor({state:'visible'});
              await mobile.locator('.controle-mobile-bottom').getByRole('button',{name:'Produção',exact:true}).click();
              await mobile.locator('.production-checklist').waitFor({state:'visible',timeout:12000});
              await mobile.getByRole('button',{name:'Slots',exact:true}).click();
              await mobile.locator('.production-slots-view').waitFor({state:'visible',timeout:12000});
              const metrics=await mobile.evaluate(()=>({width:document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth}));
              if(metrics.scrollWidth>metrics.width+3)throw new Error('Slots causam rolagem horizontal no celular');
              await mobile.getByRole('button',{name:'Lista',exact:true}).click();
              await mobile.locator('.production-list-view').waitFor({state:'visible',timeout:12000});
              console.log('MOBILE: Planejamento, lista e slots abriram sem rolagem horizontal');
              await mobile.locator('.controle-mobile-bottom').getByRole('button',{name:'Cadastros e fichas',exact:true}).click();
              await mobile.locator('.lark-cadastros-ui').waitFor({state:'visible',timeout:12000});
              await mobile.getByRole('button',{name:'XML',exact:true}).first().click();
              await mobile.locator('.invoice-modal-viewport').waitFor({state:'visible',timeout:10000});
              const mobileBounds=await mobile.locator('.invoice-modal-viewport > div.relative').first().boundingBox();
              if(!mobileBounds || mobileBounds.x < -2 || mobileBounds.y < -2 ||
                mobileBounds.x + mobileBounds.width > 392 ||
                mobileBounds.y + mobileBounds.height > 846) {
                throw new Error('Modal de NF-e saiu da tela mobile: '+JSON.stringify(mobileBounds));
              }
              await mobile.getByRole('button',{name:'Fechar importação XML'}).click();
              console.log('MOBILE: Modal de NF-e dentro da tela');
              if(errors.length)throw new Error('Erros na execução: '+errors.join(' | '));
              console.log('SEM_ERROS_DE_REACT: SIM');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
