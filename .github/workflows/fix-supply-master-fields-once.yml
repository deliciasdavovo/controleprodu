name: Fix supply master fields

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_supply_master_fields.py'
      - '.github/workflows/fix-supply-master-fields-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/fix_supply_master_fields.py

      - name: Verify patch
        run: |
          grep -q '2026-09-02-insumo-master-fields-1' index.html
          grep -q 'Unidade fixa do cadastro' index.html
          grep -q 'Revenda também.*edite na tabela' index.html
          grep -q 'handleSetSupplyResale' index.html
          grep -q 'Revenda {revendaDoInsumo(s.name) ?' index.html

      - name: Commit
        run: |
          git config user.name "DDV Supply Master Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Lock existing supply master fields and edit resale in table"
          git push
