name: Fix CMV resale classification
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_cmv_resale_classification.py'
      - '.github/workflows/fix-cmv-resale-classification-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_cmv_resale_classification.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert ".filter((p) => !separatedProducts.some((r) => normalizeName(r.productName) === normalizeName(p.name)))" in s
          assert "[products, recipes, recipeItems, supplies, supplyPurchases, separatedProducts]" in s
          print('verify ok')
          PY
      - name: Commit
        run: |
          git config user.name "DDV CMV Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Keep resale items out of production CMV"
          git push
