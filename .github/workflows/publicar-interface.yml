name: Compilar e publicar interface
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'scripts/versionar-interface.py'
      - 'index.html'
      - '.github/workflows/publicar-interface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Compilar React e validar JSX
        run: |
          npx --yes esbuild@0.25.12 src/app.jsx --loader:.jsx=jsx --minify --target=es2020 --outfile=compiled/app.js
          npx --yes esbuild@0.25.12 src/embalagens.jsx --loader:.jsx=jsx --minify --target=es2020 --outfile=compiled/embalagens.js
      - name: Atualizar versão dos arquivos pelo conteúdo
        run: python3 scripts/versionar-interface.py
      - name: Registrar versão publicada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiled/app.js compiled/embalagens.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publica interface compilada do Controle Produ"
            git push
          fi
