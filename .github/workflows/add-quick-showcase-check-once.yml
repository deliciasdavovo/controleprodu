name: Add quick showcase check
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_quick_showcase_check.py'
      - '.github/workflows/add-quick-showcase-check-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/add_quick_showcase_check.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
            '2026-09-04-vitrine-conferencia-rapida-1',
            'const ShowcaseQuickChecklist',
            'Conferência rápida',
            'Faltam conferir',
            'Item a item',
            '<ShowcaseQuickChecklist',
            'Conferência rápida da vitrine',
          ]
          for c in checks:
              assert c in s, c
          assert '<ShowcaseChecklist\n                key={showcaseFilter}' not in s
          print('verify ok')
          PY
      - name: Commit
        run: |
          git config user.name "DDV Vitrine"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add fast showcase conference"
          git push
