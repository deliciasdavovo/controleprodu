name: Improve recipe editor picker
on:
  push:
    paths:
      - '.github/workflows/improve-recipe-editor-picker-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/improve_recipe_editor_picker.py
      - name: Verify
        run: |
          grep -q '2026-09-04-ficha-tipo-picker-largo-1' index.html
          grep -q 'panelMinWidth = 0' index.html
          grep -q 'Tipo do cadastro' index.html
          grep -q 'panelMinWidth={520}' index.html
          grep -q 'temLigacaoExterna' index.html
      - name: Commit
        run: |
          git config user.name 'DDV Catalog'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Improve recipe editor type and picker layout'
          git push
